<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숲의 모험 — Forest Action RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="384" height="216"></canvas>
  </div>
  <div id="controls">
    <span><b>WASD</b> 이동</span>
    <span><b>Space</b> / <b>클릭</b> 공격 (마우스 방향)</span>
    <span><b>Shift</b> 대시 (2회 충전)</span>
    <span><b>Q</b> 강공격 <span style="opacity:.6">Lv10</span></span>
    <span><b>R</b> 회전베기 <span style="opacity:.6">Lv20</span></span>
    <span><b>E</b> 포션</span>
    <span><b>I</b> 인벤토리</span>
    <span><b>F</b> 무기 교체 / 동굴 / 상점</span>
    <span><b>M</b> 지도</span>
    <span><b>V</b> 소리</span>
    <span><b>N</b> 새 게임</span>
  </div>
  <p id="savenote">진행 상황은 5초마다 이 브라우저에 자동 저장됩니다.</p>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/save.js"></script>
  <script src="js/player.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/slime.js"></script>
  <script src="js/mushroom.js"></script>
  <script src="js/wolf.js"></script>
  <script src="js/boss_base.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/boss_wolf.js"></script>
  <script src="js/boss_mushroom.js"></script>
  <script src="js/items.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
