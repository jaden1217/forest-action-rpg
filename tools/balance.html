<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밸런스 표 — 숲의 모험</title>
<style>
  body { background: #151a14; color: #d8e6cf; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 32px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #9be564; }
  h2 { font-size: 15px; margin: 34px 0 8px; color: #ffe066; border-bottom: 1px solid #2c3627; padding-bottom: 4px; }
  p.note { color: #8fa383; margin: 0 0 12px; max-width: 900px; }
  table { border-collapse: collapse; margin-bottom: 8px; }
  th, td { border: 1px solid #2c3627; padding: 3px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { background: #1f261c; color: #c9d8bd; font-weight: 600; }
  td.l, th.l { text-align: left; }
  td.good { color: #9be564; }
  td.warn { color: #ffb35c; }
  td.bad  { color: #ff6b6b; }
  td.dim  { color: #5f7159; }
  .wrap { overflow-x: auto; }
  code { color: #ffd93d; }
</style>
</head>
<body>
<h1>밸런스 표</h1>
<p class="note">
  <code>js/config.js</code> 의 값을 그대로 읽어 계산한다 — 설정을 바꾸고 새로고침하면 바로 반영된다.
  게임을 실행하지 않고도 "몇 레벨이 어느 구간에서 몇 대에 죽는지"를 한눈에 볼 수 있다.
  무기는 <b>플레이어 레벨과 같은 레벨의 검</b>을 든 것으로 가정한다 (성장 단검과 같다).
</p>

<div id="out"></div>

<script src="../js/config.js"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const section = (title, note) => { out.appendChild(el('h2', '', title)); if (note) out.appendChild(el('p', 'note', note)); };
  const table = (head, rows) => {
    const wrap = el('div', 'wrap'), t = el('table');
    const tr = el('tr'); head.forEach((h, i) => tr.appendChild(el('th', i === 0 ? 'l' : '', h))); t.appendChild(tr);
    for (const r of rows) {
      const row = el('tr');
      r.forEach((c, i) => {
        const cell = el('td', i === 0 ? 'l' : '');
        if (c && typeof c === 'object') { cell.textContent = c.v; if (c.cls) cell.classList.add(c.cls); }
        else cell.textContent = c;
        row.appendChild(cell);
      });
      t.appendChild(row);
    }
    wrap.appendChild(t); out.appendChild(wrap);
  };

  /* ── 플레이어 ── */
  const P = CONFIG.player, LU = CONFIG.levelUp, WL = CONFIG.weapons.levelMult;
  const pHp = L => P.maxHp + (L - 1) * LU.hpGain;
  const pBase = L => P.attackDamage + (L - 1) * LU.damageGain;
  const wMult = L => WL[Math.min(L, WL.length) - 1];   // 무기 레벨은 몬스터 표(23)를 넘어 60까지 간다
  const pDmg = L => Math.round(pBase(L) * wMult(L));
  const potion = L => Math.max(CONFIG.items.potionHealMin, Math.round(pHp(L) * CONFIG.items.potionHealRatio));
  const levels = [1, 2, 3, 4, 5, 6, 8, 10, 12, 14, 16, 18, 20, 23, 26, 30];

  section('플레이어 성장', '공격력 = 기본(레벨당 +' + LU.damageGain + ') × 같은 레벨 무기 배수. 체력은 레벨당 +' + LU.hpGain + '. 포션은 최대 체력의 ' + (CONFIG.items.potionHealRatio * 100) + '% (최소 ' + CONFIG.items.potionHealMin + ').');
  table(['레벨', '체력', '기본 공격', '무기 배수', '실제 공격', '포션 회복', '다음 레벨까지 XP'],
    levels.map(L => [L, pHp(L), pBase(L), wMult(L).toFixed(3), pDmg(L), potion(L), LU.xpNeed(L)]));

  /* ── 몬스터 ── */
  const types = [['슬라임', CONFIG.slime.levels], ['버섯', CONFIG.mushroom.levels], ['늑대', CONFIG.wolf.levels]];
  const mLevels = [1, 3, 6, 8, 10, 12, 15, 17, 19, 21, 23];
  section('몬스터 능력치', '색 등급(무기 칼날 색·드랍 양에 쓴다): 1~4 / 5~8 / 9~13 / 14~18 / 19~23. 몬스터 몸 색은 종류가 정하고, 위험도는 이름표 색이 알려준다. 버섯 공격력은 포자 한 발의 위력이고 발수는 레벨에 따라 1 / 3 / 5.');
  table(['레벨', '등급', '슬라임 체력', '공격', 'XP', '버섯 체력', '공격', '발수', 'XP', '늑대 체력', '공격', 'XP', '골드'],
    mLevels.map(M => {
      const s = types[0][1][M - 1], m = types[1][1][M - 1], w = types[2][1][M - 1];
      return [M, levelTier(M), s.hp, s.atk, s.xp, m.hp, m.atk, m.shots, m.xp, w.hp, w.atk, w.xp, CONFIG.gold.amountByTier[levelTier(M)]];
    }));

  const cls = (v, good, warn) => ({ v: v, cls: v <= good ? 'good' : (v <= warn ? 'warn' : 'bad') });
  const clsDie = (v) => ({ v: v, cls: v >= 10 ? 'good' : (v >= 5 ? 'warn' : 'bad') });

  /* ── 사막 몬스터 (24~40, 표 밖은 enemyStatsAt 이 완만한 증가율로 늘려 잡는다) ── */
  const dTypes = [['전갈', CONFIG.scorpion.levels], ['선인장', CONFIG.cactus.levels], ['모래벌레', CONFIG.sandworm.levels]];
  const dLevels = [24, 26, 28, 30, 32, 34, 36, 38, 40];
  section('사막 몬스터 능력치 (24~40)', '색 등급: 24~29 / 30~35 / 36~. 23 너머는 체력 +7.5%, 공격 +5.5%/레벨로 완만하게 오른다. 마지막 두 줄은 같은 레벨 플레이어(검, 강화 없음)가 전갈을 몇 대에 잡고 몇 대에 죽는지.');
  table(['레벨', '등급', '전갈 체력', '공격', 'XP', '선인장 체력', '공격', 'XP', '모래벌레 체력', '공격', 'XP', '골드', '전갈 잡는 데', '전갈에게 죽기'],
    dLevels.map(M => {
      const s = enemyStatsAt(dTypes[0][1], M), c = enemyStatsAt(dTypes[1][1], M), w = enemyStatsAt(dTypes[2][1], M);
      return [M, levelTier(M), s.hp, s.atk, s.xp, c.hp, c.atk, c.xp, w.hp, w.atk, w.xp, CONFIG.gold.amountByTier[levelTier(M)],
        cls(Math.ceil(s.hp / pDmg(M)), 5, 8), clsDie(Math.ceil(pHp(M) / s.atk))];
    }));

  /* ── 대결 표 ── */
  const pL = [1, 3, 5, 8, 10, 12, 15, 18, 20, 23, 26, 30];
  const mL = [1, 3, 6, 9, 12, 15, 18, 21, 23];

  section('때려서 죽이기 — 몇 대 (슬라임 / 버섯 / 늑대)', '초록 ≤3대, 주황 ≤6대, 빨강 그 이상. 같은 레벨끼리는 3~6대가 목표. 자기 레벨보다 한참 위 구간에 가면 빨갛게 된다.');
  table(['플레이어 \\ 몬스터'].concat(mL.map(M => 'M' + M)),
    pL.map(L => [ 'L' + L + ' (공격 ' + pDmg(L) + ')' ].concat(mL.map(M => {
      const d = pDmg(L);
      const s = Math.ceil(types[0][1][M - 1].hp / d), m = Math.ceil(types[1][1][M - 1].hp / d), w = Math.ceil(types[2][1][M - 1].hp / d);
      const worst = Math.max(s, m, w);
      return { v: s + '/' + m + '/' + w, cls: worst <= 3 ? 'good' : (worst <= 6 ? 'warn' : 'bad') };
    }))));

  section('맞아서 죽기 — 몇 대 (슬라임 / 늑대), 포션 없이', '초록 ≥10대, 주황 5~9대, 빨강 <5대. 같은 레벨 슬라임에게 7~12대가 목표 — 둘러싸이면 위험하고 하나쯤은 여유 있게.');
  table(['플레이어 \\ 몬스터'].concat(mL.map(M => 'M' + M)),
    pL.map(L => [ 'L' + L + ' (체력 ' + pHp(L) + ')' ].concat(mL.map(M => {
      const hp = pHp(L);
      const s = Math.ceil(hp / types[0][1][M - 1].atk), w = Math.ceil(hp / types[2][1][M - 1].atk);
      return { v: s + '/' + w, cls: s >= 10 ? 'good' : (s >= 5 ? 'warn' : 'bad') };
    }))));

  /* ── 위험도 구간별 성장 속도 ──
     태초의 숲은 지역 대신 위험도 t(시작점에서의 거리, 0~1)가 몬스터 레벨과 종류를 정한다.
     세 구간(가까운 곳 / 중간 / 가장자리)으로 잘라 예전 지역 표와 같은 꼴로 보여준다. */
  section('위험도 구간별 레벨업 속도', '그 구간 몬스터 평균(레벨·종류 비율 반영)을 잡을 때 XP와, 플레이어 레벨별로 다음 레벨까지 몇 마리를 잡아야 하는지. 상주 몬스터가 250마리라 화면에 늘 여럿이므로 20~40마리는 몇 분 거리다.');
  const F = CONFIG.maps.forest;
  const levelAtT = (t) => 1 + Math.round(Math.pow(Math.max(0, (t - F.safeRadius) / (1 - F.safeRadius)), F.curve) * (LEVEL_MAX - 1));
  const weightsAtT = (t) => {
    const list = F.typeWeights, u = t * (list.length - 1), i = Math.min(list.length - 2, Math.floor(u)), k = u - i;
    const out = {}; for (const n in list[i]) out[n] = list[i][n] + ((list[i + 1][n] || 0) - list[i][n]) * k; return out;
  };
  const ZONES = [['NEAR (t 0~0.4)', 0, 0.4], ['MID (t 0.4~0.75)', 0.4, 0.75], ['FAR (t 0.75~1)', 0.75, 1]];
  const regions = ZONES.map(([name, t0, t1]) => {
    let xp = 0, gold = 0, n = 0;
    for (let t = t0; t <= t1 + 1e-9; t += 0.05) {
      const M = levelAtT(t), w = weightsAtT(t), names = Object.keys(w), total = names.reduce((s, k) => s + w[k], 0);
      for (const k of names) { xp += CONFIG[k].levels[M - 1].xp * w[k] / total; gold += CONFIG.gold.amountByTier[levelTier(M)] * w[k] / total; }
      n++;
    }
    return { name, range: levelAtT(t0) + '~' + levelAtT(t1), xp: xp / n, gold: gold / n };
  });
  table(['플레이어 레벨', '다음 레벨까지'].concat(regions.map(r => r.name + ' (M' + r.range + ', 평균 ' + r.xp.toFixed(1) + 'XP, ' + r.gold.toFixed(1) + 'G)')),
    pL.map(L => [ 'L' + L, LU.xpNeed(L) ].concat(regions.map(r => {
      const k = Math.ceil(LU.xpNeed(L) / r.xp);
      return { v: k + '마리', cls: k <= 15 ? 'good' : (k <= 40 ? 'warn' : 'bad') };
    }))));

  /* ── 골드 ── */
  section('상점 — 강화 값과 필요한 처치 수', '중간 구간 평균 골드(' + regions[1].gold.toFixed(1) + 'G/마리) 기준. 처음 몇 랭크는 몇 마리면 되고, 끝 랭크는 오래 모아야 한다.');
  const up = CONFIG.shop.upgrades;
  const maxRank = Math.max.apply(null, up.map(u => u.maxRank));
  const rows = [];
  for (let r = 0; r < maxRank; r++) {
    const row = ['랭크 ' + (r + 1)];
    for (const u of up) {
      if (r >= u.maxRank) { row.push({ v: '-', cls: 'dim' }); row.push({ v: '', cls: 'dim' }); continue; }
      const price = Math.round(u.basePrice * Math.pow(u.priceMult, r));
      row.push(price + 'G'); row.push(Math.ceil(price / regions[1].gold) + '마리');
    }
    rows.push(row);
  }
  const head = ['']; for (const u of up) { head.push(u.name); head.push('처치'); }
  table(head, rows);
  const totals = up.map(u => { let s = 0; for (let r = 0; r < u.maxRank; r++) s += Math.round(u.basePrice * Math.pow(u.priceMult, r)); return u.name + ' 전부 ' + s + 'G'; });
  out.appendChild(el('p', 'note', totals.join(' · ') + ' · 포션 ' + CONFIG.shop.potionPrice + 'G'));

  /* ── 보스 ── */
  const BIG = { slime: ['slam', '내려찍기'], wolf: ['pounce', '덮치기'], mushroom: ['pulse', '맥동'], sandlord: ['dive', '솟구침'] };
  const PLV = { slime: [8, 10, 12, 14, 16, 18], wolf: [14, 16, 18, 20, 22, 24], mushroom: [20, 23, 26, 28, 30, 34], sandlord: [38, 40, 42, 44, 46, 50] };
  // 보스가 어느 맵 어느 위험도에 사는지 — 맵마다 동굴 목록을 뒤진다
  const caveOf = key => { for (const id in CONFIG.maps) { const c = CONFIG.maps[id].caves.find(c => c.boss === key); if (c) return { map: CONFIG.maps[id].name, t: c.t }; } };
  for (const key in CONFIG.bosses) {
    const B = CONFIG.bosses[key], bs = enemyStatsAt(CONFIG[B.type].levels, B.level), cave = caveOf(key);
    const bHp = Math.round(bs.hp * B.hpMult), bAtk = Math.round(bs.atk * B.atkMult);
    const big = BIG[key];
    const patterns = Object.keys(B).filter(k => B[k] && B[k].damageMult).map(k => k + ' ' + Math.round(bAtk * B[k].damageMult)).join(', ');
    section('보스 — ' + B.name + ' (Lv' + B.level + ', ' + cave.map + ' ' + B.lairName + ' t≈' + cave.t + ')',
      '체력 ' + bHp + ', 몸통 공격 ' + bAtk + '. 패턴 위력: ' + patterns + '. 재도전 ' + (CONFIG.arena.respawnDelay / 60) + '분.');
    table(['플레이어', '체력', '공격', '평타 몇 대', '검으로 몇 초 (쿨 ' + CONFIG.weapons.sword.cooldown + 's)', '몸통에 몇 대', big[1] + ' 몇 대', '포션 회복'],
      PLV[key].map(L => {
        const hits = Math.ceil(bHp / pDmg(L));
        return ['L' + L, pHp(L), pDmg(L), hits, (hits * CONFIG.weapons.sword.cooldown).toFixed(0) + 's',
          clsDie(Math.ceil(pHp(L) / bAtk)), clsDie(Math.ceil(pHp(L) / Math.round(bAtk * B[big[0]].damageMult))), potion(L)];
      }));
  }

  /* ── 스킬 ──
     스킬마다 모양이 달라서(연타·두 번 베기·발사·도약…) 수치가 적힌 자리도 다르다.
     마지막 열은 config.js 스킬 주석의 위력 표와 같은 값이 나와야 한다. */
  section('스킬 — 무기별', '위력은 "무기 종류 배수를 뺀 평타(검 기준)" 대비 배수라 무기끼리 바로 비교된다. 타수는 대상 하나가 한 번 쓸 때 맞는 수 (마무리 포함). 치명은 x' + P.critMult + ' 를 더 곱한 값이고, 단검의 매복 찌르기와 도끼 광폭화는 총 배수에 넣지 않았다.');
  const skTiming = s => {
    if (s.hitWindow) return s.hitWindow.join('~') + 's';
    if (s.phases) return s.phases.map(p => p.at.join('~')).join(', ') + 's';
    if (s.launchAt !== undefined) return s.launchAt + 's 발사';
    if (s.stepTime) return s.stepTime + 's 간격';
    if (s.air) return s.air + 's 뒤 착지';
    return s.windup + 's 뒤';
  };
  const skArea = s => {
    if (s.shot) return s.shot.range + 'px 날아감';
    if (s.range) return '둘레 ' + s.range;
    if (s.radius) return '반경 ' + s.radius;
    if (s.length) return '길이 ' + s.length;
    if (s.lineWidth) return '띠 반폭 ' + s.lineWidth;
    return s.arc >= Math.PI ? '사방' : '반각 ' + s.arc;
  };
  const skExtra = s => s.finalBurst || s.finale || s.slam;   // 본 공격과 따로 들어가는 한 방
  const skHits = s => {
    if (s.phases) return s.phases.length;
    if (s.stabs || s.slashes) return s.stabs || s.slashes;
    const cap = s.perTarget || (s.shot && s.shot.perTarget);   // 비수·사신 — 한 적이 맞는 수의 상한
    if (cap) return cap;
    return s.hitInterval ? Math.floor((s.hitWindow[1] - s.hitWindow[0]) / s.hitInterval) + 1 : 1;
  };
  const skMult = s => {
    if (s.phases) return s.phases.map(p => 'x' + p.damageMult).join(' + ');
    return 'x' + s.damageMult + (skExtra(s) ? ' + x' + skExtra(s).damageMult : '') + (s.forceCrit ? ' 치명' : '')
      + (s.lastCrit ? ' 막타 치명' : '') + (s.finalMult ? ' 막타 x' + s.finalMult : '');
  };
  const skTotal = s => {
    if (s.phases) return s.phases.reduce((t, p) => t + p.damageMult, 0);
    const crit = s.forceCrit ? P.critMult : 1;
    const last = s.lastCrit ? P.critMult : (s.finalMult || 1);   // 마지막 한 번만 더 센 스킬 (연속찌르기·사신)
    return s.damageMult * crit * (skHits(s) - 1 + last) + (skExtra(s) ? skExtra(s).damageMult : 0);
  };
  const skRows = [];
  for (const w in CONFIG.skills.byWeapon) {
    for (const s of CONFIG.skills.byWeapon[w]) {
      if (s.buff) { skRows.push([CONFIG.weapons[w].name + ' ' + s.name + ' (' + s.key + ')', 'Lv' + s.unlockLevel, s.cooldown + 's', '-', s.buff.time + 's 강화', '공속 x' + s.buff.attackSpeed + ', 위력 x' + s.buff.damageMult, '-', '-']); continue; }
      skRows.push([CONFIG.weapons[w].name + ' ' + s.name + ' (' + s.key + ')', 'Lv' + s.unlockLevel, s.cooldown + 's', skMult(s), s.duration + 's', skTiming(s) + ' · ' + skArea(s), skHits(s) + (skExtra(s) ? 1 : 0), 'x' + skTotal(s).toFixed(2)]);
    }
  }
  table(['스킬', '해금', '쿨다운', '배수', '지속', '판정', '대략 타수', '마리당 총 배수'], skRows);
})();
</script>
</body>
</html>
