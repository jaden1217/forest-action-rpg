  drawPortalPrompt(ctx, portal, cam, dest, locked) {
    if (!portal || !dest) return;
    const sx = Math.round(portal.x - cam.x), sy = Math.round(portal.y - cam.y);
    if (locked) {
      const boss = CONFIG.bosses[CONFIG.gate.requiredBoss];
      this.drawText(ctx, 'SLAY ' + (boss ? boss.name : 'THE BOSS'), sx, sy - 44, '#ff6b6b', true);
      this.drawText(ctx, 'SEALED', sx, sy - 52, '#8f9aa8', true);
      return;
    }
    this.drawText(ctx, 'LV ' + dest.levelRange[0] + '-' + dest.levelRange[1], sx, sy - 44, '#8f9aa8', true);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    this.drawText(ctx, 'F  TO ' + dest.name, sx, sy - 52, '#5ff0ff', true);
  },

  // 화면을 까맣게 덮는다 (동굴을 드나들 때의 장면 전환)
  drawFade(ctx, alpha) {
    if (alpha <= 0) return;
    ctx.fillStyle = 'rgba(0,0,0,' + Util.clamp(alpha, 0, 1).toFixed(3) + ')';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  },

  /* 화면 위쪽에 잠깐 떴다 사라지는 이름표 (숲 이름, 보스 방 이름).
     끝날 때 깜빡이며 사라져서 화면에 계속 남아 있지 않다. */
  drawBanner(ctx, text, color, timeLeft) {
    if (timeLeft < 0.6 && Math.floor(timeLeft * 12) % 2 === 0) return;

    const w = this.textWidth(text) + 14;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = 26;
    ctx.fillStyle = 'rgba(10,12,10,0.72)';
    ctx.fillRect(x, y, w, 13);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + 12, w, 1);
    this.drawText(ctx, text, CONFIG.VIEW_W / 2, y + 4, color, true);
  },

  // 체력이 낮으면 가장자리가 붉게 뛴다 (비네트 모양을 붉게 물들인 것)
  drawLowHp(ctx, player) {
    if (player.dead || player.hp > player.maxHp * CONFIG.fx.lowHpRatio) return;
    if (!SPRITES.vignetteRed) SPRITES.vignetteRed = makeSilhouette(SPRITES.vignette, '#c01818');
    ctx.globalAlpha = 0.45 + Math.sin(World.time * 6) * 0.25;
    ctx.drawImage(SPRITES.vignetteRed, 0, 0);
    ctx.globalAlpha = 1;
  },

  drawSoundState(ctx, on) {
    this.drawText(ctx, on ? 'SOUND ON' : 'SOUND OFF', CONFIG.VIEW_W / 2, CONFIG.VIEW_H - 26, on ? '#9be564' : '#8f9aa8', true);
  },

  /* 조준점 — 마우스 자리에 검은 테두리를 두른 흰 십자. 적 위에 있으면 붉어진다.
     (OS 십자 커서는 가늘고 색이 없어서 도트 배경에 묻히기 때문에 직접 그린다) */
  drawCrosshair(ctx, player, cam, enemies) {
    if (!Input.mouse.used) return;
    const mx = Math.round(Input.mouse.x), my = Math.round(Input.mouse.y);

    // 적 위에 있으면 붉게
    let hot = false;
    if (enemies) {
      const wx = cam.x + mx, wy = cam.y + my;
      for (const e of enemies) {
        if (e.dead) continue;
        if (Math.abs(e.x - wx) < e.radius + 3 && Math.abs(e.y - 4 - wy) < e.radius + 5) { hot = true; break; }
      }
    }
    const color = hot ? '#ff6b6b' : '#ffffff';

    // 십자 — 가운데 비우고 네 방향 막대 + 중심점. 검은 테두리를 먼저 깔아 어떤 배경에서도 읽힌다
    const gap = 3, len = 4;
    const cross = (c, o) => {
      ctx.fillStyle = c;
      ctx.fillRect(mx - gap - len - o, my - o, len + 2 * o, 1 + 2 * o);
      ctx.fillRect(mx + gap + 1 - o, my - o, len + 2 * o, 1 + 2 * o);
      ctx.fillRect(mx - o, my - gap - len - o, 1 + 2 * o, len + 2 * o);
      ctx.fillRect(mx - o, my + gap + 1 - o, 1 + 2 * o, len + 2 * o);
      ctx.fillRect(mx - o, my - o, 1 + 2 * o, 1 + 2 * o);
    };
    cross('#000000', 1);
    cross(color, 0);
  },

  // 시작 화면 — 게임 위에 어둡게 덮고 제목과 안내만 띄운다
  drawTitle(ctx, hasSave) {
    ctx.fillStyle = 'rgba(8,12,8,0.72)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    const cx = CONFIG.VIEW_W / 2, cy = CONFIG.VIEW_H / 2;
    // 제목 — 두 배 크기
    this.drawText(ctx, 'FOREST ADVENTURE', cx, cy - 30, '#9be564', true, true, UI.TEXT_SCALE * 2);
    this.drawText(ctx, 'A TINY PIXEL ACTION RPG', cx, cy - 12, '#7fa86a', true);
    // 세상이 멈춰 있으므로 깜빡임은 실제 시계로 돌린다
    if ((Date.now() % 1000) < 650) {
      this.drawText(ctx, hasSave ? 'PRESS ANY KEY TO CONTINUE' : 'PRESS ANY KEY TO START', cx, cy + 10, '#ffe066', true);
    }
    this.drawText(ctx, 'WASD MOVE   SPACE ATTACK   SHIFT DASH', cx, cy + 32, '#8fa383', true);
    this.drawText(ctx, 'F INTERACT   E POTION   I BAG   M MAP', cx, cy + 41, '#8fa383', true);
  },

  // 새 게임 확인 — 저장을 지우는 되돌릴 수 없는 동작이라 한 번 묻는다
  drawConfirm(ctx) {
    const w = 148, h = 52;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    this.panel(ctx, x, y, w, h, '#ffd93d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    ctx.fillStyle = 'rgba(16,20,16,0.96)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#6b4a26';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    this.drawText(ctx, 'START NEW GAME?', x + w / 2, y + 10, '#ffd93d', true);
    this.drawText(ctx, 'SAVED PROGRESS IS LOST', x + w / 2, y + 22, '#c9a0a0', true);
    this.drawText(ctx, 'Y  YES        N  NO', x + w / 2, y + 36, '#f0d9b5', true);
  },

  // 쿨다운(초)을 단어로 — 0.28 단검 FAST, 0.40 검 NORMAL, 0.62 도끼 SLOW
  speedWord(cooldown) {
    if (cooldown < 0.34) return 'FAST';
    if (cooldown < 0.51) return 'NORMAL';
    return 'SLOW';
  },

};

const PatchNotes = {
  KEY: 'forest-rpg-notes-seen',
  open: false,
  seenMemory: null,    // 저장 공간을 못 쓰는 환경에서도 이번 세션 안에서는 기억한다
  box: null,
  button: null,
  badge: null,
  panel: null,

  init() {
    this.box = document.getElementById('patchnotes');
    if (!this.box || !PATCH_NOTES.length) return;

    this.box.innerHTML =
      '<button class="pn-btn" type="button">패치노트<span class="pn-badge" hidden>!</span></button>' +
      '<div class="pn-panel" hidden>' +
        '<div class="pn-head"><span class="pn-title">업데이트 내역</span>' +
        '<button class="pn-close" type="button" aria-label="닫기">×</button></div>' +
        '<div class="pn-list">' + this.listHtml() + '</div>' +
      '</div>';
    this.button = this.box.querySelector('.pn-btn');
    this.badge = this.box.querySelector('.pn-badge');
    this.panel = this.box.querySelector('.pn-panel');
    this.box.hidden = false;

    this.button.addEventListener('click', (e) => { e.stopPropagation(); this.toggle(); });
    this.box.querySelector('.pn-close').addEventListener('click', (e) => { e.stopPropagation(); this.close(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'Escape' && this.open) this.close(); });
    this.updateBadge();
  },

  listHtml() {
    return PATCH_NOTES.map(entry => {
      const d = entry.date.slice(5).replace('-', '.');
      return '<div class="pn-entry"><div class="pn-date">' + d + '</div><ul>' +
        entry.notes.map(n => '<li>' + this.escape(n) + '</li>').join('') + '</ul></div>';
    }).join('');
  },

  seenDate() {
    let v = null;
    try { v = localStorage.getItem(this.KEY); } catch (e) { /* 무시 */ }
    return v || this.seenMemory;
  },

  markSeen() {
    this.seenMemory = PATCH_NOTES[0].date;
    try { localStorage.setItem(this.KEY, this.seenMemory); } catch (e) { /* 무시 */ }
    this.updateBadge();
  },

  // 아직 안 본 새 항목이 있는가
  hasUnread() {
    return this.seenDate() !== PATCH_NOTES[0].date;
  },

  updateBadge() {
    if (!this.badge) return;
    const unread = this.hasUnread();
    this.badge.hidden = !unread;
    this.badge.style.display = unread ? '' : 'none';   // hidden 속성이 CSS 에 밀리는 일이 없도록 이중으로
  },

  toggle() {
    if (this.open) this.close(); else this.openPanel();
  },

  openPanel() {
    this.open = true;
    this.panel.hidden = false;
    // 펼쳐 봤으니 최신 날짜까지 본 것으로 기억한다 → 느낌표가 사라진다
    this.markSeen();
  },

  close() {
    this.open = false;
    this.panel.hidden = true;
    this.markSeen();   // 닫을 때도 한 번 더 — 어떤 경로로 닫혀도 느낌표는 사라진다
  },

  escape(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },
};

  <script>
// ── js/game.js
'use strict';

/* 게임 루프, 카메라, 몬스터 스폰 관리, 렌더 순서 조립 */

const Game = {
  canvas: null,
  ctx: null,
  player: null,
  enemies: [],
  respawnQueue: [],   // 죽은 몬스터가 다시 나올 때까지 남은 시간
  cam: { x: 0, y: 0 },
  lastTime: 0,
  seed: 0,
  showInventory: false,
  showMap: false,
  confirmNewGame: false,
  forestBanner: 0,   // 맵 이름표(태초의 숲 / 작열하는 사막)가 남는 시간 — 시작·텔레포트·동굴에서 나올 때 뜬다
  gateBanner: 0,     // 첫 보스를 잡아 비석이 깨어났음을 알리는 표시
  bossSlain: {},     // 한 번이라도 잡은 보스 (관문을 여는 열쇠)
  mapStates: {},     // 다른 맵에 있는 동안 접어둔 맵들 (맵·몬스터·드랍) — 텔레포트로 돌아오면 그대로 펼친다
  portalPrompt: false,   // 텔레포트 비석 앞에 서 있는가
  boss: null,        // 살아있는 보스
  bossReadyIn: [0, 0, 0],   // 동굴마다 다시 도전할 수 있게 되기까지 남은 시간
  cavePrompt: null,  // 앞에 서 있는 동굴 입구 (입장 안내가 뜬다) — 없으면 null
  arenaCave: 0,      // 지금 들어가 있는 보스 방이 몇 번째 동굴 것인가 (CONFIG.maps.forest.caves 순서)
  exitPrompt: false, // 보스 방에서 나가는 굴 앞에 서 있는가
  inArena: false,    // 지금 보스 방 안인가
  overworld: null,   // 보스 방에 있는 동안 접어둔 겉맵 (맵·몬스터·드랍·플레이어 자리)
  transition: null,  // 화면이 어두워졌다 밝아지는 장면 전환
  failTimer: 0,      // 보스 방에서 쓰러진 뒤 밖으로 쫓겨나기까지
  lairBanner: 0,     // 보스 방에 들어섰음을 알리는 표시
  shopPrompt: false, // 상인 앞에 서 있어서 안내가 떠 있는가
  soundFlash: 0,     // 소리를 켜고 끌 때 뜨는 표시
  title: true,       // 시작 화면 — 아무 키나 누르면 시작 (첫 입력이 있어야 브라우저가 소리를 허락한다)
  heartbeat: 0,      // 체력이 낮을 때 심장 소리 간격

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    UI.initLayer(document.getElementById('ui'));   // 글자·창을 그릴 고운 레이어

    buildSprites();
    Input.init(this.canvas);
    Sound.init();
    PatchNotes.init();

    // 저장된 게임이 있으면 이어서 시작한다
    this.hasSave = Save.has();
    this.startGame(Save.read());
    this.title = true;

    // 탭을 닫기 직전에 마지막 상태를 한 번 더 저장한다
    window.addEventListener('beforeunload', () => Save.write(this));

    this.lastTime = performance.now();
    requestAnimationFrame(this.frame.bind(this));
  },

  // saved 가 있으면 그 시드로 같은 맵을 되살리고 진행 상황을 얹는다
  startGame(saved) {
    this.seed = (saved && saved.seed) || Math.floor(Math.random() * 100000);
    this.mapStates = {};
    Landmarks.deserialize(saved && saved.landmarks);   // 이미 연 상자는 열린 채로 다시 선다
    Fog.deserialize(saved && saved.fog);                // 밝혀둔 지도도 그대로
    this.bossSlain = Object.assign({}, (saved && saved.bossSlain) || {});
    if (typeof Village !== 'undefined') Village.reset();
    // 불러오기면 거점 데이터를 먼저 얹어 마을 배치에 반영한다 (연금술사 이사 여부)
    if (typeof Village !== 'undefined' && saved && saved.village) {
      Village.lootSold = Math.max(0, saved.village.lootSold | 0);
      Village.announced = Object.assign({}, saved.village.announced || {});
    }
    World.init(this.seed, (saved && CONFIG.maps[saved.map]) ? saved.map : 'forest');
    Minimap.build();
    FX.reset();
    Items.reset();
    Projectiles.reset();
    Ambient.reset();
    Shop.reset();
    Quests.reset();
    Forge.reset();
    if (typeof Events !== 'undefined') Events.deserialize(saved && saved.events);   // 며칠째 몇 시인가
    this.showInventory = false;
    this.showMap = false;
    this.confirmNewGame = false;
    Save.timer = Save.interval;

    // 시작 지점은 숲 한가운데 — 사방 어디로 가든 점점 위험해진다
    this.player = new Player(World.startX, World.startY);
    if (saved) Save.apply(saved, this.player);
    Quests.deserialize(saved && saved.quests, this.player);   // 저장된 의뢰를 되살리고 빈자리를 채운다
    if (typeof Village !== 'undefined') Village.deserialize(saved && saved.village, this.player);
    this.forestBanner = 2.8;   // 맵 이름을 한 번 띄운다
    this.boss = null;
    this.bossReadyIn = CONFIG.maps.forest.caves.map(() => 0);   // 동굴은 숲에만 있다
    this.cavePrompt = null;
    this.exitPrompt = false;
    this.inArena = false;
    this.overworld = null;
    this.transition = null;
    this.lairBanner = 0;
    this.shopPrompt = false;

    this.enemies = [];
    this.respawnQueue = [];
    for (let i = 0; i < CONFIG.spawn.maxAlive; i++) this.spawnEnemy();

    this.updateCamera(true);
  },

  // 종류 이름 -> 클래스. 몬스터를 추가할 때 여기에 한 줄만 넣으면 된다
  ENEMY_TYPES: {
    slime: (x, y, lv) => new Slime(x, y, lv),
    mushroom: (x, y, lv) => new Mushroom(x, y, lv),
    wolf: (x, y, lv) => new Wolf(x, y, lv),
    // 사막
    scorpion: (x, y, lv) => new Scorpion(x, y, lv),
    cactus: (x, y, lv) => new Cactus(x, y, lv),
    sandworm: (x, y, lv) => new Sandworm(x, y, lv),
  },

  // 보스 종류 -> 클래스 (CONFIG.bosses[*].type)
  BOSS_TYPES: {
    slime: (x, y) => new GiantSlime(x, y),
    wolf: (x, y) => new AlphaWolf(x, y),
    mushroom: (x, y) => new ElderShroom(x, y),
  },

  // 몇 번째 동굴의 보스 설정인가 (CONFIG.maps.forest.caves 순서)
  bossSpec(caveIndex) {
    return CONFIG.bosses[CONFIG.maps.forest.caves[caveIndex].boss];
  },

  /* ── 몬스터를 맵 아무 데나, 플레이어와 충분히 떨어진 빈 자리에 놓는다.
     종류와 레벨은 "그 자리가 시작점에서 얼마나 먼가"(위험도)가 정한다 — 가까운 곳은 약한 슬라임,
     중간은 늑대, 가장자리는 고레벨 버섯이 많다. */
  spawnEnemy() {
    const cs = CONFIG.spawn;

    for (let attempt = 0; attempt < 60; attempt++) {
      const x = Util.rand(30, World.w - 30);
      const y = Util.rand(60, World.h - 30);
      if (!World.isFreeSpot(x, y, 9)) continue;
      if (Util.dist(x, y, this.player.x, this.player.y) < cs.minDistFromPlayer) continue;
      // 거점 안전구역 안에는 스폰하지 않는다 — 마을은 쉬는 곳이다
      if (typeof Village !== 'undefined' && Village.isSafe && Village.isSafe(x, y)) continue;

      // 레벨은 그 자리의 기준 레벨에서 조금 흔들린다 (숲 1 -> 23, 사막 24 -> 40)
      const spread = World.spec.levelSpread, range = World.spec.levelRange;
      const level = Util.clamp(World.levelAt(x, y) + Util.randInt(-spread, spread), range[0], range[1]);
      const weights = World.typeWeightsAt(x, y);
      const names = Object.keys(weights);
      const type = names[Util.weightedIndex(names.map(n => weights[n]))];
      const make = this.ENEMY_TYPES[type] || this.ENEMY_TYPES.slime;

      const e = make(x, y, level);
      // 밤에 태어났으면 더 세다 — 날이 밝아도 그대로다 (Events)
      if (typeof Events !== 'undefined') Events.applySpawn(e);
      // 몇 마리는 엘리트로 — 접두사가 붙고 덩치와 보상이 커진다 (나머지는 Elite 가 다 한다)
      const prefix = Elite.roll(level, (typeof Events !== 'undefined') ? Events.eliteChanceMult() : 1);
      if (prefix) Elite.make(e, prefix);
      this.enemies.push(e);
      // 등장 연출 — 그 종류의 색으로 터진다 (엘리트는 접두사 색으로 한 번 더)
      const pal = e.palette;
      FX.burst(x, y, 8, [pal.M, pal.n], { speed: 30, life: 0.35, gravity: 40 });
      if (prefix) {
        FX.burst(x, y - 2, 16, [CONFIG.elite.prefixes[prefix].color, '#ffffff'], { speed: 60, life: 0.5, gravity: -10 });
      }
      return e;
    }
    return null;
  },

  /* ── 동굴 드나들기 ─────────────────────────────────────
     지역마다 하나씩 있는 동굴 입구에 서서 F 를 누르면 그 지역 보스의 방으로 들어간다.
     들어가고 나오는 F 는 무기 줍기와 같은 키이므로, 발밑에 무기가 있으면 그쪽이 먼저다.
     (그래서 이 검사는 Items.update 보다 먼저 돌려 F 입력을 가로챈다) */
  updateGates(dt) {
    for (let i = 0; i < this.bossReadyIn.length; i++) this.bossReadyIn[i] = Math.max(0, this.bossReadyIn[i] - dt);
    this.cavePrompt = null;
    this.exitPrompt = false;
    this.shopPrompt = false;
    this.portalPrompt = false;
    this.boardPrompt = false;
    this.forgePrompt = false;
    this.alchemistPrompt = false;
    this.stashPrompt = false;
    this.chestPrompt = null;
    if (this.inArena) this.updateArenaGate(dt);
    else {
      this.updateCaveGate();
      this.updateShopGate();
      this.updateBoardGate();
      this.updateForgeGate();
      this.updateAlchemistGate();
      this.updateStashGate();
      this.updateChestGate();
      this.updatePortalGate();
    }
  },

  // 대장장이 앞에서 F — 무기에 속성을 박는다
  updateForgeGate() {
    const n = World.smith;
    if (!n || this.player.dead || this.cavePrompt || this.shopPrompt || this.boardPrompt || Items.nearWeapon) return;
    if (Util.dist(this.player.x, this.player.y, n.x, n.y) > CONFIG.forge.interactRange) return;

    this.forgePrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    Forge.openForge();
  },

  // 연금술사 앞에서 F — 포션·해독제를 빚는다 (이사 와야 있다)
  updateAlchemistGate() {
    const n = World.alchemist;
    if (!n || this.player.dead || this.cavePrompt || this.shopPrompt || this.boardPrompt || this.forgePrompt || Items.nearWeapon) return;
    if (Util.dist(this.player.x, this.player.y, n.x, n.y) > CONFIG.alchemy.interactRange) return;

    this.alchemistPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    Village.openAlchemy();
  },

  // 창고 앞에서 F — 가방 밖 보관
  updateStashGate() {
    const c = World.stashChest;
    if (!c || this.player.dead || this.cavePrompt || this.shopPrompt || this.boardPrompt || this.forgePrompt || this.alchemistPrompt || Items.nearWeapon) return;
    if (Util.dist(this.player.x, this.player.y, c.x, c.y) > CONFIG.stash.interactRange) return;

    this.stashPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    Village.openStash();
  },

  // 보물 상자 앞에서 F — 아직 안 연 상자만 받는다
  updateChestGate() {
    if (this.player.dead || this.cavePrompt || this.shopPrompt || this.boardPrompt || Items.nearWeapon) return;
    if (!World.chests) return;
    for (const c of World.chests) {
      if (Landmarks.isOpened(c.mapId, c.index)) continue;
      if (Util.dist(this.player.x, this.player.y, c.x, c.y) > CONFIG.landmarks.interactRange) continue;
      this.chestPrompt = c;
      if (!Items.pickupRequested) return;
      Items.pickupRequested = false;
      Landmarks.open(c, this.player);
      this.chestPrompt = null;
      return;
    }
  },

  // 게시판 앞에서 F — 상인·동굴 다음 차례다
  updateBoardGate() {
    const b = World.board;
    if (!b || this.player.dead || this.cavePrompt || this.shopPrompt || Items.nearWeapon) return;
    if (Util.dist(this.player.x, this.player.y, b.x, b.y) > CONFIG.quests.interactRange) return;

    this.boardPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    Quests.openBoard();
  },

  /* 비석이 깨어났는가 — 숲 보스 셋 중 하나라도 잡았으면.
     보스를 '있어도 그만'이 아니라 다음 무대를 여는 열쇠로 만드는 장치다. */
  portalUnlocked() {
    const need = CONFIG.gate.requiredBoss;
    return !need || !!this.bossSlain[need];
  },

  // 텔레포트 비석 앞에서 F — 다른 맵의 비석 앞으로 옮겨간다
  updatePortalGate() {
    const p = World.portal;
    if (!p || this.player.dead || this.cavePrompt || this.shopPrompt || Items.nearWeapon) return;
    if (Util.dist(this.player.x, this.player.y, p.x, p.y + 4) > CONFIG.portal.interactRange) return;

    this.portalPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    // 숲에서 사막으로 나가는 길만 잠겨 있다 (돌아오는 길은 늘 열려 있다)
    if (World.mapId === 'forest' && !this.portalUnlocked()) {
      FX.number(p.x, p.y - 30, 'SEALED', '#ff6b6b');
      Sound.play('error');
      return;
    }
    const target = World.spec.portalTo;
    this.beginTransition(() => this.travel(target));
  },

  /* ── 맵 옮겨가기 ───────────────────────────────────────
     지금 맵(지형·몬스터·바닥 드랍)은 통째로 접어두고, 목적지 맵은 접어둔 게 있으면 펼치고 없으면 새로 만든다.
     같은 시드에서 만들므로 처음 가도 저장을 다시 켜도 같은 사막이 나온다. 도착 자리는 그 맵의 비석 앞. */
  travel(mapId) {
    const from = World.mapId;
    this.mapStates[from] = {
      world: World.snapshot(),
      enemies: this.enemies,
      respawnQueue: this.respawnQueue,
      drops: Items.drops.slice(),
    };
    Projectiles.reset();
    FX.reset();
    Items.reset();

    const saved = this.mapStates[mapId];
    if (saved) {
      World.restore(saved.world);
      this.enemies = saved.enemies;
      this.respawnQueue = saved.respawnQueue;
      for (const d of saved.drops) Items.drops.push(d);
      delete this.mapStates[mapId];
    } else {
      World.init(this.seed, mapId);
      this.enemies = [];
      this.respawnQueue = [];
    }
    if (typeof Village !== 'undefined' && Village.syncZone) Village.syncZone();
    Minimap.build();
    Ambient.reset();

    const p = this.player;
    const portal = World.portal;
    p.x = portal.x; p.y = portal.y + 22;
    p.spawnX = p.x; p.spawnY = p.y;
    p.kx = p.ky = 0; p.invuln = 0.9; p.attackTimer = 0; p.activeSkill = null;
    if (!saved) for (let i = 0; i < CONFIG.spawn.maxAlive; i++) this.spawnEnemy();

    this.forestBanner = 2.8;
    this.updateCamera(true);
    FX.burst(p.x, p.y, 30, ['#5ff0ff', '#ffffff', '#2a8fa0'], { speed: 80, life: 0.7, gravity: -20 });
    Sound.play('caveOut');
  },

  // 상인 앞에서 F — 무기 줍기와 동굴 입장이 먼저이고, 둘 다 아니면 상점이다
  updateShopGate() {
    const npc = World.merchant;
    if (!npc || this.player.dead || this.cavePrompt) return;   // 동굴 안내가 떠 있으면 그쪽이 먼저
    if (Util.dist(this.player.x, this.player.y, npc.x, npc.y) > CONFIG.shop.interactRange) return;
    if (Items.nearWeapon) return;

    this.shopPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    Shop.openShop();
  },

  updateCaveGate() {
    if (this.player.dead || Items.nearWeapon) return;   // 무기 교체가 먼저다
    for (let index = 0; index < World.caves.length; index++) {
      const cave = World.caves[index];
      if (!cave) continue;
      if (Util.dist(this.player.x, this.player.y, cave.x, cave.y) > CONFIG.arena.enterRange) continue;

      this.cavePrompt = cave;
      if (this.bossReadyIn[index] > 0) return;   // 잡은 지 얼마 안 됐으면 아직 비어 있다
      if (!Items.pickupRequested) return;

      Items.pickupRequested = false;      // 이 F 입력은 입장에 쓴다
      this.beginTransition(() => this.enterArena(index));
      return;
    }
  },

  updateArenaGate(dt) {
    // 쓰러지면 잠깐 뒤 굴 밖으로 쫓겨난다. 벌칙은 없고 바로 다시 들어갈 수 있다
    if (this.player.dead) {
      this.failTimer = Math.max(0, this.failTimer - dt);
      if (this.failTimer <= 0) this.beginTransition(() => this.exitArena());
      return;
    }
    this.failTimer = 1.2;

    const exit = World.arenaExit;
    if (!exit) return;
    if (Util.dist(this.player.x, this.player.y, exit.x, exit.y) > CONFIG.arena.enterRange) return;
    if (Items.nearWeapon) return;

    this.exitPrompt = true;
    if (!Items.pickupRequested) return;
    Items.pickupRequested = false;
    this.beginTransition(() => this.exitArena());
  },

  /* 장면 전환 — 화면이 까맣게 덮였다가 다시 걷힌다.
     한가운데(완전히 까매진 순간)에 맵을 갈아끼우므로 바뀌는 장면이 보이지 않는다.
     전환 중에는 시간이 멈춰서 맞거나 때릴 수 없다. */
  beginTransition(action) {
    if (this.transition) return;
    this.transition = { t: 0, dur: 0.85, action: action, fired: false };
  },

  updateTransition(dt) {
    const tr = this.transition;
    tr.t += dt;
    if (!tr.fired && tr.t >= tr.dur / 2) {
      tr.fired = true;
      tr.action();
    }
    if (tr.t >= tr.dur) this.transition = null;
  },

  // 0(밝음) -> 1(완전히 검음) -> 0
  fadeAlpha() {
    const tr = this.transition;
    if (!tr) return 0;
    return 1 - Math.abs(1 - (tr.t / tr.dur) * 2);
  },

  /* 동굴 안으로 — 겉맵은 통째로 접어두고 보스 방을 펼친다.
     겉맵을 버리지 않으므로 나왔을 때 몬스터도 바닥에 떨어진 물건도 그대로 있다. */
  enterArena(caveIndex) {
    const cave = World.caves[caveIndex];
    this.arenaCave = caveIndex;
    this.overworld = {
      world: World.snapshot(),
      enemies: this.enemies,
      respawnQueue: this.respawnQueue,
      drops: Items.drops.slice(),
      x: cave.x, y: cave.y + 24,        // 나왔을 때 설 자리 — 입구 안내(남은 시간)가 보이는 거리
      spawnX: this.player.spawnX, spawnY: this.player.spawnY,
    };

    World.initArena(this.seed + 7777 + caveIndex * 131, caveIndex);
    Items.reset();
    Projectiles.reset();
    FX.reset();
    this.enemies = [];
    this.respawnQueue = [];

    const p = this.player;
    p.x = World.startX; p.y = World.startY;
    p.spawnX = World.startX; p.spawnY = World.startY;
    p.kx = p.ky = 0;
    p.invuln = 0.9;
    p.attackTimer = 0;
    p.activeSkill = null;

    const spec = this.bossSpec(caveIndex);
    const b = this.BOSS_TYPES[spec.type](World.bossX, World.bossY);
    this.enemies.push(b);
    this.boss = b;
    this.inArena = true;
    this.failTimer = 1.2;
    this.forestBanner = 0;
    this.lairBanner = 2.4;
    this.updateCamera(true);
    FX.addShake(6);
    Sound.play('caveIn');
    const pal = b.palette;
    FX.burst(b.x, b.y + 8, 40, [pal.M, pal.n, '#12100e'], { speed: 110, life: 0.8 });
  },

  // 동굴 밖으로 — 접어뒀던 겉맵을 그대로 펼치고 동굴 입구 앞에 세운다
  exitArena() {
    const o = this.overworld;
    if (!o) return;
    // 미처 줍지 못한 무기는 동굴 밖까지 들고 나온다 (보상을 문턱에서 잃지 않도록)
    const carried = Items.drops.filter(d => d.kind === 'weapon');

    World.restore(o.world);
    if (typeof Village !== 'undefined' && Village.syncZone) Village.syncZone();
    this.enemies = o.enemies;
    this.respawnQueue = o.respawnQueue;
    Projectiles.reset();
    FX.reset();
    Items.reset();
    for (const d of o.drops) Items.drops.push(d);

    const p = this.player;
    p.spawnX = o.spawnX; p.spawnY = o.spawnY;
    // 동굴 입구 앞 — 막혀 있으면 주변으로 조금씩 밀어가며 설 자리를 찾는다
    let px = o.x, py = o.y;
    for (let i = 0; i < 24 && World.blocked({ x: px - 5, y: py + 1, w: 10, h: 6 }); i++) {
      const a = i * 1.1;
      px = o.x + Math.cos(a) * (8 + i * 2);
      py = o.y + Math.sin(a) * (8 + i * 2);
    }
    if (p.dead) p.reviveAt(px, py);
    else { p.x = px; p.y = py; p.kx = p.ky = 0; p.invuln = 0.9; }

    for (const d of carried) {
      Items.spawnWeapon(px, py, d.weapon, d.level, { growing: d.growing, pickupDelay: 0.4 });
    }

    this.boss = null;
    this.inArena = false;
    this.overworld = null;
    this.lairBanner = 0;
    this.forestBanner = 2.4;   // 숲으로 돌아왔다
    this.updateCamera(true);
    Sound.play('caveOut');
  },

  updateEnemies(dt) {
    for (const e of this.enemies) e.update(dt, this.player);

    // 죽은 몬스터는 목록에서 빼고 재등장 타이머에 넣는다
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (!this.enemies[i].dead) continue;
      const e = this.enemies[i];
      Items.dropFor(e);
      // 조용히 물러난 것(습격 종료·밤의 교대)은 잡은 게 아니므로 의뢰에도 안 센다
      if (!e.noDrop) Quests.onKill(e);
      this.enemies.splice(i, 1);
      if (e.isBoss) {
        // 보스는 일반 몬스터 정원과 무관하다. 한참 뒤에 다시 도전할 수 있다
        this.boss = null;
        this.bossReadyIn[this.arenaCave] = CONFIG.arena.respawnDelay;
        // 처음 잡은 보스라면 — 이게 다음 무대를 여는 열쇠다
        const type = this.bossSpec(this.arenaCave).type;
        if (!this.bossSlain[type]) {
          this.bossSlain[type] = true;
          if (this.portalUnlocked()) this.gateBanner = 3.2;
          // 대장장이 이사 조건 — 보스 하나면 마을로 온다
          if (typeof Village !== 'undefined') Village.checkMoveIns(false);
        }
      } else if (!this.inArena) {
        this.respawnQueue.push(Util.rand(CONFIG.spawn.respawnMin, CONFIG.spawn.respawnMax));
      }
    }
    // 보스 방에서는 겉맵 몬스터가 새로 나오지 않는다 (분열한 새끼도 다시 채우지 않는다)
    if (this.inArena) return;
    for (let i = this.respawnQueue.length - 1; i >= 0; i--) {
      this.respawnQueue[i] -= dt;
      if (this.respawnQueue[i] <= 0) {
        this.respawnQueue.splice(i, 1);
        this.spawnEnemy();
      }
    }
  },

  paused() {
    if (typeof Village !== 'undefined' && (Village.stashOpen || Village.alchemyOpen)) return true;
    return this.showInventory || this.showMap || this.confirmNewGame || Shop.open || Quests.open || Forge.open || PatchNotes.open;
  },

  // 이름표 시간과 배경음 — 시작점에서 멀어질수록 곡이 무거워진다 (맵마다 spec.bgm 에 곡과 경계가 있다)
  updateBanners(dt) {
    this.lairBanner = Math.max(0, this.lairBanner - dt);
    this.forestBanner = Math.max(0, this.forestBanner - dt);
    this.gateBanner = Math.max(0, this.gateBanner - dt);
    if (this.inArena) { Sound.setTrack('boss'); return; }
    const t = World.dangerAt(this.player.x, this.player.y), bgm = World.spec.bgm;
    Sound.setTrack(t < bgm.edges[0] ? bgm.tracks[0] : (t < bgm.edges[1] ? bgm.tracks[1] : bgm.tracks[2]));
  },

  // 체력이 낮으면 심장이 뛴다 (화면 가장자리는 UI 가 붉게 칠한다)
  updateHeartbeat(dt) {
    const p = this.player;
    if (p.dead || p.hp > p.maxHp * CONFIG.fx.lowHpRatio) { this.heartbeat = 0; return; }
    this.heartbeat -= dt;
    if (this.heartbeat <= 0) { this.heartbeat = 1.0; Sound.play('heartbeat'); }
  },

  // 인벤토리 / 지도 / 새 게임 확인 — 시간이 멈춰 있어도 입력은 받아야 한다
  handleMenuInput() {
    if (this.transition) return;   // 장면이 넘어가는 동안에는 아무것도 열리지 않는다
    if (this.confirmNewGame) {
      // 확인 창이 떠 있는 동안에는 Y / N 만 받는다
      if (Input.pressed.KeyY) {
        Save.clear();
        this.startGame(null);
      } else if (Input.pressed.KeyN || Input.pressed.Escape) {
        this.confirmNewGame = false;
      }
      return;
    }
    // 상점이나 인벤토리가 열려 있으면 그쪽이 키를 다 가져간다
    if (Shop.open) { Shop.handleInput(this.player); return; }
    if (Quests.open) { Quests.handleInput(this.player); return; }
    if (Forge.open) { Forge.handleInput(this.player); return; }
    if (typeof Village !== 'undefined') {
      if (Village.stashOpen) { Village.handleStashInput(this.player); return; }
      if (Village.alchemyOpen) { Village.handleAlchemyInput(this.player); return; }
    }
    if (this.showInventory) { Inventory.handleInput(this.player); return; }
    if (Input.pressed.KeyV) { Sound.toggle(); Sound.play('toggle'); this.soundFlash = 1.4; }
    if (Input.inventoryPressed()) { this.showInventory = true; Inventory.message = ''; }
    // 보스 방에서는 겉맵 지도를 펼칠 수 없다 (여기는 그 지도에 없는 곳이다)
    if (Input.mapPressed() && !this.inArena) this.showMap = !this.showMap;
    if (Input.newGamePressed()) this.confirmNewGame = true;
  },

  updateCamera(snap) {
    const targetX = this.player.x - CONFIG.VIEW_W / 2;
    const targetY = this.player.y - CONFIG.VIEW_H / 2;
    const maxX = Math.max(0, World.w - CONFIG.VIEW_W);
    const maxY = Math.max(0, World.h - CONFIG.VIEW_H);
    if (snap) {
      this.cam.x = Util.clamp(targetX, 0, maxX);
      this.cam.y = Util.clamp(targetY, 0, maxY);
    } else {
      this.cam.x = Util.clamp(Util.lerp(this.cam.x, targetX, 0.18), 0, maxX);
      this.cam.y = Util.clamp(Util.lerp(this.cam.y, targetY, 0.18), 0, maxY);
    }
  },

  frame(now) {
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    dt = Math.min(dt, 0.05);   // 탭을 다시 켰을 때 한 번에 확 튀지 않도록
    this.frameDt = dt;         // 그리기 쪽 연출(나무 옅어지기)도 시간에 맞춰 움직이도록

    // 개발 중 에러 하나로 게임이 통째로 멈추지 않도록 감싼다 (에러는 콘솔에 남는다)
    try {
      // 시작 화면 — 아무 키나 누르면 시작한다. 그 전까지는 세상이 멈춰 있다
      if (this.title) {
        if (Object.keys(Input.pressed).length) { this.title = false; }
        Input.endFrame();
        this.render();
        requestAnimationFrame(this.frame.bind(this));
        return;
      }
      // 입력은 시간이 멈춘 프레임에도 사라지면 안 되므로 가장 먼저 받아둔다
      this.handleMenuInput();
      this.player.bufferInput();
      if (Input.pickupPressed()) Items.pickupRequested = true;
      // 거점 귀환 — T 로 마을 시작점으로 (보스 방·일시정지 중에는 안 된다)
      if (Input.pressed.KeyT && typeof Village !== 'undefined') Village.tryReturn(this.player);

      Save.tick(dt, this);
      this.soundFlash = Math.max(0, this.soundFlash - dt);

      // 동굴을 드나드는 장면 전환 중에도 시간이 멈춘다 (전환 도중에 맞으면 억울하다)
      if (this.transition) {
        this.updateTransition(dt);
        FX.update(dt);
      } else if (!this.paused()) {
        // 인벤토리·지도를 펼쳐둔 동안에는 시간이 완전히 멈춘다 (읽는 사이에 맞지 않도록)
        if (FX.hitStop > 0) {
          FX.hitStop -= dt;   // 타격 순간에 아주 짧게 멈춘다 — 때리는 맛이 살아난다
        } else {
          this.player.update(dt, this.enemies);
          this.updateEnemies(dt);
          if (typeof Village !== 'undefined' && Village.update) Village.update(dt);
          Projectiles.update(dt, this.player);
          // F 입력을 먼저 가져갈 수 있도록 아이템 처리보다 앞에 둔다
          this.updateGates(dt);
          Items.update(dt, this.player);
          this.updateCamera(false);
          World.update(dt);
          Ambient.update(dt, this.cam);
          this.updateBanners(dt);
          if (typeof Events !== 'undefined') Events.update(dt);   // 하루·모래폭풍·습격
          this.updateHeartbeat(dt);
          Quests.update(dt, this.player);
          Landmarks.update(dt, this.player);
          Fog.update(dt, this.player);
        }
        FX.update(dt);
      }
      Input.endFrame();
      this.render();
    } catch (err) {
      console.error('[frame]', err);
    }
    requestAnimationFrame(this.frame.bind(this));
  },

  /* 나무 뒤에 서면 나무가 반투명해진다 — 플레이어나 몬스터가 잎사귀에 가려 안 보이는 일을 막는다.
     "뒤"란 나무보다 위쪽(y가 작아 먼저 그려지는) 자리에서 몸통 상자가 나무 그림과 겹치는 것.
     사람 눈에 머리까지 보여야 하므로 몸통 상자를 위로 조금 늘려 본다.
     알파는 단번에 튀지 않고 부드럽게 오간다 (나무 하나마다 fade 값을 기억). */
  fadeTrees(drawables, dt) {
    const cfg = CONFIG.world.treeFade;
    const bodies = [];
    // 플레이어 + 살아 있는 몬스터. 상인처럼 몸통 상자가 없는 것(맞을 일이 없는 것)은 뺀다
    for (const d of drawables) if (d.draw && !d.dead && d.hurtBox) bodies.push(d);
    const k = Math.min(1, dt * cfg.speed);
    for (const p of drawables) {
      if (!p.tree) continue;
      if (p.fade === undefined) p.fade = 1;
      const left = p.x + p.ox, right = left + p.sprite.width;
      const top = p.y + p.oy, bottom = top + p.sprite.height;
      let hidden = false;
      for (const b of bodies) {
        if (b.y >= p.depth) continue;          // 나무 앞에 서 있으면 가려지지 않는다
        const hb = b.hurtBox;
        const bx0 = hb.x, bx1 = hb.x + hb.w, by0 = hb.y - 8, by1 = hb.y + hb.h;
        if (bx1 < left || bx0 > right || by1 < top || by0 > bottom) continue;
        hidden = true; break;
      }
      const target = hidden ? cfg.alpha : 1;
      p.fade += (target - p.fade) * k;
    }
  },

  render() {
    const ctx = this.ctx;
    ctx.imageSmoothingEnabled = false;

    // 화면 흔들림은 카메라를 살짝 밀어서 표현한다
    const shakeX = FX.shake > 0 ? Util.rand(-FX.shake, FX.shake) : 0;
    const shakeY = FX.shake > 0 ? Util.rand(-FX.shake, FX.shake) : 0;
    const cam = { x: Math.round(this.cam.x + shakeX + FX.kick.x), y: Math.round(this.cam.y + shakeY + FX.kick.y) };

    ctx.clearRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    UI.clearLayer();   // 글자·창 레이어도 매 프레임 새로 그린다
    World.drawGround(ctx, cam);
    Ambient.drawWater(ctx, cam);
    // 보스의 바닥 예고(돌진 경로, 착지 범위, 포자비 표시)는 바닥 바로 위, 캐릭터 아래에
    for (const e of this.enemies) if (e.drawGround && !e.dead) e.drawGround(ctx, cam);

    // ── 화면에 보이는 것만 모아서 y좌표 순으로 그린다 (아래쪽이 앞)
    const drawables = [];
    const pad = 60;
    for (const p of World.props) {
      if (p.x < cam.x - pad || p.x > cam.x + CONFIG.VIEW_W + pad) continue;
      if (p.y < cam.y - pad || p.y > cam.y + CONFIG.VIEW_H + pad) continue;
      drawables.push(p);
    }
    for (const e of this.enemies) {
      if (e.x < cam.x - pad || e.x > cam.x + CONFIG.VIEW_W + pad) continue;
      if (e.y < cam.y - pad || e.y > cam.y + CONFIG.VIEW_H + pad) continue;
      drawables.push(e);
    }
    // 바닥 드랍도 같은 목록에 넣어야 나무 앞뒤 관계가 맞는다
    for (const it of Items.drops) {
      if (it.x < cam.x - pad || it.x > cam.x + CONFIG.VIEW_W + pad) continue;
      if (it.y < cam.y - pad || it.y > cam.y + CONFIG.VIEW_H + pad) continue;
      drawables.push(it);
    }
    if (!this.player.dead) drawables.push(this.player);

    drawables.sort((a, b) => (a.depth !== undefined ? a.depth : a.y) - (b.depth !== undefined ? b.depth : b.y));
    this.fadeTrees(drawables, this.frameDt || 0);

    for (const d of drawables) {
      if (d.kind) {
        Items.drawOne(ctx, cam, d);          // 바닥 드랍 (포션 / 무기)
      } else if (d.draw) {
        d.draw(ctx, cam);                    // 플레이어 / 몬스터
      } else {
        // 흔들리는 풀은 프레임이 여러 장이다
        const sp = d.frames ? d.frames[World.swayFrame(d)] : d.sprite;
        // 뒤에 누가 서 있는 나무는 옅게 그린다
        if (d.fade !== undefined && d.fade < 0.995) ctx.globalAlpha = d.fade;
        ctx.drawImage(sp, Math.round(d.x - cam.x + d.ox), Math.round(d.y - cam.y + d.oy));
        ctx.globalAlpha = 1;
      }
    }

    Projectiles.draw(ctx, cam);   // 탄은 캐릭터 위로 지나간다
    FX.drawRings(ctx, cam);
    FX.drawParticles(ctx, cam);
    FX.drawSparks(ctx, cam);
    FX.drawNumbers(ctx, cam);
    Ambient.drawOverlay(ctx);
    // 하늘빛(밤·황혼)과 모래폭풍은 세상 위에 한 겹 덮는다 — 글자와 창(고운 레이어)은 그 위다
    if (typeof Events !== 'undefined') {
      Events.drawSky(ctx, this.player, cam);
      Events.drawStorm(ctx);
    }
    ctx.drawImage(SPRITES.vignette, 0, 0);   // 가장자리를 어둡게 해 화면 중앙에 시선을 모은다
    UI.drawLowHp(ctx, this.player);
    FX.drawFlashes(ctx);

    /* 여기부터는 고운 레이어(ui 캔버스)에 그린다 — 창과 덮개가 글자보다 위에 와야 하고,
       세상에 떠 있는 글자(이름표·데미지 숫자)도 이미 그 레이어에 있기 때문이다 */
    const ui = UI.fx;
    // 보스 방은 겉맵 지도에 없는 곳이라 미니맵을 띄우지 않는다
    if (!this.showMap && !this.inArena) Minimap.drawCorner(ui, this.player, this.enemies);
    // 화면 밖 엘리트는 가장자리에 별로 — 평범한 사냥 중에 '어, 저거'가 생기는 자리
    if (!this.showMap && !this.title && !this.player.dead) Elite.drawMarkers(ui, cam, this.enemies, this.player);
    // 마을 간판 — 안에 들어와 있을 때만 시설 이름이 뜬다
    if (!this.showMap && !this.title && typeof Village !== 'undefined') Village.drawSigns(ui, cam, this.player);
    UI.draw(ui, this.player, this.showInventory);
    if (this.showMap) Minimap.drawFull(ui, this.player, this.enemies);
    if (this.boss && !this.boss.dead && !this.showMap) UI.drawBossBar(ui, this.boss);
    if (this.cavePrompt) UI.drawCavePrompt(ui, this.cavePrompt, cam, this.bossReadyIn[this.cavePrompt.caveIndex], 'ENTER');
    if (this.exitPrompt) UI.drawCavePrompt(ui, World.arenaExit, cam, 0, 'LEAVE');
    if (this.shopPrompt && !this.showMap) Shop.drawPrompt(ui, cam);
    if (this.boardPrompt && !this.showMap) Quests.drawPrompt(ui, cam);
    if (this.forgePrompt && !this.showMap) Forge.drawPrompt(ui, cam);
    if (this.alchemistPrompt && !this.showMap && typeof Village !== 'undefined') Village.drawAlchemistPrompt(ui, cam);
    if (this.stashPrompt && !this.showMap && typeof Village !== 'undefined') Village.drawStashPrompt(ui, cam);
    if (this.chestPrompt && !this.showMap) Landmarks.drawPrompt(ui, cam, this.chestPrompt);
    if (this.portalPrompt && !this.showMap) {
      UI.drawPortalPrompt(ui, World.portal, cam, CONFIG.maps[World.spec.portalTo],
        World.mapId === 'forest' && !this.portalUnlocked());
    }
    if (!this.showMap && !this.showInventory && !Shop.open && !Quests.open && !this.title) Quests.drawTracker(ui, this.player);
    if (Shop.open) Shop.draw(ui, this.player);
    if (Quests.open) Quests.draw(ui, this.player);
    if (Forge.open) Forge.draw(ui, this.player);
    if (typeof Village !== 'undefined') {
      if (Village.stashOpen) Village.drawStashWindow(ui, this.player);
      if (Village.alchemyOpen) Village.drawAlchemy(ui, this.player);
    }
    if (this.lairBanner > 0) UI.drawBanner(ui, this.bossSpec(this.arenaCave).lairName, '#ff6b6b', this.lairBanner);
    if (this.forestBanner > 0 && !this.showMap && !this.showInventory && !Shop.open && !this.title) UI.drawBanner(ui, World.spec.name, World.spec.color, this.forestBanner);
    if (this.gateBanner > 0 && !this.showMap) UI.drawBanner(ui, 'THE OBELISK AWAKENS', '#5ff0ff', this.gateBanner);
    if (typeof Events !== 'undefined') {
      if (!this.showMap && !this.showInventory && !this.title && !Shop.open && !Quests.open) Events.drawHud(ui);
      if (Events.notice > 0 && !this.showMap) UI.drawBanner(ui, Events.noticeText, Events.noticeColor, Events.notice);
    }
    if (this.confirmNewGame) UI.drawConfirm(ui);
    if (this.soundFlash > 0) UI.drawSoundState(ui, Sound.enabled);
    // 장면 전환은 맨 위를 덮는다
    if (this.transition) UI.drawFade(ui, this.fadeAlpha());
    if (this.title) UI.drawTitle(ui, this.hasSave);
    // 조준점은 무엇보다 위에 — 창이 열려 있어도 마우스 자리는 보여야 한다
    else UI.drawCrosshair(ui, this.player, cam, this.enemies);
  },
};

window.addEventListener('load', () => Game.init());

</script>
</body>
</html>
