  <script>
// ── js/save.js
'use strict';

/* 저장 / 불러오기 — localStorage 한 칸에 JSON으로 넣는다.

   맵 전체를 저장하지 않고 **맵을 만든 시드**만 저장한다.
   같은 시드로 다시 생성하면 지형이 그대로 재현되므로 저장 용량이 아주 작다.
   슬라임은 어차피 계속 재등장하므로 저장하지 않고, 바닥 드랍과 가방 속 물건은 저장한다. 저장은 화면에 표시하지 않고 조용히 한다.

   형식이 바뀌면 VERSION 을 올린다 — 옛 저장은 조용히 무시되고 새 게임이 시작된다. */

const Save = {
  KEY: 'forest-rpg-save',
  VERSION: 1,
  interval: 5,      // 자동 저장 주기 (초)
  timer: 5,

  /* ── 쓰기 ──────────────────────────────────────────────── */

  collect(game) {
    const p = game.player;
    /* 보스 방 안에서는 그곳의 좌표와 드랍을 저장하면 안 된다 —
       보스 방은 저장되지 않는 임시 공간이라, 다시 켰을 때 겉맵의 엉뚱한 자리에 떨어진다.
       그래서 접어둔 겉맵 쪽 좌표와 드랍을 대신 적는다. */
    const o = game.overworld;
    const x = o ? o.x : p.x, y = o ? o.y : p.y;
    const drops = o ? o.drops : Items.drops;

    return {
      version: this.VERSION,
      seed: game.seed,
      savedAt: Date.now(),
      player: {
        x: Math.round(x), y: Math.round(y),
        hp: Math.round(p.hp), maxHp: p.maxHp, damage: p.damage,
        level: p.level, xp: p.xp, xpNeed: p.xpNeed,
        potions: p.potions,
        weapon: p.weapon, weaponLevel: p.weaponLevel, weaponGrowing: p.weaponGrowing,
        gold: p.gold, upgrades: p.upgrades,
        bag: Inventory.serialize(p),
      },
      drops: drops.map(d => ({
        kind: d.kind, weapon: d.weapon, level: d.level, amount: d.amount, id: d.id,
        growing: !!d.growing,
        x: Math.round(d.x), y: Math.round(d.y), life: Math.round(d.life),
      })),
    };
  },

  write(game) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.collect(game)));
      return true;
    } catch (err) {
      // 시크릿 모드나 저장 공간 부족 — 게임 진행 자체는 막지 않는다
      console.warn('[save] 저장하지 못했습니다', err);
      return false;
    }
  },

  clear() {
    try { localStorage.removeItem(this.KEY); } catch (err) { /* 무시 */ }
  },

  /* ── 읽기 ──────────────────────────────────────────────── */

  read() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== this.VERSION) return null;
      if (typeof data.seed !== 'number' || !data.player) return null;
      return data;
    } catch (err) {
      console.warn('[save] 저장 파일을 읽지 못했습니다', err);
      return null;
    }
  },

  has() {
    return this.read() !== null;
  },

  // 불러온 값을 플레이어와 바닥 드랍에 되돌려 놓는다 (World.init 이후에 호출)
  apply(data, player) {
    const s = data.player;
    player.maxHp = Math.max(1, s.maxHp || CONFIG.player.maxHp);
    player.hp = Util.clamp(s.hp, 1, player.maxHp);
    player.damage = s.damage || CONFIG.player.attackDamage;
    player.level = Math.max(1, s.level || 1);
    player.xp = Math.max(0, s.xp || 0);
    player.xpNeed = s.xpNeed || CONFIG.levelUp.xpNeed(player.level);
    // 9주차: 골드와 강화 랭크. 가방 크기는 랭크에서 다시 계산한다 (maxHp/damage 는 값 자체가 저장돼 있다)
    player.gold = Math.max(0, s.gold || 0);
    player.upgrades = Object.assign({}, s.upgrades || {});
    player.maxPotions = CONFIG.items.potionMax + (player.upgrades.bag || 0);
    player.potions = Util.clamp(s.potions || 0, 0, player.maxPotions);
    // 가방 — 칸 수는 강화 랭크에서 다시 계산하고, 들어 있던 것을 되살린다
    const slotSpec = CONFIG.shop.upgrades.find(u => u.id === 'slots');
    player.bagSlots = CONFIG.inventory.baseSlots + (player.upgrades.slots || 0) * (slotSpec ? slotSpec.gain : 5);
    Inventory.create(player);
    Inventory.deserialize(player, s.bag);

    if (CONFIG.weapons[s.weapon]) {
      player.weapon = s.weapon;
      player.weaponGrowing = !!s.weaponGrowing;
      player.weaponLevel = Util.clamp(s.weaponLevel || 1, 1, player.weaponGrowing ? CONFIG.weapons.levelMult.length : LEVEL_MAX);
      player.syncWeaponLevel();   // 성장하는 무기는 레벨을 다시 맞춰둔다
    }

    // 저장된 자리가 막혀 있으면(설정을 바꿔 지형이 달라진 경우) 시작 지점으로 되돌린다
    player.x = s.x; player.y = s.y;
    if (World.blocked(player.feetBox)) {
      player.x = player.spawnX;
      player.y = player.spawnY;
    }

    Items.reset();
    for (const d of (data.drops || [])) {
      if (d.kind === 'weapon') Items.spawnWeapon(d.x, d.y, d.weapon, d.level, { growing: d.growing });
      else if (d.kind === 'loot') Items.spawnLoot(d.x, d.y, d.id, d.amount);
      else Items.spawn(d.x, d.y, d.amount);
      // spawn 은 빈 자리를 찾아 위치를 흔들므로 저장된 자리로 되돌린다
      const nd = Items.drops[Items.drops.length - 1];
      if (nd) {
        nd.x = d.x; nd.y = d.y;
        nd.vx = 0; nd.vy = 0;
        nd.life = d.life;
      }
    }
  },

  /* ── 자동 저장 ─────────────────────────────────────────── */

  tick(dt, game) {
    this.timer -= dt;
    if (this.timer > 0) return;
    this.timer = this.interval;
    this.write(game);   // 조용히 저장한다 — 화면에 표시하지 않는다
  },
};

</script>
  <script>
// ── js/player.js
'use strict';

/* 플레이어 — 이동, 무기 휘두르기, 피격, 레벨업 */

class Player {
  constructor(x, y) {
    const c = CONFIG.player;
    this.x = x; this.y = y;
    this.spawnX = x; this.spawnY = y;
    this.facing = 'down';
    this.maxHp = c.maxHp;
    this.hp = this.maxHp;
    this.damage = c.attackDamage;
    this.level = 1;
    this.xp = 0;
    this.xpNeed = CONFIG.levelUp.xpNeed(1);

    // 2주차 인벤토리 — 지금은 포션 한 종류만 든다
    this.potions = CONFIG.items.potionStart;
    this.maxPotions = CONFIG.items.potionMax;
    this.potionCooldown = 0;

    // 장비 — 한 번에 하나의 무기만 든다. 종류는 성능이 같고, 위력은 무기 레벨이 정한다
    this.weapon = CONFIG.equipment.startWeapon;
    this.weaponLevel = CONFIG.equipment.startWeaponLevel;
    // 보스가 떨구는 '성장하는 무기' — 레벨이 내 레벨을 따라 같이 오른다
    this.weaponGrowing = false;

    // 9주차: 골드와 상점 강화 랭크 (hp / atk / bag / slots). 강화로 오른 수치는 maxHp 등에 바로 더해져 있다
    this.gold = 0;
    this.upgrades = {};

    // 여러 칸짜리 가방 — 첫 칸은 포션 주머니, 나머지엔 무기와 전리품 (Inventory 가 다룬다)
    this.bagSlots = CONFIG.inventory.baseSlots;
    Inventory.create(this);

    this.attackTimer = 0;      // 휘두르는 중이면 0보다 큼
    this.cooldown = 0;
    this.attackBuffer = 0;     // 쿨다운 중에 누른 공격을 잠깐 기억해둔다
    this.hitIds = new Set();   // 한 번 휘둘렀을 때 같은 적을 여러 번 때리지 않도록
    this.invuln = 0;
    this.kx = 0; this.ky = 0;  // 넉백 속도
    this.walkTime = 0;
    this.moving = false;
    this.dead = false;
    this.deadTimer = 0;
    this.potionQueued = false;
    this.stepTimer = 0;        // 발밑 먼지를 일정 간격으로 피우기 위한 타이머
    this.sinceCombat = 0;      // 마지막으로 맞거나 맞힌 뒤 흐른 시간 — 자연 회복 판단
    this.regenTick = 0;        // 회복 중 "+" 표시를 띄우는 간격

    // 겨냥 — 마우스를 쓰면 마우스 쪽, 아니면 마지막으로 걸어간 쪽을 본다
    this.aim = Math.PI / 2;    // 처음엔 아래를 본다
    this.swingAngle = this.aim; // 휘두르기 시작한 순간의 겨냥을 고정해 쓴다

    // 대시 (충전식)
    this.dashCharges = CONFIG.dash.charges;
    this.dashRecharge = CONFIG.dash.recharge;
    this.dashTimer = 0;        // 0보다 크면 대시 중
    this.dashGap = 0;          // 연속 대시 사이 최소 간격
    this.dashDir = 0;
    this.dashQueued = 0;       // 대시 입력 버퍼
    this.dashIFrames = 0;      // 대시 무적 (피격 무적과 달리 깜빡이지 않는다)
    this.trail = [];           // 대시 잔상

    // 스킬 (강공격 / 회전베기)
    this.skillCooldowns = {};  // 스킬 id -> 남은 쿨다운
    this.activeSkill = null;   // 지금 쓰는 중인 스킬 id
    this.skillTimer = 0;
    this.skillHitIds = new Set();
    this.skillHitTimer = 0;    // 회전베기처럼 여러 번 맞히는 스킬용
    this.skillQueued = null;   // 스킬 입력 버퍼
    this.skillQueueTime = 0;
    this.lockedHint = 0;       // 잠긴 스킬 안내 스팸 방지
    this.spinAngle = 0;        // 회전베기 연출용
    this.buff = null;          // 광폭화 같은 한시 강화 { id, timeLeft, time, attackSpeed, damageMult }
    this.auraTick = 0;
  }

  // 지금 든 무기의 스킬 둘 (Q, R)
  currentSkills() {
    return CONFIG.skills.byWeapon[this.weapon] || CONFIG.skills.byWeapon.sword;
  }

  // 스킬 id -> 스펙 (무기와 무관하게 찾는다 — 쓰는 도중 무기를 바꿔도 끝까지 그린다)
  skillSpec(id) {
    const by = CONFIG.skills.byWeapon;
    for (const w in by) {
      const s = by[w].find(k => k.id === id);
      if (s) return s;
    }
    return null;
  }

  // 모든 스킬 스펙 (쿨다운 돌리기용)
  allSkills() {
    const by = CONFIG.skills.byWeapon, out = [];
    for (const w in by) out.push(...by[w]);
    return out;
  }

  /* 스킬 위력의 기준 — 무기 종류 배수를 뺀 평타 (기본 공격 x 무기 레벨 배수 x 강화).
     단검을 들었다고 스킬까지 약해지면 안 되므로 종류 배수는 빼고 잰다. */
  skillBase() {
    const lv = CONFIG.weapons.levelMult[this.weaponLevel - 1] || 1;
    const buff = this.buff ? this.buff.damageMult : 1;
    return Math.max(1, Math.round(this.damage * lv * buff));
  }

  /* 스킬 — 쿨다운을 돌리고, 쓰는 중이면 판정을 굴리고, 입력이 있으면 새로 발동한다.
     위력은 평타 데미지에 배수를 곱해 정하므로 레벨이 오르면 스킬도 세진다. */
  updateSkills(dt, enemies) {
    for (const spec of this.allSkills()) {
      if (this.skillCooldowns[spec.id] > 0) {
        this.skillCooldowns[spec.id] = Math.max(0, this.skillCooldowns[spec.id] - dt);
      }
    }
    this.lockedHint = Math.max(0, this.lockedHint - dt);
    this.skillQueueTime = Math.max(0, this.skillQueueTime - dt);
    if (this.skillQueueTime <= 0) this.skillQueued = null;
    this.updateBuff(dt);

    // ── 쓰는 중
    if (this.activeSkill) {
      const spec = this.skillSpec(this.activeSkill);
      const elapsed = spec.duration - this.skillTimer;

      if (spec.id === 'spin') this.spinAngle += dt * 20;
      if (this.weaponGrowing) {
        // 성장 무기는 칼끝에서 무지개 알갱이가 흩날린다
        const t = this.skillTipAngle(spec, elapsed), r = spec.id === 'spin' ? 23 : 22;
        FX.burst(this.x + Math.cos(t) * r, this.y - 1 + Math.sin(t) * r, 2, CONFIG.weapons.rainbow,
          { speed: 22, life: 0.35, gravity: -10, size: 1 });
      }

      // 강공격은 휘두르며 앞으로 밀고 나간다
      if (spec.lunge && elapsed < 0.18) {
        this.moveWithCollision(Math.cos(this.swingAngle) * spec.lunge * dt, Math.sin(this.swingAngle) * spec.lunge * dt);
      }
      // 그림자 밟기 — 겨냥한 쪽으로 파고든다 (무적, 잔상)
      if (spec.dashSpeed) {
        this.moveWithCollision(Math.cos(this.swingAngle) * spec.dashSpeed * dt, Math.sin(this.swingAngle) * spec.dashSpeed * dt);
        if (spec.invuln) this.dashIFrames = Math.max(this.dashIFrames, 0.06);
        this.trail.push({ x: this.x, y: this.y, life: 0.22, facing: this.facing });
      }

      if (spec.hitWindow && elapsed >= spec.hitWindow[0] && elapsed <= spec.hitWindow[1]) {
        // 연속 찌르기는 찌르는 동안 조금씩 앞으로 나간다
        if (spec.stepForward) {
          this.moveWithCollision(Math.cos(this.swingAngle) * spec.stepForward * dt, Math.sin(this.swingAngle) * spec.stepForward * dt);
        }
        // 회전베기·연속 찌르기는 일정 간격마다 판정을 새로 열어 여러 번 맞힌다
        if (spec.hitInterval) {
          this.skillHitTimer -= dt;
          if (this.skillHitTimer <= 0) {
            this.skillHitIds.clear();
            this.skillHitTimer = spec.hitInterval;
            this.skillHits++;
          }
        }
        this.resolveHits(enemies, {
          ids: this.skillHitIds,
          reachBonus: spec.reachBonus,
          arc: spec.arc,
          damageMult: spec.damageMult,
          knockMult: spec.knockMult,
          forceCrit: spec.forceCrit,
          skill: true,
        });
      }

      this.skillTimer -= dt;
      if (this.skillTimer <= 0) this.activeSkill = null;
      return;
    }

    // ── 새로 발동
    if (!this.skillQueued) return;
    if (this.dashTimer > 0 || this.attackTimer > 0) return;   // 다른 동작 중이면 기다린다

    // 눌린 키(Q/R)를 지금 든 무기의 스킬로 푼다
    const spec = this.currentSkills().find(s => s.key === this.skillQueued);
    if (!spec) { this.skillQueued = null; return; }

    if (this.level < spec.unlockLevel) {
      if (this.lockedHint <= 0) {
        FX.number(this.x, this.y - 22, 'LV' + spec.unlockLevel, '#8f9aa8');
        this.lockedHint = 0.8;
      }
      this.skillQueued = null;
      return;
    }
    if (this.skillCooldowns[spec.id] > 0) return;   // 쿨다운이 풀리면 버퍼로 바로 나간다

    this.skillQueued = null;
    this.activeSkill = spec.id;
    this.skillTimer = spec.duration;
    this.skillHitIds = new Set();
    this.skillHitTimer = 0;
    this.skillHits = 0;
    this.skillCooldowns[spec.id] = spec.cooldown;
    this.swingAngle = this.aim;
    this.spinAngle = 0;
    this.attackTimer = 0;
    this.cooldown = Math.max(this.cooldown, spec.duration);   // 스킬 직후 평타가 바로 안 나가게
    if (spec.buff) {
      // 광폭화 — 한동안 손이 빨라지고 위력이 오른다
      this.buff = { id: spec.id, timeLeft: spec.buff.time, time: spec.buff.time, attackSpeed: spec.buff.attackSpeed, damageMult: spec.buff.damageMult };
      FX.number(this.x, this.y - 24, spec.name, spec.color, true);
      FX.flash(spec.color, 0.18, 0.25);
    }
    FX.addShake(spec.shake);
    FX.burst(this.x, this.y, 12, [spec.color, '#ffffff'], { speed: 55, life: 0.4, gravity: 30 });
    Sound.play(spec.id);
  }

  // 한시 강화 — 남은 시간을 줄이고, 도는 동안 몸 주위에 붉은 알갱이가 인다
  updateBuff(dt) {
    if (!this.buff) return;
    this.buff.timeLeft -= dt;
    if (this.buff.timeLeft <= 0) { this.buff = null; return; }
    this.auraTick -= dt;
    if (this.auraTick <= 0) {
      this.auraTick = 0.12;
      FX.burst(this.x + Util.rand(-6, 6), this.y + Util.rand(-2, 6), 1, ['#ff6b6b', '#ffb35c'], { speed: 8, life: 0.45, gravity: -40, size: 1 });
    }
  }

  // 스킬을 쓰는 동안 무기 끝이 향한 각도 (연출용)
  skillTipAngle(spec, elapsed) {
    if (spec.id === 'spin') return this.spinAngle;
    if (spec.id === 'heavy') return this.swingAngle - 1.6 + (elapsed / spec.duration) * 3.2;
    if (spec.id === 'quake') return elapsed < spec.windup ? this.swingAngle - 1.3 : this.swingAngle + 0.4;
    return this.swingAngle;
  }

  /* 대시 — 충전을 하나 쓰고 짧게 미끄러진다.
     충전은 시간이 지나면 한 칸씩 다시 차고, 최대 2칸까지 모인다. */
  updateDash(dt, ix, iy) {
    const d = CONFIG.dash;
    this.dashQueued = Math.max(0, this.dashQueued - dt);
    this.dashGap = Math.max(0, this.dashGap - dt);
    this.dashIFrames = Math.max(0, this.dashIFrames - dt);
    if (this.dashTimer > 0) this.dashTimer -= dt;

    if (this.dashCharges < d.charges) {
      this.dashRecharge -= dt;
      if (this.dashRecharge <= 0) {
        this.dashCharges++;
        this.dashRecharge = d.recharge;
      }
    } else {
      this.dashRecharge = d.recharge;
    }

    if (this.dashQueued <= 0 || this.dashCharges <= 0) return;
    if (this.dashTimer > 0 || this.dashGap > 0) return;

    // 이동키를 누르고 있으면 그쪽으로, 아니면 겨냥한 쪽으로 구른다
    this.dashDir = (ix || iy) ? Math.atan2(iy, ix) : this.aim;
    this.dashCharges--;
    this.dashTimer = d.time;
    this.dashGap = d.gap;
    this.dashQueued = 0;
    this.dashIFrames = d.invuln;
    // 대시하면 휘두르던 동작도 쓰던 스킬도 끊긴다 (빠져나가는 수단이므로)
    this.attackTimer = 0;
    this.activeSkill = null;
    this.kx = this.ky = 0;
    FX.burst(this.x, this.y + 4, 10, ['#cbd8e8', '#ffffff'], { speed: 42, life: 0.3, gravity: 18, size: 1 });
    Sound.play('dash');
  }

  /* 히트스톱이나 인벤토리로 게임이 멈춘 프레임에도 키 입력은 사라지면 안 되므로,
     매 프레임 가장 먼저 눌림을 받아 기억해둔다. (Game.frame 에서 호출) */
  bufferInput() {
    if (this.dead) return;
    if (Input.attackPressed()) this.attackBuffer = CONFIG.player.attackBuffer;
    if (Input.potionPressed()) this.potionQueued = true;
    if (Input.dashPressed()) this.dashQueued = CONFIG.dash.buffer;
    const skill = Input.skillPressed();
    if (skill) { this.skillQueued = skill; this.skillQueueTime = CONFIG.skills.buffer; }
  }

  // 마우스가 가리키는 곳을 향한 각도. 마우스를 안 쓰면 걸어간 방향을 유지한다.
  updateAim(ix, iy) {
    if (Input.mouse.used) {
      const t = Input.aimWorld(Game.cam);
      const dx = t.x - this.x, dy = t.y - this.y;
      // 마우스가 발밑에 겹치면 각도가 튀므로 직전 겨냥을 유지한다
      if (dx * dx + dy * dy > CONFIG.player.aimDeadzone * CONFIG.player.aimDeadzone) {
        this.aim = Math.atan2(dy, dx);
      }
    } else if (ix || iy) {
      this.aim = Math.atan2(iy, ix);
    }
    this.facing = Player.facingFromAngle(this.aim);
  }

  // 각도 -> 4방향 스프라이트 이름
  static facingFromAngle(a) {
    const deg = a * 180 / Math.PI;
    if (deg >= -45 && deg < 45) return 'right';
    if (deg >= 45 && deg < 135) return 'down';
    if (deg >= -135 && deg < -45) return 'up';
    return 'left';
  }

  get hurtBox() {
    return { x: this.x - 5, y: this.y - 4, w: 10, h: 11 };
  }

  get feetBox() {
    return { x: this.x - 5, y: this.y + 1, w: 10, h: 6 };
  }

  // 장착 중인 무기 스펙 (CONFIG.weapons 참조)
  weaponSpec() {
    return CONFIG.weapons[this.weapon] || CONFIG.weapons.sword;
  }

  // 실제 공격력 = 레벨업으로 쌓인 기본값 x 무기 종류 배수 x 무기 레벨 배수.
  // 종류 배수는 쿨다운에 비례하므로 어떤 무기를 들어도 초당 데미지는 같다.
  attackDamage() {
    const lv = CONFIG.weapons.levelMult[this.weaponLevel - 1] || 1;
    const buff = this.buff ? this.buff.damageMult : 1;
    return Math.max(1, Math.round(this.damage * this.weaponSpec().damageMult * lv * buff));
  }

  // 다른 무기를 들었다면 평타가 얼마일지 — 인벤토리에서 끼기 전에 비교하는 용도
  damageWith(weapon, level, growing) {
    const lv = growing ? Util.clamp(this.level, 1, CONFIG.weapons.levelMult.length) : level;
    const mult = CONFIG.weapons.levelMult[lv - 1] || 1;
    const buff = this.buff ? this.buff.damageMult : 1;
    return Math.max(1, Math.round(this.damage * CONFIG.weapons[weapon].damageMult * mult * buff));
  }

  // 무기 레벨 색 — HUD·바닥 이름표에 함께 쓴다
  weaponColor() {
    if (this.weaponGrowing) return CONFIG.weapons.growColor;
    return CONFIG.weapons.levelColor[levelTier(this.weaponLevel)] || '#ffffff';
  }

  weaponLabel() {
    // 성장하는 무기는 고유한 이름만 보여준다 — 레벨은 늘 내 레벨과 같으니 적을 필요가 없다
    if (this.weaponGrowing) return CONFIG.weapons.growNames[this.weapon] || this.weaponSpec().name;
    return this.weaponSpec().name + ' L' + this.weaponLevel;
  }

  /* 성장하는 무기는 내 레벨이 곧 무기 레벨이다.
     레벨업 때마다 맞춰주므로 다시 주울 필요가 없다. */
  syncWeaponLevel() {
    if (!this.weaponGrowing) return;
    this.weaponLevel = Util.clamp(this.level, 1, CONFIG.weapons.levelMult.length);
  }

  update(dt, enemies) {
    if (this.dead) {
      this.deadTimer -= dt;
      if (this.deadTimer <= 0) this.respawn();
      return;
    }

    const c = CONFIG.player;
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.potionCooldown = Math.max(0, this.potionCooldown - dt);
    this.updateRegen(dt);

    // ── 이동 입력
    let ix = Input.axisX(), iy = Input.axisY();
    if (ix && iy) { const inv = Math.SQRT1_2; ix *= inv; iy *= inv; }
    this.moving = (ix !== 0 || iy !== 0);

    // 겨냥은 마우스를 따라 늘 갱신된다 (휘두르는 중에는 시작할 때 고정한 각도를 쓴다)
    this.updateAim(ix, iy);
    this.updateDash(dt, ix, iy);
    this.updateSkills(dt, enemies);

    if (this.dashTimer > 0) {
      // 대시 중에는 이동 입력과 넉백을 무시하고 정해진 방향으로만 미끄러진다
      const d = CONFIG.dash;
      this.moveWithCollision(Math.cos(this.dashDir) * d.speed * dt, Math.sin(this.dashDir) * d.speed * dt);
      this.trail.push({ x: this.x, y: this.y, life: 0.2, facing: this.facing });
    } else {
      // 스킬을 쓰는 동안은 그 스킬의 moveScale 만큼만 걷는다 (강공격 0 — 스스로 앞으로 나간다,
      // 회전베기 0.45 — 돌면서 천천히 자리를 옮긴다). 평타 중에는 속도가 크게 줄어든다
      const speedScale = this.activeSkill
        ? (this.skillSpec(this.activeSkill).moveScale || 0)
        : (this.attackTimer > 0 ? 0.35 : 1);
      const vx = ix * c.speed * speedScale + this.kx;
      const vy = iy * c.speed * speedScale + this.ky;
      this.moveWithCollision(vx * dt, vy * dt);
    }

    // 잔상은 대시가 끝난 뒤에도 잠깐 남는다
    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }

    // 넉백 감쇠
    this.kx *= Math.pow(0.0025, dt);
    this.ky *= Math.pow(0.0025, dt);
    if (Math.abs(this.kx) < 1) this.kx = 0;
    if (Math.abs(this.ky) < 1) this.ky = 0;

    if (this.moving) this.walkTime += dt; else this.walkTime = 0;

    // 걸을 때 발밑에서 흙먼지가 인다 — 밟고 있는 지형에 따라 색이 다르다
    if (this.moving) {
      this.stepTimer -= dt;
      if (this.stepTimer <= 0) {
        this.stepTimer = 0.24;
        const t = World.tileAt(this.x, this.y + 6);
        const colors = (t === TILE_DIRT) ? ['#b39a72', '#8f7854']
          : (t === TILE_SAND) ? ['#dcc79a', '#bda578']
            : ['#6fa762', '#4e8a4a'];
        FX.burst(this.x, this.y + 6, 2, colors, { speed: 12, life: 0.26, gravity: 8, size: 1 });
      }
    } else {
      this.stepTimer = 0;
    }

    // ── 공격 (사거리/속도/판정은 장착 무기 기준)
    const w = this.weaponSpec();
    this.attackBuffer = Math.max(0, this.attackBuffer - dt);
    // 버퍼에 남은 입력이 있거나 공격키를 계속 누르고 있으면 쿨다운이 풀리는 즉시 이어서 휘두른다
    const wantsAttack = this.attackBuffer > 0 || Input.attackHeld();
    if (wantsAttack && this.cooldown <= 0 && this.attackTimer <= 0 && this.dashTimer <= 0 && !this.activeSkill) {
      this.attackTimer = w.duration;
      this.cooldown = w.cooldown / (this.buff ? this.buff.attackSpeed : 1);   // 광폭화 중엔 손이 빠르다
      this.hitIds = new Set();
      this.attackBuffer = 0;
      this.swingAngle = this.aim;   // 휘두르는 동안에는 이 각도로 고정된다
      Sound.play('swing');
    }

    if (this.attackTimer > 0) {
      const elapsed = w.duration - this.attackTimer;
      if (elapsed >= w.hitWindow[0] && elapsed <= w.hitWindow[1]) {
        this.resolveHits(enemies);
      }
      // 성장 무기는 칼끝에서 무지개 알갱이가 흩날린다
      if (this.weaponGrowing) {
        const a = this.swingAngle - 1.15 + (1 - this.attackTimer / w.duration) * 2.3;
        FX.burst(this.x + Math.cos(a) * 20, this.y - 1 + Math.sin(a) * 20, 2, CONFIG.weapons.rainbow,
          { speed: 18, life: 0.32, gravity: -10, size: 1 });
      }
      this.attackTimer -= dt;
    }

    // ── 포션 마시기 (E / Q / H)
    if (this.potionQueued) { this.potionQueued = false; this.usePotion(); }
  }

  // x축과 y축을 따로 밀어서 벽에 붙어도 미끄러지듯 움직이게 한다
  moveWithCollision(dx, dy) {
    const step = 2;
    let remain = dx;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.x += move;
      if (World.blocked(box)) break;
      this.x += move;
      remain -= move;
    }
    remain = dy;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.y += move;
      if (World.blocked(box)) break;
      this.y += move;
      remain -= move;
    }
  }

  // 무기 사거리 안, 바라보는 부채꼴 안에 들어온 몬스터를 때린다
  /* 평타와 스킬이 같이 쓰는 판정.
     opts 로 사거리·판정각·데미지 배수를 갈아끼우면 그대로 스킬 판정이 된다.
       ids         이미 맞힌 적 목록 (한 번 휘둘러 같은 적을 여러 번 때리지 않게)
       reachBonus  사거리 추가
       arc         판정 반각. Math.PI 이상이면 사방 전체
       damageMult  평타 대비 배수
       knockMult   넉백 배수 */
  resolveHits(enemies, opts) {
    const c = CONFIG.player;
    const w = this.weaponSpec();
    const base = this.swingAngle;   // 휘두르기 시작할 때 고정한 마우스 방향
    const ids = (opts && opts.ids) || this.hitIds;
    const reach = w.reach + ((opts && opts.reachBonus) || 0);
    const arc = (opts && opts.arc !== undefined) ? opts.arc : w.arc;
    const dmgMult = (opts && opts.damageMult) || 1;
    const knockMult = (opts && opts.knockMult) || 1;
    const omni = arc >= Math.PI;    // 사방을 다 때리는 기술인가

    for (const s of enemies) {
      if (s.dead || ids.has(s.id)) continue;
      // 보스는 몸통 상자(그림자 제외)까지의 거리로, 일반 몬스터는 중심 원으로 잰다
      const hc = s.hitCenter ? s.hitCenter() : s;   // (c 는 CONFIG.player — 이름을 겹치면 치명타가 사라진다)
      const dx = hc.x - this.x, dy = hc.y - this.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const gap = s.hitDistance ? s.hitDistance(this.x, this.y) : d - s.radius;
      if (gap > reach) continue;
      const toEnemy = Math.atan2(dy, dx);
      if (!omni && d > 3 && Math.abs(Util.angleDiff(toEnemy, base)) > arc) continue;

      ids.add(s.id);
      const crit = (opts && opts.forceCrit) || Math.random() < c.critChance;   // 치명타율은 무기와 무관하게 동일
      // 스킬은 무기 종류 배수를 뺀 기준값으로 — 단검 스킬이 도끼 스킬보다 약하지 않게
      const dmgBase = (opts && opts.skill) ? this.skillBase() : this.attackDamage();
      let dmg = Math.round((dmgBase + Util.randInt(-1, 1)) * dmgMult);
      if (crit) dmg = Math.round(dmg * c.critMult);
      dmg = Math.max(1, dmg);
      // 사방 공격은 바깥쪽으로, 베는 공격은 휘두른 방향으로 날린다
      s.takeHit(dmg, omni ? toEnemy : base, crit, this, knockMult);
      this.sinceCombat = 0;   // 때리는 중에도 자연 회복은 멈춘다
      // 처치 > 치명타 > 보통 순으로 화면이 더 오래 멈춘다. 카메라도 휘두른 쪽으로 살짝 밀린다
      const fx = CONFIG.fx;
      FX.freeze(s.dead ? fx.hitStopKill : (crit ? fx.hitStopCrit : fx.hitStop));
      FX.addShake(s.dead ? 3 : (crit ? 2.4 : 1.3));
      FX.addKick(omni ? toEnemy : base, fx.kick * (crit ? 1.6 : 1));
    }
  }

  takeDamage(amount, fromX, fromY) {
    if (this.invuln > 0 || this.dashIFrames > 0 || this.dead) return;
    const c = CONFIG.player;
    this.hp -= amount;
    this.invuln = c.invulnTime;
    this.sinceCombat = 0;      // 맞으면 자연 회복은 처음부터 다시 기다린다
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    this.kx = Math.cos(a) * c.knockbackTaken;
    this.ky = Math.sin(a) * c.knockbackTaken;
    FX.number(this.x, this.y - 12, '-' + amount, '#ff6b6b');
    FX.addShake(CONFIG.fx.shakeOnHurt);
    FX.spray(this.x, this.y, a, 8, ['#ff6b6b', '#ffffff']);
    FX.flash('#ff3b3b', 0.22, 0.18);   // 화면이 붉게 번쩍 — 맞았다는 걸 눈이 놓치지 않게
    FX.freeze(0.03);
    Sound.play('hurt');
    if (this.hp <= 0) this.die();
  }

  die() {
    this.hp = 0;
    this.dead = true;
    this.deadTimer = 1.6;
    FX.burst(this.x, this.y, 22, ['#ff6b6b', '#ffffff', '#f3c99b'], { speed: 80, life: 0.7 });
    FX.addShake(6);
    FX.flash('#ff3b3b', 0.4, 0.5);
    Sound.play('death');
  }

  // 정해진 자리에서 되살아난다 (보스 방에서 쫓겨날 때 쓴다)
  reviveAt(x, y) {
    this.dead = false;
    this.deadTimer = 0;
    this.hp = this.maxHp;
    this.sinceCombat = 0;
    this.x = x; this.y = y;
    this.kx = this.ky = 0;
    this.invuln = 1.2;
    this.attackTimer = 0;
    this.activeSkill = null;
  }

  respawn() {
    this.dead = false;
    this.hp = this.maxHp;
    this.sinceCombat = 0;
    this.x = this.spawnX; this.y = this.spawnY;
    this.kx = this.ky = 0;
    this.invuln = 1.2;
    this.attackTimer = 0;
  }

  gainXp(amount) {
    this.xp += amount;
    while (this.xp >= this.xpNeed) {
      this.xp -= this.xpNeed;
      this.level++;
      this.maxHp += CONFIG.levelUp.hpGain;
      this.damage += CONFIG.levelUp.damageGain;
      this.hp = this.maxHp;
      this.xpNeed = CONFIG.levelUp.xpNeed(this.level);
      this.syncWeaponLevel();
      FX.number(this.x, this.y - 22, 'LEVEL UP', '#ffe066', true);
      FX.ring(this.x, this.y + 4, 10, '#ffe066');
      Sound.play('levelup');
      FX.burst(this.x, this.y, 26, ['#ffe066', '#ffffff', '#9be564'], { speed: 60, life: 0.8, gravity: 40 });
    }
  }

  // 골드는 바닥에 떨어지지 않고 잡는 즉시 들어온다. 액수는 잡은 자리에 띄운다
  addGold(amount, x, y) {
    this.gold += amount;
    if (x === undefined) { x = this.x; y = this.y; }
    FX.number(x, y - 14, '+' + amount + ' G', CONFIG.gold.color);
    FX.burst(x, y - 2, 6, [CONFIG.gold.color, '#ffffff'], { speed: 38, life: 0.4, gravity: 90, size: 1 });
    Sound.play('gold');
  }

  // 가방에 들어갈 만큼만 담고 실제로 담은 개수를 돌려준다.
  // 2개짜리 드랍인데 한 칸만 남았으면 1개만 담고 나머지는 바닥에 남는다.
  addPotion(amount) {
    const room = this.maxPotions - this.potions;
    if (room <= 0) return 0;
    const taken = Math.min(room, amount);
    this.potions += taken;
    return taken;
  }

  /* 자연 회복 — 맞지도 맞히지도 않은 채 regenDelay 초가 지나면 초당 최대 체력의 regenRate 만큼 조금씩 찬다.
     맞을 때도, 내가 공격을 맞힐 때도 시계가 되돌아가므로 싸움 중에는 안 차고 물러나 있을 때만 찬다. */
  updateRegen(dt) {
    const c = CONFIG.player;
    this.sinceCombat += dt;
    if (this.sinceCombat < c.regenDelay || this.hp >= this.maxHp) { this.regenTick = 0; return; }
    this.hp = Math.min(this.maxHp, this.hp + this.maxHp * c.regenRate * dt);
    // 1.5초마다 작은 + 표시 — 지금 차고 있다는 걸 알려준다
    this.regenTick -= dt;
    if (this.regenTick <= 0) {
      this.regenTick = 1.5;
      FX.number(this.x, this.y - 16, '+', '#7dff8a');
    }
  }

  regenerating() {
    return !this.dead && this.sinceCombat >= CONFIG.player.regenDelay && this.hp < this.maxHp;
  }

  // 포션 한 개가 채우는 양 — 최대 체력의 30%, 최소 30
  potionHeal() {
    const cfg = CONFIG.items;
    return Math.max(cfg.potionHealMin, Math.round(this.maxHp * cfg.potionHealRatio));
  }

  usePotion() {
    if (this.dead || this.potionCooldown > 0) return;
    const cfg = CONFIG.items;
    if (this.potions <= 0) {
      FX.number(this.x, this.y - 20, 'EMPTY', '#8f9aa8');
      this.potionCooldown = cfg.potionCooldown;
      return;
    }
    if (this.hp >= this.maxHp) {
      FX.number(this.x, this.y - 20, 'FULL HP', '#8f9aa8');
      this.potionCooldown = cfg.potionCooldown;
      return;
    }
    this.potions--;
    this.potionCooldown = cfg.potionCooldown;
    // 자연 회복으로 체력에 소수점이 붙어 있을 수 있다 — 회복량은 정수로 맞추고, 차오른 뒤엔 상한에 딱 붙인다
    const healed = Math.min(this.potionHeal(), Math.ceil(this.maxHp - this.hp));
    this.hp = Math.min(this.maxHp, this.hp + healed);
    Sound.play('potion');
    FX.number(this.x, this.y - 20, '+' + healed, '#7dff8a');
    FX.burst(this.x, this.y, 14, ['#7dff8a', '#ffffff', '#e5484d'], { speed: 45, life: 0.5, gravity: 30 });
  }

  // 무기 교체. 종류와 레벨이 모두 같으면 'same', 죽어있으면 false, 교체되면 true
  equipWeapon(id, level, growing) {
    if (this.dead) return false;
    if (!CONFIG.weapons[id]) return false;
    growing = !!growing;
    // 성장하는 무기는 주운 순간부터 내 레벨을 그대로 따라간다
    level = growing ? this.level : level;
    level = Util.clamp(Math.round(level || 1), 1, growing ? CONFIG.weapons.levelMult.length : LEVEL_MAX);
    if (this.weapon === id && this.weaponLevel === level && this.weaponGrowing === growing) return 'same';
    this.weapon = id;
    this.weaponLevel = level;
    this.weaponGrowing = growing;
    const color = this.weaponColor();
    FX.number(this.x, this.y - 22, this.weaponLabel() + '!', color);
    // 성장하는 무기는 조용히 손에 들어온다 (바닥 오라가 이미 충분히 화려하다)
    if (!growing) FX.burst(this.x, this.y, 12, [color, '#ffffff'], { speed: 50, life: 0.45, gravity: 60 });
    Sound.play('pickup');
    // 휘두르는 도중에 바뀌면 판정이 꼬이므로 자세를 리셋한다
    this.attackTimer = 0;
    this.hitIds = new Set();
    return true;
  }

  draw(ctx, cam) {
    if (this.dead) return;
    const sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y);

    // 대시 잔상 — 지나온 자리에 흐릿하게 남는다
    if (this.trail.length) {
      for (const t of this.trail) {
        ctx.globalAlpha = Util.clamp(t.life / 0.2, 0, 1) * 0.34;
        ctx.drawImage(SPRITES.player[t.facing][0], Math.round(t.x - cam.x) - 8, Math.round(t.y - cam.y) - 8);
      }
      ctx.globalAlpha = 1;
    }

    // 무적 시간 동안 사라지지는 않는다 — 대신 잠깐 붉게 물들어 맞았음을 알린다 (아래 set 선택)

    // 그림자
    fillCircle(ctx, sx, sy + 7, 5, 'rgba(0,0,0,0.28)');

    const frame = this.moving && Math.floor(this.walkTime * 8) % 2 === 1 ? 1 : 0;
    // 맞은 직후 0.25초는 붉은 실루엣, 그 뒤 무적이 남은 동안엔 한 프레임 걸러 살짝 옅어질 뿐 늘 보인다
    const set = this.invuln > CONFIG.player.invulnTime - 0.25 ? SPRITES.playerFlash : SPRITES.player;
    if (this.invuln > 0 && Math.floor(this.invuln * 20) % 2 === 0) ctx.globalAlpha = 0.75;
    // 걸을 때 살짝 위아래로 흔들리면 발걸음이 살아난다
    const bob = frame === 1 ? -1 : 0;
    // 회전베기 중에는 바라보는 방향을 빠르게 돌려서 도는 것처럼 보이게 한다
    const facing = this.activeSkill === 'spin' ? Player.facingFromAngle(this.spinAngle) : this.facing;
    // 광폭화 중엔 몸 뒤에 붉은 그림자가 떨린다
    if (this.buff) {
      const o = Math.floor(World.time * 12) % 2 === 0 ? 1 : -1;
      ctx.globalAlpha = 0.6;
      ctx.drawImage(tinted(set[facing][frame], '#ff6b6b'), sx - 8 + o, sy - 8 + bob, 16, 16);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(set[facing][frame], sx - 8, sy - 8 + bob);
    ctx.globalAlpha = 1;

    if (this.activeSkill) this.drawSkill(ctx, sx, sy);
    else if (this.attackTimer > 0) this.drawSwing(ctx, sx, sy);
  }

  // 지금 든 무기의 도트 (종류 + 레벨 등급)
  weaponSprite() {
    const set = SPRITES.weapons && SPRITES.weapons[this.weapon];
    return (set && set[levelTier(this.weaponLevel)]) || SPRITES.sword;
  }

  drawSkill(ctx, sx, sy) {
    const spec = this.skillSpec(this.activeSkill);
    const p = 1 - this.skillTimer / spec.duration;      // 0 -> 1
    const fi = Util.clamp(Math.floor(p * 3), 0, 2);
    const sw = this.weaponSprite();

    const grow = this.weaponGrowing;
    const elapsedAll = spec.duration - this.skillTimer;

    // ── 연속 찌르기: 찌를 때마다 짧은 궤적, 무기는 앞으로 쿡쿡 나간다
    if (spec.id === 'flurry') {
      const phase = (elapsedAll / spec.hitInterval) % 1;
      const arc = SPRITES.slash[slashIndex(this.swingAngle)][Util.clamp(Math.floor(phase * 3), 0, 2)];
      const ox = Math.cos(this.swingAngle) * 6, oy = Math.sin(this.swingAngle) * 6;
      if (grow) this.drawRainbowGlow(ctx, arc, sx + ox, sy + oy, 1.2);
      ctx.drawImage(arc, Math.round(sx + ox - arc.width / 2), Math.round(sy + oy - arc.height / 2));
      const thrust = 4 + 10 * Math.abs(Math.sin(phase * Math.PI));
      ctx.save();
      ctx.translate(sx + Math.cos(this.swingAngle) * thrust, sy - 1 + Math.sin(this.swingAngle) * thrust);
      ctx.rotate(this.swingAngle + Math.PI / 2);
      ctx.drawImage(sw, -Math.floor(sw.width / 2), -18);
      ctx.restore();
      return;
    }

    // ── 그림자 밟기: 잔상은 trail 이 그리고, 여기선 앞으로 뻗은 무기와 보랏빛 잔영만
    if (spec.id === 'shadow') {
      for (let k = 2; k >= 1; k--) {
        ctx.save();
        ctx.translate(sx - Math.cos(this.swingAngle) * 7 * k, sy - 1 - Math.sin(this.swingAngle) * 7 * k);
        ctx.rotate(this.swingAngle + Math.PI / 2);
        ctx.globalAlpha = k === 1 ? 0.45 : 0.22;
        ctx.drawImage(tinted(sw, grow ? this.rainbowNow(k) : '#c79ce8'), -Math.floor(sw.width / 2), -18);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(sx + Math.cos(this.swingAngle) * 8, sy - 1 + Math.sin(this.swingAngle) * 8);
      ctx.rotate(this.swingAngle + Math.PI / 2);
      ctx.drawImage(sw, -Math.floor(sw.width / 2), -18);
      ctx.restore();
      return;
    }

    // ── 땅 찍기: 들어올렸다가 내리찍고, 찍는 순간 충격파가 퍼진다
    if (spec.id === 'quake') {
      const up = elapsedAll < spec.windup;
      if (!up) {
        const t = Util.clamp((elapsedAll - spec.windup) / 0.32, 0, 0.999);
        const ring = SPRITES.shockRing[Math.floor(t * 4)];
        const r = (this.weaponSpec().reach + spec.reachBonus) / CONFIG.bosses.slime.slam.radius;   // 충격파 도트(반경 62)를 내 반경에 맞춘다
        const w = Math.round(ring.width * r), h = Math.round(ring.height * r);
        if (grow) { ctx.globalAlpha = 0.7; ctx.drawImage(tinted(ring, this.rainbowNow(0)), sx - Math.round(w / 2) - 1, sy + 4 - Math.round(h / 2) - 1, w + 2, h + 2); ctx.globalAlpha = 1; }
        ctx.drawImage(ring, sx - Math.round(w / 2), sy + 4 - Math.round(h / 2), w, h);
      }
      // 들어올릴 땐 뒤로 젖혔다가, 찍을 땐 앞으로 내리친다
      const a = up ? this.swingAngle - 1.3 - (elapsedAll / spec.windup) * 0.6 : this.swingAngle + 0.4;
      const lift = up ? -Math.round((elapsedAll / spec.windup) * 6) : 0;
      if (grow) this.drawAfterimages(ctx, sx, sy + lift, sw, a, -24, 0.4);
      ctx.save();
      ctx.translate(sx, sy - 1 + lift);
      ctx.rotate(a + Math.PI / 2);
      ctx.drawImage(sw, -Math.floor(sw.width / 2), -24);
      ctx.restore();
      return;
    }

    // ── 광폭화: 발동 동작 — 무기를 번쩍 치켜든다
    if (spec.id === 'rage') {
      ctx.save();
      ctx.translate(sx, sy - 1 - Math.round(elapsedAll / spec.duration * 4));
      ctx.rotate(this.swingAngle * 0 - Math.PI / 2 + Math.PI / 2);   // 곧게 위로
      ctx.globalAlpha = 0.6;
      ctx.drawImage(tinted(sw, '#ff6b6b'), -Math.floor(sw.width / 2) - 1, -25, sw.width + 2, sw.height + 2);
      ctx.globalAlpha = 1;
      ctx.drawImage(sw, -Math.floor(sw.width / 2), -24);
      ctx.restore();
      return;
    }

    if (spec.id === 'spin') {
      // 몸을 둘러싸고 퍼져나가는 고리 + 같이 도는 무기. 고리는 도는 내내 0.55초마다 다시 퍼진다
      const elapsed = spec.duration - this.skillTimer;
      const ring = SPRITES.spinRing[Math.floor((elapsed / 0.55) * 3) % 3];
      if (grow) this.drawRainbowGlow(ctx, ring, sx, sy, 1.18);
      ctx.drawImage(ring, sx - Math.floor(ring.width / 2), sy - Math.floor(ring.height / 2));
      if (grow) this.drawAfterimages(ctx, sx, sy, sw, this.spinAngle, -23, 0.45);
      ctx.save();
      ctx.translate(sx, sy - 1);
      ctx.rotate(this.spinAngle + Math.PI / 2);
      ctx.drawImage(sw, -Math.floor(sw.width / 2), -23);
      ctx.restore();
      return;
    }

    // 강공격 — 넓고 굵은 궤적을 크게 그린다
    const arc = SPRITES.heavySlash[slashIndex(this.swingAngle)][fi];
    if (grow) this.drawRainbowGlow(ctx, arc, sx, sy, 1.22);
    ctx.drawImage(arc, sx - Math.floor(arc.width / 2), sy - Math.floor(arc.height / 2));
    const a = this.swingAngle - 1.6 + p * 3.2;
    if (grow) this.drawAfterimages(ctx, sx, sy, sw, a, -25, 0.5);
    ctx.save();
    ctx.translate(sx, sy - 1);
    ctx.rotate(a + Math.PI / 2);
    ctx.drawImage(sw, -Math.floor(sw.width / 2), -25);
    ctx.restore();
  }

  /* ── 성장 무기 전용 연출 ──
     궤적 도트를 무지개색 실루엣으로 조금 크게 한 번 더 깔아 빛나는 테두리를 만들고,
     무기가 지나온 각도에 반투명 잔상을 두 장 남긴다. 색은 이름표처럼 시간 따라 흐른다. */
  rainbowNow(offset) {
    const pal = CONFIG.weapons.rainbow;
    return pal[(Math.floor(World.time * 9) + (offset || 0)) % pal.length];
  }

  drawRainbowGlow(ctx, sprite, sx, sy, scale) {
    const w = Math.round(sprite.width * scale), h = Math.round(sprite.height * scale);
    ctx.globalAlpha = 0.55;
    ctx.drawImage(tinted(sprite, this.rainbowNow(0)), sx - Math.round(w / 2), sy - Math.round(h / 2), w, h);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(tinted(sprite, this.rainbowNow(3)), sx - Math.floor(sprite.width / 2), sy - Math.floor(sprite.height / 2));
    ctx.globalAlpha = 1;
  }

  // 무기가 방금 지나온 자리에 무지개 잔상 두 장 (뒤로 갈수록 옅다)
  drawAfterimages(ctx, sx, sy, sw, angle, offsetY, gap) {
    for (let k = 2; k >= 1; k--) {
      ctx.save();
      ctx.translate(sx, sy - 1);
      ctx.rotate(angle - gap * k + Math.PI / 2);
      ctx.globalAlpha = k === 1 ? 0.5 : 0.25;
      ctx.drawImage(tinted(sw, this.rainbowNow(k * 2)), -Math.floor(sw.width / 2), offsetY);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  drawSwing(ctx, sx, sy) {
    const w = this.weaponSpec();
    const p = 1 - this.attackTimer / w.duration;   // 0 -> 1
    const base = this.swingAngle;

    // 궤적 — 16방향 중 겨냥과 가장 가까운 것을 쓴다
    const fi = Util.clamp(Math.floor(p * 3), 0, 2);
    const arc = SPRITES.slash[slashIndex(base)][fi];
    const grow = this.weaponGrowing;
    // 성장 무기는 궤적 둘레가 무지개로 빛나고 잔상이 따라온다
    if (grow) this.drawRainbowGlow(ctx, arc, sx, sy, 1.25);
    ctx.drawImage(arc, sx - arc.width / 2, sy - arc.height / 2);

    // 무기를 부채꼴을 따라 휘두른다
    const a = base - 1.15 + p * 2.3;
    const sw = this.weaponSprite();
    if (grow) this.drawAfterimages(ctx, sx, sy, sw, a, -20, 0.42);
    ctx.save();
    ctx.translate(sx, sy - 1);
    ctx.rotate(a + Math.PI / 2);
    ctx.drawImage(sw, -Math.floor(sw.width / 2), -20);
    ctx.restore();
  }
}

// ── js/projectile.js
'use strict';

/* 날아다니는 탄 — 지금은 버섯이 쏘는 포자 하나뿐이지만,
   나중에 다른 원거리 몬스터나 플레이어 스킬도 같은 통로를 쓰면 된다.

   규칙
     - 벽(나무·바위·물)에 닿으면 터진다
     - 플레이어에 닿으면 피해를 주고 터진다 (무적 시간 중이면 그냥 지나간다)
     - 수명이 끝나면 사라진다 */

const Projectiles = {
  list: [],

  reset() {
    this.list.length = 0;
  },

  spawn(x, y, angle, opts) {
    Sound.play('blip');
    this.list.push({
      x: x, y: y,
      vx: Math.cos(angle) * opts.speed,
      vy: Math.sin(angle) * opts.speed,
      damage: opts.damage,
      level: opts.level || 1,
      life: opts.life,
      maxLife: opts.life,
      radius: opts.radius || 3,
      spin: Math.random() * Math.PI * 2,
    });
  },

  update(dt, player) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.spin += dt * 6;

      // 벽에 부딪히면 터진다
      const box = { x: p.x - 2, y: p.y - 2, w: 4, h: 4 };
      if (World.blocked(box)) {
        this.burst(p);
        this.list.splice(i, 1);
        continue;
      }

      // 플레이어에게 명중
      if (!player.dead && Util.aabb(box, player.hurtBox)) {
        // 무적 시간 중이면 피해가 들어가지 않으므로 탄도 그대로 지나가게 둔다
        if (player.invuln <= 0) {
          player.takeDamage(p.damage, p.x, p.y);
          this.burst(p);
          this.list.splice(i, 1);
        }
      }
    }
  },

  burst(p) {
    const pal = LEVEL_PALETTES[levelTier(p.level)];
    FX.burst(p.x, p.y, 6, [pal.M, pal.n, '#ffffff'], { speed: 34, life: 0.28, gravity: 20, size: 1 });
  },

  draw(ctx, cam) {
    for (const p of this.list) {
      const sx = Math.round(p.x - cam.x), sy = Math.round(p.y - cam.y);
      const sprite = SPRITES.spore[levelTier(p.level)];
      // 사라지기 직전에는 깜빡여서 곧 없어짐을 알린다
      if (p.life < 0.3 && Math.floor(p.life * 24) % 2 === 0) continue;
      // 살짝 위아래로 흔들리며 날아간다
      const bob = Math.round(Math.sin(p.spin) * 1.2);
      ctx.drawImage(sprite, sx - 2, sy - 2 + bob);
    }
  },
};

  <script>
// ── js/enemy.js
'use strict';

/* 모든 몬스터의 공통 뼈대.
   체력·피격·넉백·사망·레벨 표시처럼 종류가 달라도 똑같은 부분을 여기 모아두고,
   종류별 파일(slime / mushroom / wolf)은 "어떻게 움직이고 어떻게 공격하는가"만 쓴다.

   하위 클래스가 채워야 하는 것
     TYPE       종류 이름 (스폰 표와 미니맵에서 쓴다)
     stats      CONFIG 에서 가져온 레벨별 능력치 ({hp, atk, xp, knockback, scale, ...})
     think(dt, player)   매 프레임 행동
     drawBody(ctx, sx, sy)   몸통 그리기 (그림자와 레벨표시는 공통으로 처리) */

let enemyIdCounter = 0;

class Enemy {
  constructor(x, y, level, stats) {
    this.id = ++enemyIdCounter;
    this.TYPE = 'enemy';
    this.level = level;
    // 표의 줄을 그대로 참조하면 한 마리를 고칠 때 같은 레벨 전부가 바뀐다 — 복사해서 쓴다
    this.stats = Object.assign({}, stats);
    this.x = x; this.y = y;
    this.maxHp = stats.hp;
    this.hp = stats.hp;
    this.scale = stats.scale;
    this.radius = 7 * stats.scale;
    this.dead = false;

    this.dir = Math.random() * Math.PI * 2;
    this.contactTimer = 0;
    this.hurtFlash = 0;
    this.showHp = 0;
    this.kx = 0; this.ky = 0;   // 넉백 속도
  }

  get palette() {
    return LEVEL_PALETTES[levelTier(this.level)];
  }

  get hurtBox() {
    const r = this.radius;
    return { x: this.x - r, y: this.y - r * 0.8, w: r * 2, h: r * 1.8 };
  }

  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.7, y: this.y + 1, w: r * 1.4, h: 5 };
  }

  distanceTo(player) {
    return player.dead ? Infinity : Util.dist(this.x, this.y, player.x, player.y);
  }

  /* 몸이 벽 안에 끼면 어느 쪽으로도 움직일 수 없어 영영 굳어버린다.
     (스폰은 빈 자리를 확인하지만, 앞으로 몸집이 더 큰 몬스터가 들어오면 생길 수 있는 상황)
     가까운 빈 자리를 나선으로 찾아 빠져나온다. */
  unstick() {
    if (!World.blocked(this.feetBox)) return;
    for (let r = 3; r <= 24; r += 3) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
        const box = this.feetBox;
        box.x += dx; box.y += dy;
        if (!World.blocked(box)) { this.x += dx; this.y += dy; return; }
      }
    }
  }

  update(dt, player) {
    if (this.dead) return;
    this.unstick();
    this.contactTimer = Math.max(0, this.contactTimer - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.showHp = Math.max(0, this.showHp - dt);

    this.think(dt, player);

    // 넉백은 종류와 무관하게 똑같이 밀리고 잦아든다
    if (Math.abs(this.kx) > 0.5 || Math.abs(this.ky) > 0.5) {
      this.moveWithCollision(this.kx * dt, this.ky * dt);
      this.kx *= Math.pow(0.004, dt);
      this.ky *= Math.pow(0.004, dt);
    }
  }

  think(dt, player) { /* 하위 클래스가 채운다 */ }

  // 몸이 겹쳐 있으면 닿는 피해를 준다 (쿨다운은 종류별로 다르다)
  touchPlayer(player, cooldown, damage) {
    if (player.dead || this.contactTimer > 0) return false;
    if (!Util.aabb(this.hurtBox, player.hurtBox)) return false;
    player.takeDamage(damage === undefined ? this.stats.atk : damage, this.x, this.y);
    this.contactTimer = cooldown;
    return true;
  }

  // x축과 y축을 따로 밀어 벽에 붙어도 미끄러지듯 움직인다.
  // 벽에 막히면 방향을 튕겨 제자리에 끼지 않게 한다.
  moveWithCollision(dx, dy) {
    const step = 2;
    let remain = dx;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.x += move;
      if (World.blocked(box)) { this.dir = Math.PI - this.dir; this.onBlocked(); break; }
      this.x += move;
      remain -= move;
    }
    remain = dy;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.y += move;
      if (World.blocked(box)) { this.dir = -this.dir; this.onBlocked(); break; }
      this.y += move;
      remain -= move;
    }
  }

  onBlocked() { /* 필요한 종류만 쓴다 (늑대는 돌진을 멈춘다) */ }

  // knockScale — 스킬처럼 더 세게 날려보내야 할 때 쓰는 추가 배수
  takeHit(damage, angle, crit, player, knockScale) {
    this.hp -= damage;
    this.hurtFlash = 0.12;
    this.showHp = 2.5;
    // 도끼처럼 무거운 무기는 더 멀리 날려보낸다
    const weaponKnock = (player && player.weaponSpec) ? player.weaponSpec().knockMult : 1;
    const knockMult = weaponKnock * (knockScale || 1);
    this.kx = Math.cos(angle) * this.stats.knockback * knockMult;
    this.ky = Math.sin(angle) * this.stats.knockback * knockMult;

    const pal = this.palette;
    FX.spray(this.x, this.y, angle, crit ? 12 : 7, [pal.M, pal.n, '#ffffff']);
    FX.number(this.x, this.y - 10 - this.radius, damage, crit ? '#ffd93d' : '#ffffff', crit);
    // 맞은 쪽(때린 사람을 향한 면)에서 불꽃이 튄다
    FX.spark(this.x - Math.cos(angle) * this.radius * 0.6, this.y - 2 - Math.sin(angle) * this.radius * 0.4, angle, crit);
    Sound.play(crit ? 'crit' : 'hit');

    this.onHit(damage, player);
    if (this.hp <= 0) this.die(player);
  }

  onHit(damage, player) { /* 맞았을 때 반응이 필요한 종류만 쓴다 */ }

  die(player) {
    this.dead = true;
    const pal = this.palette;
    FX.burst(this.x, this.y, 16 + this.level * 3, [pal.M, pal.n, pal.m], { speed: 70, life: 0.55 });
    FX.ring(this.x, this.y + 2, this.radius + 2, pal.n);
    Sound.play('kill');
    FX.number(this.x, this.y - 18, '+' + this.stats.xp + 'XP', '#9be564');
    player.gainXp(this.stats.xp);
  }

  /* ── 그리기 ────────────────────────────────────────────── */

  draw(ctx, cam) {
    if (this.dead) return;
    const sx = Math.round(this.x - cam.x);
    const sy = Math.round(this.y - cam.y);
    // 맞은 직후엔 발을 축으로 옆으로 퍼졌다 돌아온다 — 충격이 몸에 전해지는 느낌
    if (this.hurtFlash > 0) {
      const k = this.hurtFlash / 0.12;
      ctx.save();
      ctx.translate(sx, sy + 7);
      ctx.scale(1 + k * 0.16, 1 - k * 0.14);
      ctx.translate(-sx, -(sy + 7));
      this.drawBody(ctx, sx, sy);
      ctx.restore();
      return;
    }
    this.drawBody(ctx, sx, sy);
  }

  drawBody(ctx, sx, sy) { /* 하위 클래스가 채운다 */ }

  drawShadow(ctx, sx, sy, radius) {
    fillCircle(ctx, sx, sy + 6, radius, 'rgba(0,0,0,0.28)');
  }

  // 레벨 표시와 체력바 — 모든 몬스터가 같은 자리에 같은 모양으로 띄운다
  drawLabel(ctx, sx, topY) {
    const pal = this.palette;
    UI.drawText(ctx, 'L' + this.level, sx - 4, topY - 5, pal.n, false);

    if (this.showHp > 0) {
      const w = Math.max(12, Math.round(14 * this.scale));
      const x = sx - Math.round(w / 2), y = topY + 2;
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, y - 1, w + 2, 4);
      ctx.fillStyle = '#4a1f1f';
      ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = pal.M;
      ctx.fillRect(x, y, Math.round(w * Math.max(0, this.hp) / this.maxHp), 2);
    }
  }

  // 공격 직전 예고 — 몸 위에 느낌표가 깜빡인다 (버섯·늑대가 함께 쓴다)
  drawWarning(ctx, sx, topY, progress) {
    if (Math.floor(progress * 12) % 2 !== 0) return;
    UI.drawText(ctx, '!', sx, topY - 13, '#ff6b6b', true);
  }
}

// ── js/slime.js
'use strict';

/* 슬라임 — 가장 기본이 되는 몬스터.
   통통 튀는 주기(hop) 중 앞부분에서만 실제로 움직여서, 계속 미끄러지듯 오는 게 아니라
   폴짝폴짝 다가온다. 공격 수단은 몸통 박치기 하나뿐이다. */

class Slime extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.slime.levels[level - 1]);
    this.TYPE = 'slime';
    this.hopTimer = Math.random() * CONFIG.slime.hopCycle;   // 서로 다른 박자로 튀도록
    this.wanderTimer = Util.rand(0.5, 2.5);
    this.chasing = false;
  }

  think(dt, player) {
    const cs = CONFIG.slime;

    // ── 목표 방향: 감지 범위 안이면 쫓아가고, 아니면 가끔 방향을 바꿔 배회한다
    this.chasing = this.distanceTo(player) < this.stats.detect;
    if (this.chasing) {
      this.dir = Math.atan2(player.y - this.y, player.x - this.x);
    } else {
      this.wanderTimer -= dt;
      if (this.wanderTimer <= 0) {
        this.dir = Math.random() * Math.PI * 2;
        this.wanderTimer = Util.rand(1.2, 3.2);
      }
    }

    // ── 통통 튀기: 주기의 앞부분에서만 전진한다
    this.hopTimer += dt;
    if (this.hopTimer >= cs.hopCycle) this.hopTimer -= cs.hopCycle;
    const t = this.hopTimer / cs.hopCycle;

    if (t < cs.hopMoveRatio) {
      const push = Math.sin((t / cs.hopMoveRatio) * Math.PI);   // 도약 중간에 가장 빠르다
      const spd = this.stats.speed * (this.chasing ? 1 : 0.55) * push * 1.6;
      this.moveWithCollision(Math.cos(this.dir) * spd * dt, Math.sin(this.dir) * spd * dt);
    }

    this.touchPlayer(player, CONFIG.slime.contactCooldown);
  }

  drawBody(ctx, sx, sy) {
    const cs = CONFIG.slime;
    const t = this.hopTimer / cs.hopCycle;

    // 도약하면 위로 뜨면서 세로로 늘어나고, 착지하면 납작해진다
    let yOff = 0, stretchY = 1, stretchX = 1;
    if (t < cs.hopMoveRatio) {
      const k = Math.sin((t / cs.hopMoveRatio) * Math.PI);
      yOff = -k * 5 * this.scale;
      stretchY = 1 + k * 0.14;
      stretchX = 1 - k * 0.10;
    } else {
      const k = Math.max(0, 1 - ((t - cs.hopMoveRatio) / (1 - cs.hopMoveRatio)) * 4);
      stretchY = 1 - 0.20 * k;
      stretchX = 1 + 0.16 * k;
    }

    const w = Math.round(16 * this.scale * stretchX);
    const h = Math.round(16 * this.scale * stretchY);

    // 그림자 — 떠 있을수록 작아진다
    const shadowScale = 1 - (-yOff / (6 * this.scale)) * 0.35;
    this.drawShadow(ctx, sx, sy, 5.5 * this.scale * shadowScale);

    const sprite = this.hurtFlash > 0 ? SPRITES.slimeFlash[levelTier(this.level)] : SPRITES.slime[levelTier(this.level)];
    ctx.drawImage(sprite, sx - Math.round(w / 2), Math.round(sy + yOff + 7 - h), w, h);

    this.drawLabel(ctx, sx, Math.round(sy + yOff - h + 4));
  }
}

// ── js/mushroom.js
'use strict';

/* 버섯 — 뿌리내린 포탑. 절대 움직이지 않는 대신 포자를 쏜다.
   슬라임처럼 쫓아오지 않으므로 "빨리 붙어서 없앨까 / 사거리 밖으로 돌아갈까"를 고르게 된다.

   행동 순서
     대기 → (플레이어가 감지 범위 안) 재는 중 → 부풀어오름(예고) → 발사 → 다시 대기
   부풀어오르는 동안 몸이 커지고 느낌표가 뜨므로, 보고 피할 수 있다. */

class Mushroom extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.mushroom.levels[level - 1]);
    this.TYPE = 'mushroom';
    this.cooldown = Util.rand(0.4, CONFIG.mushroom.levels[level - 1].interval);
    this.windup = 0;        // 0보다 크면 부풀어오르는 중
    this.aim = 0;           // 발사 방향 (예고 시작 때 정해서 고정한다)
    this.puff = 0;          // 쏜 직후 몸이 움찔하는 연출
  }

  // 뿌리내린 몬스터라 넉백으로 밀려나지 않는다 — 대신 잠깐 움찔한다
  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.7, y: this.y + 1, w: r * 1.4, h: 5 };
  }

  think(dt, player) {
    const cfg = CONFIG.mushroom;
    this.puff = Math.max(0, this.puff - dt);

    const dist = this.distanceTo(player);
    const inRange = dist < this.stats.detect;

    if (this.windup > 0) {
      // 예고 중 — 조준은 이미 고정되어 있어서 옆으로 피하면 빗나간다
      this.windup -= dt;
      if (this.windup <= 0) this.fire();
    } else if (inRange) {
      this.cooldown -= dt;
      if (this.cooldown <= 0) {
        this.windup = cfg.windup;
        // 조준은 포자가 나가는 위치(y-2) 기준으로 잰다
        this.aim = Math.atan2(player.y - (this.y - 2), player.x - this.x);
        this.cooldown = this.stats.interval;
      }
    }

    // 붙어 있으면 몸통 피해도 준다 (붙어서 때리는 게 공짜는 아니게)
    this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * 0.6));
  }

  fire() {
    const cfg = CONFIG.mushroom;
    const shots = this.stats.shots;
    this.puff = 0.18;
    for (let i = 0; i < shots; i++) {
      // 가운데를 기준으로 좌우 대칭으로 퍼뜨린다
      const offset = (i - (shots - 1) / 2) * cfg.spread;
      Projectiles.spawn(this.x, this.y - 2, this.aim + offset, {
        speed: cfg.sporeSpeed,
        damage: this.stats.atk,
        level: this.level,
        life: cfg.sporeLife,
      });
    }
    const pal = this.palette;
    FX.burst(this.x, this.y - 2, 8, [pal.n, '#ffffff'], { speed: 30, life: 0.3, gravity: 10, size: 1 });
  }

  // 넉백을 거의 무시한다 (뿌리내린 몬스터)
  takeHit(damage, angle, crit, player) {
    super.takeHit(damage, angle, crit, player);
    this.kx *= 0.25;
    this.ky *= 0.25;
  }

  drawBody(ctx, sx, sy) {
    const cfg = CONFIG.mushroom;
    // 예고 중에는 부풀고, 쏜 직후에는 납작해진다
    let grow = 1;
    if (this.windup > 0) grow = 1 + (1 - this.windup / cfg.windup) * 0.16;
    else if (this.puff > 0) grow = 1 - (this.puff / 0.18) * 0.12;

    const w = Math.round(16 * this.scale * grow);
    const h = Math.round(16 * this.scale * grow);

    this.drawShadow(ctx, sx, sy, 5.5 * this.scale);
    const set = this.hurtFlash > 0 ? SPRITES.mushroomEnemyFlash : SPRITES.mushroomEnemy;
    ctx.drawImage(set[levelTier(this.level)], sx - Math.round(w / 2), Math.round(sy + 7 - h), w, h);

    const topY = Math.round(sy + 7 - h + 4);
    if (this.windup > 0) this.drawWarning(ctx, sx, topY, 1 - this.windup / cfg.windup);
    this.drawLabel(ctx, sx, topY);
  }
}

// ── js/wolf.js
'use strict';

/* 늑대 — 빠르게 붙었다가 웅크린 뒤 직선으로 돌진한다.
   슬라임이 "계속 밀려오는 압박"이라면 늑대는 "예고를 보고 피하는" 몬스터다.

   상태 흐름
     배회 → (감지) 추적 → (사거리 안) 웅크림(예고) → 돌진 → 빈틈 → 추적
   웅크리는 동안 몸이 낮아지고 느낌표가 뜬다. 돌진은 정해진 방향으로만 가므로
   옆으로 비키면 빗나가고, 돌진 뒤 빈틈에 때리는 것이 정석이다. */

class Wolf extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.wolf.levels[level - 1]);
    this.TYPE = 'wolf';
    this.state = 'wander';   // wander | chase | windup | lunge | recover
    this.timer = Util.rand(0.5, 2.0);
    this.facing = 1;         // 1 = 오른쪽, -1 = 왼쪽
    this.stepTime = 0;       // 다리 애니메이션
    this.lungeDir = 0;
  }

  think(dt, player) {
    const cfg = CONFIG.wolf;
    const dist = this.distanceTo(player);
    this.timer -= dt;

    switch (this.state) {
      case 'wander':
        this.stepTime += dt * 0.6;
        if (this.timer <= 0) {
          this.dir = Math.random() * Math.PI * 2;
          this.timer = Util.rand(1.2, 3.0);
        }
        this.walk(this.dir, this.stats.speed * 0.35, dt);
        if (dist < this.stats.detect) this.state = 'chase';
        break;

      case 'chase': {
        this.stepTime += dt * 1.6;
        this.dir = Math.atan2(player.y - this.y, player.x - this.x);
        this.walk(this.dir, this.stats.speed, dt);
        if (dist > this.stats.detect * 1.3) {          // 너무 멀어지면 포기한다
          this.state = 'wander';
          this.timer = Util.rand(0.6, 1.6);
        } else if (dist < cfg.lungeRange) {
          this.state = 'windup';
          this.timer = cfg.windup;
          this.lungeDir = this.dir;                     // 여기서 방향이 고정된다
          Sound.play('growl');
        }
        break;
      }

      case 'windup':
        // 웅크리고 멈춘다 — 이때 옆으로 비키면 돌진이 빗나간다
        if (this.timer <= 0) {
          this.state = 'lunge';
          this.timer = cfg.lungeTime;
        }
        break;

      case 'lunge':
        this.stepTime += dt * 3;
        this.walk(this.lungeDir, this.stats.lunge, dt);
        if (this.timer <= 0) {
          this.state = 'recover';
          this.timer = cfg.recover;
        }
        break;

      case 'recover':
        // 숨을 고르는 빈틈 — 때리기 가장 좋은 순간
        if (this.timer <= 0) this.state = 'chase';
        break;
    }

    this.touchPlayer(player, cfg.contactCooldown);
  }

  walk(angle, speed, dt) {
    this.facing = Math.cos(angle) >= 0 ? 1 : -1;
    this.moveWithCollision(Math.cos(angle) * speed * dt, Math.sin(angle) * speed * dt);
  }

  // 돌진 중 벽에 부딪히면 그대로 멈추고 빈틈에 들어간다
  onBlocked() {
    if (this.state !== 'lunge') return;
    this.state = 'recover';
    this.timer = CONFIG.wolf.recover;
    FX.burst(this.x, this.y, 6, ['#cbbfa2', '#8f7854'], { speed: 40, life: 0.3, size: 1 });
  }

  // 맞으면 웅크리던 동작이 끊긴다 (선제공격이 통한다)
  onHit() {
    if (this.state === 'windup') {
      this.state = 'recover';
      this.timer = CONFIG.wolf.recover * 0.6;
    }
  }

  drawBody(ctx, sx, sy) {
    const frame = (this.state === 'windup' || this.state === 'recover')
      ? 0
      : (Math.floor(this.stepTime * 6) % 2);

    const flash = this.hurtFlash > 0;
    const set = this.facing >= 0
      ? (flash ? SPRITES.wolfFlash : SPRITES.wolf)
      : (flash ? SPRITES.wolfLeftFlash : SPRITES.wolfLeft);
    const sprite = set[levelTier(this.level)][frame];

    // 웅크릴 때는 납작해지고, 돌진할 때는 앞으로 길어진다
    let sxScale = 1, syScale = 1;
    if (this.state === 'windup') { syScale = 0.82; sxScale = 1.06; }
    else if (this.state === 'lunge') { syScale = 0.92; sxScale = 1.12; }

    const draw = this.scale * CONFIG.wolf.spriteScale;
    const w = Math.round(sprite.width * draw * sxScale);
    const h = Math.round(sprite.height * draw * syScale);

    this.drawShadow(ctx, sx, sy, 6.5 * this.scale);
    ctx.drawImage(sprite, sx - Math.round(w / 2), Math.round(sy + 7 - h), w, h);

    const topY = Math.round(sy + 7 - h + 2);
    if (this.state === 'windup') {
      this.drawWarning(ctx, sx, topY, 1 - this.timer / CONFIG.wolf.windup);
    }
    this.drawLabel(ctx, sx, topY);
  }
}

// ── js/boss_base.js
'use strict';

/* 보스 공통 뼈대. 세 보스(거대 슬라임 / 우두머리 늑대 / 늙은 버섯)가 이걸 상속한다.

   공통으로 하는 일
     - 능력치: 같은 레벨 일반 몬스터의 표에 spec 의 배수를 곱해 만든다
     - 상태 기계: intro -> idle -> (패턴)Wind -> ... -> idle. 패턴은 가중치로 뽑는다
     - 2페이즈: 체력이 절반 아래로 내려가면 빨라지고 패턴 확률이 바뀐다
     - 예고 표시(`!`), 넉백 면역, 화면 위 체력바(머리 위 이름표는 안 그린다)
     - 죽을 때 큰 연출

   각 보스는 think() 안에서 자기 패턴 상태만 처리하고, 나머지는 여기 있는 걸 쓴다. */

class Boss extends Enemy {
  constructor(x, y, spec, baseLevels) {
    const level = spec.level;
    const base = enemyStatsAt(baseLevels, level);   // 표 밖 레벨(30 등)도 같은 곡선으로
    super(x, y, level, {
      hp: Math.round(base.hp * spec.hpMult),
      atk: Math.round(base.atk * spec.atkMult),
      speed: spec.speed,
      detect: spec.detect,
      scale: spec.scale,
      xp: Math.round(base.xp * spec.xpMult),
      knockback: 0,          // 보스는 밀리지 않는다
    });
    this.spec = spec;
    this.TYPE = 'boss';
    this.isBoss = true;
    this.name = spec.name;
    this.reward = spec.reward;

    /* 몸통 상자 — 판정은 이걸로 한다. 그림자는 포함하지 않는다.
       (x, y) 는 발 자리이고 몸은 그 위로 솟아 있으므로, 상자는 발에서 위로만 올라간다.
       각 보스가 생성자에서 자기 도트 크기에 맞춰 덮어쓴다 */
    this.bodyW = this.radius * 1.6;
    this.bodyH = this.radius * 1.8;
    this.bodyBottom = 7;     // 발 자리(y)에서 몸 아랫단까지

    this.state = 'intro';
    this.timer = 1.0;        // 등장 연출
    this.phase2 = false;
    this.warn = 0;           // 예고 표시가 남은 시간
    this.squash = 0;         // 몸이 눌리는 정도 (-1 눌림 ~ +1 늘어남) — 예고 동작에 쓴다
    Sound.play('roar');
  }

  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.65, y: this.y + 2, w: r * 1.3, h: 6 };
  }

  // 몸통 상자 — 몸에 닿아야 맞는다 (그림자 위에 서 있는 건 닿은 게 아니다)
  bodyBox() {
    const bottom = this.y + this.bodyBottom;
    return { x: this.x - this.bodyW / 2, y: bottom - this.bodyH, w: this.bodyW, h: this.bodyH };
  }

  get hurtBox() { return this.bodyBox(); }

  // 플레이어 공격 판정용 — 점에서 몸통 상자까지의 거리 (안이면 0)
  hitDistance(px, py) {
    const b = this.bodyBox();
    const dx = Math.max(b.x - px, 0, px - (b.x + b.w));
    const dy = Math.max(b.y - py, 0, py - (b.y + b.h));
    return Math.sqrt(dx * dx + dy * dy);
  }

  hitCenter() {
    const b = this.bodyBox();
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  /* ── 바닥 예고 — 돌진 경로와 착지 범위를 붉게 칠한다 ──
     Game.render 가 캐릭터들보다 먼저 바닥 위에 그린다 (drawGround) */

  // 이 방향으로 달리면 어디서 벽에 막히는가 (px)
  castWall(angle, halfW) {
    let d = 0;
    for (let k = 0; k < 120; k++) {
      d += 6;
      const x = this.x + Math.cos(angle) * d, y = this.y + Math.sin(angle) * d;
      if (World.blocked({ x: x - halfW, y: y + 2, w: halfW * 2, h: 6 })) return d;
    }
    return d;
  }

  // 붉은 띠 — 시작점에서 벽까지, 몸 폭만큼
  drawPathBand(ctx, cam, angle, width) {
    const len = this.castWall(angle, width * 0.3) + width * 0.4;
    const pulse = 0.16 + Math.abs(Math.sin(World.time * 8)) * 0.1;
    ctx.save();
    ctx.translate(Math.round(this.x - cam.x), Math.round(this.y + 2 - cam.y));
    ctx.rotate(angle);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(0, -width / 2, len, width);
    ctx.globalAlpha = 0.55;
    ctx.fillRect(0, -width / 2, len, 1);
    ctx.fillRect(0, width / 2 - 1, len, 1);
    ctx.fillRect(len - 1, -width / 2, 1, width);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 붉은 원판 — 착지 범위
  drawLandingCircle(ctx, cam, x, y, r, urgent) {
    const sx = Math.round(x - cam.x), sy = Math.round(y - cam.y);
    ctx.globalAlpha = (urgent ? 0.3 : 0.18) + Math.abs(Math.sin(World.time * 8)) * 0.1;
    fillCircle(ctx, sx, sy + 2, r, '#ff3b3b');
    ctx.globalAlpha = 1;
    ctx.fillStyle = urgent ? '#ffffff' : '#ff8a8a';
    const steps = Math.max(20, Math.round(r * 1.2));
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ctx.fillRect(Math.round(sx + Math.cos(a) * r), Math.round(sy + 2 + Math.sin(a) * r), 1, 1);   // 판정이 정원이므로 테두리도 정원
    }
    ctx.fillRect(sx - 1, sy + 2, 3, 1); ctx.fillRect(sx, sy + 1, 1, 3);
  }

  // 페이즈에 따라 달라지는 값을 꺼내는 helper ([1페이즈, 2페이즈])
  byPhase(pair) {
    return pair[this.phase2 ? 1 : 0];
  }

  speedUp() {
    return this.phase2 ? this.spec.phase2Speed : 1;
  }

  // 체력 절반에서 2페이즈로 넘어간다. 매 프레임 think() 첫머리에서 부른다
  checkPhase2() {
    if (this.phase2 || this.hp > this.maxHp * this.spec.phase2At) return;
    this.phase2 = true;
    FX.addShake(7);
    FX.flash('#ff3b3b', 0.3, 0.4);
    Sound.play('roar');
    FX.number(this.x, this.y - 30, 'ENRAGED', '#ff6b6b', true);
    const pal = this.palette;
    FX.burst(this.x, this.y, 30, [pal.M, pal.n, '#ffffff'], { speed: 90, life: 0.7 });
  }

  // 공통 타이머 — 2페이즈에서는 시간이 빨리 간다
  tick(dt) {
    this.timer -= dt * this.speedUp();
    this.warn = Math.max(0, this.warn - dt);
  }

  toIdle() {
    const t = this.spec.idleTime;
    this.state = 'idle';
    this.timer = Util.rand(t[0], t[1]);
  }

  // 패턴을 가중치로 하나 고른다. 고른 패턴의 windup 을 타이머에 넣고 '(패턴)Wind' 상태로 간다
  pickPattern(names) {
    const cfg = this.spec;
    const weights = names.map(n => this.byPhase(cfg[n].weight));
    const pick = names[Util.weightedIndex(weights)];
    this.warn = 0.6;
    this.state = pick + 'Wind';
    this.timer = cfg[pick].windup;
    return pick;
  }

  // 예고 진행도 (0 -> 1). 예고 동작의 눌림·부풂에 쓴다
  windProgress(pattern) {
    return 1 - Math.max(0, this.timer) / (this.spec[pattern].windup / this.speedUp());
  }

  // 플레이어 쪽 각도
  angleTo(player) {
    return Math.atan2(player.y - this.y, player.x - this.x);
  }

  // 새끼 몬스터를 주위 빈 자리에 놓는다 (분열 / 울부짖음 / 포자 새끼)
  summon(make, n, levelBelow) {
    const lv = Math.max(1, this.level - levelBelow);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random();
      for (let r = 26; r <= 70; r += 8) {
        const x = this.x + Math.cos(a) * r, y = this.y + Math.sin(a) * r;
        if (!World.isFreeSpot(x, y, 9)) continue;
        Game.enemies.push(make(x, y, lv));
        break;
      }
    }
  }

  die(player) {
    super.die(player);
    FX.addShake(10);
    const pal = this.palette;
    FX.burst(this.x, this.y, 60, [pal.M, pal.n, pal.m, '#ffffff'], { speed: 130, life: 1.0 });
    FX.ring(this.x, this.y + 6, 24, '#ffffff');
    FX.flash('#ffffff', 0.5, 0.35);
    FX.freeze(0.18);
    FX.number(this.x, this.y - 34, 'DEFEATED', '#ffd93d', true);
    Sound.play('bossDead');
  }

  // 보스는 머리 위 이름표 대신 화면 위쪽 전용 체력바를 쓴다
  drawLabel() { }
}

// ── js/boss.js
'use strict';

/* 거대 슬라임 — 숲 가장자리 보스. 동굴로 들어가면 그 안 전용 공간에서 싸운다.

   네 가지 패턴을 번갈아 쓴다. 모든 패턴에 예고 동작(몸이 눌리거나 부풀고 `!` 가 뜬다)이
   붙어 있어서 무엇이 올지 보고 대응할 수 있다.

     SLAM  내려찍기 — 떠올랐다가 플레이어가 있던 자리에 떨어진다. 착지 충격파가 넓다
     ROLL  구르기   — 방향을 정하고 직선으로 굴러온다. 벽에 부딪히면 멈춘다
     SPLIT 분열     — 새끼 슬라임을 여럿 뱉어낸다
     SPIT  뱉기     — 사방으로 점액을 뿌린다

   체력이 절반 아래로 내려가면 2페이즈 — 모든 동작이 빨라지고 패턴이 독해진다. */

class GiantSlime extends Boss {
  constructor(x, y) {
    super(x, y, CONFIG.bosses.slime, CONFIG.slime.levels);
    this.hopTimer = 0;       // 평소 통통 튀는 연출
    this.airHeight = 0;      // 내려찍기로 떠오른 높이
    this.target = { x: x, y: y };
    this.rollDir = 0;
    this.shock = 0;          // 충격파 연출이 남은 시간
    this.shockMax = 0.42;
    // 몸통: 도트 44x38, 아랫단은 y+12
    this.bodyW = 40; this.bodyH = 34; this.bodyBottom = 12;
  }

  // 바닥 예고 — 구르기는 경로를, 내려찍기는 떨어질 자리를 붉게
  drawGround(ctx, cam) {
    const cfg = this.spec, player = Game.player;
    if (this.state === 'rollWind') this.drawPathBand(ctx, cam, this.rollDir, this.bodyW);
    else if (this.state === 'slamWind' && !player.dead) this.drawLandingCircle(ctx, cam, player.x, player.y, cfg.slam.radius, false);
    else if (this.state === 'slamAir') this.drawLandingCircle(ctx, cam, this.target.x, this.target.y, cfg.slam.radius, true);
  }

  think(dt, player) {
    const cfg = this.spec;
    this.checkPhase2();
    this.tick(dt);
    this.shock = Math.max(0, this.shock - dt);
    this.hopTimer += dt;
    const speedUp = this.speedUp();

    switch (this.state) {
      case 'intro':
        // 굴 안쪽에서 몸을 일으키는 참 — 잠깐 부풀었다 가라앉는다
        this.squash = Math.sin(this.timer * 6) * 0.4;
        if (this.timer <= 0) this.toIdle();
        break;

      case 'idle': {
        this.squash *= Math.pow(0.02, dt);
        // 느릿느릿 다가온다
        const d = this.distanceTo(player);
        if (d > 34 && !player.dead) {
          const a = this.angleTo(player);
          this.moveWithCollision(Math.cos(a) * this.stats.speed * dt, Math.sin(a) * this.stats.speed * dt);
        }
        if (this.timer <= 0) {
          const pick = this.pickPattern(['slam', 'roll', 'split', 'spit']);
          if (pick === 'roll' && !player.dead) this.rollDir = this.angleTo(player);
        }
        break;
      }

      /* ── 내려찍기 ── */
      case 'slamWind':
        this.squash = -0.5 * this.windProgress('slam');
        if (this.timer <= 0) {
          // 예고가 끝나는 순간의 플레이어 위치를 노린다 — 그 뒤에 움직이면 피할 수 있다
          this.target = { x: player.x, y: player.y };
          this.state = 'slamAir';
          this.timer = cfg.slam.air;
        }
        break;

      case 'slamAir': {
        const p = 1 - Math.max(0, this.timer) / (cfg.slam.air / speedUp);
        this.airHeight = Math.sin(p * Math.PI) * 46;
        this.squash = 0.35 * Math.sin(p * Math.PI);
        // 공중에서 목표 지점으로 미끄러져 간다 (벽은 무시하고 날아간다)
        this.x = Util.lerp(this.x, this.target.x, Math.min(1, dt * 6));
        this.y = Util.lerp(this.y, this.target.y, Math.min(1, dt * 6));
        if (this.timer <= 0) this.land(player);
        break;
      }

      case 'slamLand':
        this.squash = -0.45 * Math.max(0, this.timer) / (cfg.slam.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 구르기 ── */
      case 'rollWind':
        this.squash = -0.35;
        // 예고 중에도 방향을 계속 맞춘다 — 끝나는 순간 고정된다
        if (!player.dead) this.rollDir = this.angleTo(player);
        if (this.timer <= 0) {
          this.state = 'roll';
          this.timer = cfg.roll.time;
        }
        break;

      case 'roll': {
        this.squash = 0.15;
        const before = this.x + this.y;
        this.moveWithCollision(
          Math.cos(this.rollDir) * cfg.roll.speed * dt * speedUp,
          Math.sin(this.rollDir) * cfg.roll.speed * dt * speedUp
        );
        // 벽에 막혀 못 움직이면 멈춘다
        if (Math.abs((this.x + this.y) - before) < 0.05) {
          FX.addShake(4);
          FX.burst(this.x, this.y, 12, ['#cbbfa2', '#8f7854'], { speed: 60, life: 0.4 });
          this.toIdle();
          break;
        }
        this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * cfg.roll.damageMult));
        if (this.timer <= 0) this.toIdle();
        break;
      }

      /* ── 분열 ── */
      case 'splitWind':
        this.squash = 0.4 * this.windProgress('split');
        if (this.timer <= 0) { this.split(); this.toIdle(); }
        break;

      /* ── 뱉기 ── */
      case 'spitWind':
        this.squash = 0.3 * this.windProgress('spit');
        if (this.timer <= 0) { this.spit(player); this.toIdle(); }
        break;
    }

    // 공중에 떠 있을 때만 빼고 몸이 닿으면 피해를 준다
    if (this.state !== 'slamAir') {
      this.touchPlayer(player, cfg.contactCooldown);
    }
  }

  toIdle() {
    super.toIdle();
    this.airHeight = 0;
  }

  // 착지 — 충격파가 원 안의 플레이어를 때린다
  land(player) {
    const cfg = this.spec;
    this.airHeight = 0;
    this.state = 'slamLand';
    this.timer = cfg.slam.recover;
    this.shock = this.shockMax;
    FX.addShake(9);
    FX.flash('#ffffff', 0.25, 0.12);
    FX.freeze(0.05);
    Sound.play('slam');
    const pal = this.palette;
    FX.burst(this.x, this.y + 6, 26, [pal.M, pal.n, '#cbbfa2'], { speed: 95, life: 0.6 });

    if (!player.dead && Util.dist(this.x, this.y, player.x, player.y) < cfg.slam.radius) {
      player.takeDamage(Math.round(this.stats.atk * cfg.slam.damageMult), this.x, this.y);
    }
  }

  // 분열 — 새끼 슬라임을 뱉는다 (보스보다 여러 레벨 낮다)
  split() {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.split.count), this.byPhase(cfg.split.count) + 1);
    this.summon((x, y, lv) => new Slime(x, y, lv), n, cfg.split.levelBelow);
    FX.addShake(4);
    const pal = this.palette;
    FX.burst(this.x, this.y, 20, [pal.M, pal.m], { speed: 80, life: 0.5 });
    Sound.play('split');
  }

  // 뱉기 — 사방으로 점액을 뿌린다. 2페이즈에서는 발수가 늘어난다
  spit(player) {
    const cfg = this.spec;
    const shots = this.byPhase(cfg.spit.shots);
    // 조준은 몸 중심이 아니라 "뱉는 위치" 기준으로 잰다.
    // 안 그러면 가로로 뱉을 때 탄이 플레이어 머리 위로 평행하게 지나가 버린다
    const ox = this.x, oy = this.y - 6;
    const aim = player.dead ? 0 : Math.atan2(player.y - oy, player.x - ox);
    for (let i = 0; i < shots; i++) {
      Projectiles.spawn(ox, oy, aim + (i / shots) * Math.PI * 2, {
        speed: cfg.spit.speed,
        damage: Math.round(this.stats.atk * cfg.spit.damageMult),
        level: this.level,
        life: cfg.spit.life,
      });
    }
    FX.addShake(3);
    Sound.play('spit');
  }

  // 공중에 있는 동안은 때릴 수 없다
  takeHit(damage, angle, crit, player, knockScale) {
    if (this.state === 'slamAir') return;
    super.takeHit(damage, angle, crit, player, knockScale);
  }

  drawBody(ctx, sx, sy) {
    const tier = levelTier(this.level);
    const y = sy - Math.round(this.airHeight);

    // 그림자 — 떠 있을수록 작고 옅어진다 (어디에 떨어질지 알려주는 표시이기도 하다)
    const lift = this.airHeight / 46;
    fillCircle(ctx, sx, sy + 10, 13 * (1 - lift * 0.45), 'rgba(0,0,0,' + (0.3 - lift * 0.12) + ')');

    // 착지 충격파
    if (this.shock > 0) {
      const t = 1 - this.shock / this.shockMax;
      const ring = SPRITES.shockRing[Util.clamp(Math.floor(t * 4), 0, 3)];
      ctx.drawImage(ring, sx - Math.floor(ring.width / 2), sy + 8 - Math.floor(ring.height / 2));
    }

    // 몸 — squash 로 눌리고 늘어난다 (예고 동작이 전부 여기서 보인다)
    const sprite = this.hurtFlash > 0 ? SPRITES.giantSlimeFlash[tier] : SPRITES.giantSlime[tier];
    const bounce = this.state === 'idle' ? Math.sin(this.hopTimer * 4) * 0.05 : 0;
    const sq = this.squash + bounce;
    const w = Math.round(sprite.width * (1 - sq * 0.5));
    const h = Math.round(sprite.height * (1 + sq * 0.5));
    ctx.drawImage(sprite, sx - Math.round(w / 2), Math.round(y + 12 - h), w, h);

    const topY = Math.round(y + 12 - h);
    if (this.warn > 0) this.drawWarning(ctx, sx, topY, 1 - this.warn / 0.6);
  }
}

  <script>
// ── js/boss_wolf.js
'use strict';

/* 우두머리 늑대 — 깊은 숲 보스. 빠르고 집요하다.

   거대 슬라임이 "덩치로 밀어붙이는" 상대라면 이쪽은 "빈틈을 잡아야 하는" 상대다.
   평소에도 플레이어만큼 빠르게 서성이며 거리를 재고, 패턴은 전부 순식간에 끝난다.

     LUNGE  돌진     — 웅크렸다가 직선으로 쏜살같이 달려든다. 벽에 부딪히면 잠깐 휘청 — 그때가 기회.
                       2페이즈에서는 방향을 고쳐 잡으며 세 번 연달아 온다
     POUNCE 덮치기   — 뛰어올라 내가 있던 자리에 떨어진다 (범위는 좁지만 정확하다)
     HOWL   울부짖음 — 무리를 부른다 (새끼 늑대 2~3마리)
     CIRCLE 돌기     — 주위를 빙 돌며 틈을 보다가 곧바로 돌진으로 이어진다

   체력이 절반 아래로 내려가면 2페이즈 — 빨라지고 돌진이 세 번 연속이 된다. */

class AlphaWolf extends Boss {
  constructor(x, y) {
    super(x, y, CONFIG.bosses.wolf, CONFIG.wolf.levels);
    this.facing = 1;         // 1 오른쪽 / -1 왼쪽
    this.stepTime = 0;       // 다리 움직임
    this.lungeDir = 0;
    this.lungesLeft = 0;     // 연속 돌진 남은 횟수
    this.airHeight = 0;
    this.target = { x: x, y: y };
    this.circleDir = 1;      // 도는 방향
    // 몸통: 늑대 도트 x3, 아랫단은 y+7
    const sp = SPRITES.wolf[0][0];
    this.bodyW = Math.round(sp.width * this.scale * 0.85);
    this.bodyH = Math.round(sp.height * this.scale * 0.9);
    this.bodyBottom = 7;
  }

  // 바닥 예고 — 돌진은 경로를, 덮치기는 떨어질 자리를 붉게
  drawGround(ctx, cam) {
    const cfg = this.spec, player = Game.player;
    if (this.state === 'lungeWind') this.drawPathBand(ctx, cam, this.lungeDir, this.bodyH * 0.8);
    else if (this.state === 'pounceWind' && !player.dead) this.drawLandingCircle(ctx, cam, player.x, player.y, cfg.pounce.radius, false);
    else if (this.state === 'pounceAir') this.drawLandingCircle(ctx, cam, this.target.x, this.target.y, cfg.pounce.radius, true);
  }

  face(dx) { if (Math.abs(dx) > 0.5) this.facing = dx > 0 ? 1 : -1; }

  // 정해진 방향으로 달린다. 벽에 막혀 못 움직이면 false
  run(angle, speed, dt) {
    const before = this.x + this.y;
    this.moveWithCollision(Math.cos(angle) * speed * dt, Math.sin(angle) * speed * dt);
    this.face(Math.cos(angle));
    this.stepTime += dt * (speed / 60);
    return Math.abs((this.x + this.y) - before) > 0.05;
  }

  think(dt, player) {
    const cfg = this.spec;
    this.checkPhase2();
    this.tick(dt);
    const speedUp = this.speedUp();

    switch (this.state) {
      case 'intro':
        this.squash = -0.3 + Math.sin(this.timer * 8) * 0.1;
        if (this.timer <= 0) this.toIdle();
        break;

      case 'idle': {
        this.squash *= Math.pow(0.02, dt);
        // 적당한 거리를 유지하며 서성인다 — 너무 멀면 다가오고 너무 가까우면 물러난다
        if (!player.dead) {
          const d = this.distanceTo(player), a = this.angleTo(player);
          if (d > cfg.keepDistance + 12) this.run(a, this.stats.speed * speedUp, dt);
          else if (d < cfg.keepDistance - 12) this.run(a + Math.PI, this.stats.speed * 0.7 * speedUp, dt);
          else this.face(player.x - this.x);
        }
        if (this.timer <= 0) {
          const pick = this.pickPattern(['lunge', 'pounce', 'howl', 'circle']);
          if (pick === 'lunge') this.lungesLeft = this.byPhase(cfg.lunge.count);
          if (pick === 'circle') { this.circleDir = Math.random() < 0.5 ? 1 : -1; this.state = 'circle'; this.timer = cfg.circle.time; this.warn = 0; }
        }
        break;
      }

      /* ── 돌진 ── */
      case 'lungeWind':
        this.squash = -0.35 * this.windProgress('lunge');
        if (!player.dead) { this.lungeDir = this.angleTo(player); this.face(Math.cos(this.lungeDir)); }
        if (this.timer <= 0) {
          this.state = 'lunge';
          this.timer = cfg.lunge.time;
          this.lungesLeft--;
          Sound.play('growl');
          FX.burst(this.x, this.y + 6, 8, ['#cbbfa2', '#8f7854'], { speed: 40, life: 0.3, gravity: 60, size: 1 });
        }
        break;

      case 'lunge': {
        this.squash = 0.18;
        const moved = this.run(this.lungeDir, cfg.lunge.speed * speedUp, dt);
        this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * cfg.lunge.damageMult));
        if (!moved) {
          // 벽에 부딪혔다 — 휘청이는 동안이 때릴 기회
          FX.addShake(5);
          FX.burst(this.x, this.y, 12, ['#cbbfa2', '#8f7854'], { speed: 60, life: 0.4 });
          Sound.play('slam');
          this.state = 'lungeRecover';
          this.timer = cfg.lunge.recover * 1.3;
          this.lungesLeft = 0;
        } else if (this.timer <= 0) {
          if (this.lungesLeft > 0) {
            // 연속 돌진 — 짧게 방향을 고쳐 잡고 다시 온다
            this.state = 'lungeWind';
            this.timer = cfg.lunge.gapWindup;
            this.warn = 0.3;
          } else {
            this.state = 'lungeRecover';
            this.timer = cfg.lunge.recover;
          }
        }
        break;
      }

      case 'lungeRecover':
        this.squash = -0.2 * Math.max(0, this.timer) / (cfg.lunge.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 덮치기 ── */
      case 'pounceWind':
        this.squash = -0.45 * this.windProgress('pounce');
        if (!player.dead) this.face(player.x - this.x);
        if (this.timer <= 0) {
          this.target = { x: player.x, y: player.y };
          this.state = 'pounceAir';
          this.timer = cfg.pounce.air;
        }
        break;

      case 'pounceAir': {
        const p = 1 - Math.max(0, this.timer) / (cfg.pounce.air / speedUp);
        this.airHeight = Math.sin(p * Math.PI) * 34;
        this.squash = 0.25;
        this.x = Util.lerp(this.x, this.target.x, Math.min(1, dt * 8));
        this.y = Util.lerp(this.y, this.target.y, Math.min(1, dt * 8));
        this.face(this.target.x - this.x);
        if (this.timer <= 0) this.landPounce(player);
        break;
      }

      case 'pounceLand':
        this.squash = -0.35 * Math.max(0, this.timer) / (cfg.pounce.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 울부짖음 ── */
      case 'howlWind':
        this.squash = 0.25 * this.windProgress('howl');   // 고개를 든다
        if (this.timer <= 0) { this.howl(); this.toIdle(); }
        break;

      /* ── 돌기 ── */
      case 'circle': {
        if (!player.dead) {
          // 플레이어를 중심으로 원을 그리며 달린다 — 원 위의 목표점을 향해 계속 움직인다
          const a = this.angleTo(player) + Math.PI;                 // 플레이어에서 나를 향한 각
          const want = a + this.circleDir * 0.9;                    // 조금 앞선 자리
          const tx = player.x + Math.cos(want) * cfg.circle.radius;
          const ty = player.y + Math.sin(want) * cfg.circle.radius;
          const moved = this.run(Math.atan2(ty - this.y, tx - this.x), cfg.circle.speed * speedUp, dt);
          if (!moved) this.circleDir *= -1;                          // 벽에 막히면 반대로 돈다
        }
        if (this.timer <= 0) {
          // 돌다가 바로 돌진 — 예고는 짧다
          this.lungesLeft = 1;
          this.state = 'lungeWind';
          this.timer = cfg.lunge.gapWindup;
          this.warn = 0.3;
        }
        break;
      }
    }

    if (this.state !== 'pounceAir' && this.state !== 'lunge') {
      this.touchPlayer(player, cfg.contactCooldown);
    }
  }

  toIdle() {
    super.toIdle();
    this.airHeight = 0;
  }

  landPounce(player) {
    const cfg = this.spec;
    this.airHeight = 0;
    this.state = 'pounceLand';
    this.timer = cfg.pounce.recover;
    FX.addShake(6);
    FX.freeze(0.03);
    Sound.play('slam');
    FX.burst(this.x, this.y + 6, 16, ['#cbbfa2', '#8f7854', '#ffffff'], { speed: 70, life: 0.45 });
    FX.ring(this.x, this.y + 4, cfg.pounce.radius * 0.6, '#cbbfa2');
    if (!player.dead && Util.dist(this.x, this.y, player.x, player.y) < cfg.pounce.radius) {
      player.takeDamage(Math.round(this.stats.atk * cfg.pounce.damageMult), this.x, this.y);
    }
  }

  howl() {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.howl.count), this.byPhase(cfg.howl.count) + 1);
    this.summon((x, y, lv) => new Wolf(x, y, lv), n, cfg.howl.levelBelow);
    FX.addShake(4);
    FX.ring(this.x, this.y - 6, 14, '#ffffff');
    Sound.play('howl');
  }

  // 공중에 있는 동안은 때릴 수 없다
  takeHit(damage, angle, crit, player, knockScale) {
    if (this.state === 'pounceAir') return;
    super.takeHit(damage, angle, crit, player, knockScale);
  }

  drawBody(ctx, sx, sy) {
    const tier = levelTier(this.level);
    const y = sy - Math.round(this.airHeight);
    const moving = this.state === 'lunge' || this.state === 'circle' || this.state === 'idle';
    const frame = moving ? (Math.floor(this.stepTime * 6) % 2) : 0;
    const flash = this.hurtFlash > 0;
    const set = this.facing >= 0 ? (flash ? SPRITES.wolfFlash : SPRITES.wolf) : (flash ? SPRITES.wolfLeftFlash : SPRITES.wolfLeft);
    const sprite = set[tier][frame];

    const lift = this.airHeight / 34;
    this.drawShadow(ctx, sx, sy, 7 * this.scale * (1 - lift * 0.4));

    // 눌림/늘어남 — 예고에서 웅크리고 돌진에서 길어진다
    const sq = this.squash;
    const w = Math.round(sprite.width * this.scale * (1 - sq * 0.35));
    const h = Math.round(sprite.height * this.scale * (1 + sq * 0.5));
    ctx.drawImage(sprite, sx - Math.round(w / 2), Math.round(y + 7 - h), w, h);

    // 우두머리 표시 — 눈 도트 자리에 붉은 눈을 덧그린다 (도트를 새로 그리지 않고도 구별된다)
    if (!flash) {
      ctx.fillStyle = '#ff5c5c';
      const px = this.facing >= 0 ? WOLF_EYE.x : sprite.width - 1 - WOLF_EYE.x;
      const cw = w / sprite.width, ch = h / sprite.height;
      ctx.fillRect(Math.round(sx - w / 2 + px * cw), Math.round(y + 7 - h + WOLF_EYE.y * ch), Math.max(1, Math.round(cw)), Math.max(1, Math.round(ch)));
    }

    const topY = Math.round(y + 7 - h);
    if (this.warn > 0) this.drawWarning(ctx, sx, topY, 1 - this.warn / 0.6);
  }
}
