// ── js/projectile.js
'use strict';

/* 날아다니는 탄 — 지금은 버섯이 쏘는 포자 하나뿐이지만,
   나중에 다른 원거리 몬스터나 플레이어 스킬도 같은 통로를 쓰면 된다.

   규칙
     - 벽(나무·바위·물)에 닿으면 터진다
     - 플레이어에 닿으면 피해를 주고 터진다 (무적 시간 중이면 그냥 지나간다)
     - 수명이 끝나면 사라진다 */

const Projectiles = {
  list: [],

  reset() {
    this.list.length = 0;
  },

  spawn(x, y, angle, opts) {
    Sound.play('blip');
    this.list.push({
      x: x, y: y,
      vx: Math.cos(angle) * opts.speed,
      vy: Math.sin(angle) * opts.speed,
      damage: opts.damage,
      type: opts.type || 'mushroom',   // 색은 쏜 몬스터의 종류를 따른다
      life: opts.life,
      maxLife: opts.life,
      radius: opts.radius || 3,
      spin: Math.random() * Math.PI * 2,
      kind: opts.kind || 'spore',   // 'needle' 은 선인장 가시 — 날아가는 방향으로 누운 막대
      angle: angle,
    });
  },

  update(dt, player) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }

      const px = p.x, py = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.spin += dt * 6;

      // 거점 안으로는 날아들지 못한다 — 경계에서 흩어진다 (독 묻히기도 여기서 끊긴다)
      if (typeof Village !== 'undefined' && Village.blocksEntry && Village.blocksEntry(px, py, p.x, p.y)) {
        this.burst(p);
        this.list.splice(i, 1);
        continue;
      }

      // 벽에 부딪히면 터진다
      const box = { x: p.x - 2, y: p.y - 2, w: 4, h: 4 };
      if (World.blocked(box)) {
        this.burst(p);
        this.list.splice(i, 1);
        continue;
      }

      // 플레이어에게 명중
      if (!player.dead && Util.aabb(box, player.hurtBox)) {
        // 무적 시간 중이면 피해가 들어가지 않으므로 탄도 그대로 지나가게 둔다
        if (player.invuln <= 0) {
          player.takeDamage(p.damage, p.x, p.y);
          // 포자는 독을 품고 있다 (가시는 그냥 아프다)
          if (p.type === 'mushroom') Status.apply(player, 'poison', p.damage * CONFIG.status.monsterPoison, null);
          this.burst(p);
          this.list.splice(i, 1);
        }
      }
    }
  },

  burst(p) {
    const pal = ENEMY_COLORS[p.type] || ENEMY_COLORS.mushroom;
    FX.burst(p.x, p.y, 6, [pal.M, pal.n, '#ffffff'], { speed: 34, life: 0.28, gravity: 20, size: 1 });
  },

  draw(ctx, cam) {
    for (const p of this.list) {
      const sx = Math.round(p.x - cam.x), sy = Math.round(p.y - cam.y);
      // 사라지기 직전에는 깜빡여서 곧 없어짐을 알린다
      if (p.life < 0.3 && Math.floor(p.life * 24) % 2 === 0) continue;
      if (p.kind === 'needle') {
        const pal = ENEMY_COLORS[p.type] || ENEMY_COLORS.cactus;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(p.angle);
        ctx.fillStyle = pal.n; ctx.fillRect(-3, -1, 6, 2);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(1, -1, 2, 1);
        ctx.restore();
        continue;
      }
      const sprite = SPRITES.spore[p.type] || SPRITES.spore.mushroom;
      // 살짝 위아래로 흔들리며 날아간다
      const bob = Math.round(Math.sin(p.spin) * 1.2);
      ctx.drawImage(sprite, sx - 2, sy - 2 + bob);
    }
  },
};

  <script>
// ── js/enemy.js
'use strict';

/* 모든 몬스터의 공통 뼈대.
   체력·피격·넉백·사망·레벨 표시처럼 종류가 달라도 똑같은 부분을 여기 모아두고,
   종류별 파일(slime / mushroom / wolf)은 "어떻게 움직이고 어떻게 공격하는가"만 쓴다.

   하위 클래스가 채워야 하는 것
     TYPE       종류 이름 (스폰 표와 미니맵에서 쓴다)
     stats      CONFIG 에서 가져온 레벨별 능력치 ({hp, atk, xp, knockback, scale, ...})
     think(dt, player)   매 프레임 행동
     drawBody(ctx, sx, sy)   몸통 그리기 (그림자와 레벨표시는 공통으로 처리) */

let enemyIdCounter = 0;

class Enemy {
  constructor(x, y, level, stats) {
    this.id = ++enemyIdCounter;
    this.TYPE = 'enemy';
    this.level = level;
    // 표의 줄을 그대로 참조하면 한 마리를 고칠 때 같은 레벨 전부가 바뀐다 — 복사해서 쓴다
    this.stats = Object.assign({}, stats);
    this.x = x; this.y = y;
    this.maxHp = stats.hp;
    this.hp = stats.hp;
    this.scale = stats.scale;
    this.radius = 7 * stats.scale;
    this.dead = false;

    this.status = {};          // 걸려 있는 상태이상 (Status 가 다룬다)
    this.elite = null;         // 엘리트 접두사 id — 붙이고 다루는 일은 Elite 가 한다
    this.nightBorn = false;    // 밤에 태어났는가 — 더 세고 이름표에 달이 붙는다
    this.dir = Math.random() * Math.PI * 2;
    this.contactTimer = 0;
    this.hurtFlash = 0;
    this.showHp = 0;
    this.kx = 0; this.ky = 0;   // 넉백 속도
  }

  // 종류 색 (피 튀김·죽을 때 터지는 알갱이·체력바에 쓴다)
  get palette() {
    return ENEMY_COLORS[this.TYPE] || ENEMY_COLORS.slime;
  }

  // 이름표 색 — 지금 내 레벨에 견줘 얼마나 벅찬가 (빨강 / 주황 / 흰색)
  get labelColor() {
    return difficultyColor(this.level, Game.player ? Game.player.level : 1);
  }

  get hurtBox() {
    const r = this.radius;
    return { x: this.x - r, y: this.y - r * 0.8, w: r * 2, h: r * 1.8 };
  }

  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.7, y: this.y + 1, w: r * 1.4, h: 5 };
  }

  distanceTo(player) {
    if (player.dead) return Infinity;
    // 마을 안에 있는 플레이어는 바깥에서 안 보인다 — 울타리에 달라붙어 기다리지 않고 물러난다
    if (typeof Village !== 'undefined' && Village.isSafe && !Village.isSafe(this.x, this.y)
        && Village.isSafe(player.x, player.y)) return Infinity;
    return Util.dist(this.x, this.y, player.x, player.y);
  }

  /* 몸이 벽 안에 끼면 어느 쪽으로도 움직일 수 없어 영영 굳어버린다.
     (스폰은 빈 자리를 확인하지만, 앞으로 몸집이 더 큰 몬스터가 들어오면 생길 수 있는 상황)
     가까운 빈 자리를 나선으로 찾아 빠져나온다. */
  unstick() {
    if (!World.blocked(this.feetBox)) return;
    for (let r = 3; r <= 24; r += 3) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
        const box = this.feetBox;
        box.x += dx; box.y += dy;
        if (!World.blocked(box)) { this.x += dx; this.y += dy; return; }
      }
    }
  }

  update(dt, player) {
    if (this.dead) return;
    Status.update(this, dt, false);
    if (this.dead) return;     // 화상·중독으로 여기서 쓰러질 수 있다
    this.unstick();
    this.contactTimer = Math.max(0, this.contactTimer - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.showHp = Math.max(0, this.showHp - dt);

    // 기절 (도끼 땅 찍기) — 그동안은 움직이지도 공격하지도 않는다. 밀려나는 것은 그대로
    if (this.stunTimer > 0) this.stunTimer -= dt;
    else this.think(dt, player);

    // 넉백은 종류와 무관하게 똑같이 밀리고 잦아든다
    if (Math.abs(this.kx) > 0.5 || Math.abs(this.ky) > 0.5) {
      this.moveWithCollision(this.kx * dt, this.ky * dt);
      this.kx *= Math.pow(0.004, dt);
      this.ky *= Math.pow(0.004, dt);
    }
  }

  think(dt, player) { /* 하위 클래스가 채운다 */ }

  // 몸이 겹쳐 있으면 닿는 피해를 준다 (쿨다운은 종류별로 다르다)
  touchPlayer(player, cooldown, damage) {
    if (player.dead || this.contactTimer > 0) return false;
    if (!Util.aabb(this.hurtBox, player.hurtBox)) return false;
    player.takeDamage(damage === undefined ? this.stats.atk : damage, this.x, this.y);
    this.contactTimer = cooldown;
    if (this.elite) Elite.onTouch(this, player);   // 불타는 엘리트는 닿으면 화상을 옮긴다
    return true;
  }

  /* x축과 y축을 따로 밀어 벽에 붙어도 미끄러지듯 움직인다.
     벽에 막히면 방향을 튕겨 제자리에 끼지 않게 한다.
     빙결은 여기서 한 번에 처리한다 — 모든 몬스터가 이 길로 움직이므로 종류마다 손볼 것이 없다. */
  moveWithCollision(dx, dy) {
    const slow = Status.speedScale(this);
    dx *= slow; dy *= slow;
    // 거점 안전구역 — 바깥에서 안으로 들어가는 발걸음은 벽처럼 막는다.
    // 안에 있던 것은 나가는 길이라 막지 않는다 (Village.update 의 밀어내기가 여기로 나간다)
    const safeZone = (typeof Village !== 'undefined' && Village.blocksEntry) ? Village : null;
    const margin = this.radius || 0;   // 중심이 아니라 몸통이 선을 넘지 못하게 한다
    const step = 2;
    let remain = dx;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.x += move;
      if (World.blocked(box)) { this.dir = Math.PI - this.dir; this.onBlocked(); break; }
      if (safeZone && safeZone.blocksEntry(this.x, this.y, this.x + move, this.y, margin)) {
        this.dir = Math.PI - this.dir; this.onBlocked(); break;
      }
      this.x += move;
      remain -= move;
    }
    remain = dy;
    while (Math.abs(remain) > 0.001) {
      const move = Util.clamp(remain, -step, step);
      const box = this.feetBox; box.y += move;
      if (World.blocked(box)) { this.dir = -this.dir; this.onBlocked(); break; }
      if (safeZone && safeZone.blocksEntry(this.x, this.y, this.x, this.y + move, margin)) {
        this.dir = -this.dir; this.onBlocked(); break;
      }
      this.y += move;
      remain -= move;
    }
  }

  onBlocked() { /* 필요한 종류만 쓴다 (늑대는 돌진을 멈춘다) */ }

  // knockScale — 스킬처럼 더 세게 날려보내야 할 때 쓰는 추가 배수
  takeHit(damage, angle, crit, player, knockScale) {
    damage = Math.round(damage * Status.damageTaken(this));   // 감전되어 있으면 더 아프다
    this.hp -= damage;
    this.hurtFlash = 0.12;
    this.showHp = 2.5;
    // 도끼처럼 무거운 무기는 더 멀리 날려보낸다
    const weaponKnock = (player && player.weaponSpec) ? player.weaponSpec().knockMult : 1;
    const knockMult = weaponKnock * (knockScale || 1);
    this.kx = Math.cos(angle) * this.stats.knockback * knockMult;
    this.ky = Math.sin(angle) * this.stats.knockback * knockMult;

    const pal = this.palette;
    FX.spray(this.x, this.y, angle, crit ? 12 : 7, [pal.M, pal.n, '#ffffff']);
    FX.number(this.x, this.y - 10 - this.radius, damage, crit ? '#ffd93d' : '#ffffff', crit);
    // 맞은 쪽(때린 사람을 향한 면)에서 불꽃이 튄다
    FX.spark(this.x - Math.cos(angle) * this.radius * 0.6, this.y - 2 - Math.sin(angle) * this.radius * 0.4, angle, crit);
    Sound.play(crit ? 'crit' : 'hit');

    this.onHit(damage, player);
    if (this.hp <= 0) this.die(player);
  }

  onHit(damage, player) { /* 맞았을 때 반응이 필요한 종류만 쓴다 */ }

  die(player) {
    this.dead = true;
    const pal = this.palette;
    FX.burst(this.x, this.y, 16 + this.level * 3, [pal.M, pal.n, pal.m], { speed: 70, life: 0.55 });
    FX.ring(this.x, this.y + 2, this.radius + 2, pal.n);
    Sound.play('kill');
    FX.number(this.x, this.y - 18, '+' + this.stats.xp + 'XP', '#9be564');
    player.gainXp(this.stats.xp);
    if (this.elite) Elite.onDie(this, player);     // 불꽃이 퍼지거나, 둘로 갈라진다
  }

  /* ── 그리기 ────────────────────────────────────────────── */

  draw(ctx, cam) {
    if (this.dead) return;
    const sx = Math.round(this.x - cam.x);
    const sy = Math.round(this.y - cam.y);
    if (this.elite) Elite.drawAura(ctx, this, sx, sy);   // 발밑 고리는 몸에 가려지지 않게 먼저
    /* 맞은 직후엔 옆으로 퍼졌다 돌아온다 — 충격이 몸에 전해지는 느낌.
       예전엔 캔버스를 비정수 배율로 늘려서 도트가 뭉개졌다. 이제는 눌린 크기(hitSX/hitSY)를
       그리는 쪽에 넘겨 **그 크기로 다시 그린다** (늘리지 않는다) */
    this.hitK = this.hurtFlash > 0 ? this.hurtFlash / 0.12 : 0;
    this.drawBody(ctx, sx, sy);
  }

  drawBody(ctx, sx, sy) { /* 하위 클래스가 채운다 */ }

  // 맞은 순간의 눌림 배수 (그림 크기에 곱한다)
  get hitSX() { return 1 + (this.hitK || 0) * 0.16; }
  get hitSY() { return 1 - (this.hitK || 0) * 0.14; }

  // 기절 — 머리 위를 노란 별 셋이 납작하게 돈다 (앞으로 올 때 밝고 크게)
  drawStunStars(ctx, sx, y) {
    for (let i = 0; i < 3; i++) {
      const a = World.time * 6 + i * Math.PI * 2 / 3;
      const x = Math.round(sx + Math.cos(a) * 7), yy = Math.round(y + Math.sin(a) * 2);
      const front = Math.sin(a) > 0;
      ctx.fillStyle = front ? '#ffe066' : '#b8902c';
      ctx.fillRect(x, yy, 1, 1);
      if (front) { ctx.fillRect(x - 1, yy, 3, 1); ctx.fillRect(x, yy - 1, 1, 3); }
    }
  }

  // 발밑 그림자 — 납작한 타원, 빛 반대편으로 한 칸 (둥근 원은 공처럼 떠 보인다)
  drawShadow(ctx, sx, sy, radius) {
    fillEllipse(ctx, sx + 1, sy + 6, radius, Math.max(1.5, radius * 0.42), 'rgba(10,12,20,0.32)');
  }

  // 레벨 표시와 체력바 — 모든 몬스터가 같은 자리에 같은 모양으로 띄운다
  drawLabel(ctx, sx, topY) {
    const pal = this.palette;
    if (this.stunTimer > 0) this.drawStunStars(ctx, sx, topY - (this.elite ? 15 : 8));
    // 엘리트는 별과 접두사가 한 줄 더 붙으므로 상태이상 표를 그만큼 위로 올린다
    Status.drawMarks(ctx, this, sx, topY - (this.elite ? 7 : 0));
    if (this.elite) Elite.drawName(ctx, this, sx, topY - 12);
    // 밤에 태어난 놈은 달을 달고 다닌다 — 날이 밝아도 세다는 표시
    if (this.nightBorn) UI.drawText(ctx, '@', sx - 10, topY - 5, '#9fc8ff', false);
    UI.drawText(ctx, 'L' + this.level, sx - 4, topY - 5, this.labelColor, false);

    if (this.showHp > 0) {
      const w = Math.max(12, Math.round(14 * this.scale));
      const x = sx - Math.round(w / 2), y = topY + 2;
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, y - 1, w + 2, 4);
      ctx.fillStyle = '#4a1f1f';
      ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = pal.M;
      ctx.fillRect(x, y, Math.round(w * Math.max(0, this.hp) / this.maxHp), 2);
    }
  }

  // 공격 직전 예고 — 몸 위에 느낌표가 깜빡인다 (버섯·늑대가 함께 쓴다)
  drawWarning(ctx, sx, topY, progress) {
    if (Math.floor(progress * 12) % 2 !== 0) return;
    UI.drawText(ctx, '!', sx, topY - 13, '#ff6b6b', true);
  }
}

// ── js/slime.js
'use strict';

/* 슬라임 — 가장 기본이 되는 몬스터.
   통통 튀는 주기(hop) 중 앞부분에서만 실제로 움직여서, 계속 미끄러지듯 오는 게 아니라
   폴짝폴짝 다가온다. 공격 수단은 몸통 박치기 하나뿐이다. */

class Slime extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.slime.levels[level - 1]);
    this.TYPE = 'slime';
    this.hopTimer = Math.random() * CONFIG.slime.hopCycle;   // 서로 다른 박자로 튀도록
    this.wanderTimer = Util.rand(0.5, 2.5);
    this.chasing = false;
  }

  think(dt, player) {
    const cs = CONFIG.slime;

    // ── 목표 방향: 감지 범위 안이면 쫓아가고, 아니면 가끔 방향을 바꿔 배회한다
    this.chasing = this.distanceTo(player) < this.stats.detect;
    if (this.chasing) {
      this.dir = Math.atan2(player.y - this.y, player.x - this.x);
    } else {
      this.wanderTimer -= dt;
      if (this.wanderTimer <= 0) {
        this.dir = Math.random() * Math.PI * 2;
        this.wanderTimer = Util.rand(1.2, 3.2);
      }
    }

    // ── 통통 튀기: 주기의 앞부분에서만 전진한다
    this.hopTimer += dt;
    if (this.hopTimer >= cs.hopCycle) this.hopTimer -= cs.hopCycle;
    const t = this.hopTimer / cs.hopCycle;

    if (t < cs.hopMoveRatio) {
      const push = Math.sin((t / cs.hopMoveRatio) * Math.PI);   // 도약 중간에 가장 빠르다
      const spd = this.stats.speed * (this.chasing ? 1 : 0.55) * push * 1.6;
      this.moveWithCollision(Math.cos(this.dir) * spd * dt, Math.sin(this.dir) * spd * dt);
    }

    this.touchPlayer(player, CONFIG.slime.contactCooldown);
  }

  drawBody(ctx, sx, sy) {
    const cs = CONFIG.slime;
    const t = this.hopTimer / cs.hopCycle;

    // 도약하면 위로 뜨면서 세로로 늘어나고, 착지하면 납작해진다
    let yOff = 0, stretchY = 1, stretchX = 1;
    if (t < cs.hopMoveRatio) {
      const k = Math.sin((t / cs.hopMoveRatio) * Math.PI);
      yOff = -k * 5 * this.scale;
      stretchY = 1 + k * 0.14;
      stretchX = 1 - k * 0.10;
    } else {
      const k = Math.max(0, 1 - ((t - cs.hopMoveRatio) / (1 - cs.hopMoveRatio)) * 4);
      stretchY = 1 - 0.20 * k;
      stretchX = 1 + 0.16 * k;
    }

    // 그림자 — 떠 있을수록 작아진다
    const shadowScale = 1 - (-yOff / (6 * this.scale)) * 0.35;
    this.drawShadow(ctx, sx, sy, 5.5 * this.scale * shadowScale);

    // 몸 — 늘어난 크기 그대로 새로 그린다 (Creatures.slime)
    const w = Math.round(14 * this.scale * stretchX * this.hitSX);
    const h = Math.round(12 * this.scale * stretchY * this.hitSY);
    const top = Creatures.blit(ctx, Creatures.slime(w, h, this.hurtFlash > 0), sx, sy, Math.round(-yOff));
    this.drawLabel(ctx, sx, top + 2);
  }
}

'use strict';

/* 버섯 — 뿌리내린 포탑. 절대 움직이지 않는 대신 포자를 쏜다.
   슬라임처럼 쫓아오지 않으므로 "빨리 붙어서 없앨까 / 사거리 밖으로 돌아갈까"를 고르게 된다.

   행동 순서
     대기 → (플레이어가 감지 범위 안) 재는 중 → 부풀어오름(예고) → 발사 → 다시 대기
   부풀어오르는 동안 몸이 커지고 느낌표가 뜨므로, 보고 피할 수 있다. */

class Mushroom extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.mushroom.levels[level - 1]);
    this.TYPE = 'mushroom';
    this.cooldown = Util.rand(0.4, CONFIG.mushroom.levels[level - 1].interval);
    this.windup = 0;        // 0보다 크면 부풀어오르는 중
    this.aim = 0;           // 발사 방향 (예고 시작 때 정해서 고정한다)
    this.puff = 0;          // 쏜 직후 몸이 움찔하는 연출
  }

  // 뿌리내린 몬스터라 넉백으로 밀려나지 않는다 — 대신 잠깐 움찔한다
  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.7, y: this.y + 1, w: r * 1.4, h: 5 };
  }

  think(dt, player) {
    const cfg = CONFIG.mushroom;
    this.puff = Math.max(0, this.puff - dt);

    const dist = this.distanceTo(player);
    const inRange = dist < this.stats.detect;

    if (this.windup > 0) {
      // 예고 중 — 조준은 이미 고정되어 있어서 옆으로 피하면 빗나간다
      this.windup -= dt;
      if (this.windup <= 0) this.fire();
    } else if (inRange) {
      this.cooldown -= dt;
      if (this.cooldown <= 0) {
        this.windup = cfg.windup;
        // 조준은 포자가 나가는 위치(y-2) 기준으로 잰다
        this.aim = Math.atan2(player.y - (this.y - 2), player.x - this.x);
        this.cooldown = this.stats.interval;
      }
    }

    // 붙어 있으면 몸통 피해도 준다 (붙어서 때리는 게 공짜는 아니게)
    this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * 0.6));
  }

  fire() {
    const cfg = CONFIG.mushroom;
    const shots = this.stats.shots;
    this.puff = 0.18;
    for (let i = 0; i < shots; i++) {
      // 가운데를 기준으로 좌우 대칭으로 퍼뜨린다
      const offset = (i - (shots - 1) / 2) * cfg.spread;
      Projectiles.spawn(this.x, this.y - 2, this.aim + offset, {
        speed: cfg.sporeSpeed,
        damage: this.stats.atk,
        type: 'mushroom',
        life: cfg.sporeLife,
      });
    }
    const pal = this.palette;
    FX.burst(this.x, this.y - 2, 8, [pal.n, '#ffffff'], { speed: 30, life: 0.3, gravity: 10, size: 1 });
  }

  // 넉백을 거의 무시한다 (뿌리내린 몬스터)
  takeHit(damage, angle, crit, player) {
    super.takeHit(damage, angle, crit, player);
    this.kx *= 0.25;
    this.ky *= 0.25;
  }

  drawBody(ctx, sx, sy) {
    const cfg = CONFIG.mushroom;
    // 예고 중에는 부풀고, 쏜 직후에는 납작해진다
    let grow = 1;
    if (this.windup > 0) grow = 1 + (1 - this.windup / cfg.windup) * 0.16;
    else if (this.puff > 0) grow = 1 - (this.puff / 0.18) * 0.12;

    this.drawShadow(ctx, sx, sy, 5.5 * this.scale);
    const cv = Creatures.mushroom(Math.round(15 * this.scale * this.hitSX), grow, this.hurtFlash > 0);
    const top = Creatures.blit(ctx, cv, sx, sy);
    if (this.windup > 0) this.drawWarning(ctx, sx, top + 2, 1 - this.windup / cfg.windup);
    this.drawLabel(ctx, sx, top + 2);
  }
}

// ── js/wolf.js
'use strict';

/* 늑대 — 빠르게 붙었다가 웅크린 뒤 직선으로 돌진한다.
   슬라임이 "계속 밀려오는 압박"이라면 늑대는 "예고를 보고 피하는" 몬스터다.

   상태 흐름
     배회 → (감지) 추적 → (사거리 안) 웅크림(예고) → 돌진 → 빈틈 → 추적
   웅크리는 동안 몸이 낮아지고 느낌표가 뜬다. 돌진은 정해진 방향으로만 가므로
   옆으로 비키면 빗나가고, 돌진 뒤 빈틈에 때리는 것이 정석이다. */

class Wolf extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, CONFIG.wolf.levels[level - 1]);
    this.TYPE = 'wolf';
    this.state = 'wander';   // wander | chase | windup | lunge | recover
    this.timer = Util.rand(0.5, 2.0);
    this.facing = 1;         // 1 = 오른쪽, -1 = 왼쪽
    this.stepTime = 0;       // 다리 애니메이션
    this.lungeDir = 0;
  }

  think(dt, player) {
    const cfg = CONFIG.wolf;
    const dist = this.distanceTo(player);
    this.timer -= dt;

    switch (this.state) {
      case 'wander':
        this.stepTime += dt * 0.6;
        if (this.timer <= 0) {
          this.dir = Math.random() * Math.PI * 2;
          this.timer = Util.rand(1.2, 3.0);
        }
        this.walk(this.dir, this.stats.speed * 0.35, dt);
        if (dist < this.stats.detect) this.state = 'chase';
        break;

      case 'chase': {
        this.stepTime += dt * 1.6;
        this.dir = Math.atan2(player.y - this.y, player.x - this.x);
        this.walk(this.dir, this.stats.speed, dt);
        if (dist > this.stats.detect * 1.3) {          // 너무 멀어지면 포기한다
          this.state = 'wander';
          this.timer = Util.rand(0.6, 1.6);
        } else if (dist < cfg.lungeRange) {
          this.state = 'windup';
          this.timer = cfg.windup;
          this.lungeDir = this.dir;                     // 여기서 방향이 고정된다
          Sound.play('growl');
        }
        break;
      }

      case 'windup':
        // 웅크리고 멈춘다 — 이때 옆으로 비키면 돌진이 빗나간다
        if (this.timer <= 0) {
          this.state = 'lunge';
          this.timer = cfg.lungeTime;
        }
        break;

      case 'lunge':
        this.stepTime += dt * 3;
        this.walk(this.lungeDir, this.stats.lunge, dt);
        if (this.timer <= 0) {
          this.state = 'recover';
          this.timer = cfg.recover;
        }
        break;

      case 'recover':
        // 숨을 고르는 빈틈 — 때리기 가장 좋은 순간
        if (this.timer <= 0) this.state = 'chase';
        break;
    }

    this.touchPlayer(player, cfg.contactCooldown);
  }

  walk(angle, speed, dt) {
    this.facing = Math.cos(angle) >= 0 ? 1 : -1;
    this.moveWithCollision(Math.cos(angle) * speed * dt, Math.sin(angle) * speed * dt);
  }

  // 돌진 중 벽에 부딪히면 그대로 멈추고 빈틈에 들어간다
  onBlocked() {
    if (this.state !== 'lunge') return;
    this.state = 'recover';
    this.timer = CONFIG.wolf.recover;
    FX.burst(this.x, this.y, 6, ['#cbbfa2', '#8f7854'], { speed: 40, life: 0.3, size: 1 });
  }

  // 맞으면 웅크리던 동작이 끊긴다 (선제공격이 통한다)
  onHit() {
    if (this.state === 'windup') {
      this.state = 'recover';
      this.timer = CONFIG.wolf.recover * 0.6;
    }
  }

  drawBody(ctx, sx, sy) {
    // 걸음 네 장 — 딛기·지나기·딛기·지나기. 웅크리거나 숨 고를 땐 멈춘다
    const still = this.state === 'windup' || this.state === 'recover';
    const frame = still ? 0 : Math.floor(this.stepTime * 8) % 4;
    const pose = this.state === 'windup' ? 'crouch' : (this.state === 'lunge' ? 'lunge' : 'walk');
    const sxScale = this.state === 'lunge' ? 1.12 : (this.state === 'windup' ? 1.04 : 1);

    const W = Math.round(22 * this.scale * sxScale * this.hitSX);
    const H = Math.round(16 * this.scale * this.hitSY);
    let cv = Creatures.wolf(W, H, frame, pose, this.hurtFlash > 0);
    if (this.facing < 0) cv = Creatures.flip(cv);

    this.drawShadow(ctx, sx, sy, 6.5 * this.scale);
    const top = Creatures.blit(ctx, cv, sx, sy) + 2;
    if (this.state === 'windup') this.drawWarning(ctx, sx, top, 1 - this.timer / CONFIG.wolf.windup);
    this.drawLabel(ctx, sx, top);
  }
}

   찔리면 몇 초간 독이 올라 체력이 조금씩 준다 — 한 방은 늑대보다 약하지만 물러나서 회복하기 전까지 계속 갉아먹는다.

   상태 흐름
     배회 → (감지) 추적 → (사거리 안) 꼬리 치켜듦(예고) → 찌르기(짧게 앞으로) → 빈틈 → 추적
   예고 동안 느낌표가 뜨고 몸이 뒤로 살짝 물러나므로, 옆으로 비키면 빗나간다. */

class Scorpion extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, enemyStatsAt(CONFIG.scorpion.levels, level));
    this.TYPE = 'scorpion';
    this.state = 'wander';   // wander | chase | windup | sting | recover
    this.timer = Util.rand(0.5, 2.0);
    this.facing = 1;
    this.stepTime = 0;
    this.stingDir = 0;
  }

  think(dt, player) {
    const cfg = CONFIG.scorpion;
    const dist = this.distanceTo(player);
    this.timer -= dt;

    switch (this.state) {
      case 'wander':
        this.stepTime += dt * 0.6;
        if (this.timer <= 0) {
          this.dir = Math.random() * Math.PI * 2;
          this.timer = Util.rand(1.2, 3.0);
        }
        this.walk(this.dir, this.stats.speed * 0.35, dt);
        if (dist < this.stats.detect) this.state = 'chase';
        break;

      case 'chase':
        this.stepTime += dt * 1.6;
        this.dir = Math.atan2(player.y - this.y, player.x - this.x);
        this.walk(this.dir, this.stats.speed, dt);
        if (dist > this.stats.detect * 1.3) {
          this.state = 'wander';
          this.timer = Util.rand(0.6, 1.6);
        } else if (dist < cfg.stingRange) {
          this.state = 'windup';
          this.timer = cfg.windup;
          this.stingDir = this.dir;
        }
        break;

      case 'windup':
        // 꼬리를 치켜들고 멈춘다 — 이때 비키면 빗나간다
        if (this.timer <= 0) {
          this.state = 'sting';
          this.timer = cfg.stingTime;
          this.stung = false;

        break;

        // 찌르는 동안 닿으면 피해 + 독
        if (!this.stung && this.touchPlayer(player, cfg.contactCooldown)) {

        if (this.timer <= 0) {

          this.timer = cfg.recover;

      case 'recover':

    if (this.state !== 'sting') this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * 0.7));

    const pose = this.state === 'windup' ? 'windup' : (this.state === 'sting' ? 'sting' : 'walk');

    // 예고 때는 뒤로 움츠리고, 찌를 때는 앞으로 길어진다 — 크기를 바꿔 새로 그린다
    let sxScale = 1, syScale = 1;
    if (this.state === 'windup') { sxScale = 0.92; syScale = 1.06; }
    else if (this.state === 'sting') { sxScale = 1.12; syScale = 0.94; }

    const W = Math.round(24 * 0.85 * this.scale * sxScale * this.hitSX);
    const H = Math.round(17 * 0.85 * this.scale * syScale * this.hitSY);
    let cv = Creatures.scorpion(W, H, frame, pose, this.hurtFlash > 0);
    if (this.facing < 0) cv = Creatures.flip(cv);

    this.drawShadow(ctx, sx, sy, 7 * this.scale);
    const top = Creatures.blit(ctx, cv, sx, sy) + 2;
    if (this.state === 'windup') this.drawWarning(ctx, sx, top, 1 - this.timer / cfg.windup);
    this.drawLabel(ctx, sx, top);
  }

    this.windup = 0;
    this.puff = 0;
    this.volley = 0;      // 몇 번째 발사인가 — 홀수 번은 반 칸 돌려 쏜다
  }

  think(dt, player) {
    const cfg = CONFIG.cactus;
    this.puff = Math.max(0, this.puff - dt);
    const inRange = this.distanceTo(player) < this.stats.detect;

    if (this.windup > 0) {
      this.windup -= dt;
      if (this.windup <= 0) this.fire();
    } else if (inRange) {
      this.cooldown -= dt;
      if (this.cooldown <= 0) {
        this.windup = cfg.windup;
        this.cooldown = this.stats.interval;
      }
    }
    // 몸에 닿으면 가시에 찔린다
    this.touchPlayer(player, cfg.contactCooldown, Math.max(1, Math.round(this.stats.atk * cfg.thornMult)));
  }

  fire() {
    const cfg = CONFIG.cactus;
    const n = cfg.needles;
    const offset = (this.volley++ % 2) * (Math.PI / n);   // 번갈아 반 칸씩 돌린다
    this.puff = 0.18;
    for (let i = 0; i < n; i++) {
      Projectiles.spawn(this.x, this.y - 4, offset + (i / n) * Math.PI * 2, {
        speed: cfg.needleSpeed,
        damage: this.stats.atk,
        type: 'cactus',
        life: cfg.needleLife,
        kind: 'needle',
      });
    }
    const pal = this.palette;
    FX.burst(this.x, this.y - 4, 8, [pal.n, '#ffffff'], { speed: 30, life: 0.3, gravity: 10, size: 1 });
  }

  // 뿌리내린 몬스터 — 넉백을 거의 무시한다
  takeHit(damage, angle, crit, player) {
    super.takeHit(damage, angle, crit, player);
    this.kx *= 0.2;
    this.ky *= 0.2;
  }

  drawBody(ctx, sx, sy) {
    const cfg = CONFIG.cactus;
    let grow = 1;
    if (this.windup > 0) grow = 1 + (1 - this.windup / cfg.windup) * 0.14;
    else if (this.puff > 0) grow = 1 - (this.puff / 0.18) * 0.1;

    this.drawShadow(ctx, sx, sy, 5.5 * this.scale);
    const cv = Creatures.cactusMob(Math.round(16 * this.scale * this.hitSX), grow, this.hurtFlash > 0);
    const top = Creatures.blit(ctx, cv, sx, sy) + 3;
    if (this.windup > 0) this.drawWarning(ctx, sx, top, 1 - this.windup / cfg.windup);
    this.drawLabel(ctx, sx, top);
  }
}

// ── js/sandworm.js
'use strict';

/* 모래벌레 — 땅속으로 다가와 발밑에서 솟구친다.
   땅속에 있을 때는 모래 언덕만 보이고 때릴 수 없다. 언덕이 멈추고 들썩이면(예고) 곧 솟구치므로
   그 자리에서 비켜야 한다. 솟구친 뒤 잠깐 밖에 나와 느릿느릿 기어오는데, 그때가 때릴 틈이다.

   상태 흐름
     땅속(추적) → 들썩임(예고) → 솟구침(범위 피해) → 밖에 나옴(느림, 맞는다) → 다시 파고듦 → 땅속 */

class Sandworm extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, enemyStatsAt(CONFIG.sandworm.levels, level));
    this.TYPE = 'sandworm';
    this.state = 'burrowed';   // burrowed | rise | surfaced | burrow
    this.timer = 0;
    this.chaseTime = 0;
    this.wanderTimer = 0;
    this.shake = 0;
    this.sandTimer = 0;
  }

  get underground() { return this.state === 'burrowed' || this.state === 'rise' || this.state === 'burrow'; }

  // 땅속에서는 어디를 베어도 닿지 않는다
  hitDistance(px, py) {
    if (this.underground) return Infinity;
    return Util.dist(px, py, this.x, this.y) - this.radius;
  }

  get hurtBox() {
    if (this.underground) return { x: -9999, y: -9999, w: 0, h: 0 };
    const r = this.radius;
    return { x: this.x - r, y: this.y - r * 1.6, w: r * 2, h: r * 2.2 };
  }

  think(dt, player) {
    const cfg = CONFIG.sandworm;
    const dist = this.distanceTo(player);
    this.timer -= dt;
    this.sandTimer -= dt;

    switch (this.state) {
      case 'burrowed': {
        const chasing = dist < this.stats.detect;
        if (chasing) {
          this.dir = Math.atan2(player.y - this.y, player.x - this.x);
          this.chaseTime += dt;
          this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * dt, Math.sin(this.dir) * this.stats.speed * dt);
        } else {
          this.chaseTime = 0;
          this.wanderTimer -= dt;
          if (this.wanderTimer <= 0) { this.dir = Math.random() * Math.PI * 2; this.wanderTimer = Util.rand(1.5, 3.5); }
          this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * 0.3 * dt, Math.sin(this.dir) * this.stats.speed * 0.3 * dt);
        }
        // 지나간 자리에 모래가 튄다
        if (this.sandTimer <= 0) {
          this.sandTimer = 0.12;
          FX.burst(this.x, this.y + 3, 2, ['#e6d191', '#c9b06e'], { speed: 14, life: 0.35, gravity: 40, size: 1 });
        }
        if (chasing && (dist < cfg.riseRange || this.chaseTime > cfg.chaseMax)) {
          this.state = 'rise';
          this.timer = cfg.windup;
          this.chaseTime = 0;
        }
        break;
      }

      case 'rise':
        // 들썩이며 멈춰 있다 — 비킬 시간
        this.shake = (1 - this.timer / cfg.windup) * 2;
        if (this.timer <= 0) this.erupt(player);
        break;

      case 'surfaced':
        // 밖에서는 아주 느리게 기어온다. 이때가 때릴 틈
        if (dist < this.stats.detect) {
          this.dir = Math.atan2(player.y - this.y, player.x - this.x);
          this.moveWithCollision(Math.cos(this.dir) * cfg.surfaceSpeed * dt, Math.sin(this.dir) * cfg.surfaceSpeed * dt);
        }
        this.touchPlayer(player, cfg.contactCooldown);
        if (this.timer <= 0) {
          this.state = 'burrow';
          this.timer = cfg.burrowTime;
          FX.burst(this.x, this.y + 4, 10, ['#e6d191', '#c9b06e'], { speed: 30, life: 0.4, gravity: 60, size: 1 });
        }
        break;

      case 'burrow':
        if (this.timer <= 0) this.state = 'burrowed';
        break;
    }
  }

  // 솟구침 — 주변 범위에 한 번 피해를 주고 밀어낸다
  erupt(player) {
    const cfg = CONFIG.sandworm;
    this.state = 'surfaced';
    this.timer = cfg.surfaced;
    this.shake = 0;
    FX.burst(this.x, this.y + 2, 26, ['#e6d191', '#d9c27f', '#9a8560'], { speed: 90, life: 0.6, gravity: 80 });
    FX.ring(this.x, this.y + 2, cfg.eruptRadius, '#e6d191');
    FX.addShake(4);
    Sound.play('slam');
    if (!player.dead && Util.dist(this.x, this.y, player.x, player.y) < cfg.eruptRadius + 4) {
      player.takeDamage(Math.max(1, Math.round(this.stats.atk * cfg.eruptMult)), this.x, this.y);
    }
  }

  // 솟구칠 자리를 붉게 — 보스처럼 바닥에 미리 그린다
  drawGround(ctx, cam) {
    if (this.state !== 'rise') return;
    const r = CONFIG.sandworm.eruptRadius;
    const sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y + 3);
    const k = 1 - this.timer / CONFIG.sandworm.windup;
    ctx.globalAlpha = 0.28 + k * 0.2;
    fillCircle(ctx, sx, sy, r, '#ff3b3b');
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
  }

  drawBody(ctx, sx, sy) {
    const cfg = CONFIG.sandworm;
    if (this.underground) {
      // 모래 언덕 — 예고 때는 좌우로 들썩이고 조금 부푼다
      const jitter = this.state === 'rise' ? Math.round(Math.sin(World.time * 40) * this.shake) : 0;
      const grow = this.state === 'rise' ? 1 + (1 - this.timer / cfg.windup) * 0.3 : (this.state === 'burrow' ? 0.8 : 1);
      const cv = Creatures.wormMound(Math.round(16 * this.scale * grow));
      const top = Creatures.blit(ctx, cv, sx + jitter, sy);
      if (this.state === 'rise') this.drawWarning(ctx, sx, top, 1 - this.timer / cfg.windup);
      UI.drawText(ctx, 'L' + this.level, sx - 4, top - 5, this.labelColor, false);
      return;
    }
    // 밖에 나온 몸통 — 막 솟았을 땐 위로 늘어났다가 자리를 잡는다
    const age = Math.max(0, cfg.surfaced - this.timer);
    const stretch = age < 0.25 ? 1 + (0.25 - age) * 1.2 : 1;
    const W = Math.round(14 * this.scale * this.hitSX), H = Math.round(21 * this.scale * stretch * this.hitSY);
    this.drawShadow(ctx, sx, sy, 6 * this.scale);
    const top = Creatures.blit(ctx, Creatures.worm(W, H, this.hurtFlash > 0), sx, sy);
    this.drawLabel(ctx, sx, top + 2);
  }
}

// ── js/wisp.js
'use strict';

/* 서리 망령 — **벽을 통과해서 온다** (로드맵 12주차).

   지금까지 도망치는 법은 하나였다: 나무 뒤로 돌아 들어가면 몬스터는 길을 잃고 벽에 걸린다.
   망령은 그게 안 통하는 첫 몬스터다. 나무도 바위도 그냥 지나온다 —
   **설원에서는 거리를 벌려 달아나는 수밖에 없다.**

   대신 느리고 물렁하다. 멀리서 보고 달리면 떼어낼 수 있고, 붙으면 얼어붙어 못 달린다.
   벽 안에 있을 때는 흐릿해지지만 사라지지는 않는다 — 어디쯤 오는지는 늘 보여야 한다. */

class Wisp extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, enemyStatsAt(CONFIG.wisp.levels, level));
    this.TYPE = 'wisp';
    this.bob = Math.random() * Math.PI * 2;   // 둥둥 뜨는 위상 — 서로 다른 박자로
    this.wanderTimer = Util.rand(0.5, 2.5);
    this.inWall = false;
  }

  // 벽을 통과하므로 끼일 일이 없다 (빠져나오려다 오히려 튕긴다)
  unstick() { }

  /* 벽을 무시하고 그대로 간다 — 이 한 줄이 이 몬스터의 전부다.
     다만 **맵 밖으로는 못 나간다** (나가면 영영 안 돌아온다). */
  moveWithCollision(dx, dy) {
    const slow = Status.speedScale(this);
    this.x = Util.clamp(this.x + dx * slow, 8, World.w - 8);
    this.y = Util.clamp(this.y + dy * slow, 8, World.h - 8);
  }

  think(dt, player) {
    const cfg = CONFIG.wisp;
    this.bob += dt * cfg.bobSpeed;
    const dist = this.distanceTo(player);

    if (dist < this.stats.detect) {
      // 한 번 본 뒤로는 똑바로 온다. 돌아갈 길이 없으므로 머뭇거릴 것도 없다
      this.dir = Math.atan2(player.y - this.y, player.x - this.x);
      this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * dt, Math.sin(this.dir) * this.stats.speed * dt);
    } else {
      this.wanderTimer -= dt;
      if (this.wanderTimer <= 0) {
        this.dir = Math.random() * Math.PI * 2;
        this.wanderTimer = Util.rand(1.5, 3.5);
      }
      this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * 0.4 * dt, Math.sin(this.dir) * this.stats.speed * 0.4 * dt);
    }

    // 닿으면 언다 — 얼면 못 달리니, 망령에게 붙잡히는 것이 설원에서 가장 위험하다
    if (this.touchPlayer(player, cfg.contactCooldown) && Math.random() < cfg.freezeChance) {
      Status.apply(player, 'freeze', this.stats.atk, this);
    }

    // 지나온 자리에 푸른 불티가 남는다
    if (Math.random() < 0.12) {
      FX.burst(this.x + Util.rand(-3, 3), this.y - Util.rand(0, 6), 1, ['#4fb8e0', '#d8f6ff'],
        { speed: 10, life: 0.5, gravity: -20, size: 1 });
    }
  }

  drawBody(ctx, sx, sy) {
    const cfg = CONFIG.wisp;
    const lift = Math.round(Math.sin(this.bob) * cfg.bobAmp) + 3;
    const frame = Math.floor(this.bob * 2) % 4;

    // 발이 없으므로 그림자는 작고 흐리게 — 땅에 닿아 있지 않다는 표시
    fillEllipse(ctx, sx + 1, sy + 6, 3.5 * this.scale, 1.5, 'rgba(10,12,20,0.18)');

    // 벽(나무·바위) 안에 들어가 있으면 흐려진다. 사라지지는 않는다
    this.inWall = World.blocked({ x: this.x - 3, y: this.y, w: 6, h: 4 });
    ctx.save();
    if (this.inWall) ctx.globalAlpha = cfg.wallAlpha;
    const cv = Creatures.wisp(Math.round(16 * this.scale * this.hitSX), frame, this.hurtFlash > 0);
    const top = Creatures.blit(ctx, cv, sx, sy, lift);
    ctx.restore();
    this.drawLabel(ctx, sx, top + 2);
  }
}

  <script>
// ── js/yeti.js
'use strict';

/* 설인 — 눈덩이를 **포물선으로** 던진다 (로드맵 12주차).

   버섯의 포자와 선인장의 가시는 둘 다 땅을 따라 곧게 날아온다.
   눈덩이는 하늘로 떠서 **머리 위를 넘어온다** — 옆으로 비켜도 안 되고,
   떨어질 자리를 보고 그 자리에서 빠져야 한다. 날아가는 동안 바닥에 그림자가 따라가므로
   어디 떨어질지는 내내 보인다.

   떨어진 자리는 잠깐 **빙판**이 된다. 밟으면 느려지므로, 설인은 던질수록
   내가 설 자리를 좁혀 온다 — 이게 이 몬스터의 진짜 수법이다.

   상태 흐름
     배회 → (감지) 간격 유지 → 치켜듦(예고) → 던짐 → 다시 간격 유지 */

class Yeti extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, enemyStatsAt(CONFIG.yeti.levels, level));
    this.TYPE = 'yeti';
    this.state = 'wander';     // wander | keep | wind | throw
    this.timer = Util.rand(0.5, 2.0);
    this.cool = Util.rand(0.5, 1.5);
    this.facing = 1;
    this.stepTime = 0;
    this.balls = [];           // 날아가는 눈덩이 {x,y,tx,ty,t,time}
    this.slicks = [];          // 빙판 {x,y,life}
  }

  think(dt, player) {
    const cfg = CONFIG.yeti;
    const dist = this.distanceTo(player);
    this.timer -= dt;
    this.cool -= dt;
    this.updateBalls(dt, player);
    this.updateSlicks(dt, player);

    switch (this.state) {
      case 'wander':
        this.stepTime += dt * 0.6;
        if (this.timer <= 0) { this.dir = Math.random() * Math.PI * 2; this.timer = Util.rand(1.2, 3.0); }
        this.walk(this.dir, this.stats.speed * 0.35, dt);
        if (dist < this.stats.detect) this.state = 'keep';
        break;

      case 'keep': {
        this.stepTime += dt * 1.3;
        const to = Math.atan2(player.y - this.y, player.x - this.x);
        // 너무 가까우면 물러나고, 너무 멀면 다가간다 — 던지기 좋은 거리를 지킨다
        if (dist < cfg.keepDistance * 0.75) this.walk(to + Math.PI, this.stats.speed * 0.9, dt);
        else if (dist > cfg.keepDistance * 1.25) this.walk(to, this.stats.speed, dt);
        else this.facing = Math.cos(to) >= 0 ? 1 : -1;

        if (dist > this.stats.detect * 1.4) { this.state = 'wander'; this.timer = Util.rand(0.6, 1.6); }
        else if (this.cool <= 0 && dist < cfg.throwRange) {
          this.state = 'wind';
          this.timer = cfg.windup;
          Sound.play('growl');
        }
        break;
      }

      case 'wind':
        // 치켜드는 동안 멈춘다 — 이때 달리기 시작하면 던지는 자리를 벗어날 수 있다
        this.facing = player.x >= this.x ? 1 : -1;
        if (this.timer <= 0) {
          this.throwBall(player);
          this.state = 'keep';
          this.cool = this.stats.interval || 2.4;
        }
        break;
    }

    this.touchPlayer(player, cfg.contactCooldown);
  }

  walk(angle, speed, dt) {
    this.facing = Math.cos(angle) >= 0 ? 1 : -1;
    this.moveWithCollision(Math.cos(angle) * speed * dt, Math.sin(angle) * speed * dt);
  }

  // 지금 서 있는 자리를 노리고 던진다 (던진 뒤에 움직이면 빗나간다)
  throwBall(player) {
    const cfg = CONFIG.yeti;
    this.balls.push({
      x: this.x, y: this.y - 10,
      sx: this.x, sy: this.y - 10,
      tx: player.x, ty: player.y,
      t: 0, time: cfg.ballTime,
    });
    Sound.play('swing');
  }

  updateBalls(dt, player) {
    const cfg = CONFIG.yeti;
    for (let i = this.balls.length - 1; i >= 0; i--) {
      const b = this.balls[i];
      b.t += dt;
      const k = Math.min(1, b.t / b.time);
      b.x = Util.lerp(b.sx, b.tx, k);
      b.y = Util.lerp(b.sy, b.ty, k);
      if (k < 1) continue;

      // 착탄 — 범위 안이면 맞고, 그 자리는 빙판이 된다
      this.balls.splice(i, 1);
      FX.burst(b.tx, b.ty, 16, ['#eaf4fa', '#9fd4e4', '#ffffff'], { speed: 70, life: 0.6, gravity: 30 });
      FX.ring(b.tx, b.ty + 2, cfg.ballRadius, '#d8f6ff');
      Sound.play('hit');
      if (!player.dead && Util.dist(player.x, player.y, b.tx, b.ty) < cfg.ballRadius) {
        player.takeDamage(Math.round(this.stats.atk * cfg.damageMult), b.tx, b.ty);
      }
      this.slicks.push({ x: b.tx, y: b.ty, life: cfg.slickTime });
    }
  }

  /* 빙판 — 밟고 있으면 느려진다. 플레이어의 이동 배수에 끼어드는 자리가
     Player 에 이미 있으므로(slickSlow) 여기서는 '지금 밟고 있다'만 알려준다. */
  updateSlicks(dt, player) {
    const cfg = CONFIG.yeti;
    for (let i = this.slicks.length - 1; i >= 0; i--) {
      const s = this.slicks[i];
      s.life -= dt;
      if (s.life <= 0) { this.slicks.splice(i, 1); continue; }
      if (!player.dead && Util.dist(player.x, player.y, s.x, s.y) < cfg.ballRadius) player.onSlick = cfg.slickSlow;
    }
  }

  // 빙판과 날아가는 눈덩이의 그림자는 바닥에, 캐릭터보다 아래에 그린다
  drawGround(ctx, cam) {
    const cfg = CONFIG.yeti;
    for (const s of this.slicks) {
      const a = Math.min(1, s.life / 0.8) * 0.45;
      ctx.globalAlpha = a;
      fillCircle(ctx, Math.round(s.x - cam.x), Math.round(s.y + 2 - cam.y), cfg.ballRadius, '#bfe8ff');
      ctx.globalAlpha = a * 1.6;
      ctx.fillStyle = '#eaf9ff';
      const r = cfg.ballRadius;
      for (let i = 0; i < 18; i++) {
        const ang = (i / 18) * Math.PI * 2;
        ctx.fillRect(Math.round(s.x - cam.x + Math.cos(ang) * r), Math.round(s.y + 2 - cam.y + Math.sin(ang) * r), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
    // 떨어질 자리 — 그림자가 점점 또렷해져서 '곧 떨어진다'가 보인다
    for (const b of this.balls) {
      const k = Math.min(1, b.t / b.time);
      ctx.globalAlpha = 0.2 + k * 0.35;
      fillCircle(ctx, Math.round(b.tx - cam.x), Math.round(b.ty + 2 - cam.y), cfg.ballRadius * (0.5 + k * 0.5), '#4a6a7a');
      ctx.globalAlpha = 1;
    }
  }

  drawBody(ctx, sx, sy) {
    const frame = this.state === 'wind' ? 0 : Math.floor(this.stepTime * 6) % 4;
    const pose = this.state === 'wind' ? 'wind' : 'walk';

// ── js/golem.js
'use strict';

/* 얼음 골렘 — 느리고 단단하다 (로드맵 12주차).

   설원의 '벽'. 걸음이 느려서 달아나기는 쉽지만, 체력이 두껍고 받는 피해도 줄어들어
   **잡는 데 시간이 걸린다.** 그 시간 동안 망령과 설인이 모여들기 때문에,
   골렘은 혼자 위험한 게 아니라 **딴 놈들과 같이 있을 때** 위험하다.

   붙으면 땅을 내리쳐 주위를 때린다 (예고가 길어서 보고 빠질 수 있다).
   그리고 죽을 때 사방으로 얼음 파편이 터지므로, 마지막 일격을 넣고 물러서야 한다. */

class Golem extends Enemy {
  constructor(x, y, level) {
    super(x, y, level, enemyStatsAt(CONFIG.golem.levels, level));
    this.TYPE = 'golem';
    this.state = 'wander';     // wander | chase | slam | recover
    this.timer = Util.rand(0.5, 2.0);
    this.cool = Util.rand(0.5, 2.0);
    this.stepTime = 0;
  }

  // 얼음 껍질 — 받는 피해가 줄어든다 (상태이상은 그대로 걸린다)
  takeHit(damage, angle, crit, player, knockScale) {
    super.takeHit(Math.max(1, Math.round(damage * CONFIG.golem.armor)), angle, crit, player, knockScale);
  }

  think(dt, player) {
    const cfg = CONFIG.golem;
    const dist = this.distanceTo(player);
    this.timer -= dt;
    this.cool -= dt;

    switch (this.state) {
      case 'wander':
        this.stepTime += dt * 0.5;
        if (this.timer <= 0) { this.dir = Math.random() * Math.PI * 2; this.timer = Util.rand(1.5, 3.5); }
        this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * 0.4 * dt, Math.sin(this.dir) * this.stats.speed * 0.4 * dt);
        if (dist < this.stats.detect) this.state = 'chase';
        break;

      case 'chase':
        this.stepTime += dt * 1.1;
        this.dir = Math.atan2(player.y - this.y, player.x - this.x);
        this.moveWithCollision(Math.cos(this.dir) * this.stats.speed * dt, Math.sin(this.dir) * this.stats.speed * dt);
        if (dist > this.stats.detect * 1.4) { this.state = 'wander'; this.timer = Util.rand(0.8, 1.8); }
        else if (dist < cfg.slam.range && this.cool <= 0) {
          this.state = 'slam';
          this.timer = cfg.slam.windup;
          Sound.play('growl');
        }
        break;

      case 'slam':
        // 팔을 들어올린 채 멈춘다 — 예고가 길어서 보고 빠져나갈 수 있다
        if (this.timer <= 0) {
          this.doSlam(player);
          this.state = 'recover';
          this.timer = 0.6;
          this.cool = cfg.slam.cooldown;
        }
        break;

      case 'recover':
        if (this.timer <= 0) this.state = 'chase';
        break;
    }

    this.touchPlayer(player, cfg.contactCooldown);
  }

  doSlam(player) {
    const cfg = CONFIG.golem.slam;
    FX.addShake(4);
    FX.ring(this.x, this.y + 2, cfg.radius, '#d8f6ff');
    FX.burst(this.x, this.y + 2, 20, ['#7fd4e8', '#e8fbff', '#ffffff'], { speed: 95, life: 0.6, gravity: 40 });
    Sound.play('slam');
    if (!player.dead && Util.dist(player.x, player.y, this.x, this.y) < cfg.radius) {
      player.takeDamage(Math.round(this.stats.atk * cfg.damageMult), this.x, this.y);
    }
  }

  // 죽을 때 사방으로 얼음 파편 — 마지막 일격을 넣고 물러서게 만든다
  die(player) {
    const cfg = CONFIG.golem.shards;
    super.die(player);
    const dmg = Math.max(1, Math.round(this.stats.atk * cfg.damageMult));
    for (let i = 0; i < cfg.count; i++) {
      const a = (i / cfg.count) * Math.PI * 2 + Math.random() * 0.3;
      Projectiles.spawn(this.x, this.y - 6, a,
        { speed: cfg.speed, damage: dmg, life: cfg.life, type: 'golem', kind: 'needle' });
    }
    FX.burst(this.x, this.y - 4, 28, ['#7fd4e8', '#e8fbff', '#ffffff'], { speed: 110, life: 0.8 });
  }

  // 내리치기 예고 — 바닥에 범위를 먼저 보여준다
  drawGround(ctx, cam) {
    if (this.state !== 'slam') return;
    const cfg = CONFIG.golem.slam;
    const k = 1 - Math.max(0, this.timer) / cfg.windup;
    ctx.globalAlpha = 0.16 + k * 0.22;
    fillCircle(ctx, Math.round(this.x - cam.x), Math.round(this.y + 2 - cam.y), cfg.radius, '#5fc8e8');
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = k > 0.75 ? '#ffffff' : '#bfe8ff';
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2;
      ctx.fillRect(Math.round(this.x - cam.x + Math.cos(a) * cfg.radius), Math.round(this.y + 2 - cam.y + Math.sin(a) * cfg.radius), 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  drawBody(ctx, sx, sy) {
    const moving = this.state === 'chase' || this.state === 'wander';
    const frame = moving ? Math.floor(this.stepTime * 5) % 4 : 0;
    const pose = this.state === 'slam' ? 'slam' : 'walk';
    // 내리칠 땐 몸을 한껏 늘였다가, 찍은 뒤엔 납작해진다 — 크기를 바꿔 새로 그린다
    let syScale = 1;
    if (this.state === 'slam') syScale = 1 + (1 - Math.max(0, this.timer) / CONFIG.golem.slam.windup) * 0.12;
    else if (this.state === 'recover') syScale = 0.92;

    const W = Math.round(16 * this.scale * this.hitSX), H = Math.round(20 * this.scale * syScale * this.hitSY);
    const cv = Creatures.golem(W, H, frame, pose, this.hurtFlash > 0);
    this.drawShadow(ctx, sx, sy, 7 * this.scale);
    const top = Creatures.blit(ctx, cv, sx, sy) + 2;
    if (this.state === 'slam') this.drawWarning(ctx, sx, top, 1 - this.timer / CONFIG.golem.slam.windup);
    this.drawLabel(ctx, sx, top);
  }
}

// ── js/boss_base.js
'use strict';

/* 보스 공통 뼈대. 세 보스(거대 슬라임 / 우두머리 늑대 / 늙은 버섯)가 이걸 상속한다.

   공통으로 하는 일
     - 능력치: 같은 레벨 일반 몬스터의 표에 spec 의 배수를 곱해 만든다
     - 상태 기계: intro -> idle -> (패턴)Wind -> ... -> idle. 패턴은 가중치로 뽑는다
     - 2페이즈: 체력이 절반 아래로 내려가면 빨라지고 패턴 확률이 바뀐다
     - 예고 표시(`!`), 넉백 면역, 화면 위 체력바(머리 위 이름표는 안 그린다)
     - 죽을 때 큰 연출

   각 보스는 think() 안에서 자기 패턴 상태만 처리하고, 나머지는 여기 있는 걸 쓴다. */

class Boss extends Enemy {
  constructor(x, y, spec, baseLevels) {
    const level = spec.level;
    const base = enemyStatsAt(baseLevels, level);   // 표 밖 레벨(30 등)도 같은 곡선으로
    super(x, y, level, {
      hp: Math.round(base.hp * spec.hpMult),
      atk: Math.round(base.atk * spec.atkMult),
      speed: spec.speed,
      detect: spec.detect,
      scale: spec.scale,
      xp: Math.round(base.xp * spec.xpMult),
      knockback: 0,          // 보스는 밀리지 않는다
    });
    this.spec = spec;
    this.TYPE = spec.type;   // 색은 종류를 따른다 (보스인지는 isBoss 로 가린다)
    this.isBoss = true;
    this.name = spec.name;
    this.reward = spec.reward;

    /* 몸통 상자 — 판정은 이걸로 한다. 그림자는 포함하지 않는다.
       (x, y) 는 발 자리이고 몸은 그 위로 솟아 있으므로, 상자는 발에서 위로만 올라간다.
       각 보스가 생성자에서 자기 도트 크기에 맞춰 덮어쓴다 */
    this.bodyW = this.radius * 1.6;
    this.bodyH = this.radius * 1.8;
    this.bodyBottom = 7;     // 발 자리(y)에서 몸 아랫단까지

    this.state = 'intro';
    this.timer = 1.0;        // 등장 연출
    this.phase2 = false;
    this.warn = 0;           // 예고 표시가 남은 시간
    this.squash = 0;         // 몸이 눌리는 정도 (-1 눌림 ~ +1 늘어남) — 예고 동작에 쓴다
    Sound.play('roar');
  }

  get feetBox() {
    const r = this.radius;
    return { x: this.x - r * 0.65, y: this.y + 2, w: r * 1.3, h: 6 };
  }

  // 몸통 상자 — 몸에 닿아야 맞는다 (그림자 위에 서 있는 건 닿은 게 아니다)
  bodyBox() {
    const bottom = this.y + this.bodyBottom;
    return { x: this.x - this.bodyW / 2, y: bottom - this.bodyH, w: this.bodyW, h: this.bodyH };
  }

  get hurtBox() { return this.bodyBox(); }

  // 플레이어 공격 판정용 — 점에서 몸통 상자까지의 거리 (안이면 0)
  hitDistance(px, py) {
    const b = this.bodyBox();
    const dx = Math.max(b.x - px, 0, px - (b.x + b.w));
    const dy = Math.max(b.y - py, 0, py - (b.y + b.h));
    return Math.sqrt(dx * dx + dy * dy);
  }

  hitCenter() {
    const b = this.bodyBox();
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  /* ── 바닥 예고 — 돌진 경로와 착지 범위를 붉게 칠한다 ──
     Game.render 가 캐릭터들보다 먼저 바닥 위에 그린다 (drawGround) */

  // 이 방향으로 달리면 어디서 벽에 막히는가 (px)
  castWall(angle, halfW) {
    let d = 0;
    for (let k = 0; k < 120; k++) {
      d += 6;
      const x = this.x + Math.cos(angle) * d, y = this.y + Math.sin(angle) * d;
      if (World.blocked({ x: x - halfW, y: y + 2, w: halfW * 2, h: 6 })) return d;
    }
    return d;
  }

  // 붉은 띠 — 시작점에서 벽까지, 몸 폭만큼
  drawPathBand(ctx, cam, angle, width) {
    const len = this.castWall(angle, width * 0.3) + width * 0.4;
    const pulse = 0.16 + Math.abs(Math.sin(World.time * 8)) * 0.1;
    ctx.save();
    ctx.translate(Math.round(this.x - cam.x), Math.round(this.y + 2 - cam.y));
    ctx.rotate(angle);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(0, -width / 2, len, width);
    ctx.globalAlpha = 0.55;
    ctx.fillRect(0, -width / 2, len, 1);
    ctx.fillRect(0, width / 2 - 1, len, 1);
    ctx.fillRect(len - 1, -width / 2, 1, width);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 붉은 원판 — 착지 범위
  drawLandingCircle(ctx, cam, x, y, r, urgent) {
    const sx = Math.round(x - cam.x), sy = Math.round(y - cam.y);
    ctx.globalAlpha = (urgent ? 0.3 : 0.18) + Math.abs(Math.sin(World.time * 8)) * 0.1;
    fillCircle(ctx, sx, sy + 2, r, '#ff3b3b');
    ctx.globalAlpha = 1;
    ctx.fillStyle = urgent ? '#ffffff' : '#ff8a8a';
    const steps = Math.max(20, Math.round(r * 1.2));
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ctx.fillRect(Math.round(sx + Math.cos(a) * r), Math.round(sy + 2 + Math.sin(a) * r), 1, 1);   // 판정이 정원이므로 테두리도 정원
    }
    ctx.fillRect(sx - 1, sy + 2, 3, 1); ctx.fillRect(sx, sy + 1, 1, 3);
  }

  // 페이즈에 따라 달라지는 값을 꺼내는 helper ([1페이즈, 2페이즈])
  byPhase(pair) {
    return pair[this.phase2 ? 1 : 0];
  }

  speedUp() {
    return this.phase2 ? this.spec.phase2Speed : 1;
  }

  // 체력 절반에서 2페이즈로 넘어간다. 매 프레임 think() 첫머리에서 부른다
  checkPhase2() {
    if (this.phase2 || this.hp > this.maxHp * this.spec.phase2At) return;
    this.phase2 = true;
    FX.addShake(7);
    FX.flash('#ff3b3b', 0.3, 0.4);
    Sound.play('roar');
    FX.number(this.x, this.y - 30, 'ENRAGED', '#ff6b6b', true);
    const pal = this.palette;
    FX.burst(this.x, this.y, 30, [pal.M, pal.n, '#ffffff'], { speed: 90, life: 0.7 });
  }

  // 공통 타이머 — 2페이즈에서는 시간이 빨리 간다
  tick(dt) {
    this.timer -= dt * this.speedUp();
    this.warn = Math.max(0, this.warn - dt);
  }

  toIdle() {
    const t = this.spec.idleTime;
    this.state = 'idle';
    this.timer = Util.rand(t[0], t[1]);
  }

  // 패턴을 가중치로 하나 고른다. 고른 패턴의 windup 을 타이머에 넣고 '(패턴)Wind' 상태로 간다
  pickPattern(names) {
    const cfg = this.spec;
    const weights = names.map(n => this.byPhase(cfg[n].weight));
    const pick = names[Util.weightedIndex(weights)];
    this.warn = 0.6;
    this.state = pick + 'Wind';
    this.timer = cfg[pick].windup;
    return pick;
  }

  // 예고 진행도 (0 -> 1). 예고 동작의 눌림·부풂에 쓴다
  windProgress(pattern) {
    return 1 - Math.max(0, this.timer) / (this.spec[pattern].windup / this.speedUp());
  }

  // 플레이어 쪽 각도
  angleTo(player) {
    return Math.atan2(player.y - this.y, player.x - this.x);
  }

  // 새끼 몬스터를 주위 빈 자리에 놓는다 (분열 / 울부짖음 / 포자 새끼)
  summon(make, n, levelBelow) {
    const lv = Math.max(1, this.level - levelBelow);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random();
      for (let r = 26; r <= 70; r += 8) {
        const x = this.x + Math.cos(a) * r, y = this.y + Math.sin(a) * r;
        if (!World.isFreeSpot(x, y, 9)) continue;
        Game.enemies.push(make(x, y, lv));
        break;
      }
    }
  }

  die(player) {
    super.die(player);
    FX.addShake(10);
    const pal = this.palette;
    FX.burst(this.x, this.y, 60, [pal.M, pal.n, pal.m, '#ffffff'], { speed: 130, life: 1.0 });
    FX.ring(this.x, this.y + 6, 24, '#ffffff');
    FX.flash('#ffffff', 0.5, 0.35);
    FX.freeze(0.18);
    FX.number(this.x, this.y - 34, 'DEFEATED', '#ffd93d', true);
    Sound.play('bossDead');
  }

  // 보스는 머리 위 이름표 대신 화면 위쪽 전용 체력바를 쓴다
  drawLabel() { }
}

// ── js/boss.js
'use strict';

/* 거대 슬라임 — 숲 가장자리 보스. 동굴로 들어가면 그 안 전용 공간에서 싸운다.

   네 가지 패턴을 번갈아 쓴다. 모든 패턴에 예고 동작(몸이 눌리거나 부풀고 `!` 가 뜬다)이
   붙어 있어서 무엇이 올지 보고 대응할 수 있다.

     SLAM  내려찍기 — 떠올랐다가 플레이어가 있던 자리에 떨어진다. 착지 충격파가 넓다
     ROLL  구르기   — 방향을 정하고 직선으로 굴러온다. 벽에 부딪히면 멈춘다
     SPLIT 분열     — 새끼 슬라임을 여럿 뱉어낸다
     SPIT  뱉기     — 사방으로 점액을 뿌린다

   체력이 절반 아래로 내려가면 2페이즈 — 모든 동작이 빨라지고 패턴이 독해진다. */

class GiantSlime extends Boss {
  constructor(x, y) {
    super(x, y, CONFIG.bosses.slime, CONFIG.slime.levels);
    this.hopTimer = 0;       // 평소 통통 튀는 연출
    this.airHeight = 0;      // 내려찍기로 떠오른 높이
    this.target = { x: x, y: y };
    this.rollDir = 0;
    this.shock = 0;          // 충격파 연출이 남은 시간
    this.shockMax = 0.42;
    // 몸통: 도트 44x38, 아랫단은 y+12
    this.bodyW = 40; this.bodyH = 34; this.bodyBottom = 12;
  }

  // 바닥 예고 — 구르기는 경로를, 내려찍기는 떨어질 자리를 붉게
  drawGround(ctx, cam) {
    const cfg = this.spec, player = Game.player;
    if (this.state === 'rollWind') this.drawPathBand(ctx, cam, this.rollDir, this.bodyW);
    else if (this.state === 'slamWind' && !player.dead) this.drawLandingCircle(ctx, cam, player.x, player.y, cfg.slam.radius, false);
    else if (this.state === 'slamAir') this.drawLandingCircle(ctx, cam, this.target.x, this.target.y, cfg.slam.radius, true);
  }

  think(dt, player) {
    const cfg = this.spec;
    this.checkPhase2();
    this.tick(dt);
    this.shock = Math.max(0, this.shock - dt);
    this.hopTimer += dt;
    const speedUp = this.speedUp();

    switch (this.state) {
      case 'intro':
        // 굴 안쪽에서 몸을 일으키는 참 — 잠깐 부풀었다 가라앉는다
        this.squash = Math.sin(this.timer * 6) * 0.4;
        if (this.timer <= 0) this.toIdle();
        break;

      case 'idle': {
        this.squash *= Math.pow(0.02, dt);
        // 느릿느릿 다가온다
        const d = this.distanceTo(player);
        if (d > 34 && !player.dead) {
          const a = this.angleTo(player);
          this.moveWithCollision(Math.cos(a) * this.stats.speed * dt, Math.sin(a) * this.stats.speed * dt);
        }
        if (this.timer <= 0) {
          const pick = this.pickPattern(['slam', 'roll', 'split', 'spit']);
          if (pick === 'roll' && !player.dead) this.rollDir = this.angleTo(player);
        }
        break;
      }

      /* ── 내려찍기 ── */
      case 'slamWind':
        this.squash = -0.5 * this.windProgress('slam');
        if (this.timer <= 0) {
          // 예고가 끝나는 순간의 플레이어 위치를 노린다 — 그 뒤에 움직이면 피할 수 있다
          this.target = { x: player.x, y: player.y };
          this.state = 'slamAir';
          this.timer = cfg.slam.air;
        }
        break;

      case 'slamAir': {
        const p = 1 - Math.max(0, this.timer) / (cfg.slam.air / speedUp);
        this.airHeight = Math.sin(p * Math.PI) * 46;
        this.squash = 0.35 * Math.sin(p * Math.PI);
        // 공중에서 목표 지점으로 미끄러져 간다 (벽은 무시하고 날아간다)
        this.x = Util.lerp(this.x, this.target.x, Math.min(1, dt * 6));
        this.y = Util.lerp(this.y, this.target.y, Math.min(1, dt * 6));
        if (this.timer <= 0) this.land(player);
        break;
      }

      case 'slamLand':
        this.squash = -0.45 * Math.max(0, this.timer) / (cfg.slam.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 구르기 ── */
      case 'rollWind':
        this.squash = -0.35;
        // 예고 중에도 방향을 계속 맞춘다 — 끝나는 순간 고정된다
        if (!player.dead) this.rollDir = this.angleTo(player);
        if (this.timer <= 0) {
          this.state = 'roll';
          this.timer = cfg.roll.time;
        }
        break;

      case 'roll': {
        this.squash = 0.15;
        const before = this.x + this.y;
        this.moveWithCollision(
          Math.cos(this.rollDir) * cfg.roll.speed * dt * speedUp,
          Math.sin(this.rollDir) * cfg.roll.speed * dt * speedUp
        );
        // 벽에 막혀 못 움직이면 멈춘다
        if (Math.abs((this.x + this.y) - before) < 0.05) {
          FX.addShake(4);
          FX.burst(this.x, this.y, 12, ['#cbbfa2', '#8f7854'], { speed: 60, life: 0.4 });
          this.toIdle();
          break;
        }
        this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * cfg.roll.damageMult));
        if (this.timer <= 0) this.toIdle();
        break;
      }

      /* ── 분열 ── */
      case 'splitWind':
        this.squash = 0.4 * this.windProgress('split');
        if (this.timer <= 0) { this.split(); this.toIdle(); }
        break;

      /* ── 뱉기 ── */
      case 'spitWind':
        this.squash = 0.3 * this.windProgress('spit');
        if (this.timer <= 0) { this.spit(player); this.toIdle(); }
        break;
    }

    // 공중에 떠 있을 때만 빼고 몸이 닿으면 피해를 준다
    if (this.state !== 'slamAir') {
      this.touchPlayer(player, cfg.contactCooldown);
    }
  }

  toIdle() {
    super.toIdle();
    this.airHeight = 0;
  }

  // 착지 — 충격파가 원 안의 플레이어를 때린다
  land(player) {
    const cfg = this.spec;
    this.airHeight = 0;
    this.state = 'slamLand';
    this.timer = cfg.slam.recover;
    this.shock = this.shockMax;
    FX.addShake(9);
    FX.flash('#ffffff', 0.25, 0.12);
    FX.freeze(0.05);
    Sound.play('slam');
    const pal = this.palette;
    FX.burst(this.x, this.y + 6, 26, [pal.M, pal.n, '#cbbfa2'], { speed: 95, life: 0.6 });

    if (!player.dead && Util.dist(this.x, this.y, player.x, player.y) < cfg.slam.radius) {
      player.takeDamage(Math.round(this.stats.atk * cfg.slam.damageMult), this.x, this.y);
    }
  }

  // 분열 — 새끼 슬라임을 뱉는다 (보스보다 여러 레벨 낮다)
  split() {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.split.count), this.byPhase(cfg.split.count) + 1);
    this.summon((x, y, lv) => new Slime(x, y, lv), n, cfg.split.levelBelow);
    FX.addShake(4);
    const pal = this.palette;
    FX.burst(this.x, this.y, 20, [pal.M, pal.m], { speed: 80, life: 0.5 });
    Sound.play('split');
  }

  // 뱉기 — 사방으로 점액을 뿌린다. 2페이즈에서는 발수가 늘어난다
  spit(player) {
    const cfg = this.spec;
    const shots = this.byPhase(cfg.spit.shots);
    // 조준은 몸 중심이 아니라 "뱉는 위치" 기준으로 잰다.
    // 안 그러면 가로로 뱉을 때 탄이 플레이어 머리 위로 평행하게 지나가 버린다
    const ox = this.x, oy = this.y - 6;
    const aim = player.dead ? 0 : Math.atan2(player.y - oy, player.x - ox);
    for (let i = 0; i < shots; i++) {
      Projectiles.spawn(ox, oy, aim + (i / shots) * Math.PI * 2, {
        speed: cfg.spit.speed,
        damage: Math.round(this.stats.atk * cfg.spit.damageMult),
        type: 'slime',
        life: cfg.spit.life,
      });
    }
    FX.addShake(3);
    Sound.play('spit');
  }

  // 공중에 있는 동안은 때릴 수 없다
  takeHit(damage, angle, crit, player, knockScale) {
    if (this.state === 'slamAir') return;
    super.takeHit(damage, angle, crit, player, knockScale);
  }

  drawBody(ctx, sx, sy) {
    const y = sy - Math.round(this.airHeight);

    // 그림자 — 떠 있을수록 작고 옅어진다 (어디에 떨어질지 알려주는 표시이기도 하다)
    const lift = this.airHeight / 46;
    fillCircle(ctx, sx, sy + 10, 13 * (1 - lift * 0.45), 'rgba(0,0,0,' + (0.3 - lift * 0.12) + ')');

    // 착지 충격파
    if (this.shock > 0) {
      const t = 1 - this.shock / this.shockMax;
      const ring = SPRITES.shockRing[Util.clamp(Math.floor(t * 4), 0, 3)];
      ctx.drawImage(ring, sx - Math.floor(ring.width / 2), sy + 8 - Math.floor(ring.height / 2));
    }

    // 몸 — squash 로 눌리고 늘어난다 (예고 동작이 전부 여기서 보인다). 그 크기로 새로 그린다
    const bounce = this.state === 'idle' ? Math.sin(this.hopTimer * 4) * 0.05 : 0;
    const sq = this.squash + bounce;
    const cv = Creatures.slime(Math.round(42 * (1 - sq * 0.5)), Math.round(34 * (1 + sq * 0.5)), this.hurtFlash > 0, true);
    const topY = Math.round(y + 13 - cv.height);
    ctx.drawImage(cv, sx - (cv.width >> 1), topY);
    if (this.warn > 0) this.drawWarning(ctx, sx, topY, 1 - this.warn / 0.6);
  }
}

  <script>
// ── js/boss_wolf.js
'use strict';

/* 우두머리 늑대 — 깊은 숲 보스. 빠르고 집요하다.

   거대 슬라임이 "덩치로 밀어붙이는" 상대라면 이쪽은 "빈틈을 잡아야 하는" 상대다.
   평소에도 플레이어만큼 빠르게 서성이며 거리를 재고, 패턴은 전부 순식간에 끝난다.

     LUNGE  돌진     — 웅크렸다가 직선으로 쏜살같이 달려든다. 벽에 부딪히면 잠깐 휘청 — 그때가 기회.
                       2페이즈에서는 방향을 고쳐 잡으며 세 번 연달아 온다
     POUNCE 덮치기   — 뛰어올라 내가 있던 자리에 떨어진다 (범위는 좁지만 정확하다)
     HOWL   울부짖음 — 무리를 부른다 (새끼 늑대 2~3마리)
     CIRCLE 돌기     — 주위를 빙 돌며 틈을 보다가 곧바로 돌진으로 이어진다

   체력이 절반 아래로 내려가면 2페이즈 — 빨라지고 돌진이 세 번 연속이 된다. */

class AlphaWolf extends Boss {
  constructor(x, y) {
    super(x, y, CONFIG.bosses.wolf, CONFIG.wolf.levels);
    this.facing = 1;         // 1 오른쪽 / -1 왼쪽
    this.stepTime = 0;       // 다리 움직임
    this.lungeDir = 0;
    this.lungesLeft = 0;     // 연속 돌진 남은 횟수
    this.airHeight = 0;
    this.target = { x: x, y: y };
    this.circleDir = 1;      // 도는 방향
    // 몸통 판정 — 늑대 몸(28x20)을 덩치만큼 키운 것의 안쪽. 아랫단은 y+7
    this.bodyW = Math.round(28 * this.scale * 0.85);
    this.bodyH = Math.round(20 * this.scale * 0.9);
    this.bodyBottom = 7;
  }

  // 바닥 예고 — 돌진은 경로를, 덮치기는 떨어질 자리를 붉게
  drawGround(ctx, cam) {
    const cfg = this.spec, player = Game.player;
    if (this.state === 'lungeWind') this.drawPathBand(ctx, cam, this.lungeDir, this.bodyH * 0.8);
    else if (this.state === 'pounceWind' && !player.dead) this.drawLandingCircle(ctx, cam, player.x, player.y, cfg.pounce.radius, false);
    else if (this.state === 'pounceAir') this.drawLandingCircle(ctx, cam, this.target.x, this.target.y, cfg.pounce.radius, true);
  }

  face(dx) { if (Math.abs(dx) > 0.5) this.facing = dx > 0 ? 1 : -1; }

  // 정해진 방향으로 달린다. 벽에 막혀 못 움직이면 false
  run(angle, speed, dt) {
    const before = this.x + this.y;
    this.moveWithCollision(Math.cos(angle) * speed * dt, Math.sin(angle) * speed * dt);
    this.face(Math.cos(angle));
    this.stepTime += dt * (speed / 60);
    return Math.abs((this.x + this.y) - before) > 0.05;
  }

  think(dt, player) {
    const cfg = this.spec;
    this.checkPhase2();
    this.tick(dt);
    const speedUp = this.speedUp();

    switch (this.state) {
      case 'intro':
        this.squash = -0.3 + Math.sin(this.timer * 8) * 0.1;
        if (this.timer <= 0) this.toIdle();
        break;

      case 'idle': {
        this.squash *= Math.pow(0.02, dt);
        // 적당한 거리를 유지하며 서성인다 — 너무 멀면 다가오고 너무 가까우면 물러난다
        if (!player.dead) {
          const d = this.distanceTo(player), a = this.angleTo(player);
          if (d > cfg.keepDistance + 12) this.run(a, this.stats.speed * speedUp, dt);
          else if (d < cfg.keepDistance - 12) this.run(a + Math.PI, this.stats.speed * 0.7 * speedUp, dt);
          else this.face(player.x - this.x);
        }
        if (this.timer <= 0) {
          const pick = this.pickPattern(['lunge', 'pounce', 'howl', 'circle']);
          if (pick === 'lunge') this.lungesLeft = this.byPhase(cfg.lunge.count);
          if (pick === 'circle') { this.circleDir = Math.random() < 0.5 ? 1 : -1; this.state = 'circle'; this.timer = cfg.circle.time; this.warn = 0; }
        }
        break;
      }

      /* ── 돌진 ── */
      case 'lungeWind':
        this.squash = -0.35 * this.windProgress('lunge');
        if (!player.dead) { this.lungeDir = this.angleTo(player); this.face(Math.cos(this.lungeDir)); }
        if (this.timer <= 0) {
          this.state = 'lunge';
          this.timer = cfg.lunge.time;
          this.lungesLeft--;
          Sound.play('growl');
          FX.burst(this.x, this.y + 6, 8, ['#cbbfa2', '#8f7854'], { speed: 40, life: 0.3, gravity: 60, size: 1 });
        }
        break;

      case 'lunge': {
        this.squash = 0.18;
        const moved = this.run(this.lungeDir, cfg.lunge.speed * speedUp, dt);
        this.touchPlayer(player, cfg.contactCooldown, Math.round(this.stats.atk * cfg.lunge.damageMult));
        if (!moved) {
          // 벽에 부딪혔다 — 휘청이는 동안이 때릴 기회
          FX.addShake(5);
          FX.burst(this.x, this.y, 12, ['#cbbfa2', '#8f7854'], { speed: 60, life: 0.4 });
          Sound.play('slam');
          this.state = 'lungeRecover';
          this.timer = cfg.lunge.recover * 1.3;
          this.lungesLeft = 0;
        } else if (this.timer <= 0) {
          if (this.lungesLeft > 0) {
            // 연속 돌진 — 짧게 방향을 고쳐 잡고 다시 온다
            this.state = 'lungeWind';
            this.timer = cfg.lunge.gapWindup;
            this.warn = 0.3;
          } else {
            this.state = 'lungeRecover';
            this.timer = cfg.lunge.recover;
          }
        }
        break;
      }

      case 'lungeRecover':
        this.squash = -0.2 * Math.max(0, this.timer) / (cfg.lunge.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 덮치기 ── */
      case 'pounceWind':
        this.squash = -0.45 * this.windProgress('pounce');
        if (!player.dead) this.face(player.x - this.x);
        if (this.timer <= 0) {
          this.target = { x: player.x, y: player.y };
          this.state = 'pounceAir';
          this.timer = cfg.pounce.air;
        }
        break;

      case 'pounceAir': {
        const p = 1 - Math.max(0, this.timer) / (cfg.pounce.air / speedUp);
        this.airHeight = Math.sin(p * Math.PI) * 34;
        this.squash = 0.25;
        this.x = Util.lerp(this.x, this.target.x, Math.min(1, dt * 8));
        this.y = Util.lerp(this.y, this.target.y, Math.min(1, dt * 8));
        this.face(this.target.x - this.x);
        if (this.timer <= 0) this.landPounce(player);
        break;
      }

      case 'pounceLand':
        this.squash = -0.35 * Math.max(0, this.timer) / (cfg.pounce.recover / speedUp);
        if (this.timer <= 0) this.toIdle();
        break;

      /* ── 울부짖음 ── */
      case 'howlWind':
        this.squash = 0.25 * this.windProgress('howl');   // 고개를 든다
        if (this.timer <= 0) { this.howl(); this.toIdle(); }
        break;

      /* ── 돌기 ── */
      case 'circle': {
        if (!player.dead) {
          // 플레이어를 중심으로 원을 그리며 달린다 — 원 위의 목표점을 향해 계속 움직인다
          const a = this.angleTo(player) + Math.PI;                 // 플레이어에서 나를 향한 각
          const want = a + this.circleDir * 0.9;                    // 조금 앞선 자리
          const tx = player.x + Math.cos(want) * cfg.circle.radius;
          const ty = player.y + Math.sin(want) * cfg.circle.radius;
          const moved = this.run(Math.atan2(ty - this.y, tx - this.x), cfg.circle.speed * speedUp, dt);
          if (!moved) this.circleDir *= -1;                          // 벽에 막히면 반대로 돈다
        }
        if (this.timer <= 0) {
          // 돌다가 바로 돌진 — 예고는 짧다
          this.lungesLeft = 1;
          this.state = 'lungeWind';
          this.timer = cfg.lunge.gapWindup;
          this.warn = 0.3;
        }
        break;
      }
    }

    if (this.state !== 'pounceAir' && this.state !== 'lunge') {
      this.touchPlayer(player, cfg.contactCooldown);
    }
  }

  toIdle() {
    super.toIdle();
    this.airHeight = 0;
  }

  landPounce(player) {
    const cfg = this.spec;
    this.airHeight = 0;
    this.state = 'pounceLand';
    this.timer = cfg.pounce.recover;
    FX.addShake(6);
    FX.freeze(0.03);
    Sound.play('slam');
    FX.burst(this.x, this.y + 6, 16, ['#cbbfa2', '#8f7854', '#ffffff'], { speed: 70, life: 0.45 });
    FX.ring(this.x, this.y + 4, cfg.pounce.radius * 0.6, '#cbbfa2');
    if (!player.dead && Util.dist(this.x, this.y, player.x, player.y) < cfg.pounce.radius) {
      player.takeDamage(Math.round(this.stats.atk * cfg.pounce.damageMult), this.x, this.y);
    }
  }

  howl() {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.howl.count), this.byPhase(cfg.howl.count) + 1);
    this.summon((x, y, lv) => new Wolf(x, y, lv), n, cfg.howl.levelBelow);
    FX.addShake(4);
    FX.ring(this.x, this.y - 6, 14, '#ffffff');
    Sound.play('howl');
  }

  // 공중에 있는 동안은 때릴 수 없다
  takeHit(damage, angle, crit, player, knockScale) {
    if (this.state === 'pounceAir') return;
    super.takeHit(damage, angle, crit, player, knockScale);
  }

  drawBody(ctx, sx, sy) {
    const y = sy - Math.round(this.airHeight);
    const moving = this.state === 'lunge' || this.state === 'circle' || this.state === 'idle';
    const frame = moving ? Math.floor(this.stepTime * 8) % 4 : 0;
    const pose = this.state === 'lunge' ? 'lunge' : (this.squash < -0.15 ? 'crouch' : 'walk');

    const lift = this.airHeight / 34;
    this.drawShadow(ctx, sx, sy, 7 * this.scale * (1 - lift * 0.4));

    // 눌림/늘어남 — 예고에서 웅크리고 돌진에서 길어진다 (그 크기로 새로 그린다)
    const sq = this.squash;
    const W = Math.round(28 * this.scale * (1 - sq * 0.35)), H = Math.round(20 * this.scale * (1 + sq * 0.5));
    let cv = Creatures.wolf(W, H, frame, pose, this.hurtFlash > 0, true);   // 우두머리 — 붉은 눈·갈기·흉터
    if (this.facing < 0) cv = Creatures.flip(cv);
    const topY = Math.round(y + 8 - cv.height);
    ctx.drawImage(cv, sx - (cv.width >> 1), topY);
    if (this.warn > 0) this.drawWarning(ctx, sx, topY, 1 - this.warn / 0.6);
  }
}

  <script>
// ── js/boss_mushroom.js
'use strict';

/* 늙은 버섯 — 포자 골짜기 보스. 거의 움직이지 않는 대신 방 전체를 포자로 덮는다.

   쫓아다니지 않는 상대라 "어디에 서 있느냐"가 전부다.
   포자 고리는 사이로 빠져나가고, 포자비는 표시가 뜬 자리에서 벗어나고,
   맥동은 대시로 통과하거나 미리 멀리 떨어져야 한다.

     RING   포자 고리 — 사방으로 포자를 뿌린다. 2페이즈에서는 두 겹, 각도를 비껴서
     RAIN   포자비   — 내 주변 여러 곳에 표시가 뜨고 1초 뒤 터진다
     SPAWN  새끼     — 작은 버섯 포탑을 주위에 심는다
     PULSE  맥동     — 몸에서 고리가 퍼져나온다. 고리에 스치면 맞는다

   체력이 절반 아래로 내려가면 2페이즈 — 빨라지고 뿌리를 뽑아 움직이기 시작한다. */

class ElderShroom extends Boss {
  constructor(x, y) {
    super(x, y, CONFIG.bosses.mushroom, CONFIG.mushroom.levels);
    this.marks = [];         // 포자비 표시 [{x, y, t}]
    this.pulses = [];        // 퍼져나가는 고리 [{r, hit}]
    this.waveTimer = 0;      // 두 번째 고리까지 남은 시간
    this.wavesLeft = 0;
    this.grow = 0;           // 부풂 연출 (0 ~ 1)
    // 몸통: 버섯 도트 16x16 x3, 아랫단은 y+7
    this.bodyW = Math.round(16 * this.scale * 0.8);
    this.bodyH = Math.round(16 * this.scale * 0.9);
    this.bodyBottom = 7;
  }

  think(dt, player) {
    const cfg = this.spec;
    this.checkPhase2();
    this.tick(dt);
    const speedUp = this.speedUp();

    // 포자비와 맥동은 상태와 무관하게 흘러간다 — 다음 패턴 예고와 겹칠 수 있어 더 위험하다
    this.updateMarks(dt, player);
    this.updatePulses(dt, player);
    if (this.wavesLeft > 0) {
      this.waveTimer -= dt;
      if (this.waveTimer <= 0) { this.fireRing(player, this.wavesLeft); this.wavesLeft--; this.waveTimer = cfg.ring.waveGap; }
    }

    switch (this.state) {
      case 'intro':
        this.grow = Math.max(0, Math.sin(this.timer * 5)) * 0.3;
        if (this.timer <= 0) this.toIdle();
        break;

      case 'idle': {
        this.grow *= Math.pow(0.02, dt);
        // 뿌리를 끌며 아주 천천히 다가온다 (2페이즈에서는 눈에 띄게 빨라진다)
        const d = this.distanceTo(player);
        if (d > 40 && !player.dead) {
          const a = this.angleTo(player);
          const sp = this.stats.speed * (this.phase2 ? 2.2 : 1);
          this.moveWithCollision(Math.cos(a) * sp * dt, Math.sin(a) * sp * dt);
        }
        if (this.timer <= 0) this.pickPattern(['ring', 'rain', 'spawn', 'pulse']);
        break;
      }

      case 'ringWind':
        this.grow = 0.35 * this.windProgress('ring');
        if (this.timer <= 0) {
          const waves = this.byPhase(cfg.ring.waves);
          this.fireRing(player, waves);
          this.wavesLeft = waves - 1;
          this.waveTimer = cfg.ring.waveGap;
          this.toIdle();
        }
        break;

      case 'rainWind':
        this.grow = 0.3 * this.windProgress('rain');
        if (this.timer <= 0) { this.rain(player); this.toIdle(); }
        break;

      case 'spawnWind':
        this.grow = 0.25 * this.windProgress('spawn');
        if (this.timer <= 0) { this.spawnKids(); this.toIdle(); }
        break;

      case 'pulseWind':
        this.grow = 0.5 * this.windProgress('pulse');
        if (this.timer <= 0) {
          this.pulses.push({ r: 4, hit: false });
          this.grow = -0.2;
          FX.addShake(5);
          Sound.play('slam');
          this.toIdle();
        }
        break;
    }

    this.touchPlayer(player, cfg.contactCooldown);
  }

  /* 포자 고리 — 사방으로 균등하게. 두 번째 겹은 반 칸 비껴서 사이를 메운다 */
  fireRing(player, waveIndex) {
    const cfg = this.spec;
    const shots = this.byPhase(cfg.ring.shots);
    const ox = this.x, oy = this.y - 8;
    const base = (player.dead ? 0 : Math.atan2(player.y - oy, player.x - ox)) + (waveIndex % 2 ? Math.PI / shots : 0);
    for (let i = 0; i < shots; i++) {
      Projectiles.spawn(ox, oy, base + (i / shots) * Math.PI * 2, {
        speed: cfg.ring.speed,
        damage: Math.round(this.stats.atk * cfg.ring.damageMult),
        type: 'mushroom',
        life: cfg.ring.life,
      });
    }
    FX.addShake(3);
    Sound.play('spit');
  }

  /* 포자비 — 플레이어 주변 여러 자리에 표시를 찍는다. 한 발은 반드시 플레이어 발밑이다 */
  rain(player) {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.rain.count), this.byPhase(cfg.rain.count) + 1);
    for (let i = 0; i < n; i++) {
      const r = i === 0 ? 0 : Util.rand(18, cfg.rain.scatter), a = Math.random() * Math.PI * 2;
      const x = Util.clamp(player.x + Math.cos(a) * r, 40, World.w - 40);
      const y = Util.clamp(player.y + Math.sin(a) * r, 40, World.h - 40);
      this.marks.push({ x: x, y: y, t: cfg.rain.delay });
    }
    Sound.play('split');
  }

  updateMarks(dt, player) {
    const cfg = this.spec;
    for (let i = this.marks.length - 1; i >= 0; i--) {
      const m = this.marks[i];
      m.t -= dt;
      if (m.t > 0) continue;
      // 터진다
      const pal = this.palette;
      FX.burst(m.x, m.y - 4, 18, [pal.M, pal.n, '#ffffff'], { speed: 70, life: 0.5 });
      FX.ring(m.x, m.y, cfg.rain.radius * 0.7, pal.n);
      FX.addShake(2.5);
      Sound.play('kill');
      if (!player.dead && Util.dist(m.x, m.y, player.x, player.y) < cfg.rain.radius) {
        player.takeDamage(Math.round(this.stats.atk * cfg.rain.damageMult), m.x, m.y);
      }
      this.marks.splice(i, 1);
    }
  }

  /* 맥동 — 고리가 몸에서 퍼져나간다. 고리 선에 스치는 순간 한 번 맞는다 (대시 무적으로 통과 가능) */
  updatePulses(dt, player) {
    const cfg = this.spec;
    for (let i = this.pulses.length - 1; i >= 0; i--) {
      const p = this.pulses[i];
      p.r += cfg.pulse.speed * dt * this.speedUp();
      if (!p.hit && !player.dead) {
        const d = Util.dist(this.x, this.y + 2, player.x, player.y);
        if (Math.abs(d - p.r) < 7) {
          p.hit = true;
          player.takeDamage(Math.round(this.stats.atk * cfg.pulse.damageMult), this.x, this.y);
        }
      }
      if (p.r >= cfg.pulse.radius) this.pulses.splice(i, 1);
    }
  }

  spawnKids() {
    const cfg = this.spec;
    const n = Util.randInt(this.byPhase(cfg.spawn.count), this.byPhase(cfg.spawn.count) + 1);
    this.summon((x, y, lv) => new Mushroom(x, y, lv), n, cfg.spawn.levelBelow);
    FX.addShake(3);
    const pal = this.palette;
    FX.burst(this.x, this.y, 20, [pal.M, pal.m], { speed: 70, life: 0.5 });
    Sound.play('split');
  }

  // 바닥 표시 — 캐릭터들보다 먼저, 바닥 위에 그린다
  drawGround(ctx, cam) {
    const pal = this.palette, cfg = this.spec;
    const sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y);

    // 포자비가 떨어질 자리. 붉은 원판이 점점 진해지고, 터지기 직전엔 빠르게 깜빡인다
    for (const m of this.marks) {
      const mx = Math.round(m.x - cam.x), my = Math.round(m.y - cam.y);
      const urgent = m.t < 0.35;
      if (urgent && Math.floor(m.t * 20) % 2 === 0) continue;
      const r = cfg.rain.radius;
      ctx.globalAlpha = 0.18 + (1 - m.t / cfg.rain.delay) * 0.22;
      fillCircle(ctx, mx, my, r, '#ff5c5c');
      ctx.globalAlpha = 1;
      ctx.fillStyle = urgent ? '#ffffff' : '#ff8a8a';
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        ctx.fillRect(Math.round(mx + Math.cos(a) * r), Math.round(my + Math.sin(a) * r), 1, 1);
      }
      ctx.fillRect(mx - 1, my, 3, 1); ctx.fillRect(mx, my - 1, 1, 3);
    }

    // 맥동 고리
    for (const p of this.pulses) {
      ctx.fillStyle = pal.n;
      const steps = Math.max(16, Math.round(p.r * 1.5));
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        ctx.fillRect(Math.round(sx + Math.cos(a) * p.r), Math.round(sy + 2 + Math.sin(a) * p.r), 1, 1);
        ctx.fillRect(Math.round(sx + Math.cos(a) * (p.r - 2)), Math.round(sy + 2 + Math.sin(a) * (p.r - 2)), 1, 1);
      }
    }
  }

  drawBody(ctx, sx, sy) {
    this.drawShadow(ctx, sx, sy, 6 * this.scale);
    const cv = Creatures.mushroom(Math.round(16 * this.scale), 1 + this.grow * 0.5, this.hurtFlash > 0, true);
    const topY = Creatures.blit(ctx, cv, sx, sy);
    if (this.warn > 0) this.drawWarning(ctx, sx, topY, 1 - this.warn / 0.6);
  }
}
