// ── js/fog.js
'use strict';

/* 발견 안개 — 가본 곳만 지도가 밝아진다 (로드맵 6주차).

   지금까지 지도는 처음부터 전부 보였다. 2560x1920 짜리 맵을 펼쳐 놓고
   "어디를 가봤는지"를 기록하지 않으니, 지도가 **내가 만든 기록이 아니라 그냥 설명서**였다.

   이제 타일 하나하나에 '가봤는가'를 적어 두고, 미니맵·전체 지도에서 안 가본 곳을 덮는다.

   저장은 타일 하나당 1비트로 눌러 담아 base64 로 적는다 (맵 하나에 2.4KB → 3.2KB 글자).
   맵 모양은 시드에서 다시 나오므로 '가봤는가'만 남기면 된다. */

const Fog = {
  maps: {},          // { forest: {...}, desert: {...} }
  lastTile: { x: -1, y: -1 },

  reset() {
    this.maps = {};
    this.lastTile = { x: -1, y: -1 };
  },

  ensure(mapId) {
    let m = this.maps[mapId];
    if (m) return m;
    const W = CONFIG.MAP_W, H = CONFIG.MAP_H, cfg = CONFIG.fog;
    m = {
      w: W, h: H,
      bits: new Uint8Array(W * H),
      seen: 0,
      canvas: makeCanvas(W, H),
    };
    const ctx = m.canvas.getContext('2d');
    ctx.fillStyle = cfg.color;
    ctx.fillRect(0, 0, W, H);
    this.maps[mapId] = m;
    return m;
  },

  isSeen(mapId, tx, ty) {
    const m = this.maps[mapId];
    if (!m) return false;
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false;
    return !!m.bits[ty * m.w + tx];
  },

  seenAt(mapId, x, y) {
    return this.isSeen(mapId, Math.floor(x / CONFIG.TILE), Math.floor(y / CONFIG.TILE));
  },

  percent(mapId) {
    const m = this.maps[mapId];
    if (!m) return 0;
    return m.seen / (m.w * m.h);
  },

  /* ── 걷는 대로 걷힌다 ──────────────────────────────────
     타일을 하나 넘어갈 때만 둘레를 훑는다 (매 프레임 150칸을 보는 건 아깝다). */
  update(dt, player) {
    if (World.isArena) return;     // 보스 방은 지도에 없는 곳이다
    const T = CONFIG.TILE, cfg = CONFIG.fog;
    const tx = Math.floor(player.x / T), ty = Math.floor(player.y / T);
    if (tx === this.lastTile.x && ty === this.lastTile.y) return;
    this.lastTile.x = tx; this.lastTile.y = ty;

    const m = this.ensure(World.mapId);
    const ctx = m.canvas.getContext('2d');
    const r = cfg.radius, r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = tx + dx, y = ty + dy;
        if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
        const i = y * m.w + x;
        if (m.bits[i]) continue;
        m.bits[i] = 1;
        m.seen++;
        ctx.clearRect(x, y, 1, 1);
      }
    }
  },

  // 미니맵·전체 지도 위에 덮는다 (잘라낸 자리와 배율을 그대로 받는다)
  draw(ctx, mapId, dx, dy, sx, sy, bw, bh, scale) {
    const m = this.maps[mapId];
    if (!m) return;
    ctx.drawImage(m.canvas, sx, sy, bw, bh, dx, dy, bw * scale, bh * scale);
  },

  /* ── 저장 ── 타일 하나당 1비트로 눌러 담는다 */
  serialize() {
    const out = {};
    for (const id in this.maps) {
      const m = this.maps[id];
      const bytes = new Uint8Array(Math.ceil(m.bits.length / 8));
      for (let i = 0; i < m.bits.length; i++) if (m.bits[i]) bytes[i >> 3] |= 1 << (i & 7);
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      out[id] = { b: btoa(s) };
    }
    return out;
  },

  deserialize(data) {
    this.reset();
    if (!data) return;
    for (const id in data) {
      const d = data[id];
      if (!d || typeof d.b !== 'string') continue;
      const m = this.ensure(id);
      let s;
      try { s = atob(d.b); } catch (err) { continue; }
      const ctx = m.canvas.getContext('2d');
      for (let i = 0; i < m.bits.length; i++) {
        const byte = s.charCodeAt(i >> 3) || 0;
        if (!(byte & (1 << (i & 7)))) continue;
        m.bits[i] = 1;
        m.seen++;
        ctx.clearRect(i % m.w, Math.floor(i / m.w), 1, 1);
      }
    }
  },
};

// ── js/status.js
'use strict';

/* 상태이상 — 화상 / 빙결 / 감전 / 중독 (로드맵 7주차).

   **몬스터와 플레이어 양쪽에 같은 규칙으로 걸린다.** 그래서 이 파일 하나가 둘 다 다룬다
   (전갈의 독만 따로 굴러가던 것을 여기로 흡수했다).

     BURN   화상  0.5초마다 아픔. 짧고 세다
     POISON 중독  0.5초마다 조금씩. 길고 약한 대신 **자연 회복이 멈춘다**
     FREEZE 빙결  걸음과 손이 느려진다 (피해는 없다)
     SHOCK  감전  **받는 피해가 늘어난다** — 다른 상태와 겹칠 때 가장 무섭다

   세기는 '건 쪽의 힘'을 기준으로 잡는다 — 플레이어가 걸면 그 일격의 피해,
   몬스터가 걸면 그 몬스터의 공격력. 그래야 레벨이 올라도 따로 손볼 것이 없다.

   거는 방법
     - 플레이어 → 장비 옵션 (FIERY / FROSTY / SHOCKING / VENOMOUS 가 붙으면 확률로 건다)
     - 몬스터 → 전갈 찌르기(중독), 버섯·늙은 버섯의 포자(중독)

   **막는 수단은 없다.** 저항 수치를 두면 "저항만 올리면 그만"이 되어 불·얼음·독을 만든 보람이 사라진다 —
   걸리면 걸리는 것이고, 대신 지속 시간을 짧게 잡았다. */

const Status = {
  spec(type) { return CONFIG.status.list[type]; },

  /* 건다. power 는 '건 쪽의 힘' — 지속 피해가 이 값에 비례한다.
     같은 상태를 다시 걸면 더 센 쪽으로 덮어쓰고 시간을 새로 센다 (쌓이지는 않는다). */
  apply(target, type, power, source) {
    const spec = this.spec(type);
    if (!target || target.dead || !spec) return;
    // 해독제 해독 상태 — 새로 안 걸린다
    if (target.wardTimer > 0) return;
    // 거점 안의 플레이어에게는 새로 안 걸린다 — 이미 걸린 것은 그대로 tick 한다
    if (typeof Village !== 'undefined' && Village.isSafe && typeof Game !== 'undefined'
        && target === Game.player && Village.isSafe(target.x, target.y)) return;
    const time = spec.time;

    if (!target.status) target.status = {};
    const dmg = spec.ratio ? Math.max(1, Math.round(power * spec.ratio)) : 0;
    const cur = target.status[type];
    target.status[type] = {
      time: time,
      tick: spec.tick || 0,
      next: cur ? Math.min(cur.next, spec.tick || 0) : (spec.tick || 0),
      dmg: cur ? Math.max(cur.dmg, dmg) : dmg,
      source: source || null,
    };
    if (!cur) {
      FX.number(target.x, target.y - 26, spec.name, spec.color);
      FX.burst(target.x, target.y - 4, 6, [spec.color, '#ffffff'], { speed: 26, life: 0.4, gravity: -20, size: 1 });
    }
  },

  has(target, type) { return !!(target.status && target.status[type]); },
  clear(target) { target.status = {}; },

  // 걸음·손이 얼마나 느려지나 (빙결)
  speedScale(target) {
    return this.has(target, 'freeze') ? CONFIG.status.list.freeze.slow : 1;
  },

  // 받는 피해 배수 (감전)
  damageTaken(target) {
    return this.has(target, 'shock') ? CONFIG.status.list.shock.amp : 1;
  },

  // 자연 회복이 막혔는가 (중독·화상) — 강장제가 도는 동안은 안 막힌다
  blocksRegen(target) {
    if (target.tonicTimer > 0) return false;
    if (!target.status) return false;
    for (const type in target.status) if (this.spec(type).blockRegen) return true;
    return false;
  },

  /* 매 프레임 — 시간을 깎고, 지속 피해를 넣고, 알갱이를 띄운다.
     몬스터가 지속 피해로 죽으면 평소 죽음과 같은 길(die)을 타야 드랍·의뢰가 돈다. */
  update(target, dt, isPlayer) {
    const st = target.status;
    if (!st) return;
    for (const type in st) {
      const s = st[type], spec = this.spec(type);
      s.time -= dt;

      if (s.tick > 0 && s.dmg > 0) {
        s.next -= dt;
        if (s.next <= 0) {
          s.next = s.tick;
          this.hurt(target, s.dmg, spec, isPlayer, s.source);
        }
      }

      // 몸에서 피어오르는 알갱이 — 무엇이 걸렸는지 멀리서도 보인다
      if (Math.random() < spec.puff) {
        FX.burst(target.x + Util.rand(-5, 5), target.y - Util.rand(0, 8), 1, spec.puffColors,
          { speed: spec.rise ? 10 : 4, life: 0.5, gravity: spec.rise ? -34 : 10, size: 1 });
      }

      if (s.time <= 0) delete st[type];
      if (target.dead) return;
    }
  },

  hurt(target, dmg, spec, isPlayer, source) {
    if (isPlayer) {
      // 상태이상만으로는 죽지 않는다 — 체력 1 아래로는 안 내려간다
      const hit = Math.min(dmg, Math.max(0, target.hp - 1));
      if (hit > 0) {
        target.hp -= hit;
        FX.number(target.x + Util.rand(-6, 6), target.y - 12, '-' + hit, spec.color);
      }
      target.sinceCombat = 0;
      return;
    }
    target.hp -= dmg;
    target.showHp = 2.0;
    FX.number(target.x + Util.rand(-4, 4), target.y - 10 - target.radius, dmg, spec.color);
    if (target.hp <= 0 && !target.dead) target.die(source || Game.player);
  },

  /* 머리 위 작은 표 — 걸린 것마다 색 네모 하나. 글자를 쓰기엔 자리가 없다 */
  drawMarks(ctx, target, sx, topY) {
    const st = target.status;
    if (!st) return;
    const types = Object.keys(st);
    if (!types.length) return;
    let x = sx - (types.length * 4 - 1) / 2;
    for (const type of types) {
      const spec = this.spec(type);
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, topY - 12, 4, 4);
      ctx.fillStyle = spec.color;
      ctx.fillRect(x, topY - 11, 2, 2);
      x += 4;
    }
  },

  /* 플레이어 HUD — 남은 시간이 보이는 칩 한 줄 */
  drawHud(ctx, player, x, y) {
    const st = player.status;
    if (!st) return;
    for (const type in st) {
      const spec = this.spec(type), s = st[type];
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, y - 1, 8, 8);
      ctx.fillStyle = spec.color;
      ctx.fillRect(x, y, 6, 6);
      // 남은 시간을 아래에서부터 어둡게 덮어 모래시계처럼 보이게
      const gone = Math.round(6 * (1 - s.time / (spec.time || 1)));
      if (gone > 0) {
        ctx.fillStyle = 'rgba(10,12,10,0.65)';
        ctx.fillRect(x, y + 6 - gone, 6, gone);
      }
      UI.drawText(ctx, spec.short, x + 9, y, spec.color);
      x += 9 + UI.textWidth(spec.short) + 4;
    }
  },
};

  <script>
// ── js/forge.js
'use strict';

/* 대장간 — 무기에 속성을 박아 넣는다 (로드맵 8주차).

   전리품은 지금까지 '팔 것'이기만 했다. 여기서 **재료**가 된다 —
   상인 옆 모루 앞에서 F 를 누르면 대장장이가 무기에 속성 하나를 입혀준다.

     FLAME 불꽃  때릴 때마다 화상
     FROST 서리  확률로 빙결
     SHOCK 뇌전  확률로 감전
     VENOM 맹독  때릴 때마다 중독

   속성이 붙은 무기는 **추가 피해**도 준다. 그 피해는 **몬스터마다 다르다** —
   버섯은 불에 약하고, 선인장은 불에 강하고 서리에 약하다.
   그래서 "숲에서는 불, 사막에서는 서리"처럼 **갈 곳에 맞춰 무기를 바꿔 끼게** 된다.

   속성은 무기 한 자루에 하나다. 새로 박으면 먼저 것이 지워진다. 빼는 것은 공짜. */

const Forge = {
  open: false,
  cursor: 0,
  message: '',
  messageTimer: 0,
  npc: null,

  reset() {
    this.open = false;
    this.cursor = 0;
    this.message = '';
    this.messageTimer = 0;
  },

  spec(id) { return CONFIG.forge.elements[id]; },

  // 그 몬스터가 이 속성에 약한가 (1.6 약점 / 1.0 보통 / 0.4 강함)
  affinity(type, element) {
    const row = CONFIG.forge.affinity[type];
    return (row && row[element]) || 1;
  },

  /* ── 대장간 세우기 — 상인 반대편, 게시판과 나란히 ──
     거점 10주차: 보스 하나를 잡기 전에는 모루만 있고 대장장이가 없다. */
  place() {
    const s = Village.spot('forge'), x = s.x, y = s.y;
    const anvil = World.addProp(SPRITES.anvil, x, y, { solid: [9, 3, 5], footHeight: 3 });
    anvil.anvil = true;
    anvil.sign = { text: 'FORGE', color: '#ff8a3c', dy: 24 };
    World.anvil = anvil;
    World.smith = null;
    this.npc = null;
    // 조건을 채웠으면 바로 이사 온다 (저장 불러오기·사막 포함)
    if (typeof Village !== 'undefined' && Village.smithHome && !Village.smithHome()) return;
    this.spawnSmith();
  },

  // 마을에 뒤늦게 이사 올 때 (조건을 채운 뒤)
  spawnSmith() {
    if (World.smith) return World.smith;
    const s = Village.spot('forge'), x = s.x, y = s.y;
    const npc = World.addProp(SPRITES.smith[0], x - 16, y - 2, { footHeight: 2 });
    npc.smith = true;
    npc.landmark = 'forge';
    npc.draw = (ctx, cam) => this.drawNpc(ctx, cam, npc);
    this.npc = npc;
    World.smith = npc;
    if (World.buildGrid) World.buildGrid();
    return npc;
  },

  drawNpc(ctx, cam, npc) {
    const sx = Math.round(npc.x - cam.x), sy = Math.round(npc.y - cam.y);
    fillEllipse(ctx, sx + 1, sy + 1, 5, 2.1, 'rgba(10,12,20,0.3)');
    // 4초마다 잠깐 망치질하듯 몸이 숙여진다
    const t = World.time % 2.4;
    const sp = (t > 2.1 && t < 2.3) ? SPRITES.smith[1] : SPRITES.smith[0];
    ctx.drawImage(sp, sx - 8, sy - 14);
    // 모루 쪽에서 가끔 불똥이 튄다
    if (Math.random() < 0.02) {
      FX.burst(npc.x + 16, npc.y - 4, 2, ['#ff8a3c', '#ffe066'], { speed: 22, life: 0.4, gravity: 40, size: 1 });
    }
  },

  drawPrompt(ctx, cam) {
    const n = World.smith;
    if (!n) return;
    const sx = Math.round(n.x - cam.x), sy = Math.round(n.y - cam.y);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  FORGE', sx + 8, sy - 24, '#ff8a3c', true);
  },

  /* ── 값과 재료 ──────────────────────────────────────── */
  goldCost(player) {
    const cfg = CONFIG.forge;
    return Math.round(cfg.goldBase + player.level * cfg.goldPerLevel);
  },

  lootHeld(player, id) {
    let n = 0;
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (s && s.kind === 'loot' && s.id === id) n += s.amount;
    }
    return n;
  },

  takeLoot(player, id, count) {
    let left = count;
    for (let i = 1; i < player.bag.length && left > 0; i++) {
      const s = player.bag[i];
      if (!s || s.kind !== 'loot' || s.id !== id) continue;
      const take = Math.min(s.amount, left);
      s.amount -= take; left -= take;
      if (s.amount <= 0) player.bag[i] = null;
    }
  },

  /* 강화 값 — 지금 든 무기 레벨 기준 */
  upgradeCost(player) {
    const u = CONFIG.forge.upgrade;
    const lv = player.weaponLevel || 1;
    return {
      gold: Math.round(u.goldBase + lv * u.goldPerLevel),
      loot: u.loot,
      need: Math.round(u.lootBase + lv * u.lootPerLevel / 4),
    };
  },

  reforgeCost(item) {
    const r = CONFIG.forge.reforge;
    const lv = (item && item.level) || 1;
    return {
      gold: Math.round(r.goldBase + lv * r.goldPerLevel),
      loot: r.loot,
      need: r.lootBase,
    };
  },

  // 재련할 수 있는 장비 목록 — 가방 + 입고 있는 것
  reforgeTargets(player) {
    const out = [];
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (s && s.kind === 'gear') out.push({ bagIndex: i, item: s });
    }
    for (const slot of CONFIG.gear.slots) {
      const s = player.gear && player.gear[slot];
      if (s) out.push({ slot: slot, item: s });
    }
    return out;
  },

  entries(player) {
    const list = [];
    for (const id in CONFIG.forge.elements) {
      const e = this.spec(id);
      const held = this.lootHeld(player, e.loot);
      list.push({
        id: id, name: e.name, color: e.color,
        loot: CONFIG.loot.items[e.loot].name, need: e.cost, held: held,
        gold: this.goldCost(player),
        worn: player.weaponElement === id,
        ok: held >= e.cost && player.gold >= this.goldCost(player),
      });
    }
    list.push({ id: null, name: 'REMOVE', color: '#8f9aa8', remove: true, ok: !!player.weaponElement });
    // 강화 — 전설 무기도 레벨이 고정이라 똑같이 올릴 수 있다
    const up = this.upgradeCost(player);
    const upHeld = this.lootHeld(player, up.loot);
    const upMax = player.weaponLevel >= CONFIG.forge.upgrade.maxLevel;
    list.push({
      upgrade: true, name: 'UPGRADE ' + player.weaponLabel(), color: '#ffe066',
      loot: CONFIG.loot.items[up.loot].name, need: up.need, held: upHeld,
      gold: up.gold, worn: false,
      maxed: upMax,
      ok: !upMax && upHeld >= up.need && player.gold >= up.gold,
    });
    // 재련 — 장비 하나당 한 줄
    for (const t of this.reforgeTargets(player).slice(0, 6)) {
      const c = this.reforgeCost(t.item);
      const held = this.lootHeld(player, c.loot);
      list.push({
        reforge: true, target: t, name: 'REFORGE ' + Gear.name(t.item).slice(0, 14),
        fullName: Gear.name(t.item), color: Gear.color(t.item),
        loot: CONFIG.loot.items[c.loot].name, need: c.need, held: held,
        gold: c.gold, worn: false,
        ok: held >= c.need && player.gold >= c.gold,
      });
    }
    /* 제작 — 설원 자원으로만 만드는 서리심 한 벌 (로드맵 12주차).
       재료를 하나도 못 모았으면 줄을 띄우지 않는다 — 설원에 가기 전에는 있는 줄도 모른다.
       한 번 설원을 밟아 전리품이 들어오면 그때부터 목록에 뜬다. */
    for (const r of CONFIG.forge.craft.recipes) {
      const spec = Gear.spec(r.id);
      if (!spec) continue;
      const parts = [];
      let have = true, seen = false;
      for (const lootId in r.loot) {
        const held = this.lootHeld(player, lootId);
        if (held > 0) seen = true;
        if (held < r.loot[lootId]) have = false;
        parts.push(CONFIG.loot.items[lootId].name.split(' ')[0] + ' ' + held + '/' + r.loot[lootId]);
      }
      if (!seen && !have) continue;   // 재료를 한 톨도 못 봤으면 숨긴다
      const gold = this.craftGold(player);
      list.push({
        craft: true, recipe: r, name: 'FORGE ' + spec.name.replace('FROSTHEART ', ''),
        fullName: spec.name, color: CONFIG.rarity.list[CONFIG.forge.craft.rarity].color,
        lootText: parts.join('  '), lootOk: have,
        gold: gold, worn: false,
        ok: have && player.gold >= gold,
      });
    }
    return list;
  },

  craftGold(player) {
    const c = CONFIG.forge.craft;
    return Math.round(c.goldBase + player.level * c.goldPerLevel);
  },

  apply(item, player) {
    if (item.craft) {
      const r = item.recipe, spec = Gear.spec(r.id);
      if (!item.lootOk) { this.say('NEED MORE MATERIALS'); Sound.play('error'); return; }
      if (player.gold < item.gold) { this.say('NOT ENOUGH GOLD'); Sound.play('error'); return; }
      // 가방에 자리가 있어야 받는다 (바닥에 떨구면 귀한 것을 잃을 수 있다)
      const made = Gear.roll(r.id, player.level, CONFIG.forge.craft.rarity);
      if (!Inventory.addGear(player, made)) { this.say('BAG IS FULL'); Sound.play('error'); return; }
      for (const lootId in r.loot) this.takeLoot(player, lootId, r.loot[lootId]);
      player.gold -= item.gold;
      Sound.play('levelup');
      FX.burst(player.x, player.y - 4, 30, ['#bfe8ff', '#ffffff'], { speed: 80, life: 0.8, gravity: 10 });
      FX.number(player.x, player.y - 30, spec.name, '#bfe8ff', true);
      this.say('FORGED ' + spec.name);
      return;
    }
    if (item.remove) {
      if (!player.weaponElement) { this.say('NOTHING TO REMOVE'); Sound.play('error'); return; }
      player.weaponElement = null;
      Sound.play('blip');
      this.say('ELEMENT REMOVED');
      return;
    }
    if (item.upgrade) {
      if (player.weaponLevel >= CONFIG.forge.upgrade.maxLevel) { this.say('MAX LEVEL'); Sound.play('error'); return; }
      if (item.held < item.need) { this.say('NEED MORE ' + item.loot); Sound.play('error'); return; }
      if (player.gold < item.gold) { this.say('NOT ENOUGH GOLD'); Sound.play('error'); return; }
      const up = this.upgradeCost(player);
      this.takeLoot(player, up.loot, up.need);
      player.gold -= up.gold;
      player.weaponLevel = Math.min(CONFIG.forge.upgrade.maxLevel, player.weaponLevel + 1);
      player.recalcStats();
      Sound.play('levelup');
      FX.burst(player.x, player.y - 4, 20, ['#ffe066', '#ffffff'], { speed: 60, life: 0.6, gravity: 20 });
      FX.number(player.x, player.y - 30, player.weaponLabel() + '!', '#ffe066');
      this.say('UPGRADED TO L' + player.weaponLevel);
      return;
    }
    if (item.reforge) {
      if (item.held < item.need) { this.say('NEED MORE ' + item.loot); Sound.play('error'); return; }
      if (player.gold < item.gold) { this.say('NOT ENOUGH GOLD'); Sound.play('error'); return; }
      const t = item.target;
      const src = t.bagIndex !== undefined ? player.bag[t.bagIndex] : player.gear[t.slot];
      if (!src || src.kind !== 'gear') { this.say('GEAR IS GONE'); Sound.play('error'); return; }
      const c = this.reforgeCost(src);
      this.takeLoot(player, c.loot, c.need);
      player.gold -= c.gold;
      // 등급·개수는 그대로, 값만 다시 굴린다
      const fresh = Gear.roll(src.id, src.level, src.rarity);
      if (fresh) {
        src.affixes = fresh.affixes;
        player.recalcStats();
      }
      Sound.play('levelup');
      FX.burst(player.x, player.y - 4, 18, [Gear.color(src), '#ffffff'], { speed: 55, life: 0.6, gravity: 20 });
      FX.number(player.x, player.y - 30, Gear.name(src), Gear.color(src));
      this.say('REFORGED ' + Gear.spec(src.id).name);
      return;
    }
    if (item.worn) { this.say('ALREADY FORGED'); Sound.play('error'); return; }
    if (item.held < item.need) { this.say('NEED MORE ' + item.loot); Sound.play('error'); return; }
    if (player.gold < item.gold) { this.say('NOT ENOUGH GOLD'); Sound.play('error'); return; }

    const e = this.spec(item.id);
    this.takeLoot(player, e.loot, e.cost);
    player.gold -= item.gold;
    player.weaponElement = item.id;

    Sound.play('levelup');
    FX.burst(player.x, player.y - 4, 24, [e.color, '#ffffff'], { speed: 70, life: 0.7, gravity: 20 });
    FX.number(player.x, player.y - 30, e.name + ' ' + player.weaponSpec().name, e.color);
    this.say('FORGED ' + e.name);
  },

  say(text) { this.message = text; this.messageTimer = 1.8; },

  openForge() {
    this.open = true;
    this.cursor = 0;
    this.message = '';
    Sound.play('shopOpen');
  },

  close() {
    this.open = false;
    Sound.play('shopClose');
  },

  handleInput(player) {
    this.messageTimer = Math.max(0, this.messageTimer - 1 / 60);
    if (this.messageTimer <= 0) this.message = '';
    const list = this.entries(player), P = Input.pressed;
    if (P.KeyW || P.ArrowUp) this.cursor = (this.cursor + list.length - 1) % list.length;
    if (P.KeyS || P.ArrowDown) this.cursor = (this.cursor + 1) % list.length;
    if (P.Space || P.Enter) {
      this.apply(list[this.cursor], player);
      delete P.Space; delete P.Enter;
    }
    if (P.KeyF || P.Escape) { this.close(); delete P.KeyF; }
  },

  /* ── 창 ──────────────────────────────────────────────── */
  draw(ctx, player) {
    const list = this.entries(player);
    this.cursor = Util.clamp(this.cursor, 0, Math.max(0, list.length - 1));
    const w = 214, h = Math.min(190, 52 + list.length * 13 + 22);
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#ff8a3c');
    UI.divider(ctx, x + 6, y + 15, w - 12);
    UI.drawText(ctx, 'FORGE', x + w / 2, y + 6, '#ff8a3c', true);

    // 지금 든 무기와 박혀 있는 속성
    const el = player.weaponElement ? this.spec(player.weaponElement) : null;
    UI.drawText(ctx, player.weaponLabel(), x + 8, y + 19, player.weaponColor());
    const cur = el ? el.name : 'NO ELEMENT';
    UI.drawText(ctx, cur, x + w - 10 - UI.textWidth(cur), y + 19, el ? el.color : '#5f6b59');

    /* 줄이 많아져서(속성 넷 + 해제 + 강화 + 재련 여섯 + 제작 셋) 창 하나에 다 안 들어간다.
       커서를 따라 목록이 흐르게 하고, 위아래에 더 있다는 표시를 둔다 */
    const rowY = y + 32, rowH = 13;
    const rows = Math.max(1, Math.floor((h - 56) / rowH));
    const top = Util.clamp(this.cursor - Math.floor(rows / 2), 0, Math.max(0, list.length - rows));
    if (top > 0) UI.drawText(ctx, '-', x + w / 2, rowY - 8, '#7f6a52', true);
    if (top + rows < list.length) UI.drawText(ctx, '-', x + w / 2, rowY + rows * rowH - 3, '#7f6a52', true);

    for (let i = top; i < Math.min(list.length, top + rows); i++) {
      const it = list[i], ry = rowY + (i - top) * rowH;
      if (i === this.cursor) {
        ctx.fillStyle = 'rgba(255,138,60,0.12)';
        ctx.fillRect(x + 6, ry - 3, w - 12, rowH - 1);
        UI.drawText(ctx, '>', x + 9, ry, '#ff8a3c');
      }
      UI.drawText(ctx, it.name, x + 18, ry, it.worn ? '#9be564' : it.color);
      if (it.remove) {
        UI.drawText(ctx, 'FREE', x + w - 12 - UI.textWidth('FREE'), ry, it.ok ? '#f0d9b5' : '#6f7a68');
        continue;
      }
      if (it.maxed) {
        UI.drawText(ctx, 'MAX', x + w - 12 - UI.textWidth('MAX'), ry, '#6f7a68');
        continue;
      }
      // 제작은 재료가 둘이라 한 줄로 이어 붙인다
      if (it.craft) {
        UI.drawText(ctx, it.lootText, x + 62, ry, it.lootOk ? '#7fa86a' : '#c05a5a');
        const cp = it.gold + ' G';
        UI.drawText(ctx, cp, x + w - 12 - UI.textWidth(cp), ry, player.gold >= it.gold ? CONFIG.gold.color : '#c05a5a');
        continue;
      }
      // 재료와 값 — 모자라면 붉게
      const mat = it.loot + ' ' + it.held + '/' + it.need;
      UI.drawText(ctx, mat, x + 56, ry, it.held >= it.need ? '#7fa86a' : '#c05a5a');
      const price = it.worn ? 'ON' : it.gold + ' G';
      UI.drawText(ctx, price, x + w - 12 - UI.textWidth(price), ry,
        it.worn ? '#9be564' : (player.gold >= it.gold ? CONFIG.gold.color : '#c05a5a'));
    }

    const footY = y + h - 19;
    if (this.message) UI.drawText(ctx, this.message, x + w / 2, footY, '#9be564', true);
    else UI.drawText(ctx, 'W S SELECT   SPACE FORGE', x + w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 8, '#5f6b59', true);
  },
};

</script>
  <script>
// ── js/elite.js
'use strict';

/* 엘리트 몬스터 — 길에서 갑자기 만나는 강화 개체 (로드맵 9주차).

   맵에 250마리가 돌아다니는데 전부 똑같으면 사냥은 배경음이 된다.
   그중 몇 마리에 **접두사**를 붙여 "어, 저거"를 만든다.

     SWIFT     날쌘    훨씬 빠르다. 도망칠 수 없다 (대신 물렁하다)
     TOUGH     단단한  밀리지 않는다. 치고 빠지는 수법이 안 통한다
     BURNING   불타는  닿으면 화상, 죽을 때 불꽃이 퍼진다 (주변 몬스터까지 탄다)
     SPLITTING 분열하는 죽으면 같은 종류 둘로 갈라진다

   엘리트는 **보스가 아니다.** 보스는 동굴에 들어가 약속하고 싸우지만
   엘리트는 길에서 마주친다. 그래서 숫자를 보스만큼 올리지 않았다 —
   체력 2.6배 정도라 피해 갈 수도 있고, 붙어볼 수도 있다.

   대신 보상은 확실하게 올렸다. 경험치 4배, 골드 3배, 전리품 2배,
   그리고 **장비는 RARE 이상이 확정으로 떨어진다.** 그 한 번이 "쫓아가 볼까"를 만든다.

   이 파일은 종류별 파일(slime / wolf / …)을 건드리지 않는다 —
   능력치 표를 곱하고, 바닥에 고리를 그리고, 죽을 때를 가로채는 일만 한다.
   그래서 몬스터가 더 늘어도 엘리트는 공짜로 따라온다. */

const Elite = {
  spec(enemy) { return enemy && enemy.elite ? CONFIG.elite.prefixes[enemy.elite] : null; },

  // 접두사 하나만 뽑는다 (확률은 보지 않는다 — 습격대처럼 '엘리트로 정해진' 자리에서 쓴다)
  rollPrefix() {
    const ids = Object.keys(CONFIG.elite.prefixes);
    return ids[Util.weightedIndex(ids.map(id => CONFIG.elite.prefixes[id].weight))];
  },

  /* 스폰할 때 한 번 굴린다 — 접두사 하나, 또는 평범하면 null.
     mult 는 확률 배수다 (밤·모래폭풍이 엘리트를 더 자주 불러낸다). */
  roll(level, mult) {
    const cfg = CONFIG.elite;
    if (level < cfg.minLevel) return null;          // 시작점 바로 옆은 배우는 자리다
    if (Math.random() >= cfg.chance * (mult || 1)) return null;
    return this.rollPrefix();
  },

  /* 평범한 개체를 엘리트로 바꾼다.
     능력치 표(stats)는 한 마리씩 복사해 두었으므로 여기서 곱해도
     같은 레벨의 다른 개체는 그대로다. */
  make(enemy, prefixId) {
    const cfg = CONFIG.elite, p = cfg.prefixes[prefixId];
    if (!enemy || !p) return enemy;
    enemy.elite = prefixId;

    const s = enemy.stats;
    const mul = (key, a, b) => {
      if (s[key] === undefined) return;
      const v = s[key] * (a || 1) * (b === undefined ? 1 : b);
      // 쏘는 간격만 소수로 둔다 (나머지는 정수여야 데미지 숫자가 깔끔하다)
      s[key] = key === 'interval' ? +v.toFixed(2) : Math.max(1, Math.round(v));
    };
    mul('hp', cfg.hp, p.hp);
    mul('atk', cfg.atk, p.atk);
    mul('xp', cfg.xp, p.xp);
    mul('speed', p.speed);
    mul('lunge', p.speed);        // 늑대의 돌진 속도도 같이 오른다
    mul('interval', p.interval);  // 버섯·선인장이 쏘는 간격 (작을수록 자주)
    mul('knockback', p.knockback);

    enemy.maxHp = s.hp;
    enemy.hp = s.hp;
    // 덩치 — 멀리서도 '저건 다르다'가 먼저 보인다
    s.scale = +(s.scale * cfg.scale * (p.scale || 1)).toFixed(3);
    enemy.scale = s.scale;
    enemy.radius = 7 * s.scale;
    enemy.auraT = Math.random() * Math.PI * 2;
    return enemy;
  },

  /* ── 접두사가 하는 일 ──────────────────────────────────── */

  // 닿았을 때 — 불타는 엘리트는 화상을 옮긴다
  onTouch(enemy, player) {
    const p = this.spec(enemy);
    if (!p || !p.burn) return;
    Status.apply(player, 'burn', enemy.stats.atk * CONFIG.status.monsterBurn, enemy);
  },

  // 죽을 때 — 불꽃이 퍼지거나, 둘로 갈라진다
  onDie(enemy, player) {
    const p = this.spec(enemy);
    if (!p) return;
    FX.ring(enemy.x, enemy.y + 2, enemy.radius + 6, p.color);
    FX.number(enemy.x, enemy.y - 32, p.name + ' SLAIN', p.color, true);
    FX.addShake(3);
    if (p.burn) this.nova(enemy, p, player);
    if (p.split) this.split(enemy, p);
  },

  /* 불타는 엘리트가 죽으며 터뜨리는 불.
     가까이 붙어 있으면 플레이어도 탄다 — 마지막 일격을 넣고 물러서게 만든다.
     **주변 몬스터도 같이 탄다.** 떼로 몰려 있을 때 불이 옮겨 붙으면서 한몫 한다
     (불로 죽은 것도 공은 플레이어에게 간다). */
  nova(enemy, p, player) {
    FX.burst(enemy.x, enemy.y - 2, 30, ['#ff8a3c', '#ffd27a', '#c93f3f'], { speed: 95, life: 0.7, gravity: -10 });
    FX.ring(enemy.x, enemy.y + 2, p.novaRadius, '#ff8a3c');
    Sound.play('heavy');
    const pl = Game.player;
    if (pl && !pl.dead && Util.dist(pl.x, pl.y, enemy.x, enemy.y) < p.novaRadius) {
      Status.apply(pl, 'burn', enemy.stats.atk * CONFIG.status.monsterBurn, enemy);
    }
    for (const s of Game.enemies) {
      if (s === enemy || s.dead) continue;
      if (Util.dist(s.x, s.y, enemy.x, enemy.y) > p.novaRadius) continue;
      Status.apply(s, 'burn', enemy.stats.atk, player || pl);
    }
  },

  /* 분열 — 같은 종류의 **평범한** 개체 둘로 갈라진다.
     갈라진 것은 엘리트가 아니므로 또 갈라지지는 않는다 (끝없이 늘어나면 안 된다). */
  split(enemy, p) {
    const make = Game.ENEMY_TYPES[enemy.TYPE];
    if (!make) return;
    const lv = Math.max(1, enemy.level - p.splitLevelBelow);
    for (let i = 0; i < p.split; i++) {
      const base = (i / p.split) * Math.PI * 2 + Math.random();
      // 한 방향만 보면 나무에 막혀 한 마리가 안 나온다 — 각도와 거리를 같이 흔들어 찾는다.
      // 끝까지 빈 자리가 없으면 죽은 자리에 그냥 놓는다 (unstick 이 알아서 빼낸다)
      let x = enemy.x, y = enemy.y;
      search:
      for (let r = 12; r <= 44; r += 8) {
        for (const off of [0, 0.7, -0.7, 1.5, -1.5, Math.PI]) {
          const cx = enemy.x + Math.cos(base + off) * r, cy = enemy.y + Math.sin(base + off) * r;
          if (!World.isFreeSpot(cx, cy, 9)) continue;
          x = cx; y = cy;
          break search;
        }
      }
      Game.enemies.push(make(x, y, lv));
      FX.burst(x, y, 10, [enemy.palette.M, p.color], { speed: 50, life: 0.4 });
    }
    Sound.play('split');
  },

  /* ── 보이기 ────────────────────────────────────────────── */

  /* 발밑을 도는 점 고리. 몸 그림에는 손대지 않으므로 종류가 늘어도 공짜로 따라온다.
     도트가 돌아가는 것만으로 "저건 평범한 놈이 아니다"가 읽힌다. */
  drawAura(ctx, enemy, sx, sy) {
    const p = this.spec(enemy);
    if (!p) return;
    const t = World.time * 1.6 + (enemy.auraT || 0);
    const r = enemy.radius + 4;
    ctx.save();
    ctx.globalAlpha = 0.8 + Math.sin(t * 2) * 0.2;
    // 글자처럼 검은 그림자를 한 겹 깔아야 풀밭 위에서도 고리가 읽힌다
    for (const [c, o] of [['#120f0b', 1], [p.color, 0]]) {
      ctx.fillStyle = c;
      for (let i = 0; i < 12; i++) {
        const a = t + (i / 12) * Math.PI * 2;
        ctx.fillRect(Math.round(sx + Math.cos(a) * r) + o, Math.round(sy + 7 + Math.sin(a) * r * 0.42) + o, 2, 2);
      }
    }
    ctx.restore();
    if (Math.random() < 0.28) {
      FX.burst(enemy.x + Util.rand(-4, 4), enemy.y - Util.rand(0, 8), 1, [p.color, '#ffffff'],
        { speed: 10, life: 0.5, gravity: -26, size: 1 });
    }
  },

  // 머리 위 이름표 — 별 하나와 접두사. 레벨 줄은 그 아래에 그대로 남는다
  drawName(ctx, enemy, sx, y) {
    const p = this.spec(enemy);
    if (!p) return;
    UI.drawText(ctx, '^ ' + p.name, sx, y, p.color, true);
  },

  /* 화면 밖에 엘리트가 있으면 가장자리에 그 색 별을 띄운다 — "어, 저거"가 생기는 자리.
     가까운 것만(markerRange) 알려주므로 지도가 별로 뒤덮이지 않는다.
     안개는 따지지 않는다 — 이 거리면 보이든 안 보이든 기척이 느껴질 자리고,
     못 가본 쪽을 가리킬 때는 그게 가볼 이유가 된다. */
  drawMarkers(ctx, cam, enemies, player) {
    const range = CONFIG.elite.markerRange;
    for (const e of enemies) {
      if (e.dead || !e.elite) continue;
      const p = this.spec(e);
      if (!p) continue;
      if (Util.dist(e.x, e.y, player.x, player.y) > range) continue;
      const sx = e.x - cam.x, sy = e.y - cam.y;
      // 화면 안에 몸이 보이면 굳이 가리키지 않는다
      if (sx > 8 && sx < CONFIG.VIEW_W - 8 && sy > 18 && sy < CONFIG.VIEW_H - 8) continue;
      UI.drawText(ctx, '^', Util.clamp(sx, 10, CONFIG.VIEW_W - 10), Util.clamp(sy, 20, CONFIG.VIEW_H - 14), p.color, true);
    }
  },

  // 미니맵 점 색 (엘리트는 난이도 색 대신 접두사 색으로 찍는다)
  dotColor(enemy) {
    const p = this.spec(enemy);
    return p ? p.color : '#ffffff';
  },
};

</script>
  <script>
// ── js/village.js
'use strict';

/* 거점 — 상인 옆을 마을로 키운다 (로드맵 10주차).

   마을은 "돌아오는 곳"이다. 사냥을 나가 전리품을 모아 오면
   팔고(상인) · 박고(대장간) · 빚고(연금술사) · 맡기고(창고) 다시 나간다.

     대장장이  강화·재련·속성 부여 — 보스 하나를 잡아야 이사 온다
     연금술사  포션·해독제 제작 — 전리품 50개를 팔아야 이사 온다
     창고      가방 밖 보관 — 처음부터 있다 (맡기는 데 조건은 없다)
     귀환      T 를 누르면 마을 시작점으로 돌아온다 (보스 방 안에서는 안 된다)

   테라리아처럼 조건을 걸어 "마을이 커지는 맛"을 준다.
   조건을 채운 뒤 마을에 가면 새 집과 함께 알림이 뜬다. */

const Village = {
  /* ── 마을 자리표 ─────────────────────────────────────────
     **마을의 모든 좌표는 여기 한 곳에서 정한다.** 상인·게시판·대장간·비석은
     각자 파일에서 세우지만 자리는 이 표를 읽어 간다 (Village.spot).

     안전구역은 시작점에서 가로 ±96 · 세로 ±64 다. 예전에는 창고·게시판·비석이
     한가운데 몰려 있어서 들어서자마자 간판과 이름표가 겹쳐 읽기 어려웠다.
     그래서 **쓰는 것은 전부 울타리 안쪽(14~20px)에 붙이고 가운데를 비웠다.**
     들어서면 모닥불 하나만 있는 빈 마당이고, 볼일은 가장자리를 한 바퀴 도는 길에 있다.

     입구를 막지 않도록 비워 둔 자리
       남문  |x| < 26  (y = +64)  — 들어서는 길
       동문  |y| < 20  (x = +96)  — 대장간 쪽 쪽문 */
  SPOTS: {
    stash:     { x: -34, y: -46 },   // 북 (좌)
    board:     { x:  14, y: -46 },   // 북 (우)
    shop:      { x:  64, y: -32 },   // 북동 — 가판대는 이 자리 16px 뒤에 선다
    forge:     { x:  78, y:  40 },   // 동 (남쪽) — 대장장이는 16px 왼쪽
    alchemy:   { x: -40, y:  48 },   // 남 (좌) — 연금술사는 14px 왼쪽
    portal:    { x: -80, y:   4 },   // 서
    houseA:    { x: -78, y: -44 },   // 북서 모서리
    houseB:    { x: -80, y:  44 },   // 남서 모서리
    campfire:  { x:   0, y:  16 },   // 가운데 마당 — 길잡이이자 밤의 불빛
    log:       { x:  44, y:  50 },   // 장식 (지나갈 수 있다)
    stump:     { x:  86, y: -50 },   // 장식 (막힌다)
  },

  // 자리표의 상대 좌표를 그 맵의 실제 좌표로
  spot(key) {
    const s = this.SPOTS[key] || { x: 0, y: 0 };
    return { x: World.startX + s.x, y: World.startY + s.y };
  },

  // 창고 내용물 — 기어/무기/전리품을 그대로 둔다 (포션 주머니는 못 맡긴다)
  stash: [],
  // 지금까지 판 전리품 개수 (값이 아니라 개수 — 연금술사 이사 조건)
  lootSold: 0,
  // 이사 알림을 이미 띄웠는가 (세션당 한 번 + 저장에 남긴다)
  announced: {},

  // 창고 창 상태
  stashOpen: false,
  stashCursor: 0,
  stashMessage: '',
  stashTimer: 0,

  // 연금술 창 상태
  alchemyOpen: false,
  alchemyCursor: 0,
  alchemyMessage: '',
  alchemyTimer: 0,

  alchemist: null,
  stashChest: null,
  bench: null,        // 연금 탁자 (간판을 띄우려고 들고 있는다)
  zone: null,         // 지금 맵의 안전구역 {cx,cy,x0,y0,x1,y1}
  zones: {},          // 맵마다 { forest: zone, desert: zone } — 오가도 남는다

  reset() {
    this.stash = [];
    this.lootSold = 0;
    this.announced = {};
    this.stashOpen = false;
    this.stashCursor = 0;
    this.stashMessage = '';
    this.stashTimer = 0;
    this.alchemyOpen = false;
    this.alchemyCursor = 0;
    this.alchemyMessage = '';
    this.alchemyTimer = 0;
    this.alchemist = null;
    this.stashChest = null;
    this.bench = null;
    this.zone = null;
    this.zones = {};
  },

  /* ── 안전구역 ────────────────────────────────────────────
     시작점을 중심으로 한 직사각형. 안에는 몬스터가 들어오지 못한다.
     울타리가 경계를 보여주고, 입구 빈틈은 플레이어만 드나든다 (몬스터는 논리로 막는다). */
  zoneFor(mapId) {
    const id = mapId || World.mapId;
    if (this.zones[id]) return this.zones[id];
    // 불러오기 순서 등으로 zones 가 비어 있어도, 현재 맵 구역은 World 가 들고 있다
    if (World.mapId === id && World.villageZone) return World.villageZone;
    return null;
  },

  // 시작점에서 구역 사각형을 구한다 — World.init 이 나무·돌을 심기 전에 먼저 불러 둔다
  rectFor(cx, cy) {
    const rx = CONFIG.village.safeRX, ry = CONFIG.village.safeRY;
    return { cx: cx, cy: cy, x0: cx - rx, y0: cy - ry, x1: cx + rx, y1: cy + ry };
  },

  // 점이 구역 안에 있는가 (margin 만큼 바깥까지 포함)
  inRect(x, y, r, margin) {
    if (!r) return false;
    const m = margin || 0;
    return x >= r.x0 - m && x <= r.x1 + m && y >= r.y0 - m && y <= r.y1 + m;
  },

  // 맵을 갈아끼운 뒤 (텔레포트 복원·동굴 출입) 현재 맵 구역을 다시 가리킨다
  syncZone() {
    this.zone = this.zones[World.mapId] || null;
  },

  // margin 만큼 구역을 바깥으로 넓혀 본다 — 몬스터는 몸통(반지름)째로 못 들어오게 한다
  isSafe(x, y, margin) {
    if (World.isArena) return false;
    const z = this.zoneFor();
    if (!z) return false;
    const m = (margin || 0) - 2;   // 평소 2px 안쪽 여유는 그대로 둔다
    return x >= z.x0 - m && x <= z.x1 + m && y >= z.y0 - m && y <= z.y1 + m;
  },

  // 바깥에서 안으로 들어가는 발걸음인가 (안에 있던 것은 나가는 길이라 막지 않는다).
  // from 은 진짜 구역으로만 보고, to 는 몸통 마진까지 넓혀 본다 —
  // 선 바깥에 붙어 있는 놈이 "안쪽"으로 분류돼 스며들 틈이 없게 한다.
  blocksEntry(fromX, fromY, toX, toY, margin) {
    if (World.isArena) return false;
    if (this.isSafe(fromX, fromY)) return false;
    return this.isSafe(toX, toY, margin);
  },

  /* ── 이사 조건 ─────────────────────────────────────────── */

  bossCount() {
    if (!Game || !Game.bossSlain) return 0;
    return Object.keys(Game.bossSlain).length;
  },

  smithHome() {
    return this.bossCount() >= (CONFIG.village ? CONFIG.village.smithNeedBoss : 1);
  },

  alchemistHome() {
    return this.lootSold >= (CONFIG.village ? CONFIG.village.alchemistNeedLootSold : 50);
  },

  /* ── 마을 세우기 ─────────────────────────────────────────
     World.init 에서 상인·게시판·대장간 다음에 호출된다.
     시작점 주위는 나무·물이 비워져 있으므로 그 안에 마을을 놓는다.
     울타리가 안전구역 경계를 두르고, 남·동쪽에 입구를 낸다. */
  place() {
    this.alchemist = null;
    this.stashChest = null;
    this.bench = null;
    const sx = World.startX, sy = World.startY;

    // 안전구역 확정 — World.init 이 먼저 잡아둔 값을 그대로 쓴다 (나무·돌 제외와 같은 값)
    this.zone = World.villageZone
      ? { cx: sx, cy: sy, x0: World.villageZone.x0, y0: World.villageZone.y0, x1: World.villageZone.x1, y1: World.villageZone.y1 }
      : this.rectFor(sx, sy);
    this.zones[World.mapId] = this.zone;

    // 모닥불 — 빈 마당 한가운데 (충돌 없음, 길잡이이자 밤의 불빛)
    try {
      const f = this.spot('campfire');
      if (SPRITES.campfire) World.addProp(SPRITES.campfire, f.x, f.y, { footHeight: 2 });
    } catch (err) { /* 장식 실패는 무시 */ }

    // 집 두 채 — 서쪽 두 모서리에 붙여 마당을 비운다
    try {
      if (SPRITES.tent) {
        const a = this.spot('houseA'), b = this.spot('houseB');
        World.addProp(SPRITES.tent[0], a.x, a.y, { solid: [10, 4, 6], footHeight: 3 });
        World.addProp(SPRITES.tent[1], b.x, b.y, { solid: [10, 4, 6], footHeight: 3 });
      }
    } catch (err) { /* 무시 */ }

    // 장식 — 통나무(지나감)와 그루터기(막힘) 하나씩, 마을답게
    try {
      const l = this.spot('log'), s2 = this.spot('stump');
      if (SPRITES.log) World.addProp(SPRITES.log[0], l.x, l.y, { footHeight: 2 });
      if (SPRITES.stump) World.addProp(SPRITES.stump[0], s2.x, s2.y, { solid: [5, 3, 5], footHeight: 3 });
    } catch (err) { /* 무시 */ }

    // 창고 — 북쪽 울타리 안쪽, 처음부터 있다
    try {
      const s3 = this.spot('stash');
      const c = World.addProp(SPRITES.chest[0], s3.x, s3.y, { solid: [6, 3, 4], footHeight: 3 });
      c.stashChest = true;
      c.landmark = 'stash';
      c.sign = { text: 'STASH', color: '#9fe8ff', dy: 22 };
      c.draw = (ctx, cam) => this.drawStash(ctx, cam, c);
      this.stashChest = c;
      World.stashChest = c;
    } catch (err) { /* 무시 */ }

    // 연금술사 — 남쪽 울타리 안쪽. 조건을 채워야 이사 오고, 비어 있을 땐 빈 탁자만 둔다
    try {
      const s4 = this.spot('alchemy');
      const bench = World.addProp(SPRITES.stall || SPRITES.chest[0], s4.x, s4.y, { solid: [10, 3, 5], footHeight: 3 });
      bench.alchemyBench = true;
      bench.sign = { text: 'ALCHEMY', color: '#c79ce8', dy: 36 };   // 탁자 차양 위로
      this.bench = bench;
      if (this.alchemistHome()) {
        this.spawnAlchemist(s4.x - 14, s4.y - 2);
      } else {
        World.alchemist = null;
      }
    } catch (err) { /* 무시 */ }

    // 울타리 — 경계를 두르고 남·동쪽에 입구를 낸다. 입구 옆에는 화톳불(충돌 없음)
    try { this.buildFence(sx, sy, this.zone.x1 - sx, sy - this.zone.y0); } catch (err) { /* 무시 */ }

    // 대장장이가 아직 안 왔으면 모루만 둔다 — Forge.place 가 NPC를 생략한다
    this.checkMoveIns(true);
  },

  /* 울타리 — 북·서쪽은 막고, 남쪽 가운데와 동쪽 가운데는 입구로 비운다.
     울타리 자체는 플레이어도 못 넘는다 (입구로 돌아가게). 몬스터는 입구까지 논리로 막는다.
     동·서쪽은 세로 울타리를 쓴다 — 가로 울타리를 세우면 충돌에 7px 틈새가 생겨
     발이 작은 것이 그 틈으로 새어든다. 세로 울타리는 14px 간격·12px 충돌로 틈이 없다. */
  buildFence(sx, sy, rx, ry) {
    if (!SPRITES.fence) return;
    const cfg = CONFIG.village;
    const fenceV = SPRITES.fenceV || SPRITES.fence;
    const x0 = sx - rx, x1 = sx + rx, y0 = sy - ry, y1 = sy + ry;
    const step = 16, vstep = 14;
    // 북쪽 — 빈틈 없음
    for (let x = x0; x < x1; x += step) {
      World.addProp(SPRITES.fence, Math.min(x + 8, x1 - 2), y0, { solid: [8, 4, 5], footHeight: 3 }).fence = true;
    }
    // 남쪽 — 가운데를 입구로 비운다
    for (let x = x0; x < x1; x += step) {
      const cx = Math.min(x + 8, x1 - 2);
      if (Math.abs(cx - sx) < cfg.gapSouth) continue;
      World.addProp(SPRITES.fence, cx, y1, { solid: [8, 4, 5], footHeight: 3 }).fence = true;
    }
    // 서쪽 — 빈틈 없음 (세로 울타리)
    for (let y = y0 + 6; y < y1; y += vstep) {
      World.addProp(fenceV, x0, Math.min(y + 7, y1 - 2), { solid: [7, 7, 5], footHeight: 3 }).fence = true;
    }
    // 동쪽 — 가운데를 입구로 비운다 (세로 울타리)
    for (let y = y0 + 6; y < y1; y += vstep) {
      const cy = Math.min(y + 7, y1 - 2);
      if (Math.abs(cy - sy) < cfg.gapEast) continue;
      World.addProp(fenceV, x1, cy, { solid: [7, 7, 5], footHeight: 3 }).fence = true;
    }
    // 모서리 기둥 — 가로·세로 울타리가 만나는 네 귀퉁이의 1px 틈새를 막는다
    for (const c of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) {
      World.addProp(SPRITES.fence, c[0], c[1], { solid: [8, 8, 5], footHeight: 3 }).fence = true;
    }
    // 입구 화톳불 — 밤에도 입구가 보이게 (충돌 없음)
    if (SPRITES.campfire) {
      World.addProp(SPRITES.campfire, sx - cfg.gapSouth - 8, y1, { footHeight: 2 }).fenceFire = true;
      World.addProp(SPRITES.campfire, sx + cfg.gapSouth + 8, y1, { footHeight: 2 }).fenceFire = true;
      World.addProp(SPRITES.campfire, x1, sy - cfg.gapEast - 8, { footHeight: 2 }).fenceFire = true;
      World.addProp(SPRITES.campfire, x1, sy + cfg.gapEast + 8, { footHeight: 2 }).fenceFire = true;
    }
  },

  /* 간판 — **마을 안에 있을 때만** 각 시설 위에 이름이 뜬다.

     여섯 개가 울타리를 따라 흩어져 있으니, 들어서는 순간 어디가 무엇인지 한눈에 보여야 한다.
     바깥에서는 안 보인다 (숲 한복판에 글자가 떠다니면 그게 더 어지럽다).
     가까이 가서 F 안내가 뜨는 거리에서는 간판을 감춘다 — 같은 자리에 둘이 겹치지 않게. */
  drawSigns(ctx, cam, player) {
    if (World.isArena || !player || player.dead) return;
    if (!this.isSafe(player.x, player.y, CONFIG.village.signMargin)) return;
    const near = CONFIG.village.interactRange + 8;
    for (const p of World.props) {
      if (!p.sign) continue;
      if (Util.dist(player.x, player.y, p.x, p.y) < near) continue;   // F 안내가 뜰 거리면 비켜준다
      const sx = Math.round(p.x - cam.x), sy = Math.round(p.y - cam.y);
      if (sx < -40 || sx > CONFIG.VIEW_W + 40 || sy < -40 || sy > CONFIG.VIEW_H + 40) continue;
      /* 북쪽 시설은 화면 위에 바짝 붙을 때가 있다 — 그대로 두면 날짜·의뢰 칸과 겹쳐
         둘 다 못 읽는다. 가로 자리는 그대로 두고 높이만 HUD 아래로 내려 붙인다 */
      const y = Math.max(CONFIG.village.signMinY, sy - (p.sign.dy || 26));
      UI.drawText(ctx, p.sign.text, sx, y, p.sign.color, true);
    }
  },

  /* 매 프레임 — 안에 들어와 있는 몬스터를 바깥으로 민다.
     스폰 제외·이동 차단이 본방이고, 이건 넉백·분열처럼 뚫고 들어온 경우의 뒷정리다. */
  update(dt) {
    if (World.isArena || !this.zoneFor() || !Game.enemies) return;
    const z = this.zoneFor();
    const speed = CONFIG.village.pushSpeed;
    for (const e of Game.enemies) {
      if (!e || e.dead || !this.isSafe(e.x, e.y)) continue;
      const dx = e.x - z.cx, dy = e.y - z.cy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      // moveWithCollision 을 타면 안쪽에서 바깥으로는 나갈 수 있다 (차단은 바깥→안쪽만 막는다)
      e.moveWithCollision(dx / d * speed * dt, dy / d * speed * dt);
      // 벽에 끼어 못 나가면 가장 가까운 변 밖으로 꺼낸다
      if (this.isSafe(e.x, e.y)) {
        const outs = [
          { x: z.x0 - 6, y: e.y }, { x: z.x1 + 6, y: e.y },
          { x: e.x, y: z.y0 - 6 }, { x: e.x, y: z.y1 + 6 },
        ];
        let best = outs[0], bd = Infinity;
        for (const o of outs) {
          const dd = Math.abs(o.x - e.x) + Math.abs(o.y - e.y);
          if (dd < bd) { bd = dd; best = o; }
        }
        if (World.isFreeSpot(best.x, best.y, 8)) { e.x = best.x; e.y = best.y; }
      }
    }
  },

  spawnAlchemist(x, y) {
    if (World.alchemist) return World.alchemist;
    const sp = (SPRITES.alchemist && SPRITES.alchemist[0]) || SPRITES.merchant[0];
    const npc = World.addProp(sp, x, y, { footHeight: 2 });
    npc.alchemist = true;
    npc.landmark = 'alchemist';
    npc.draw = (ctx, cam) => this.drawNpc(ctx, cam, npc);
    this.alchemist = npc;
    World.alchemist = npc;
    World.buildGrid();
    return npc;
  },

  drawNpc(ctx, cam, npc) {
    const sx = Math.round(npc.x - cam.x), sy = Math.round(npc.y - cam.y);
    fillEllipse(ctx, sx + 1, sy + 1, 5, 2.1, 'rgba(10,12,20,0.3)');
    // 가끔 고개를 끄덕인다
    const t = World.time % 3.2;
    const base = (SPRITES.alchemist && SPRITES.alchemist[0]) || SPRITES.merchant[0];
    const blink = (SPRITES.alchemist && SPRITES.alchemist[1]) || SPRITES.merchant[1];
    ctx.drawImage((t > 2.9 && t < 3.05) ? blink : base, sx - 8, sy - 14);
    // 탁자 쪽에서 가끔 초록 알갱이가 피어오른다
    if (Math.random() < 0.03) {
      FX.burst(npc.x + 12, npc.y - 6, 1, ['#7dff8a', '#ffffff'], { speed: 10, life: 0.6, gravity: -20, size: 1 });
    }
  },

  drawStash(ctx, cam, c) {
    const sx = Math.round(c.x - cam.x), sy = Math.round(c.y - cam.y);
    fillEllipse(ctx, sx + 1, sy + 1, 7, 2.9, 'rgba(10,12,20,0.3)');
    ctx.drawImage(SPRITES.chest[0], sx + c.ox, sy + c.oy);
    if (Math.floor(World.time * 2) % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 2, sy + c.oy + 5, 1, 1);
    }
  },

  drawAlchemistPrompt(ctx, cam) {
    const n = World.alchemist;
    if (!n) return;
    const sx = Math.round(n.x - cam.x), sy = Math.round(n.y - cam.y);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  ALCHEMY', sx + 6, sy - 24, '#7dff8a', true);
  },

  drawStashPrompt(ctx, cam) {
    const c = World.stashChest;
    if (!c) return;
    const sx = Math.round(c.x - cam.x), sy = Math.round(c.y - cam.y);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  STASH', sx, sy - 24, '#e8dcc0', true);
  },

  // 빈 대장간·빈 탁자 안내 (아직 이사 전)
  drawEmptySigns(ctx, cam) {
    if (!this.smithHome() && World.time % 1 < 0.6) {
      const n = World.smith;
      if (n) {
        // smith 자리가 비어 있으면 모루 쪽에 표시 — Forge.place 가 NPC를 안 둔 경우
      } else if (typeof World !== 'undefined') {
        // 모루 근처에 "보스를 잡으면 대장장이가 온다"는 느낌만 미니맵·배너로 대신한다
      }
    }
  },

  /* ── 이사 알림 ───────────────────────────────────────────
     조건을 채운 순간이 아니라, 다음에 마을에 닿았을 때 띄운다.
     그래야 "마을에 돌아갈 이유"가 된다. silent=true면 알림 없이 집만 채운다. */
  checkMoveIns(silent) {
    // 대장장이 — Forge.place 때 없었으면 여기서 세운다
    if (this.smithHome() && !World.smith) {
      try {
        if (typeof Forge !== 'undefined' && Forge.spawnSmith) Forge.spawnSmith();
        else if (typeof Forge !== 'undefined') Forge.place();
      } catch (err) { /* 무시 */ }
      if (!silent && !this.announced.smith) {
        this.announced.smith = true;
        FX.number(Game.player.x, Game.player.y - 30, 'BLACKSMITH MOVED IN', '#ff8a3c');
        Sound.play('banner');
      } else if (silent) {
        this.announced.smith = this.announced.smith || this.smithHome();
      }
    }
    // 연금술사
    if (this.alchemistHome() && !World.alchemist) {
      const a = this.spot('alchemy');
      this.spawnAlchemist(a.x - 14, a.y - 2);
      if (!silent && !this.announced.alchemist) {
        this.announced.alchemist = true;
        FX.number(Game.player.x, Game.player.y - 30, 'ALCHEMIST MOVED IN', '#7dff8a');
        Sound.play('banner');
      } else if (silent) {
        this.announced.alchemist = true;
      }
    }
    if (!silent) {
      if (this.smithHome() && !this.announced.smith) {
        this.announced.smith = true;
        FX.number(Game.player.x, Game.player.y - 30, 'BLACKSMITH MOVED IN', '#ff8a3c');
        Sound.play('banner');
      }
      if (this.alchemistHome() && !this.announced.alchemist) {
        this.announced.alchemist = true;
        FX.number(Game.player.x, Game.player.y - 30, 'ALCHEMIST MOVED IN', '#7dff8a');
        Sound.play('banner');
      }
    }
  },

  /* ── 전리품 판매 집계 ────────────────────────────────────
     Inventory.sellLoot 에서 값을 더한 뒤 이걸 부른다. */
  addLootSold(count) {
    this.lootSold += Math.max(0, count | 0);
    this.checkMoveIns(false);
  },

  /* ── 귀환 (T) ────────────────────────────────────────────
     보스 방 안·창이 열려 있을 때·죽어 있을 땐 안 된다.
     마을 시작점 앞으로 돌아온다 — "사냥 끝에 마을로 돌아간다"는 동작이다. */
  tryReturn(player) {
    if (!player || player.dead) return false;
    if (Game.inArena || Game.transition) return false;
    if (Game.paused()) return false;
    const tx = World.startX, ty = World.startY + 10;
    Game.beginTransition(() => {
      player.x = tx; player.y = ty;
      player.kx = player.ky = 0;
      player.invuln = Math.max(player.invuln, 0.9);
      player.attackTimer = 0;
      player.activeSkill = null;
      Game.updateCamera(true);
      FX.burst(tx, ty, 24, ['#7dff8a', '#ffffff', '#5ff0ff'], { speed: 70, life: 0.7, gravity: -20 });
      Sound.play('caveOut');
      this.checkMoveIns(false);
    });
    Sound.play('blip');
    return true;
  },

  /* ── 연금술 ────────────────────────────────────────────── */

  lootHeld(player, id) {
    let n = 0;
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (s && s.kind === 'loot' && s.id === id) n += s.amount;
    }
    return n;
  },

  takeLoot(player, id, count) {
    let left = count;
    for (let i = 1; i < player.bag.length && left > 0; i++) {
      const s = player.bag[i];
      if (!s || s.kind !== 'loot' || s.id !== id) continue;
      const take = Math.min(s.amount, left);
      s.amount -= take; left -= take;
      if (s.amount <= 0) player.bag[i] = null;
    }
  },

  recipeList(player) {
    const out = [];
    const cfg = CONFIG.alchemy.recipes;
    for (const id in cfg) {
      const r = cfg[id];
      const needs = Object.keys(r.loot || {});
      const held = needs.map(k => ({ id: k, need: r.loot[k], held: this.lootHeld(player, k) }));
      const lootOk = held.every(h => h.held >= h.need);
      let ok = lootOk && player.gold >= r.gold;
      let reason = '';
      if (id === 'potion' || id === 'potionBig') {
        if (player.potions >= player.maxPotions) { ok = false; reason = 'POUCH FULL'; }
      }
      out.push({ id: id, spec: r, held: held, lootOk: lootOk, ok: ok, reason: reason });
    }
    return out;
  },

  brew(entry, player) {
    const r = entry.spec;
    if (!entry.lootOk) { this.sayAlchemy('NEED MORE LOOT'); Sound.play('error'); return; }
    if (player.gold < r.gold) { this.sayAlchemy('NOT ENOUGH GOLD'); Sound.play('error'); return; }
    if ((entry.id === 'potion' || entry.id === 'potionBig') && player.potions >= player.maxPotions) {
      this.sayAlchemy('POUCH IS FULL'); Sound.play('error'); return;
    }
    for (const h of entry.held) this.takeLoot(player, h.id, h.need);
    player.gold -= r.gold;

    if (entry.id === 'potion' || entry.id === 'potionBig') {
      const got = player.addPotion(r.gain);
      if (got <= 0) { this.sayAlchemy('POUCH IS FULL'); Sound.play('error'); return; }
      this.sayAlchemy('BREWED ' + got + ' POTION');
    } else if (entry.id === 'antidote') {
      Status.clear(player);
      player.wardTimer = CONFIG.alchemy.wardTime;
      FX.number(player.x, player.y - 26, 'CURED', '#7dff8a');
      this.sayAlchemy('CURED + WARD 15S');
    } else if (entry.id === 'tonic') {
      player.tonicTimer = CONFIG.alchemy.tonicTime;
      FX.number(player.x, player.y - 26, 'TONIC 60S', '#5ff0ff');
      this.sayAlchemy('REGEN WONT STOP 60S');
    }
    Sound.play('potion');
    FX.burst(player.x, player.y - 4, 14, [r.color, '#ffffff'], { speed: 45, life: 0.5, gravity: 30 });
  },

  sayAlchemy(text) { this.alchemyMessage = text; this.alchemyTimer = 1.8; },
  sayStash(text) { this.stashMessage = text; this.stashTimer = 1.6; },

  openAlchemy() {
    this.alchemyOpen = true;
    this.alchemyCursor = 0;
    this.alchemyMessage = '';
    Sound.play('shopOpen');
  },

  closeAlchemy() { this.alchemyOpen = false; Sound.play('shopClose'); },

  handleAlchemyInput(player) {
    this.alchemyTimer = Math.max(0, this.alchemyTimer - 1 / 60);
    if (this.alchemyTimer <= 0) this.alchemyMessage = '';
    const list = this.recipeList(player), P = Input.pressed;
    if (P.KeyW || P.ArrowUp) this.alchemyCursor = (this.alchemyCursor + list.length - 1) % list.length;
    if (P.KeyS || P.ArrowDown) this.alchemyCursor = (this.alchemyCursor + 1) % list.length;
    if (P.Space || P.Enter) {
      this.brew(list[this.alchemyCursor], player);
      delete P.Space; delete P.Enter;
    }
    if (P.KeyF || P.Escape) { this.closeAlchemy(); delete P.KeyF; }
  },

  drawAlchemy(ctx, player) {
    const w = 214, h = 112;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#7dff8a');
    UI.divider(ctx, x + 6, y + 15, w - 12);
    UI.drawText(ctx, 'ALCHEMY', x + w / 2, y + 6, '#7dff8a', true);
    ctx.drawImage(SPRITES.coin, x + w - 14 - UI.textWidth(String(player.gold)) - 10, y + 6);
    UI.drawText(ctx, String(player.gold), x + w - 14 - UI.textWidth(String(player.gold)), y + 7, '#ffe066');

    const list = this.recipeList(player);
    const rowY = y + 24, rowH = 17;
    for (let i = 0; i < list.length; i++) {
      const it = list[i], ry = rowY + i * rowH;
      if (i === this.alchemyCursor) {
        ctx.fillStyle = 'rgba(125,255,138,0.12)';
        ctx.fillRect(x + 6, ry - 3, w - 12, rowH - 2);
        UI.drawText(ctx, '>', x + 9, ry, '#7dff8a');
      }
      UI.drawText(ctx, it.spec.name, x + 18, ry, it.ok ? '#f0d9b5' : '#6f7a68');
      // 재료 — 모자라면 붉게
      const mat = it.held.map(hl => {
        const nm = (CONFIG.loot.items[hl.id] || {}).name || hl.id;
        return nm + ' ' + hl.held + '/' + hl.need;
      }).join('  ');
      UI.drawText(ctx, mat.slice(0, 44), x + 18, ry + 8, it.lootOk ? '#7fa86a' : '#c05a5a');
      const price = it.reason || (it.spec.gold + ' G');
      UI.drawText(ctx, price, x + w - 12 - UI.textWidth(price), ry,
        it.reason ? '#6f7a68' : (player.gold >= it.spec.gold ? '#ffe066' : '#c05a5a'));
    }

    const footY = y + h - 19;
    if (this.alchemyMessage) UI.drawText(ctx, this.alchemyMessage, x + w / 2, footY, '#9be564', true);
    else UI.drawText(ctx, 'W S SELECT   SPACE BREW', x + w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 8, '#5f6b59', true);
  },

  /* ── 창고 ────────────────────────────────────────────────
     가방(포션 주머니 제외)과 창고를 한 창에 나란히 둔다.
     Space = 맡기기 / 찾기. 포션·입고 있는 장비는 못 맡긴다. */

  stashItems() { return this.stash; },

  bagEntries(player) {
    const out = [];
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (!s) continue;
      out.push({ bagIndex: i, item: s });
    }
    return out;
  },

  stashName(s) {
    if (!s) return '?';
    if (s.kind === 'gear') return Gear.name(s);
    if (s.kind === 'weapon') {
      return (s.legend ? CONFIG.weapons.legends[s.legend].name : CONFIG.weapons[s.weapon].name) + ' L' + s.level;
    }
    if (s.kind === 'loot') return (CONFIG.loot.items[s.id] || {}).name + ' X' + s.amount;
    return '?';
  },

  stashColor(s) {
    if (s.kind === 'gear') return Gear.color(s);
    if (s.kind === 'weapon') {
      if (s.legend) return CONFIG.weapons.legendColor;
      return CONFIG.weapons.levelColor[levelTier(s.level)] || '#ffffff';
    }
    if (s.kind === 'loot') return (CONFIG.loot.items[s.id] || {}).color || '#ffffff';
    return '#ffffff';
  },

  sanitizeItem(s) {
    if (!s) return null;
    if (s.kind === 'gear') return Gear.sanitize(s);
    if (s.kind === 'weapon' && CONFIG.weapons[s.weapon]) {
      return {
        kind: 'weapon', weapon: s.weapon,
        level: Util.clamp(legendKeyOf(s) ? legendLevelOf(s, legendKeyOf(s)) : (Math.round(s.level) || 1), 1, CONFIG.weapons.levelMult.length),
        legend: legendKeyOf(s),
        element: CONFIG.forge.elements[s.element] ? s.element : null,
      };
    }
    if (s.kind === 'loot' && CONFIG.loot.items[s.id]) {
      return { kind: 'loot', id: s.id, amount: Util.clamp(Math.round(s.amount) || 1, 1, 999) };
    }
    return null;
  },

  openStash() {
    this.stashOpen = true;
    this.stashCursor = 0;
    this.stashMessage = '';
    Sound.play('shopOpen');
  },

  closeStash() { this.stashOpen = false; Sound.play('shopClose'); },

  // 창고 창의 전체 줄 수 = 가방 물건 + 창고 물건 (둘 다 비면 1)
  stashRows(player) {
    return Math.max(1, this.bagEntries(player).length + this.stash.length);
  },

  handleStashInput(player) {
    this.stashTimer = Math.max(0, this.stashTimer - 1 / 60);
    if (this.stashTimer <= 0) this.stashMessage = '';
    const P = Input.pressed;
    const n = this.stashRows(player);
    if (P.KeyW || P.ArrowUp) this.stashCursor = (this.stashCursor + n - 1) % n;
    if (P.KeyS || P.ArrowDown) this.stashCursor = (this.stashCursor + 1) % n;
    if (P.Space || P.Enter) {
      this.moveStashCursor(player);
      delete P.Space; delete P.Enter;
    }
    if (P.KeyF || P.Escape) { this.closeStash(); delete P.KeyF; }
  },

  moveStashCursor(player) {
    const bag = this.bagEntries(player);
    const idx = this.stashCursor;
    if (!bag.length && !this.stash.length) { this.sayStash('NOTHING STORED'); return; }
    if (idx < bag.length) {
      // 가방 -> 창고
      if (this.stash.length >= CONFIG.stash.maxItems) { this.sayStash('STASH IS FULL'); Sound.play('error'); return; }
      const e = bag[idx];
      const clean = this.sanitizeItem(e.item);
      if (!clean) { this.sayStash('CANT STORE THAT'); Sound.play('error'); return; }
      // 전리품은 창고에서 합친다
      if (clean.kind === 'loot') {
        const same = this.stash.find(s => s.kind === 'loot' && s.id === clean.id);
        if (same) same.amount += clean.amount;
        else this.stash.push(clean);
      } else {
        this.stash.push(clean);
      }
      player.bag[e.bagIndex] = null;
      Sound.play('blip');
      this.sayStash('STORED ' + this.stashName(clean));
    } else {
      // 창고 -> 가방
      const si = idx - bag.length;
      const s = this.stash[si];
      if (!s) return;
      if (s.kind === 'loot') {
        const left = Inventory.addLoot(player, s.id, s.amount);
        if (left >= s.amount) { this.sayStash('BAG IS FULL'); Sound.play('error'); return; }
        if (left <= 0) this.stash.splice(si, 1);
        else s.amount = left;
        Sound.play('pickup');
        this.sayStash('TOOK ' + this.stashName(s));
        return;
      }
      const free = Inventory.firstEmpty(player);
      if (free < 0) { this.sayStash('BAG IS FULL'); Sound.play('error'); return; }
      if (s.kind === 'gear') player.bag[free] = Gear.sanitize(s);
      else player.bag[free] = this.sanitizeItem(s);
      this.stash.splice(si, 1);
      Sound.play('pickup');
      this.sayStash('TOOK BACK');
    }
    this.stashCursor = Util.clamp(this.stashCursor, 0, Math.max(0, this.stashRows(player) - 1));
  },

  drawStashWindow(ctx, player) {
    const w = 230, h = 132;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#e8dcc0');
    UI.divider(ctx, x + 6, y + 15, w - 12);
    UI.drawText(ctx, 'STASH  ' + this.stash.length + ' ITEMS', x + w / 2, y + 6, '#e8dcc0', true);

    const bag = this.bagEntries(player);
    const rowY = y + 22, rowH = 9, maxRows = 9;
    // 커서가 긴 목록에서도 보이도록 스크롤한다
    let top = 0;
    if (this.stashCursor >= maxRows) top = this.stashCursor - maxRows + 1;

    let row = 0;
    const drawLine = (text, color, isCursor) => {
      if (row < top || row >= top + maxRows) { row++; return; }
      const ry = rowY + (row - top) * rowH;
      if (isCursor) {
        ctx.fillStyle = 'rgba(232,220,192,0.10)';
        ctx.fillRect(x + 6, ry - 2, w - 12, rowH - 1);
        UI.drawText(ctx, '>', x + 9, ry, '#e8dcc0');
      }
      UI.drawText(ctx, text.slice(0, 34), x + 18, ry, color);
      row++;
    };

    if (!bag.length && !this.stash.length) {
      UI.drawText(ctx, 'EMPTY - SPACE STORES BAG ITEMS', x + 18, rowY, '#5f6b59');
    }
    bag.forEach((e, i) => {
      drawLine('BAG ' + this.stashName(e.item), this.stashColor(e.item), this.stashCursor === i);
    });
    this.stash.forEach((s, k) => {
      drawLine('BOX ' + this.stashName(s), this.stashColor(s), this.stashCursor === bag.length + k);
    });

    const footY = y + h - 19;
    if (this.stashMessage) UI.drawText(ctx, this.stashMessage, x + w / 2, footY, '#9be564', true);
    else UI.drawText(ctx, 'SPACE STORE / TAKE', x + w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 8, '#5f6b59', true);
  },

  /* ── 저장 ──────────────────────────────────────────────── */
  serialize() {
    return {
      stash: this.stash.map(s => Object.assign({}, s)).slice(0, CONFIG.stash.maxItems),
      lootSold: this.lootSold | 0,
      announced: Object.assign({}, this.announced),
    };
  },

  deserialize(data, player) {
    const stashOpen = this.stashOpen, alchemyOpen = this.alchemyOpen;
    // 구역은 World.init → place() 가 이미 잡아뒀다. reset() 이 지우지 않게 들고 있는다
    // (안 그러면 불러오기 직후부터 안전구역 판정 전체가 죽는다)
    const keepZone = this.zone, keepZones = this.zones;
    this.reset();
    this.stashOpen = stashOpen;
    this.alchemyOpen = alchemyOpen;
    this.zone = keepZone;
    this.zones = keepZones || {};
    if (!data) return;
    this.lootSold = Math.max(0, data.lootSold | 0);
    this.announced = Object.assign({}, data.announced || {});
    if (Array.isArray(data.stash)) {
      for (const s of data.stash) {
        const clean = this.sanitizeItem(s);
        if (clean) this.stash.push(clean);
        if (this.stash.length >= CONFIG.stash.maxItems) break;
      }
    }
    // 불러오기 뒤에는 조건에 맞는 집이 비어 있으면 조용히 채운다
    try { this.checkMoveIns(true); } catch (err) { /* 무시 */ }
  },
};

</script>
  <script>
// ── js/events.js
'use strict';

/* 이벤트 — 낮과 밤, 모래폭풍, 습격 (로드맵 11주차).

   지금까지 이 세계는 **가만히 서 있으면 아무 일도 없었다.** 몬스터가 다시 차오를 뿐,
   시간이 흐른다는 느낌이 없었다. 11주차의 숙제는 그 하나다 —
   같은 자리에 서 있어도 바깥이 변하는 것.

     낮/밤   하루가 돌아간다. 해가 지면 화면이 어두워지고 **내 둘레만 밝다.**
             밤에 태어난 몬스터는 더 세고(체력 1.5배·공격 1.35배) 엘리트가 세 배로 나온다.
             그 개체는 날이 밝아도 그대로다 — 이름표에 달 표시가 남는다
     모래폭풍 사막에만. 앞이 안 보이고 바람이 밀고, 바깥에 있으면 조금씩 깎인다.
             마을 안은 안전하다 — "폭풍이 오면 들어간다"가 생긴다

   세 가지 모두 **스폰할 때 한 번** 또는 **그릴 때만** 개입한다.
   몬스터 종류별 파일과 전투 규칙에는 손대지 않았다. */

const Events = {
  time: 0,            // 하루 중 위치 (0~1)
  day: 1,
  phase: 'day',       // dawn | day | dusk | night

  storm: 0,           // 모래폭풍 남은 시간 (초)
  stormCooldown: 0,   // 다음 폭풍까지
  stormTick: 0,
  grains: [],

  notice: 0,          // 화면 가운데 알림이 남는 시간 (해가 지고, 폭풍이 오고 갈 때)
  noticeText: '',
  noticeColor: '#ffe066',
  howlTimer: 0,

  reset() {
    const cfg = CONFIG.events;
    this.time = cfg.startAt;
    this.day = 1;
    this.phase = 'day';
    this.storm = 0;
    this.stormCooldown = cfg.storm.minGap;
    this.stormTick = 0;
    this.grains.length = 0;
    this.notice = 0;
    this.howlTimer = 8;
    this.turnTimer = 0;
  },

  /* ── 하루 ──────────────────────────────────────────────── */

  phaseAt(t) {
    const e = CONFIG.events;
    if (t < e.dawnEnd) return 'dawn';
    if (t < e.duskStart) return 'day';
    if (t < e.nightStart) return 'dusk';
    return 'night';
  },

  isNight() { return this.phase === 'night'; },

  /* 밤이 얼마나 깊은가 (0~1). 황혼·새벽에는 사이값이라 화면이 서서히 오간다 —
     "해가 진다"가 한순간에 툭 바뀌지 않는다. */
  nightFactor() {
    const e = CONFIG.events, t = this.time;
    if (t < e.dawnEnd) return Util.clamp(1 - t / e.dawnEnd, 0, 1);
    if (t < e.duskStart) return 0;
    if (t < e.nightStart) return Util.clamp((t - e.duskStart) / (e.nightStart - e.duskStart), 0, 1);
    return 1;
  },

  update(dt) {
    const cfg = CONFIG.events;
    const was = this.phase;

    this.time += dt / cfg.dayLength;
    while (this.time >= 1) { this.time -= 1; this.day++; }
    this.phase = this.phaseAt(this.time);

    if (was !== this.phase) this.onPhaseChange(was, this.phase);

    this.turnover(dt);
    this.updateStorm(dt);
    this.notice = Math.max(0, this.notice - dt);

    // 밤에는 멀리서 늑대가 운다 — 소리만으로도 시간이 흐르는 게 느껴진다
    if (this.isNight() && !World.isArena) {
      this.howlTimer -= dt;
      if (this.howlTimer <= 0) {
        this.howlTimer = Util.rand(14, 34);
        Sound.play('howl');
      }
    }
  },

  onPhaseChange(from, to) {
    if (World.isArena) return;
    if (to === 'night') {
      this.banner('NIGHT FALLS', '#8fa8e0');
    } else if (to === 'day') {
      this.banner('DAY ' + this.day, '#ffe066');
    }
  },

  banner(text, color) {
    this.noticeText = text;
    this.noticeColor = color;
    this.notice = 3.0;
    Sound.play('banner');
  },

  /* ── 밤의 몬스터 ───────────────────────────────────────
     스폰하는 **그 순간**의 시각으로 정해지고, 날이 밝아도 그대로다.
     그래서 밤에 깊이 들어갔다가 아침에 돌아오는 길이 여전히 위험하다. */
  applySpawn(enemy) {
    const f = this.nightFactor();
    if (!enemy || f < 0.35) return enemy;
    const n = CONFIG.events.night, s = enemy.stats;
    const k = (base) => 1 + (base - 1) * f;
    s.hp = Math.max(1, Math.round(s.hp * k(n.hp)));
    s.atk = Math.max(1, Math.round(s.atk * k(n.atk)));
    s.xp = Math.max(1, Math.round(s.xp * k(n.xp)));
    enemy.maxHp = s.hp;
    enemy.hp = s.hp;
    enemy.nightBorn = true;
    return enemy;
  },

  /* 밤이 '도착'하게 한다 — 몬스터는 죽어야만 다시 나므로, 가만히 서 있으면
     해가 져도 낮에 태어난 놈들만 서성인다. 그래서 밤 동안 **멀리 있는 낮 개체를
     조금씩 밤 개체로 갈아 끼운다.** 화면 밖(400px 너머)에서만 일어나므로 눈앞에서 사라지지 않는다.
     아침이 와도 되돌리지는 않는다 — 밤에 태어난 것은 밤에 태어난 채로 남는다. */
  turnover(dt) {
    const cfg = CONFIG.events.night;
    if (World.isArena || this.nightFactor() < 0.35 || !Game.enemies) return;
    this.turnTimer = (this.turnTimer || 0) - dt;
    if (this.turnTimer > 0) return;
    this.turnTimer = cfg.turnover;

    const p = Game.player;
    // 재등장 대기열이 정원을 다시 채우므로 몇 마리는 비어 있어도 된다.
    // (정원이 꽉 찼을 때만 물리면 재등장 간격에 묶여 밤새 스무 마리밖에 못 바꾼다)
    if (!p || Game.enemies.length < CONFIG.spawn.maxAlive - cfg.turnoverSlack) return;
    for (let i = 0; i < 24; i++) {
      const e = Game.enemies[Math.floor(Math.random() * Game.enemies.length)];
      if (!e || e.dead || e.nightBorn || e.elite || e.isBoss) continue;
      if (Util.dist(e.x, e.y, p.x, p.y) < cfg.turnoverDist) continue;   // 보이는 데서 바뀌면 안 된다
      e.dead = true;
      e.noDrop = true;      // 잡은 것이 아니라 밤에 자리를 내준 것이다
      return;
    }
  },

  // 엘리트가 몇 배로 자주 나오는가 (밤 + 모래폭풍)
  eliteChanceMult() {
    let m = 1 + (CONFIG.events.night.eliteMult - 1) * this.nightFactor();
    if (this.storm > 0) m *= CONFIG.events.storm.eliteMult;
    return m;
  },

  // 골드 보상 배수 — 밤에 사냥한 값어치
  goldMult(enemy) {
    if (!enemy || !enemy.nightBorn) return 1;
    return CONFIG.events.night.gold;
  },

  /* ── 모래폭풍 ──────────────────────────────────────────── */

  stormActive() { return this.storm > 0; },

  updateStorm(dt) {
    const cfg = CONFIG.events.storm;
    // 사막에서만. 다른 맵으로 가면 폭풍은 그 자리에서 끝난다
    if (World.isArena || !World.spec || World.spec.theme !== 'desert') {
      if (this.storm > 0) { this.storm = 0; this.grains.length = 0; }
      return;
    }
    if (this.storm > 0) {
      this.storm -= dt;
      if (this.storm <= 0) {
        this.storm = 0;
        this.grains.length = 0;
        this.stormCooldown = Util.rand(cfg.minGap, cfg.maxGap);
        this.banner('THE STORM PASSES', '#d9b779');
        return;
      }
      this.updateGrains(dt);
      this.scour(dt);
      return;
    }
    this.stormCooldown -= dt;
    if (this.stormCooldown > 0) return;
    this.stormCooldown = Util.rand(cfg.minGap, cfg.maxGap);
    if (Math.random() >= cfg.chance) return;
    this.storm = Util.rand(cfg.dur[0], cfg.dur[1]);
    this.stormTick = 0;
    this.grains.length = 0;
    for (let i = 0; i < cfg.grains; i++) this.grains.push(this.newGrain(true));
    this.banner('SANDSTORM', '#d9b779');
    Sound.play('spin');
  },

  newGrain(anywhere) {
    return {
      x: anywhere ? Util.rand(0, CONFIG.VIEW_W) : -Util.rand(4, 40),
      y: Util.rand(-8, CONFIG.VIEW_H),
      vx: Util.rand(150, 330),
      vy: Util.rand(10, 40),
      len: Util.randInt(2, 6),
      bright: Math.random() < 0.3,
    };
  },

  updateGrains(dt) {
    for (const g of this.grains) {
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      if (g.x > CONFIG.VIEW_W + 8 || g.y > CONFIG.VIEW_H + 8) Object.assign(g, this.newGrain(false));
    }
  },

  /* 바람이 밀고, 모래가 깎는다 — 다만 **마을 안은 안전하다.**
     그래서 폭풍이 시작되면 "들어갈까 버틸까"를 고르게 된다. */
  scour(dt) {
    const cfg = CONFIG.events.storm, p = Game.player;
    if (!p || p.dead) return;
    const safe = (typeof Village !== 'undefined' && Village.isSafe && Village.isSafe(p.x, p.y));
    if (safe) return;
    p.x = Util.clamp(p.x + cfg.wind * dt, 8, World.w - 8);
    this.stormTick -= dt;
    if (this.stormTick > 0) return;
    this.stormTick = cfg.tick;
    const hit = Math.min(cfg.damage, Math.max(0, p.hp - 1));   // 폭풍만으로는 죽지 않는다
    if (hit <= 0) return;
    p.hp -= hit;
    p.sinceCombat = 0;
    FX.number(p.x + Util.rand(-6, 6), p.y - 12, '-' + hit, '#d9b779');
  },

  /* ── 그리기 ────────────────────────────────────────────── */

  rgba(hex, a) {
    const c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
  },

  /* 하늘빛 — 세상 위에 한 겹 덮는다.
     밤에는 **플레이어 둘레만 밝게** 뚫어서 등불을 든 것처럼 보이게 한다.
     마을 안에서는 모닥불 덕에 밝은 범위가 넓다. */
  drawSky(ctx, player, cam) {
    if (World.isArena) return;     // 동굴은 원래 어둡다 — 두 번 덮지 않는다
    const e = CONFIG.events, t = this.time;
    let color, alpha;
    if (this.phase === 'dusk') {
      const u = (t - e.duskStart) / (e.nightStart - e.duskStart);
      color = e.dusk.tint;
      alpha = Util.lerp(0, e.dusk.alpha, u);
    } else if (this.phase === 'night') {
      color = e.night.tint;
      alpha = e.night.alpha;
    } else if (this.phase === 'dawn') {
      const u = t / e.dawnEnd;
      color = e.dawn.tint;
      alpha = Util.lerp(e.dawn.alpha, 0, u);
    } else {
      return;
    }
    // 황혼은 노을이 하늘 전체에 깔린 것이라 등불이 없다. 깊은 밤에만 둘레가 밝다
    const lampF = this.nightFactor() * (this.phase === 'dusk' ? 0.35 : 1);
    if (alpha <= 0.004) return;

    if (lampF > 0.25) {
      const safe = (typeof Village !== 'undefined' && Village.isSafe && Village.isSafe(player.x, player.y));
      const rad = e.night.lamp * (safe ? e.night.villageLamp : 1);
      const px = Math.round(player.x - cam.x), py = Math.round(player.y - cam.y - 4);
      const g = ctx.createRadialGradient(px, py, 6, px, py, rad);
      g.addColorStop(0, this.rgba(color, alpha * 0.12));
      g.addColorStop(0.55, this.rgba(color, alpha * 0.66));
      g.addColorStop(1, this.rgba(color, alpha));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = this.rgba(color, alpha);
    }
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  },

  // 모래폭풍 — 화면을 가로지르는 모래 줄기와 누런 장막
  drawStorm(ctx) {
    if (this.storm <= 0) return;
    const cfg = CONFIG.events.storm;
    // 시작과 끝에서 서서히 짙어지고 옅어진다
    const fade = Util.clamp(Math.min(this.storm, cfg.fade) / cfg.fade, 0, 1);
    ctx.fillStyle = this.rgba(cfg.tint, cfg.alpha * fade);
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    ctx.save();
    ctx.globalAlpha = 0.75 * fade;
    for (const g of this.grains) {
      ctx.fillStyle = g.bright ? '#f2e2bd' : '#c7a978';
      ctx.fillRect(Math.round(g.x), Math.round(g.y), g.len, 1);
    }
    ctx.restore();
  },

  /* 화면 위쪽 한가운데의 작은 시계 — 며칠째인지, 지금이 언제인지, 해가 어디쯤인지.
     "가만히 서 있어도 시간이 흐른다"를 눈으로 확인하는 자리다. */
  drawHud(ctx) {
    const w = 46, x = Math.round(CONFIG.VIEW_W / 2 - w / 2), y = 5;
    const e = CONFIG.events;
    const col = this.phase === 'night' ? '#8fa8e0'
      : (this.phase === 'dusk' ? '#ff8a3c' : (this.phase === 'dawn' ? '#9fc8ff' : '#ffe066'));

    const label = 'DAY ' + this.day;
    UI.drawText(ctx, label, x - 3 - UI.textWidth(label), y - 1, '#cbbfa2', false);

    ctx.fillStyle = '#17110d';
    ctx.fillRect(x - 1, y - 1, w + 2, 5);
    // 밤 구간은 바탕을 어둡게 칠해 둔다 — 막대만 봐도 밤이 얼마나 남았는지 보인다
    ctx.fillStyle = '#2b3350';
    ctx.fillRect(x + Math.round(w * e.nightStart), y, Math.round(w * (1 - e.nightStart)), 3);
    ctx.fillStyle = '#3f3a2a';
    ctx.fillRect(x, y, Math.round(w * e.dawnEnd), 3);
    // 해(달)의 자리
    ctx.fillStyle = col;
    ctx.fillRect(x + Util.clamp(Math.round(w * this.time), 0, w - 2), y - 1, 2, 5);

    const phase = this.phase.toUpperCase();
    UI.drawText(ctx, phase, x + w + 4, y - 1, col, false);

    if (this.storm > 0) {
      const s = 'SANDSTORM ' + Math.ceil(this.storm);
      UI.drawText(ctx, s, CONFIG.VIEW_W / 2, y + 7, '#d9b779', true);
    }
  },

  /* ── 저장 ──────────────────────────────────────────────── */

  serialize() {
    return { time: this.time, day: this.day };
  },

  deserialize(data) {
    this.reset();
    if (!data) return;
    this.time = Util.clamp(+data.time || 0, 0, 0.999);
    this.day = Math.max(1, data.day | 0);
    this.phase = this.phaseAt(this.time);
  },
};

  <script>
// ── js/portal.js
'use strict';

/* 텔레포트 비석 — 어디로 갈지 고른다 (로드맵 12주차).

   무대가 둘일 때는 비석이 "반대편"만 가리키면 됐다. 셋이 되면서 그게 안 된다 —
   설원에서 사막으로 돌아가려면, 숲에서 설원으로 곧장 가려면 **고를 수 있어야 한다.**

   그래서 비석 앞에서 F 를 누르면 작은 창이 뜨고, 세 무대가 한눈에 보인다.
     - 지금 있는 곳은 회색으로 '여기'
     - 아직 못 여는 곳은 무엇을 잡아야 열리는지 붉게
     - 열린 곳은 그곳 몬스터 레벨대와 함께

   관문(CONFIG.gate.needs)이 이 창 하나로 다 보이므로, "다음에 뭘 해야 하지"가
   비석 앞에 서면 답이 나온다. */

const Portal = {
  open: false,
  cursor: 0,
  message: '',
  messageTimer: 0,

  reset() {
    this.open = false;
    this.cursor = 0;
    this.message = '';
    this.messageTimer = 0;
  },

  // 이 맵에 들어가려면 무엇을 잡아야 하는가 (없으면 null)
  needOf(mapId) {
    const needs = (CONFIG.gate && CONFIG.gate.needs) || {};
    return needs[mapId] || null;
  },

  unlocked(mapId) {
    const need = this.needOf(mapId);
    return !need || !!(Game.bossSlain && Game.bossSlain[need]);
  },

  // 갈 수 있는 곳 목록 — 지금 있는 곳도 넣는다 (지도처럼 읽히게)
  entries() {
    const list = [];
    for (const id in CONFIG.maps) {
      const spec = CONFIG.maps[id];
      const need = this.needOf(id);
      list.push({
        id: id, name: spec.name, color: spec.color,
        range: spec.levelRange,
        here: World.mapId === id,
        ok: this.unlocked(id),
        need: need ? (CONFIG.bosses[need] || {}).name || need : null,
      });
    }
    return list;
  },

  openPortal() {
    this.open = true;
    this.message = '';
    this.messageTimer = 0;
    // 커서는 '지금 있는 곳' 다음 줄에서 시작한다 — 보통 가려는 곳이 그 아래다
    const list = this.entries();
    const here = list.findIndex(e => e.here);
    this.cursor = (here + 1) % list.length;
    Sound.play('shopOpen');
  },

  close() {
    this.open = false;
    Sound.play('shopClose');
  },

  say(text) { this.message = text; this.messageTimer = 1.8; },

  handleInput(player) {
    this.messageTimer = Math.max(0, this.messageTimer - 1 / 60);
    if (this.messageTimer <= 0) this.message = '';
    const list = this.entries(), P = Input.pressed;
    if (P.KeyW || P.ArrowUp) this.cursor = (this.cursor + list.length - 1) % list.length;
    if (P.KeyS || P.ArrowDown) this.cursor = (this.cursor + 1) % list.length;
    if (P.Space || P.Enter) {
      const pick = list[this.cursor];
      delete P.Space; delete P.Enter;
      if (pick.here) { this.say('YOU ARE HERE'); Sound.play('error'); return; }
      if (!pick.ok) { this.say('SLAY ' + pick.need); Sound.play('error'); return; }
      this.close();
      Game.beginTransition(() => Game.travel(pick.id));
      return;
    }
    if (P.KeyF || P.Escape) { this.close(); delete P.KeyF; }
  },

  /* 비석 머리 위 안내 — 창을 열기 전에도 '갈 수 있는 곳이 몇 군데인가'가 보인다 */
  drawPrompt(ctx, cam) {
    const p = World.portal;
    if (!p) return;
    const sx = Math.round(p.x - cam.x), sy = Math.round(p.y - cam.y);
    const open = this.entries().filter(e => !e.here && e.ok).length;
    if (open <= 0) {
      // 아직 아무 데도 못 간다 — 무엇을 잡아야 하는지 알려준다
      const next = this.entries().find(e => !e.here && !e.ok);
      this.drawSealed(ctx, sx, sy, next);
      return;
    }
    UI.drawText(ctx, open + ' WAYS OPEN', sx, sy - 44, '#8f9aa8', true);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  OBELISK', sx, sy - 52, '#5ff0ff', true);
  },

  drawSealed(ctx, sx, sy, next) {
    UI.drawText(ctx, 'SEALED', sx, sy - 52, '#8f9aa8', true);
    if (next && next.need) UI.drawText(ctx, 'SLAY ' + next.need, sx, sy - 44, '#ff6b6b', true);
  },

  /* ── 창 ──────────────────────────────────────────────── */
  draw(ctx, player) {
    const list = this.entries();
    const w = 216, h = 54 + list.length * 18;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#5ff0ff');
    UI.divider(ctx, x + 6, y + 15, w - 12);
    UI.drawText(ctx, 'THE OBELISK', x + w / 2, y + 6, '#5ff0ff', true);

    const rowY = y + 24, rowH = 18;
    for (let i = 0; i < list.length; i++) {
      const it = list[i], ry = rowY + i * rowH;
      if (i === this.cursor) {
        ctx.fillStyle = 'rgba(95,240,255,0.12)';
        ctx.fillRect(x + 6, ry - 4, w - 12, rowH - 2);
        UI.drawText(ctx, '>', x + 9, ry, '#5ff0ff');
      }
      // 이름 — 지금 있는 곳은 가라앉히고, 잠긴 곳은 어둡게
      const nameColor = it.here ? '#6f7a68' : (it.ok ? it.color : '#6f7a68');
      UI.drawText(ctx, it.name, x + 18, ry, nameColor);

      // 오른쪽 — 여기 / 레벨대 / 잠금 조건
      if (it.here) {
        UI.drawText(ctx, 'HERE', x + w - 12 - UI.textWidth('HERE'), ry, '#8f9aa8');
      } else if (it.ok) {
        const lv = 'LV ' + it.range[0] + '-' + it.range[1];
        UI.drawText(ctx, lv, x + w - 12 - UI.textWidth(lv), ry, '#8f9aa8');
      } else {
        const need = 'SLAY ' + it.need;
        UI.drawText(ctx, need, x + w - 12 - UI.textWidth(need), ry, '#c05a5a');
      }
      // 둘째 줄 — 잠긴 곳만, 왜 못 가는지 한 번 더 또렷하게는 않는다 (줄이 빽빽해진다)
    }

    const footY = y + h - 19;
    if (this.message) UI.drawText(ctx, this.message, x + w / 2, footY, '#ff6b6b', true);
    else UI.drawText(ctx, 'W S SELECT   SPACE TRAVEL', x + w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 8, '#5f6b59', true);
  },
};
