   23을 넘어 계속 세져야 한다 — 그게 그 무기의 존재 이유다. 일반 드랍은 여전히 23이 끝이다. */

/* 23단계나 되는 레벨을 색 5등급으로 묶는다.
   레벨 숫자를 읽지 않아도 색만 보고 위험도를 가늠할 수 있게 하기 위한 것이다.
   (1~4 초록 / 5~8 청록 / 9~13 파랑 / 14~18 보라 / 19~23 빨강) */
const LEVEL_TIER_BREAKS = [4, 8, 13, 18];
function levelTier(level) {
  for (let i = 0; i < LEVEL_TIER_BREAKS.length; i++) {
    if (level <= LEVEL_TIER_BREAKS[i]) return i;
  }
  return LEVEL_TIER_BREAKS.length;
}

// 몬스터가 주는 경험치 전체 배수 — 성장 속도를 한 곳에서 조절한다
const ENEMY_XP_MULT = 0.7;

/* 레벨별 능력치를 23줄짜리 표로 적는 대신 곡선으로 만든다.
   base 에서 시작해 레벨이 1 오를 때마다 growth 배씩 커진다.
   레벨 폭이 넓어졌으므로 한 레벨당 차이는 작게 잡았다. */
function buildLevels(base, growth, extra) {
  const out = [];
  for (let lv = 1; lv <= LEVEL_MAX; lv++) {
    const k = lv - 1;
    const s = {};
    for (const key in base) {
      const g = growth[key] === undefined ? 1 : growth[key];
      let v = base[key] * Math.pow(g, k);
      if (key === 'xp') v *= ENEMY_XP_MULT;
      s[key] = (key === 'scale') ? +v.toFixed(3) : Math.max(1, Math.round(v));
    }
    if (extra) Object.assign(s, extra(lv));
    out.push(s);
  }
  return out;
}

/* 레벨당 증가율 — 세 몬스터가 같은 곡선을 쓰고 시작값만 다르다.

   11주차 밸런싱: 공격력 시작값을 올리고 증가율도 조금 높였다.
   전에는 같은 레벨 슬라임에게 20번을 맞아야 죽어서 위협이 없었다.

// ── js/util.js
'use strict';

const Util = {
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },
  lerp(a, b, t) { return a + (b - a) * t; },
  rand(a, b) { return a + Math.random() * (b - a); },
  randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

  dist(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    return Math.sqrt(dx * dx + dy * dy);
  },

  // 두 사각형이 겹치는가 {x,y,w,h}
  aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  },

  // 각도 차이를 -PI~PI 범위로 정규화
  angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  },

  // 시드 기반 난수 — 같은 시드면 항상 같은 맵이 나온다
  makeRng(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5;  s >>>= 0;
      return s / 4294967296;
    };
  },

  // 가중치 배열에서 인덱스 하나를 뽑는다
  weightedIndex(weights) {
    let total = 0;
    for (const w of weights) total += w;
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return weights.length - 1;
  },
};

  'Y': '#ffe066',     // 금화
  'u': '#6b4a8a',     // 상인 로브 (플레이어의 파랑과 구분되는 보라)

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

// 문자열 격자 -> 캔버스. override로 팔레트 일부를 갈아끼울 수 있다 (슬라임 레벨별 색)
function makeSprite(name, rows, override) {
  const h = rows.length, w = rows[0].length;
  for (let i = 0; i < h; i++) {
    if (rows[i].length !== w) {
      console.error('[sprite:' + name + '] ' + i + '번 줄 길이 ' + rows[i].length + ', 기대값 ' + w);
    }
  }
  const cv = makeCanvas(w, h), ctx = cv.getContext('2d');
  const pal = override ? Object.assign({}, PAL, override) : PAL;
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = pal[rows[y][x]];
      if (!col) continue;
      const rgb = hexToRgb(col);
      const i4 = (y * w + x) * 4;
      img.data[i4] = rgb[0]; img.data[i4 + 1] = rgb[1]; img.data[i4 + 2] = rgb[2]; img.data[i4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// 좌우 반전 (오른쪽 보기 -> 왼쪽 보기)
function flipX(src) {
  const cv = makeCanvas(src.width, src.height), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.translate(src.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(src, 0, 0);
  return cv;
}

// 피격 깜빡임용 단색 실루엣
function makeSilhouette(src, color) {
  const cv = makeCanvas(src.width, src.height), ctx = cv.getContext('2d');
  ctx.drawImage(src, 0, 0);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, cv.width, cv.height);
  return cv;
}

/* 같은 도트를 다른 색으로 — 성장 무기의 무지개 궤적에 쓴다.
   궤적 도트 48장 x 일곱 색 정도라 캔버스마다 한 번씩만 만들고 기억해 둔다. */
const TINT_CACHE = new WeakMap();
function tinted(src, color) {
  let byColor = TINT_CACHE.get(src);
  if (!byColor) { byColor = new Map(); TINT_CACHE.set(src, byColor); }
  let cv = byColor.get(color);
  if (!cv) { cv = makeSilhouette(src, color); byColor.set(color, cv); }
  return cv;
}

// 픽셀 단위 원 채우기 (안티앨리어싱 없음 = 도트 느낌 유지)
function fillCircle(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r2) ctx.fillRect(x, y, 1, 1);
    }
  }
}

function makeTree(seed) {
  const cv = makeCanvas(34, 46), ctx = cv.getContext('2d');
  const rng = Util.makeRng(seed);
  const OUT = '#0e2f16', DARK = '#1c5227', MID = '#2b7a35', LIT = '#3d9b45', HI = '#57b95c';

  // 줄기
  ctx.fillStyle = '#5a3417'; ctx.fillRect(13, 22, 8, 23);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(14, 22, 6, 22);
  ctx.fillStyle = '#946030'; ctx.fillRect(15, 22, 2, 21);
  ctx.fillStyle = '#5a3417'; ctx.fillRect(10, 42, 4, 3); ctx.fillRect(20, 42, 4, 3);

  // 잎사귀 덩어리 — 외곽선 -> 어두운면 -> 중간톤 -> 밝은면 순으로 겹쳐 칠한다
  const blobs = [[17, 15, 13], [9, 21, 9], [25, 21, 9], [17, 24, 10], [12, 10, 7], [23, 10, 7]];
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2] + 1, OUT);
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2], DARK);
  for (const b of blobs) fillCircle(ctx, b[0] - 1, b[1] - 2, b[2] - 2, MID);
  for (const b of blobs) fillCircle(ctx, b[0] - 3, b[1] - 4, b[2] - 5, LIT);

  // 잎 질감 — 덩어리 안쪽에만 점을 뿌린다
  for (let i = 0; i < 130; i++) {
    const x = Math.floor(rng() * 34), y = Math.floor(rng() * 34);
    let inside = false;
    for (const b of blobs) {
      const dx = x - b[0], dy = y - b[1];
      if (dx * dx + dy * dy < (b[2] - 2) * (b[2] - 2)) { inside = true; break; }
    }
    if (!inside) continue;
    ctx.fillStyle = rng() < 0.45 ? HI : DARK;
    ctx.fillRect(x, y, 1, 1);
  }
  return cv;
}

// 휘두르는 궤적을 몇 방향으로 나눠 만들어 둘지
const SLASH_DIRS = 16;

// 각도를 미리 만들어 둔 궤적 번호로 바꾼다
function slashIndex(angle) {
  let i = Math.round(angle / (Math.PI * 2) * SLASH_DIRS) % SLASH_DIRS;
  if (i < 0) i += SLASH_DIRS;
  return i;
}

// 무기를 휘두를 때 남는 궤적 (방향별 3프레임)
function makeSlashFrame(angle, t) {
  const S = 48, cv = makeCanvas(S, S), ctx = cv.getContext('2d');
  const cx = S / 2, cy = S / 2;
  const rIn = 10 + t * 8;
  const rOut = rIn + 7 - t * 4;
  const spread = 1.05 - t * 0.3;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < rIn || d > rOut) continue;
      const da = Math.abs(Util.angleDiff(Math.atan2(dy, dx), angle));
      if (da > spread) continue;
      if (da / spread > 0.72 && (x + y) % 2 === 0) continue;   // 끝부분은 격자로 흐리게
      ctx.fillStyle = d > rIn + (rOut - rIn) * 0.45 ? '#bfe6ff' : '#ffffff';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* 동굴 입구 — 포자 골짜기의 이정표. 미니맵에도 표시된다.
   지금은 들어갈 수 없는 장식이지만, 나중에 보스방 입구로 쓸 자리다. */
/* 9주차: 가판대 (34x30). 상인이 이 앞에 선다.
   붉은 줄무늬 차양이 멀리서도 "가게"로 읽히게 해준다. */
function makeStall(seed) {
  const cv = makeCanvas(34, 30), ctx = cv.getContext('2d');
  const OUT = '#17110d', WOOD = '#8a5a2b', WOODL = '#b07a3c', WOODD = '#5a3a1c';
  const RED = '#c0392b', REDD = '#8e2a2a', CLOTH = '#f0e6d2';
  // 기둥
  ctx.fillStyle = OUT; ctx.fillRect(2, 8, 4, 20); ctx.fillRect(28, 8, 4, 20);
  ctx.fillStyle = WOOD; ctx.fillRect(3, 9, 2, 18); ctx.fillRect(29, 9, 2, 18);
  // 차양 — 줄무늬, 아래쪽은 지그재그로 늘어진다
  ctx.fillStyle = OUT; ctx.fillRect(0, 2, 34, 9);
  for (let x = 1; x < 33; x++) {
    ctx.fillStyle = (Math.floor((x - 1) / 4) % 2 === 0) ? RED : CLOTH;
    ctx.fillRect(x, 3, 1, 6);
    if (((x - 1) % 4) === 1 || ((x - 1) % 4) === 2) ctx.fillRect(x, 9, 1, 1);
  }
  ctx.fillStyle = REDD; ctx.fillRect(1, 8, 32, 1);
  // 판매대
  ctx.fillStyle = OUT; ctx.fillRect(1, 18, 32, 11);
  ctx.fillStyle = WOOD; ctx.fillRect(2, 19, 30, 9);
  ctx.fillStyle = WOODL; ctx.fillRect(2, 19, 30, 2);
  ctx.fillStyle = WOODD;
  for (let x = 6; x < 32; x += 6) ctx.fillRect(x, 21, 1, 7);
  ctx.fillRect(2, 27, 30, 1);
  // 판매대 위 물건 — 포션 하나, 동전 몇 닢
  ctx.fillStyle = '#e5484d'; ctx.fillRect(8, 15, 3, 3); ctx.fillStyle = '#d8ecff'; ctx.fillRect(8, 14, 3, 1);
  ctx.fillStyle = '#8d5726'; ctx.fillRect(9, 13, 1, 1);
  ctx.fillStyle = '#ffe066'; ctx.fillRect(20, 16, 2, 2); ctx.fillRect(23, 16, 2, 2); ctx.fillRect(21, 14, 2, 2);
  ctx.fillStyle = '#d9a441'; ctx.fillRect(20, 17, 2, 1); ctx.fillRect(23, 17, 2, 1);
  return cv;
}

function makeCaveEntrance(seed) {
  const cv = makeCanvas(38, 34), ctx = cv.getContext('2d');
  const rng = Util.makeRng(seed);
  const OUT = '#1d1a17', ROCK = '#6a655e', LIT = '#857f75', DARK = '#4b4740';

  // 바위 덩어리를 겹쳐 아치를 만든다
  const blobs = [[19, 20, 17], [8, 24, 10], [30, 24, 10], [19, 12, 12]];
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2] + 1, OUT);
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2], ROCK);
  for (const b of blobs) fillCircle(ctx, b[0] - 2, b[1] - 3, b[2] - 4, LIT);

  // 아래를 평평하게 잘라 땅에 붙은 것처럼 보이게 한다
  ctx.clearRect(0, 31, 38, 3);

  // 입구 — 안쪽으로 갈수록 완전히 검어진다
  fillCircle(ctx, 19, 24, 10, DARK);
  fillCircle(ctx, 19, 25, 8.5, '#241f1b');
  fillCircle(ctx, 19, 26, 7, '#0d0b0a');
  ctx.fillStyle = '#0d0b0a';
  ctx.fillRect(12, 24, 15, 7);

  // 질감 얼룩
  for (let i = 0; i < 40; i++) {
    const x = 2 + Math.floor(rng() * 34), y = 2 + Math.floor(rng() * 26);
    const px = ctx.getImageData(x, y, 1, 1).data;
    if (px[3] === 0 || (px[0] < 60 && px[1] < 60)) continue;   // 입구 안쪽은 건드리지 않는다
    ctx.fillStyle = rng() < 0.5 ? LIT : DARK;
    ctx.fillRect(x, y, 1, 1);
  }
  return cv;
}

function makeLilyPad(seed) {
  const cv = makeCanvas(11, 9), ctx = cv.getContext('2d');
  fillCircle(ctx, 5.5, 4.5, 4.5, '#1d5a2c');
  fillCircle(ctx, 5.5, 4.0, 3.6, '#2f8040');
  fillCircle(ctx, 4.5, 3.2, 1.8, '#3f9950');
  ctx.clearRect(5, 4, 3, 5);     // 잎의 갈라진 틈
  return cv;
}

// 화면 가장자리를 어둡게 — 격자 디더링으로 도트 느낌을 유지한다
function makeVignette(w, h, strength) {
  const cv = makeCanvas(w, h), ctx = cv.getContext('2d');
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const img = ctx.createImageData(w, h);
  const cx = w / 2, cy = h / 2;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (x - cx) / cx, dy = (y - cy) / cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const a = Util.clamp((d - 0.60) / 0.75, 0, 1);
      if (a <= BAYER[y & 3][x & 3] / 16) continue;
      const i4 = (y * w + x) * 4;
      img.data[i4] = 10; img.data[i4 + 1] = 16; img.data[i4 + 2] = 14;
      img.data[i4 + 3] = Math.round(Math.min(1, a) * 255 * strength);
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// 강공격 궤적 — 평타보다 굵고 넓고 노랗다
function makeHeavySlashFrame(angle, t) {
  const S = 64, cv = makeCanvas(S, S), ctx = cv.getContext('2d');
  const cx = S / 2, cy = S / 2;
  const rIn = 13 + t * 11;
  const rOut = rIn + 11 - t * 5;
  const spread = 1.55 - t * 0.35;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < rIn || d > rOut) continue;
      const da = Math.abs(Util.angleDiff(Math.atan2(dy, dx), angle));
      if (da > spread) continue;
      if (da / spread > 0.78 && (x + y) % 2 === 0) continue;
      ctx.fillStyle = d > rIn + (rOut - rIn) * 0.5 ? '#ffb35c' : '#fff2d0';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

// 회전베기 — 플레이어를 둘러싸고 퍼져나가는 고리
function makeSpinRing(t) {
  // 판정 반경(무기 사거리 21 + 보너스 22 = 약 43)에 맞춰 고리를 그린다
  const S = 100, cv = makeCanvas(S, S), ctx = cv.getContext('2d');
  const cx = S / 2, cy = S / 2;
  const r = 20 + t * 23;
  const thick = 3.4 - t * 1.6;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < r - thick || d > r) continue;
      // 고리를 촘촘한 점선으로 만들어 회전하는 느낌을 준다
      const a = Math.atan2(dy, dx);
      if (Math.floor((a + Math.PI) * 7) % 2 === 0 && t > 0.3) continue;
      ctx.fillStyle = d > r - thick * 0.5 ? '#7ec8ff' : '#ffffff';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* ── 보스: 거대 슬라임 ─────────────────────────────────────
   32x32 격자를 손으로 찍기엔 칸이 너무 많아서, 나무처럼 원을 겹쳐 그린다.
   일반 슬라임과 같은 레벨 색을 쓰되 눈매를 사납게 해서 구분한다. */
function makeGiantSlime(pal) {
  const W = 44, H = 38;
  const cv = makeCanvas(W, H), ctx = cv.getContext('2d');
  const OUT = '#12100e';
  const cx = W / 2;

  // 몸통 — 아래가 퍼진 돔 모양
  const blobs = [[cx, 22, 19], [cx - 9, 26, 13], [cx + 9, 26, 13], [cx, 14, 14]];
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2] + 1, OUT);
  for (const b of blobs) fillCircle(ctx, b[0], b[1], b[2], pal.M);
  ctx.clearRect(0, 33, W, H - 33);          // 바닥을 평평하게 자른다
  ctx.fillStyle = OUT; ctx.fillRect(6, 32, W - 12, 1);

  // 위쪽 하이라이트와 아래쪽 그늘
  fillCircle(ctx, cx - 5, 12, 9, pal.n);
  fillCircle(ctx, cx - 7, 9, 5, '#ffffff');
  ctx.globalAlpha = 0.55;
  fillCircle(ctx, cx, 30, 15, pal.m);
  ctx.globalAlpha = 1;

  // 사나운 눈 — 눈썹이 안쪽으로 기울어 있다
  for (const side of [-1, 1]) {
    const ex = cx + side * 8;
    ctx.fillStyle = OUT;
    ctx.fillRect(ex - 3, 17, 6, 6);
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(ex - 2, 19, 4, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ex + (side > 0 ? -2 : 1), 19, 1, 1);
    // 눈썹
    ctx.fillStyle = OUT;
    for (let i = 0; i < 5; i++) ctx.fillRect(ex - 3 + i, 14 + (side > 0 ? 4 - i : i) * 0.5, 1, 2);
  }

  // 입
  ctx.fillStyle = OUT;
  ctx.fillRect(cx - 5, 27, 10, 2);
  ctx.fillRect(cx - 6, 26, 1, 1);
  ctx.fillRect(cx + 5, 26, 1, 1);
  return cv;
}

// 내려찍기 착지 충격파 — 바닥에 퍼지는 납작한 고리
function makeShockRing(t, radius) {
  const S = Math.ceil(radius * 2) + 8;
  const cv = makeCanvas(S, Math.ceil(S * 0.62)), ctx = cv.getContext('2d');
  const cx = S / 2, cy = cv.height / 2;
  const r = radius * (0.35 + t * 0.65);
  const thick = 4.5 - t * 2.5;
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = (y + 0.5 - cy) / 0.62;   // 눌린 타원
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < r - thick || d > r) continue;
      if (t > 0.55 && (x + y) % 2 === 0) continue;           // 끝날수록 성기게
      ctx.fillStyle = d > r - thick * 0.45 ? '#ffd9a0' : '#ff9a4a';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

// ── js/input.js
'use strict';

/* 키보드 / 마우스 입력. 눌린 키를 계속 들고 있고,
   "이번 프레임에 새로 눌렸는가"(pressed)도 따로 관리한다. */

const Input = {
  down: {},
  pressed: {},
  // 마우스 위치는 캔버스 내부 좌표(384x216) 기준으로 들고 있는다.

  mouse: { x: CONFIG.VIEW_W / 2, y: CONFIG.VIEW_H / 2, used: false },

  init(canvas) {
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      Input.mouse.x = (e.clientX - r.left) / r.width * canvas.width;
      Input.mouse.y = (e.clientY - r.top) / r.height * canvas.height;
      Input.mouse.used = true;   // 마우스를 한 번이라도 쓰면 그때부터 마우스로 겨눈다
    });
    window.addEventListener('keydown', (e) => {
      if (Input.CAPTURED[e.code]) e.preventDefault();
      if (!Input.down[e.code]) Input.pressed[e.code] = true;
      Input.down[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      Input.down[e.code] = false;
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (!Input.down.Mouse) Input.pressed.Mouse = true;
      Input.down.Mouse = true;
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) Input.down.Mouse = false;
    });
    // 창에서 포커스가 빠지면 키가 눌린 채로 남지 않도록 정리
    window.addEventListener('blur', () => { Input.down = {}; });
  },

  // 스크롤 등 브라우저 기본 동작을 막을 키
  CAPTURED: {
    Space: 1, Tab: 1,
    ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,   // 상점 고르기에 쓴다 — 페이지가 스크롤되면 안 된다
  },

  // -1 / 0 / 1 형태의 이동 입력 (WASD)
  axisX() {
    return (this.down.KeyD ? 1 : 0) - (this.down.KeyA ? 1 : 0);
  },
  axisY() {
    return (this.down.KeyS ? 1 : 0) - (this.down.KeyW ? 1 : 0);
  },

  attackPressed() {
    return !!(this.pressed.Space || this.pressed.Mouse);
  },

  // 누르고 있는 동안 계속 휘두르게 하려면 눌린 상태 자체를 봐야 한다
  attackHeld() {
    return !!(this.down.Space || this.down.Mouse);
  },

  // 3주차: 바닥 무기를 F 로 집어서 교체 (실수로 바뀌지 않도록 직접 눌러야 한다)
  pickupPressed() {
    return !!this.pressed.KeyF;
  },

  // 대시 — Shift
  dashPressed() {
    return !!(this.pressed.ShiftLeft || this.pressed.ShiftRight);
  },

  // 7주차 스킬 — 눌린 스킬 키('Q'/'R')를 돌려준다. 어느 스킬인지는 지금 든 무기가 정한다
  skillPressed() {
    for (const k of CONFIG.skills.keys) {
      if (this.pressed['Key' + k]) return k;
    }
    return null;
  },

  // 캔버스 좌표의 마우스를 월드 좌표로 바꾼다 (카메라만큼 밀어준다)
  aimWorld(cam) {
    return { x: cam.x + this.mouse.x, y: cam.y + this.mouse.y };
  },

  // 2주차: E 로 포션 마시기, I / Tab 으로 인벤토리 열기
  potionPressed() {
    return !!this.pressed.KeyE;
  },

  inventoryPressed() {
    return !!(this.pressed.KeyI || this.pressed.Tab);
  },

  // 4주차: M 으로 전체 지도, N 으로 새 게임(확인 후 진행)
  mapPressed() {
    return !!this.pressed.KeyM;
  },

  newGamePressed() {
    return !!this.pressed.KeyN;
  },

  // 매 프레임 끝에서 호출 — pressed 는 한 프레임만 살아있다
  endFrame() {
    this.pressed = {};
  },
};

  <script>
// ── js/fx.js
'use strict';

/* 파티클, 떠오르는 데미지 숫자, 화면 흔들림, 히트스톱 — 타격감 담당 */

const FX = {
  particles: [],
  numbers: [],
  sparks: [],      // 맞은 자리에서 튀는 불꽃 (짧은 빛줄기)
  rings: [],       // 처치할 때 퍼지는 고리
  flashes: [],     // 화면 전체 번쩍임 (피격은 붉게, 큰 충격은 희게)
  kick: { x: 0, y: 0 },   // 카메라 킥 — 맞힌 방향으로 살짝 밀렸다 돌아온다
  shake: 0,
  hitStop: 0,

  reset() {
    this.particles.length = 0;
    this.numbers.length = 0;
    this.sparks.length = 0;
    this.rings.length = 0;
    this.flashes.length = 0;
    this.kick.x = this.kick.y = 0;
    this.shake = 0;
    this.hitStop = 0;
  },

  // 10주차: 맞은 자리에 빛줄기가 튄다. 치명타는 줄기가 더 많고 길다
  spark(x, y, angle, big) {
    this.sparks.push({ x: x, y: y, angle: angle, big: !!big, life: 0.14, maxLife: 0.14,
      spread: Util.rand(0, Math.PI * 2) });
  },

  // 처치할 때 퍼지는 고리
  ring(x, y, r, color) {
    this.rings.push({ x: x, y: y, r0: r, life: 0.28, maxLife: 0.28, color: color });
  },

  // 화면 전체를 잠깐 물들인다
  flash(color, alpha, time) {
    this.flashes.push({ color: color, alpha: alpha, life: time, maxLife: time });
  },

  addKick(angle, amount) {
    this.kick.x += Math.cos(angle) * amount;
    this.kick.y += Math.sin(angle) * amount;
  },

  // 사방으로 튀는 사각 파티클
  burst(x, y, count, colors, opts) {
    opts = opts || {};
    const speed = opts.speed || 55;
    const life = opts.life || 0.45;
    const size = opts.size || 2;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * Util.rand(0.35, 1);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - Util.rand(8, 26),
        life: life * Util.rand(0.7, 1.3),
        maxLife: life,
        color: Util.choice(colors),
        size: Util.randInt(1, size),
        gravity: opts.gravity === undefined ? 150 : opts.gravity,
      });
    }
  },

  // 한 방향으로 흩뿌리는 피격 파티클
  spray(x, y, angle, count, colors) {
    for (let i = 0; i < count; i++) {
      const a = angle + Util.rand(-0.6, 0.6);
      const s = Util.rand(40, 110);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: Util.rand(0.18, 0.4),
        maxLife: 0.4,
        color: Util.choice(colors),
        size: Util.randInt(1, 2),
        gravity: 90,
      });
    }
  },

  // big 이면 두 배 크기로 찍힌다 (치명타)
  number(x, y, text, color, big) {
    const life = big ? 0.85 : 0.75;
    this.numbers.push({ x: x + Util.rand(-3, 3), y: y, vy: big ? -40 : -34, life: life, maxLife: life, text: String(text), color: color, big: !!big });
  },

  addShake(amount) {
    this.shake = Math.max(this.shake, amount);
  },

  freeze(t) {
    this.hitStop = Math.max(this.hitStop, t);
  },

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= 0.94;
    }
    for (let i = this.numbers.length - 1; i >= 0; i--) {
      const n = this.numbers[i];
      n.life -= dt;
      if (n.life <= 0) { this.numbers.splice(i, 1); continue; }
      n.y += n.vy * dt;
      n.vy += 60 * dt;
    }
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      this.sparks[i].life -= dt;
      if (this.sparks[i].life <= 0) this.sparks.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      this.rings[i].life -= dt;
      if (this.rings[i].life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.flashes.length - 1; i >= 0; i--) {
      this.flashes[i].life -= dt;
      if (this.flashes[i].life <= 0) this.flashes.splice(i, 1);
    }
    // 킥은 빠르게 제자리로 돌아온다
    const k = Math.pow(0.0005, dt);
    this.kick.x *= k; this.kick.y *= k;
    this.shake = Math.max(0, this.shake - dt * 22);
  },

  // 불꽃 — 중심에서 뻗는 짧은 줄기 몇 개. 처음엔 희고 끝엔 노랗게, 점점 짧아진다
  drawSparks(ctx, cam) {
    for (const s of this.sparks) {
      const t = s.life / s.maxLife;           // 1 -> 0
      const n = s.big ? 8 : 5;
      const len = (s.big ? 9 : 6) * (0.4 + t * 0.6);
      ctx.fillStyle = t > 0.5 ? '#ffffff' : (s.big ? '#ffd93d' : '#ffe9a8');
      const cx = s.x - cam.x, cy = s.y - cam.y;
      for (let i = 0; i < n; i++) {
        const a = s.spread + (i / n) * Math.PI * 2;
        const from = len * (1 - t) * 0.6;      // 안쪽은 비워서 바깥으로 날아가는 것처럼
        for (let k = from; k <= len; k += 1) {
          ctx.fillRect(Math.round(cx + Math.cos(a) * k), Math.round(cy + Math.sin(a) * k), 1, 1);
        }
      }
    }
  },

  // 고리 — 1픽셀 두께 원이 커지며 옅어진다
  drawRings(ctx, cam) {
    for (const r of this.rings) {
      const t = 1 - r.life / r.maxLife;        // 0 -> 1
      const rad = r.r0 + t * r.r0 * 1.6;
      ctx.fillStyle = r.color;
      ctx.globalAlpha = 1 - t;
      const steps = Math.max(12, Math.round(rad * 2));
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        ctx.fillRect(Math.round(r.x - cam.x + Math.cos(a) * rad), Math.round(r.y - cam.y + Math.sin(a) * rad * 0.7), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  },

  drawFlashes(ctx) {
    for (const f of this.flashes) {
      ctx.globalAlpha = f.alpha * (f.life / f.maxLife);
      ctx.fillStyle = f.color;
      ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    }
    ctx.globalAlpha = 1;
  },

  drawParticles(ctx, cam) {
    for (const p of this.particles) {
      // 수명이 끝나갈수록 격자로 사라지게 해서 도트 느낌을 유지한다
      const t = p.life / p.maxLife;
      const px = Math.round(p.x - cam.x), py = Math.round(p.y - cam.y);
      if (t < 0.4 && (px + py) % 2 === 0) continue;
      ctx.fillStyle = p.color;
      ctx.fillRect(px, py, p.size, p.size);
    }
  },

  drawNumbers(ctx, cam) {
    for (const n of this.numbers) {
      if (n.life < 0.2 && Math.floor(n.life * 30) % 2 === 0) continue;   // 끝에서 깜빡임
      if (n.big) {
        // 치명타 — 두 배 크기. 처음 0.1초는 살짝 더 커서 "튀어나온다"
        const s = n.life > n.maxLife - 0.1 ? 3 : 2;
        ctx.save();
        ctx.scale(s, s);
        UI.drawText(ctx, n.text, Math.round((n.x - cam.x) / s), Math.round((n.y - cam.y) / s), n.color, true);
        ctx.restore();
        continue;
      }
      UI.drawText(ctx, n.text, Math.round(n.x - cam.x), Math.round(n.y - cam.y), n.color, true);
    }
  },
};

// ── js/sound.js
'use strict';

/* 10주차: 소리 — 효과음과 배경음악을 전부 코드로 합성한다 (Web Audio).
   외부 음원 파일이 하나도 없으므로 index.html 만 열어도 소리가 난다.

   효과음: 오실레이터(사인/삼각/사각/톱니) 몇 개와 백색소음 + 필터로 만든다.
           도트 그림에 어울리게 짧고 단순한 칩튠 소리로 잡았다.
   배경음: 스텝 시퀀서. 베이스·화음·멜로디 세 성부를 미리 적어둔 악보로 돌리고,
           지역(숲 가장자리/깊은 숲/포자 골짜기)과 보스 방마다 다른 곡을 튼다.

   브라우저는 사용자가 뭔가 누르기 전에는 소리를 못 내게 막으므로,
   첫 키 입력이나 클릭에서 AudioContext 를 만든다(unlock). */

const Sound = {
  KEY: 'forest-rpg-sound',
  ctx: null,
  master: null,
  sfx: null,
  bgm: null,
  noiseBuf: null,
  enabled: true,
  unlocked: false,

  // 배경음 시퀀서 상태
  track: null,          // 지금 트는 곡 이름
  nextTrack: null,
  step: 0,
  nextStepTime: 0,
  timer: null,
  trackGain: null,      // 곡 전환용 페이드
  lastPlay: {},         // 같은 효과음이 한 프레임에 겹쳐 터지지 않게

  init() {
    try { this.enabled = localStorage.getItem(this.KEY) !== 'off'; } catch (e) { /* 무시 */ }
    const unlock = () => this.unlock();
    window.addEventListener('keydown', unlock);
    window.addEventListener('mousedown', unlock);
    window.addEventListener('touchstart', unlock);
  },

  unlock() {
    if (this.unlocked) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.unlocked = true;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 1 : 0;
    this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
    this.bgm = this.ctx.createGain(); this.bgm.gain.value = 0.32; this.bgm.connect(this.master);

    // 백색소음 2초 — 효과음마다 잘라 쓴다
    const n = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.startSequencer();
  },

  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.setTargetAtTime(this.enabled ? 1 : 0, this.ctx.currentTime, 0.02);
    try { localStorage.setItem(this.KEY, this.enabled ? 'on' : 'off'); } catch (e) { /* 무시 */ }
    return this.enabled;
  },

  /* ── 합성 기본 재료 ─────────────────────────────────────── */

  // 한 음. freq 에서 slide 까지 미끄러지고, attack 뒤 dur 동안 사그라든다
  tone(o) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + o.dur);
    const g = this.ctx.createGain();
    const peak = o.gain || 0.2, atk = o.attack || 0.005;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    let node = osc;
    if (o.lowpass) {
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = o.lowpass;
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(o.out || this.sfx);
    osc.start(t0); osc.stop(t0 + o.dur + 0.02);
  },

  // 소음 한 조각. 필터 주파수를 from -> to 로 쓸어내려 "휙" "퍽" 같은 질감을 만든다
  noise(o) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.from || 1000, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + o.dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(this.sfx);
    src.start(t0); src.stop(t0 + o.dur + 0.02);
  },

  // 여러 음을 차례로 (아르페지오)
  arp(notes, type, each, gain) {
    notes.forEach((n, i) => this.tone({ freq: n, type: type, dur: each * 1.6, gain: gain, delay: i * each }));
  },

  /* ── 효과음 목록 ────────────────────────────────────────── */
  SFX: {
    swing(S)   { S.noise({ dur: 0.09, from: 2200, to: 500, gain: 0.16, q: 0.8 }); },
    hit(S)     { S.tone({ freq: 190, slide: 70, type: 'sine', dur: 0.09, gain: 0.35 });
                 S.noise({ dur: 0.05, filter: 'lowpass', from: 1000, gain: 0.18 }); },
    crit(S)    { S.SFX.hit(S); S.tone({ freq: 880, slide: 1400, type: 'square', dur: 0.09, gain: 0.08, delay: 0.01 }); },
    kill(S)    { S.noise({ dur: 0.2, filter: 'lowpass', from: 1400, to: 150, gain: 0.3 });
                 S.tone({ freq: 320, slide: 50, type: 'triangle', dur: 0.18, gain: 0.3 }); },
    hurt(S)    { S.tone({ freq: 170, slide: 80, type: 'sawtooth', dur: 0.2, gain: 0.22, lowpass: 900 });
                 S.noise({ dur: 0.1, filter: 'highpass', from: 700, gain: 0.12 }); },
    death(S)   { S.tone({ freq: 440, slide: 90, type: 'triangle', dur: 0.7, gain: 0.25 });
                 S.noise({ dur: 0.5, filter: 'lowpass', from: 800, to: 100, gain: 0.2 }); },
    potion(S)  { S.arp([523, 784], 'triangle', 0.09, 0.16); },
    gold(S)    { S.tone({ freq: 1320, type: 'sine', dur: 0.07, gain: 0.1 });
                 S.tone({ freq: 1760, type: 'sine', dur: 0.12, gain: 0.1, delay: 0.06 }); },
    pickup(S)  { S.arp([660, 880, 1100], 'square', 0.06, 0.07); },
    levelup(S) { S.arp([523, 659, 784, 1046], 'triangle', 0.11, 0.2); },
    dash(S)    { S.noise({ dur: 0.14, filter: 'highpass', from: 2500, to: 400, gain: 0.14 }); },
    heavy(S)   { S.noise({ dur: 0.28, filter: 'lowpass', from: 600, to: 120, gain: 0.35 });
                 S.tone({ freq: 95, slide: 38, type: 'sine', dur: 0.3, gain: 0.4 }); },
    flurry(S)  { for (let i = 0; i < 5; i++) S.noise({ dur: 0.07, from: 2600, to: 900, gain: 0.14, q: 1.2, delay: i * 0.1 }); },
    shadow(S)  { S.noise({ dur: 0.22, filter: 'highpass', from: 3000, to: 300, gain: 0.18 });
                 S.tone({ freq: 520, slide: 130, type: 'triangle', dur: 0.25, gain: 0.14 }); },
    quake(S)   { S.tone({ freq: 70, slide: 30, type: 'sine', dur: 0.5, gain: 0.5, delay: 0.38 });
                 S.noise({ dur: 0.4, filter: 'lowpass', from: 500, to: 60, gain: 0.45, delay: 0.38 }); },
    rage(S)    { S.tone({ freq: 90, slide: 260, type: 'sawtooth', dur: 0.5, gain: 0.22, lowpass: 900, attack: 0.04 });
                 S.arp([220, 330, 440], 'square', 0.08, 0.08); },
    spin(S)    { // 도는 내내 "휘이잉" — 소음 필터를 0.18초마다 오르내리게 한다
                 for (let i = 0; i < 9; i++) S.noise({ dur: 0.2, from: 500, to: 1800, gain: 0.12, q: 2, delay: i * 0.18 }); },
    roar(S)    { S.tone({ freq: 70, slide: 42, type: 'sawtooth', dur: 0.9, gain: 0.28, lowpass: 500, attack: 0.05 });
                 S.tone({ freq: 74, slide: 45, type: 'sawtooth', dur: 0.9, gain: 0.2, lowpass: 500, attack: 0.05 }); },

  setTrack(name) {
    if (name === this.track || name === this.nextTrack) return;
    this.nextTrack = name;
    if (!this.ctx) { this.track = name; this.nextTrack = null; return; }
    // 지금 곡을 0.6초 동안 줄이고 다음 곡을 시작한다
    if (this.trackGain) {
      const g = this.trackGain;
      g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2);
      setTimeout(() => { try { g.disconnect(); } catch (e) { /* 무시 */ } }, 1500);
    }
    this.trackGain = this.ctx.createGain();
    this.trackGain.gain.value = 0;
    this.trackGain.gain.setTargetAtTime(1, this.ctx.currentTime + 0.3, 0.4);
    this.trackGain.connect(this.bgm);
    this.track = name;
    this.nextTrack = null;
    this.step = 0;
    this.nextStepTime = this.ctx.currentTime + 0.1;
  },

  /* 시퀀서 — 25ms 마다 깨어나 앞으로 0.12초 안에 올 스텝을 미리 예약한다.
     rAF 가 아니라 setInterval 이므로 탭이 잠깐 가려져도 박자가 흐트러지지 않는다. */
  startSequencer() {
    if (this.timer) return;
    if (this.track) { const t = this.track; this.track = null; this.setTrack(t); }
    this.timer = setInterval(() => this.schedule(), 25);
  },

  schedule() {
    if (!this.ctx || !this.track) return;
    const spec = this.TRACKS[this.track];
    if (!spec) return;
    const stepDur = 60 / spec.bpm / 4;
    const bars = spec.lead.length / 16;
    while (this.nextStepTime < this.ctx.currentTime + 0.12) {
      this.playStep(spec, this.step % (bars * 16), this.nextStepTime, stepDur);
      this.step++;
      this.nextStepTime += stepDur;
    }
  },

  playStep(spec, step, t, stepDur) {
    if (!this.enabled) return;
    const bar = Math.floor(step / 16), inBar = step % 16;
    const out = this.trackGain;
    const delay = Math.max(0, t - this.ctx.currentTime);

    // 베이스
    const b = spec.bass[bar % spec.bass.length];
    if (Array.isArray(b)) {
      if (inBar % 2 === 0) this.tone({ freq: this.midi(b[inBar / 2]), type: spec.bassType, dur: stepDur * 1.8, gain: 0.16, delay: delay, out: out, lowpass: 800 });
    } else if (inBar === 0 || inBar === 8) {
      this.tone({ freq: this.midi(b), type: spec.bassType, dur: stepDur * 7, gain: 0.16, delay: delay, out: out, lowpass: 600, attack: 0.02 });
    }
    // 화음 — 마디 첫 박에 여리게 깔린다
    if (inBar === 0) {
      const ch = spec.chord[bar % spec.chord.length];
      for (const n of ch) this.tone({ freq: this.midi(n), type: 'triangle', dur: stepDur * 15, gain: 0.045, delay: delay, out: out, attack: 0.05 });
    }
    // 멜로디
    const n = spec.lead[step];
    if (n) this.tone({ freq: this.midi(n), type: spec.type, dur: stepDur * 1.7, gain: spec.leadGain, delay: delay, out: out, lowpass: 2400 });
  },
};

  <script>
// ── js/world.js
'use strict';

/* 숲 맵.
   바닥(지형 타일 + 잔디디테일)은 한 번만 그려서 큰 캔버스에 구워두고,
   서 있는 물체(나무, 바위, 풀)는 매 프레임 캐릭터와 함께 y좌표 순으로 그린다.

   지형은 노이즈 두 장으로 나눈다.
     - 물기 노이즈: 높은 곳은 연못, 그 둘레는 모래사장
     - 개방도 노이즈: 낮은 곳은 흙바닥 공터, 높은 곳은 나무가 빽빽한 숲
   여기에 흙길을 가로/세로로 하나씩 내서 길잡이를 만든다. */

const TILE_GRASS = 0, TILE_DIRT = 1, TILE_SAND = 2, TILE_WATER = 3, TILE_MEADOW = 4;

// 타일 경계를 흐릴 때 쓰는 대표색 — [그늘 여부][타일종류]
const TILE_BASE_COLOR = [
  ['#3f8b40', '#7d5f3c', '#c2a877', '#2f6f9e', '#3f8b40'],   // 볕이 드는 숲 바닥
  ['#2c6431', '#7d5f3c', '#c2a877', '#2f6f9e', '#2c6431'],   // 빽빽한 숲의 그늘진 바닥
];

const World = {
  w: 0,            // 픽셀 단위 맵 크기
  h: 0,
  ground: null,    // 미리 구워둔 바닥 레이어
  props: [],       // 나무, 바위, 풀 등 세워진 물체
  solids: [],      // 충돌 박스 목록
  grid: null,      // 충돌 검색용 공간 분할
  cell: 48,
  tiles: null,     // 타일 종류
  tileBlocked: null,
  time: 0,         // 풀이 흔들리는 데 쓰는 누적 시간

  init(seed) {
    const T = CONFIG.TILE;
    this.cols = CONFIG.MAP_W;
    this.rows = CONFIG.MAP_H;
    this.isArena = false;
    this.arenaExit = null;
    this.w = this.cols * T;
    this.h = this.rows * T;
    this.props = [];
    this.solids = [];
    this.time = 0;
    this.caves = CONFIG.forest.caves.map(() => null);   // 동굴 입구 셋 — 각자 자기 보스 방으로 이어진다
    this.merchant = null;   // 상인 (Shop.place 가 채운다)

    this.buildDanger(seed);
    this.buildTiles(seed);
    this.bakeGround(Util.makeRng(seed + 5));
    this.placeTrees(Util.makeRng(seed + 17));
    this.buildGrid();   // 나무 충돌을 먼저 등록해야 장식이 나무를 피해서 놓인다
    this.placeDecor(Util.makeRng(seed + 41));
    Shop.place();       // 9주차: 시작 지점 옆 가판대와 상인
    this.buildGrid();   // 바위·그루터기·가판대까지 포함해 다시 만든다
  },

  update(dt) {
    this.time += dt;
  },

  /* ── 맵 갈아끼우기 ─────────────────────────────────────
     동굴에 들어갈 때 겉맵을 통째로 접어뒀다가, 나올 때 그대로 펼친다.
     시드로 다시 만들면 200ms쯤 걸리고 몬스터·아이템 위치도 잃어버리므로,
     만들어 둔 것을 그냥 들고 있는 편이 낫다. (바닥 캔버스가 커봐야 20MB 남짓) */
  STATE_KEYS: [
    'cols', 'rows', 'w', 'h', 'ground', 'props', 'solids', 'grid',
    'tiles', 'tileBlocked', 'shade', 'dangerNoise',
    'startX', 'startY', 'wetNoise', 'openNoise', 'caves', 'arenaExit', 'merchant',
    'time', 'isArena',
  ],

  snapshot() {
    const s = {};
    for (const k of this.STATE_KEYS) s[k] = this[k];
    return s;
  },

  restore(s) {
    for (const k of this.STATE_KEYS) this[k] = s[k];
  },

  /* ── 보스전 전용 공간 ───────────────────────────────────
     동굴 입구로 들어가면 나오는 방. 사방이 바위벽으로 막힌 돌바닥이고
     남쪽 벽에 나가는 굴이 하나 뚫려 있다.
     겉맵과 달리 지형을 뽑아내지 않고 손으로 짠 방이라 매번 같은 모양이다 —
     보스와 싸우는 자리는 예측 가능해야 패턴을 외워 대응할 수 있기 때문이다. */
  initArena(seed, caveIndex) {
    const T = CONFIG.TILE, a = CONFIG.arena, WALL = 2;
    this.cols = a.w;
    this.rows = a.h;
    this.w = this.cols * T;
    this.h = this.rows * T;
    this.props = [];
    this.solids = [];
    this.time = 0;
    this.caves = [];
    this.merchant = null;
    this.isArena = true;
    this.arenaCave = caveIndex || 0;

    const rng = Util.makeRng(seed);
    const N = this.cols * this.rows;
    this.tiles = new Uint8Array(N);
    this.tileBlocked = new Uint8Array(N);
    this.shade = new Uint8Array(N);
    // 겉맵 전용 노이즈를 참조하다 터지지 않도록 밋밋한 값으로 채워둔다
    this.wetNoise = () => 0;
    this.openNoise = () => 0.5;
    this.dangerNoise = () => 0.5;

    for (let ty = 0; ty < this.rows; ty++) {
      for (let tx = 0; tx < this.cols; tx++) {
        const i = ty * this.cols + tx;
        const wall = tx < WALL || ty < WALL || tx >= this.cols - WALL || ty >= this.rows - WALL;
        this.tiles[i] = wall ? TILE_DIRT : TILE_GRASS;
        this.tileBlocked[i] = wall ? 1 : 0;
      }
    }

    this.bakeArena(rng, WALL, caveIndex || 0);

    // 나가는 굴은 남쪽 벽 한가운데. 들어온 자리이자 나가는 자리다
    const ex = Math.floor(this.cols / 2) * T;
    const ey = (this.rows - WALL) * T + 6;
    this.arenaExit = this.addProp(SPRITES.caveEntrance[0], ex, ey, { footHeight: 3 });

    for (let tx = WALL; tx < this.cols - WALL; tx += 2) {
      if (Math.abs(tx - this.cols / 2) < 3) continue;   // 나가는 굴 앞은 비워둔다
      if (rng() < 0.35) continue;
      this.addProp(Util.choice(SPRITES.boulder), tx * T + rng() * 8, (WALL - 1) * T + 12, { footHeight: 3 });
      if (rng() < 0.5) this.addProp(Util.choice(SPRITES.boulder), tx * T + rng() * 8, (this.rows - WALL) * T + 10, { footHeight: 3 });
    }
    for (let ty = WALL + 1; ty < this.rows - WALL; ty += 3) {
      if (rng() < 0.4) continue;
      this.addProp(Util.choice(SPRITES.boulder), (WALL - 1) * T + 10, ty * T + rng() * 8, { footHeight: 3 });
      this.addProp(Util.choice(SPRITES.boulder), (this.cols - WALL) * T + 6, ty * T + rng() * 8, { footHeight: 3 });

       보스가 화면 위 체력바에 걸쳐 잘리면 안 되기 때문이다. */
    this.startX = ex;

    this.bossX = ex;
    this.bossY = WALL * T + 78;
  },

  // 보스 방 바닥 굽기 — 벽은 캄캄하게, 바닥은 자갈이 굴러다니는 돌바닥
  bakeArena(rng, WALL, caveIndex) {
    const T = CONFIG.TILE;
    // 동굴마다 벽 색조가 조금 다르다 — 슬라임 굴은 흙빛, 늑대 굴은 이끼빛, 버섯 굴은 포자빛
    const WALL_TINT = ['rgba(14,11,8,0.88)', 'rgba(8,14,10,0.88)', 'rgba(14,9,16,0.88)'][caveIndex] || 'rgba(12,11,10,0.88)';
    const WALL_GRAIN = ['#2b2620', '#20301f', '#2e2033'][caveIndex] || '#2b2620';
    this.ground = makeCanvas(this.w, this.h);
    const ctx = this.ground.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    for (let ty = 0; ty < this.rows; ty++) {
      for (let tx = 0; tx < this.cols; tx++) {
        const i = ty * this.cols + tx;
        const x = tx * T, y = ty * T;
        const set = this.groundSet(this.tiles[i], 'stone');
        ctx.drawImage(set[Math.floor(rng() * set.length)], x, y);

        if (this.tileBlocked[i]) {
          // 벽 — 거의 검게 덮고 결만 남긴다
          ctx.fillStyle = WALL_TINT;
          ctx.fillRect(x, y, T, T);
          ctx.fillStyle = WALL_GRAIN;
          for (let k = 0; k < 5; k++) ctx.fillRect(x + Math.floor(rng() * T), y + Math.floor(rng() * T), 1, 1);
        } else if (rng() < 0.035) {
          // 자갈은 아주 드물게 — 흔하면 바닥이 어수선해서 보스 동작이 안 보인다
          ctx.drawImage(SPRITES.rock[0], x + Math.floor(rng() * 6), y + Math.floor(rng() * 7));
        }
      }
    }

    // 벽에 닿은 바닥은 그늘지게 — 경계가 칼처럼 떨어지지 않는다
    for (let ty = 0; ty < this.rows; ty++) {
      for (let tx = 0; tx < this.cols; tx++) {
        if (this.tileBlocked[ty * this.cols + tx]) continue;
        const near = this.tileBlocked[(ty - 1) * this.cols + tx] || this.tileBlocked[(ty + 1) * this.cols + tx] ||
                     this.tileBlocked[ty * this.cols + tx - 1] || this.tileBlocked[ty * this.cols + tx + 1];
        if (!near) continue;
        ctx.fillStyle = 'rgba(12,11,10,0.30)';
        ctx.fillRect(tx * T, ty * T, T, T);
        ctx.fillStyle = 'rgba(12,11,10,0.5)';
        for (let k = 0; k < 10; k++) ctx.fillRect(tx * T + Math.floor(rng() * T), ty * T + Math.floor(rng() * T), 1, 1);
      }
    }
  },

  /* 장식 개수를 맵 크기에 맞춰 늘린다.
     인자는 "80x60(=4800타일) 맵이었을 때의 개수"이고, 지금 맵 넓이에 비례해 커진다.
     맵 크기를 바꿔도 숲의 빽빽한 정도가 그대로 유지된다. */
  scaled(countAt4800) {
    return Math.round(countAt4800 * (this.cols * this.rows) / 4800);
  },

  /* ── 지형 ──────────────────────────────────────────────── */

  // 성긴 격자에 난수를 깔고 부드럽게 보간하는 값 노이즈
  makeNoise(seed, cols, rows) {
    const rng = Util.makeRng(seed);
    const g = new Float32Array((cols + 1) * (rows + 1));
    for (let i = 0; i < g.length; i++) g[i] = rng();
    const smooth = (t) => t * t * (3 - 2 * t);
    return function (fx, fy) {
      const x = Util.clamp(fx, 0, 0.9999) * cols, y = Util.clamp(fy, 0, 0.9999) * rows;
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const u = smooth(x - x0), v = smooth(y - y0);
      const a = g[y0 * (cols + 1) + x0], b = g[y0 * (cols + 1) + x0 + 1];
      const c = g[(y0 + 1) * (cols + 1) + x0], d = g[(y0 + 1) * (cols + 1) + x0 + 1];
      return Util.lerp(Util.lerp(a, b, u), Util.lerp(c, d, u), v);
    };
  },

  /* ── 위험도 — 시작점(맵 한가운데)에서 얼마나 멀리 왔는가 (0~1) ──
     맵 하나가 통째로 "태초의 숲"이고, 지역 경계 대신 이 값이 몬스터 레벨·종류, 나무, 소품을 정한다.
     거리는 맵 모양을 따르는 둥근 사각형(4제곱 노름)으로 재서 가장자리 어디서나 1에 닿고,
     노이즈를 조금 섞어 같은 레벨대가 완벽한 고리로 보이지 않게 한다. */
  buildDanger(seed) {
    this.dangerNoise = this.makeNoise(seed + 71, 9, 7);
    // 플레이어는 숲 한가운데서 시작한다 — 사방 어디로 가든 점점 위험해진다
    this.startX = this.w / 2;
    this.startY = this.h / 2;
  },

  dangerAt(x, y) {
    if (this.isArena) return 0;
    const dx = Math.abs(x - this.startX) / (this.w / 2), dy = Math.abs(y - this.startY) / (this.h / 2);
    const d = Math.pow(dx * dx * dx * dx + dy * dy * dy * dy, 0.25);
    const wob = (this.dangerNoise(x / this.w, y / this.h) - 0.5) * CONFIG.forest.wobble;
    return Util.clamp(d + wob, 0, 1);
  },

  // 그 자리의 기준 몬스터 레벨 (1 ~ LEVEL_MAX). 안전 반경 안은 1, 가장자리에서 최대
  levelAt(x, y) {
    const f = CONFIG.forest;
    const t = Util.clamp((this.dangerAt(x, y) - f.safeRadius) / (1 - f.safeRadius), 0, 1);
    return 1 + Math.round(Math.pow(t, f.curve) * (LEVEL_MAX - 1));
  },

  // 그 자리에 어떤 몬스터가 잘 나오는가 — 세 기준점(t = 0 / 0.5 / 1) 사이를 보간
  typeWeightsAt(x, y) {
    const list = CONFIG.forest.typeWeights;
    const t = this.dangerAt(x, y) * (list.length - 1);
    const i = Math.min(list.length - 2, Math.floor(t)), u = t - i;
    const out = {};
    for (const k in list[i]) out[k] = Util.lerp(list[i][k], list[i + 1][k] || 0, u);
    return out;
  },

  // [t=0 값, t=1 값] 사이를 위험도로 보간 (나무 밀도, 침엽수 비율 등)
  forestAt(key, x, y) {
    const pair = CONFIG.forest[key];
    return Util.lerp(pair[0], pair[1], this.dangerAt(x, y));
  },

  buildTiles(seed) {
    const W = this.cols, H = this.rows, cfg = CONFIG.world;
    this.tiles = new Uint8Array(W * H);
    this.tileBlocked = new Uint8Array(W * H);
    this.wetNoise = this.makeNoise(seed + 11, 7, 5);
    this.openNoise = this.makeNoise(seed + 29, 10, 8);
    const bloom = this.makeNoise(seed + 53, 12, 9);
    this.shade = new Uint8Array(W * H);   // 빽빽한 숲 바닥은 그늘져서 잔디가 어둡다
    // 시작 지점(숲 한가운데) 주변은 물 없이 비워둔다
    const cx = this.startX / CONFIG.TILE, cy = this.startY / CONFIG.TILE;

    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const fx = tx / W, fy = ty / H;
        const nearStart = Util.dist(tx, ty, cx, cy) < cfg.startClearTiles;
        let t = TILE_GRASS;

        const wet = this.wetNoise(fx, fy);
        if (!nearStart) {
          if (wet > cfg.waterLevel) t = TILE_WATER;
          else if (wet > cfg.shoreLevel) t = TILE_SAND;
        }
        if (t === TILE_GRASS) {
          if (this.openNoise(fx, fy) < cfg.clearingLevel) t = TILE_DIRT;
          else if (bloom(fx, fy) > cfg.meadowLevel) t = TILE_MEADOW;
        }
        this.tiles[ty * W + tx] = t;
        if (this.openNoise(fx, fy) > CONFIG.forest.shadeLevel && !nearStart) this.shade[ty * W + tx] = 1;
      }
    }

    this.carvePaths(seed + 97);

    // 물은 통행 불가로 표시 (길을 낸 뒤에 확정한다)
    for (let i = 0; i < this.tiles.length; i++) {
      this.tileBlocked[i] = this.tiles[i] === TILE_WATER ? 1 : 0;
    }
  },

  /* 맵을 가로지르는 흙길 — 어디가 어딘지 알아볼 수 있게 해주는 길잡이.
     맵이 커지면 길도 같이 늘려야 광활한 숲에서 방향을 잃지 않는다. */
  carvePaths(seed) {
    const rng = Util.makeRng(seed);
    const W = this.cols, H = this.rows, half = CONFIG.world.pathWidth;
    const lanes = Math.max(1, Math.round(W / 70));   // 80타일 맵이면 1줄, 160타일이면 2줄

    for (let n = 0; n < lanes; n++) {
      let y = H * (n + 1) / (lanes + 1);
      for (let x = 0; x < W; x++) {
        y = Util.clamp(y + (rng() - 0.5) * 1.3, 4, H - 5);
        for (let d = -half; d <= half; d++) this.paveTile(x, Math.round(y + d));
      }
    }
    for (let n = 0; n < lanes; n++) {
      let px = W * (n + 1) / (lanes + 1);
      for (let ty = 0; ty < H; ty++) {
        px = Util.clamp(px + (rng() - 0.5) * 1.3, 4, W - 5);
        for (let d = -half; d <= half; d++) this.paveTile(Math.round(px + d), ty);
      }
    }
  },

  // 길은 물을 건너지 않는다 (다리는 아직 없으므로 연못은 그대로 둔다)
  paveTile(tx, ty) {
    const W = this.cols, H = this.rows;
    if (tx < 0 || ty < 0 || tx >= W || ty >= H) return;
    const i = ty * W + tx;
    if (this.tiles[i] === TILE_WATER) return;
    this.tiles[i] = TILE_DIRT;
  },

  tileAt(x, y) {
    const T = CONFIG.TILE;
    const tx = Math.floor(x / T), ty = Math.floor(y / T);
    if (tx < 0 || ty < 0 || tx >= this.cols || ty >= this.rows) return TILE_GRASS;
    return this.tiles[ty * this.cols + tx];
  },

  /* ── 바닥 굽기 ─────────────────────────────────────────── */

  bakeGround(rng) {
    const T = CONFIG.TILE, W = this.cols, H = this.rows;
    this.ground = makeCanvas(this.w, this.h);
    const ctx = this.ground.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const i = ty * W + tx;
        const set = this.groundSet(this.tiles[i], this.shade[i] ? 'shade' : 'forest');
        ctx.drawImage(set[Math.floor(rng() * set.length)], tx * T, ty * T);
      }
    }

    this.ditherEdges(ctx, rng);
    this.bakeDetails(ctx, rng);
  },

  // 타일 종류 + 바닥 묶음 이름(forest / shade / stone) -> 실제로 쓸 바닥 타일들
  groundSet(tile, setName) {
    const g = SPRITES.groundSets[setName] || SPRITES.groundSets.forest;
    if (tile === TILE_DIRT) return g.dirt;
    if (tile === TILE_SAND) return SPRITES.sand;    // 물가 모래는 어디서나 같다
    if (tile === TILE_WATER) return SPRITES.water;
    if (tile === TILE_MEADOW) return g.meadow;
    return g.grass;
  },

  // 경계에 서로의 색을 흩뿌려 칼같은 직선을 없앤다.
  // 타일 종류가 같아도 그늘 여부가 다르면 색이 다르므로 그늘 경계도 함께 흐려진다.
  ditherEdges(ctx, rng) {
    const T = CONFIG.TILE, W = this.cols, H = this.rows;
    const colorAt = (i) => TILE_BASE_COLOR[this.shade[i]][this.tiles[i]];
    const sprinkle = (x, y, w, h, color, n) => {
      ctx.fillStyle = color;
      for (let i = 0; i < n; i++) {
        ctx.fillRect(x + Math.floor(rng() * w), y + Math.floor(rng() * h), 1, 1);
      }
    };
    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const i = ty * W + tx;
        const c = colorAt(i);
        if (tx + 1 < W) {
          const cn = colorAt(i + 1);
          if (cn !== c) {
            sprinkle(tx * T + T - 3, ty * T, 3, T, cn, 8);
            sprinkle((tx + 1) * T, ty * T, 3, T, c, 8);
          }
        }
        if (ty + 1 < H) {
          const cn = colorAt(i + W);
          if (cn !== c) {
            sprinkle(tx * T, ty * T + T - 3, T, 3, cn, 8);
            sprinkle(tx * T, (ty + 1) * T, T, 3, c, 8);
          }
        }
      }
    }
  },

  // 지형에 어울리는 잔디테일을 바닥에 직접 찍는다 (움직이지 않으므로 구워도 된다)
  bakeDetails(ctx, rng) {
    const T = CONFIG.TILE, W = this.cols, H = this.rows;
    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const i = ty * W + tx;
        const t = this.tiles[i], shaded = this.shade[i];
        const x = tx * T, y = ty * T;

        // 그늘진 바닥은 꽃이 훨씬 드물다
        const flowerRate = shaded ? 0.05 : 0.16;
        const meadowFlowers = shaded ? 2 : 4;

        if (t === TILE_MEADOW) {
          for (let k = 0; k < meadowFlowers; k++) {
            ctx.drawImage(Util.choice(SPRITES.flower), x + Math.floor(rng() * 12), y + Math.floor(rng() * 11));
          }
        } else if (t === TILE_GRASS) {
          if (rng() < flowerRate) ctx.drawImage(Util.choice(SPRITES.flower), x + Math.floor(rng() * 12), y + Math.floor(rng() * 11));
          // 돌멩이는 아주 드물게 — 많으면 바닥이 자갈밭처럼 보인다
          if (rng() < 0.012) ctx.drawImage(SPRITES.rock[0], x + Math.floor(rng() * 5), y + Math.floor(rng() * 6));
        } else if (t === TILE_DIRT) {
          if (rng() < 0.022) ctx.drawImage(SPRITES.rock[0], x + Math.floor(rng() * 5), y + Math.floor(rng() * 6));
        } else if (t === TILE_WATER) {
          if (rng() < 0.10) ctx.drawImage(Util.choice(SPRITES.lilyPad), x + Math.floor(rng() * 6), y + Math.floor(rng() * 7));
        } else if (t === TILE_SAND) {
          if (rng() < 0.02) ctx.drawImage(SPRITES.rock[0], x + Math.floor(rng() * 5), y + Math.floor(rng() * 6));
        }
      }
    }
  },

  /* ── 물체 배치 ─────────────────────────────────────────── */

  addProp(sprite, x, y, opts) {
    const p = {
      x: x, y: y, sprite: sprite,
      ox: -Math.floor(sprite.width / 2),
      oy: -sprite.height + ((opts && opts.footHeight) || 4),
      depth: y,
    };
    if (opts && opts.frames) { p.frames = opts.frames; p.phase = Math.random() * Math.PI * 2; }
    this.props.push(p);
    if (opts && opts.solid) {
      this.solids.push({ x: x - opts.solid[0], y: y - opts.solid[1], w: opts.solid[0] * 2, h: opts.solid[1] + opts.solid[2] });
    }
    return p;
  },

  // 나무는 개방도 노이즈가 높은 곳(=숲)에 빽빽하게, 공터에는 드물게 심는다
  placeTrees(rng) {
    const W = this.cols, H = this.rows, cfg = CONFIG.world;
    const minGap = 26;
    const cx = this.startX, cy = this.startY;

    /* 나무끼리 너무 붙지 않게 간격을 확인한다.
       심은 나무를 전부 훑으면 맵이 커질수록 급격히 느려지므로(개수의 제곱),
       칸 격자에 나눠 담아 주변 9칸만 본다. */
    const buckets = new Map();
    const bkey = (x, y) => Math.floor(x / minGap) + ',' + Math.floor(y / minGap);
    const tooClose = (x, y) => {
      const gx = Math.floor(x / minGap), gy = Math.floor(y / minGap);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const list = buckets.get((gx + dx) + ',' + (gy + dy));
          if (!list) continue;
          for (const p of list) {
            const ddx = p.x - x, ddy = p.y - y;
            if (ddx * ddx + ddy * ddy < minGap * minGap) return true;
          }
        }
      }
      return false;
    };

    const tryPlace = (x, y, force) => {
      if (x < 20 || x > this.w - 20 || y < 46 || y > this.h - 10) return;
      if (!force && Util.dist(x, y, cx, cy) < cfg.startClearTiles * CONFIG.TILE) return;
      const t = this.tileAt(x, y);
      if (t === TILE_WATER || t === TILE_SAND || t === TILE_DIRT) return;
      if (tooClose(x, y)) return;
      const k = bkey(x, y);
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push({ x: x, y: y });

      // 시작점에서 멀어질수록 침엽수와 고사목이 늘어난다 — 숲이 점점 험해 보인다
      let sprite, solid;
      if (rng() < this.forestAt('pineChance', x, y)) {
        sprite = Util.choice(SPRITES.pine); solid = [5, 5, 8];
      } else if (rng() < this.forestAt('deadChance', x, y)) {
        sprite = Util.choice(SPRITES.deadTree); solid = [4, 4, 7];
      } else {
        sprite = Util.choice(SPRITES.tree); solid = [6, 5, 8];
      }
      this.addProp(sprite, x, y, { solid: solid }).tree = true;   // 미니맵에 숲으로 표시된다
    };

    // 맵 가장자리는 나무로 둘러 벽처럼 막는다
    for (let x = 20; x < this.w - 20; x += 20) {
      tryPlace(x + rng() * 8, 50 + rng() * 10, true);
      tryPlace(x + rng() * 8, this.h - 14 - rng() * 10, true);
    }
    for (let y = 54; y < this.h - 20; y += 20) {
      tryPlace(24 + rng() * 10, y + rng() * 8, true);
      tryPlace(this.w - 24 - rng() * 10, y + rng() * 8, true);
    }

    // 안쪽 — 개방도가 높을수록, 그리고 시작점에서 멀수록 빽빽해진다
    const attempts = this.scaled(5000);
    for (let i = 0; i < attempts; i++) {
      const x = rng() * this.w, y = rng() * this.h;
      const open = this.openNoise(x / this.w, y / this.h);
      if (open < cfg.treeLevel) continue;
      const density = this.forestAt('treeDensity', x, y);
      if (rng() > (open - cfg.treeLevel) * 3.2 * density) continue;
      tryPlace(x, y);
    }
  },

  placeDecor(rng) {
    const cx = this.startX, cy = this.startY;
    const spot = (needTile) => {
      for (let i = 0; i < 12; i++) {
        const x = 24 + rng() * (this.w - 48), y = 30 + rng() * (this.h - 50);
        if (Util.dist(x, y, cx, cy) < 40) continue;
        const t = this.tileAt(x, y);
        if (needTile !== undefined && t !== needTile) continue;
        if (needTile === undefined && (t === TILE_WATER)) continue;
        if (!this.isFreeSpot(x, y, 8)) continue;
        return { x: x, y: y };
      }
      return null;
    };

    // 흔들리는 풀 — 숲을 살아있게 만드는 가장 큰 요소
    for (let i = 0, n = this.scaled(260); i < n; i++) {
      const s = spot();
      if (!s) continue;
      const t = this.tileAt(s.x, s.y);
      if (t === TILE_DIRT || t === TILE_SAND) continue;
      this.addProp(SPRITES.tuft[0][1], s.x, s.y, { frames: Util.choice(SPRITES.tuft), footHeight: 1 });
    }
    for (let i = 0, n = this.scaled(90); i < n; i++) {   // 수풀
      const s = spot();
      if (s) this.addProp(Util.choice(SPRITES.bush), s.x, s.y, { footHeight: 3 });
    }
    for (let i = 0, n = this.scaled(70); i < n; i++) {   // 바위 — 부딪힌다. 가장자리로 갈수록 많다
      const s = spot();
      if (!s) continue;
      if (rng() > this.forestAt('boulders', s.x, s.y) * 0.4) continue;
      this.addProp(Util.choice(SPRITES.boulder), s.x, s.y, { solid: [7, 4, 6], footHeight: 3 });
    }

    /* 동굴 입구 셋 — 위험도 고리 위에 하나씩 (가까운 슬라임 굴 -> 중간 늑대 굴 -> 가장자리 버섯 굴).
       방향은 120도씩 벌려 서로 다른 쪽에 두고, 맵마다 돌아가는 각도가 달라 매번 다른 자리다.
       흔하면 이정표 구실을 못 하므로 희소하게 두었다. 미니맵에 따로 찍힌다. */
    const base = rng() * Math.PI * 2;
    CONFIG.forest.caves.forEach((spec, index) => {
      const want = base + index * (Math.PI * 2 / 3);
      for (let i = 0; i < 3000; i++) {
        // 원하는 방향 ±30도, 원하는 고리 ±0.05 안에서 빈자리를 찾는다
        const a = want + (rng() - 0.5) * (Math.PI / 3);
        const t = spec.t + (rng() - 0.5) * 0.1;
        const x = Util.clamp(this.startX + Math.cos(a) * t * this.w / 2, 40, this.w - 40);
        const y = Util.clamp(this.startY + Math.sin(a) * t * this.h / 2, 50, this.h - 40);
        if (Math.abs(this.dangerAt(x, y) - spec.t) > 0.06) continue;
        if (!this.isFreeSpot(x, y, 22)) continue;
        const p = this.addProp(Util.choice(SPRITES.caveEntrance), x, y, { solid: [12, 6, 9], footHeight: 3 });
        p.landmark = true;
        p.caveIndex = index;
        this.caves[index] = p;   // 이 보스 방의 입구
        break;
      }
    });
    for (let i = 0, n = this.scaled(22); i < n; i++) {   // 그루터기 — 부딪힌다
      const s = spot();
      if (s) this.addProp(SPRITES.stump[0], s.x, s.y, { solid: [5, 3, 5], footHeight: 3 });
    }
    for (let i = 0, n = this.scaled(18); i < n; i++) {   // 쓰러진 통나무 (지나갈 수 있는 장식)
      const s = spot();
      if (s) this.addProp(Util.choice(SPRITES.log), s.x, s.y, { footHeight: 2 });
    }
    // 버섯은 시작점에서 먼 그늘진 숲에 모여난다
    for (let i = 0, n = this.scaled(90); i < n; i++) {
      const s = spot();
      if (!s) continue;
      const t = this.dangerAt(s.x, s.y);
      if (t < 0.4) continue;
      if (t < 0.75 && this.openNoise(s.x / this.w, s.y / this.h) < 0.55) continue;
      this.addProp(Util.choice(SPRITES.mushroom), s.x, s.y, { footHeight: 1 });
    }
    for (let i = 0, n = this.scaled(60); i < n; i++) {   // 부들 — 물가에만
      const s = spot(TILE_SAND);
      if (s) this.addProp(Util.choice(SPRITES.cattail), s.x, s.y, { footHeight: 1 });
    }
  },

  /* ── 충돌 ──────────────────────────────────────────────── */

  buildGrid() {
    this.grid = new Map();
    this.solids.forEach((s, i) => {
      const x0 = Math.floor(s.x / this.cell), x1 = Math.floor((s.x + s.w) / this.cell);
      const y0 = Math.floor(s.y / this.cell), y1 = Math.floor((s.y + s.h) / this.cell);
      for (let gy = y0; gy <= y1; gy++) {
        for (let gx = x0; gx <= x1; gx++) {
          const key = gx + ',' + gy;
          if (!this.grid.has(key)) this.grid.set(key, []);
          this.grid.get(key).push(i);
        }
      }
    });
  },

  // 이 박스가 물·나무·바위·맵 경계와 겹치는가
  blocked(box) {
    if (box.x < 6 || box.y < 6 || box.x + box.w > this.w - 6 || box.y + box.h > this.h - 6) return true;

    // 물에는 들어갈 수 없다
    const T = CONFIG.TILE, W = this.cols, H = this.rows;
    const tx0 = Math.floor(box.x / T), tx1 = Math.floor((box.x + box.w) / T);
    const ty0 = Math.floor(box.y / T), ty1 = Math.floor((box.y + box.h) / T);
    for (let ty = ty0; ty <= ty1; ty++) {
      if (ty < 0 || ty >= H) return true;
      for (let tx = tx0; tx <= tx1; tx++) {
        if (tx < 0 || tx >= W) return true;
        if (this.tileBlocked[ty * W + tx]) return true;
      }
    }

    if (!this.grid) return false;   // 격자를 만들기 전(맵 생성 도중)에는 지형만 본다
    const gx0 = Math.floor(box.x / this.cell), gx1 = Math.floor((box.x + box.w) / this.cell);
    const gy0 = Math.floor(box.y / this.cell), gy1 = Math.floor((box.y + box.h) / this.cell);
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        const list = this.grid.get(gx + ',' + gy);
        if (!list) continue;
        for (const i of list) {
          if (Util.aabb(box, this.solids[i])) return true;
        }
      }
    }
    return false;
  },

  // 몬스터나 아이템을 놓을 수 있는 빈 자리인가
  isFreeSpot(x, y, r) {
    return !this.blocked({ x: x - r, y: y - r, w: r * 2, h: r * 2 });
  },

  /* ── 그리기 ────────────────────────────────────────────── */

  drawGround(ctx, cam) {
    ctx.drawImage(
      this.ground,
      Math.round(cam.x), Math.round(cam.y), CONFIG.VIEW_W, CONFIG.VIEW_H,
      0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H
    );
  },

  // 흔들리는 풀이 지금 어느 프레임인지 (위치마다 위상이 달라 물결치듯 보인다)
  swayFrame(p) {
    const s = Math.sin(this.time * CONFIG.ambient.swaySpeed + p.phase);
    return s < -0.33 ? 0 : (s > 0.33 ? 2 : 1);
  },
};

  <script>
// ── js/ambient.js
'use strict';

/* 분위기 연출 — 게임 규칙에는 전혀 영향을 주지 않는 장식 레이어.
   화면 안에만 존재하면 되므로, 카메라 밖으로 나간 입자는 반대편으로 돌려쓴다.
     - 꽃가루: 햇빛에 떠다니는 작은 알갱이
     - 나뭇잎: 위에서 천천히 떨어지며 좌우로 흔들린다
     - 물비늘: 연못 위에서 반짝인다 */

const Ambient = {
  motes: [],
  leaves: [],
  sparkles: [],
  sparkleTimer: 0,

  reset() {
    this.motes.length = 0;
    this.leaves.length = 0;
    this.sparkles.length = 0;
    this.sparkleTimer = 0;
    for (let i = 0; i < CONFIG.ambient.motes; i++) this.motes.push(this.newMote(true));
    for (let i = 0; i < CONFIG.ambient.leaves; i++) this.leaves.push(this.newLeaf(true));
  },

  newMote(anywhere) {
    return {
      x: Util.rand(0, CONFIG.VIEW_W),
      y: anywhere ? Util.rand(0, CONFIG.VIEW_H) : CONFIG.VIEW_H + 4,
      drift: Util.rand(-6, 6),
      rise: Util.rand(-9, -3),
      phase: Util.rand(0, Math.PI * 2),
      wobble: Util.rand(3, 9),
      blink: Util.rand(0.6, 2.2),
      t: Util.rand(0, 6),
    };
  },

  newLeaf(anywhere) {
    return {
      x: Util.rand(0, CONFIG.VIEW_W),
      y: anywhere ? Util.rand(0, CONFIG.VIEW_H) : -6,
      fall: Util.rand(9, 20),
      phase: Util.rand(0, Math.PI * 2),
      wobble: Util.rand(6, 16),
      sprite: Util.choice(SPRITES.leaf),
      t: Util.rand(0, 6),
    };
  },

  update(dt, cam) {
    const VW = CONFIG.VIEW_W, VH = CONFIG.VIEW_H;

    // 화면 좌표로 다루기 때문에 카메라가 움직여도 자연스럽게 흩어져 있다
    for (const m of this.motes) {
      m.t += dt;
      m.x += (m.drift + Math.sin(m.t * 0.7 + m.phase) * m.wobble) * dt;
      m.y += m.rise * dt;
      if (m.y < -6) { Object.assign(m, this.newMote(false)); }
      if (m.x < -6) m.x = VW + 4;
      if (m.x > VW + 6) m.x = -4;
    }

    for (const l of this.leaves) {
      l.t += dt;
      l.x += Math.sin(l.t * 0.9 + l.phase) * l.wobble * dt;
      l.y += l.fall * dt;
      if (l.y > VH + 6) Object.assign(l, this.newLeaf(false));
      if (l.x < -6) l.x = VW + 4;
      if (l.x > VW + 6) l.x = -4;
    }

    // 보이는 곳이 물이면 그 위에 반짝임을 하나 띄운다
    this.sparkleTimer -= dt;
    if (this.sparkleTimer <= 0) {
      this.sparkleTimer = 0.12;
      for (let i = 0; i < 3; i++) {
        const sx = Util.rand(0, VW), sy = Util.rand(0, VH);
        if (World.tileAt(cam.x + sx, cam.y + sy) !== TILE_WATER) continue;
        this.sparkles.push({ x: cam.x + sx, y: cam.y + sy, life: Util.rand(0.35, 0.8), max: 0.8 });
      }
    }
    for (let i = this.sparkles.length - 1; i >= 0; i--) {
      this.sparkles[i].life -= dt;
      if (this.sparkles[i].life <= 0) this.sparkles.splice(i, 1);
    }
  },

  // 물비늘은 지형 위, 캐릭터 아래에 그린다
  drawWater(ctx, cam) {
    for (const s of this.sparkles) {
      const x = Math.round(s.x - cam.x), y = Math.round(s.y - cam.y);
      ctx.fillStyle = s.life > s.max * 0.5 ? '#bfe6ff' : '#7fc4e8';
      ctx.fillRect(x, y, 1, 1);
      ctx.fillRect(x + 1, y, 1, 1);
    }
  },

  // 꽃가루와 나뭇잎은 모든 것 위에 떠 있다
  drawOverlay(ctx) {
    for (const l of this.leaves) {
      ctx.drawImage(l.sprite, Math.round(l.x), Math.round(l.y));
    }
    for (const m of this.motes) {
      // 깜빡이며 떠다녀서 햇빛에 반짝이는 먼지처럼 보인다
      if (Math.sin(m.t / m.blink * Math.PI * 2) < -0.2) continue;
      ctx.fillStyle = '#fff6cf';
      ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
    }
  },
};

  <script>
// ── js/minimap.js
'use strict';

/* 미니맵 — 지형을 "1타일 = 1픽셀"로 미리 그려두고 필요한 부분만 잘라 쓴다.
   지형은 변하지 않으므로 맵을 만들 때 한 번만 그리면 되고,
   움직이는 것(플레이어·몬스터·드랍)만 매 프레임 점으로 찍는다.

     구석 미니맵 : 플레이어 주변만 잘라서 항상 표시
     전체 지도(M): 맵 전체를 2배로 키워 화면 가운데 표시 (시간 정지) */

const Minimap = {
  canvas: null,
  W: 0,
  H: 0,
  VIEW_W: 50,   // 구석 미니맵이 보여주는 타일 수
  VIEW_H: 38,

  /* 타일 색 — [지역][타일종류]. 지역마다 바닥색이 달라서
     지도만 봐도 "여기부터 깊은 숲, 저기부터 포자 골짜기"가 바로 보인다.
     (TILE_GRASS, TILE_DIRT, TILE_SAND, TILE_WATER, TILE_MEADOW 순서) */
  // [그늘 여부][타일 종류] — 볕 드는 바닥 / 빽빽한 숲의 그늘진 바닥
  TILE_RGB: [
    [[63, 139, 64], [125, 95, 60], [194, 168, 119], [47, 111, 158], [86, 163, 90]],
    [[44, 100, 49], [110, 84, 53], [194, 168, 119], [47, 111, 158], [52, 112, 57]],
  ],
  TREE_RGB: ['#1f5a2a', '#173f1f'],

  build() {
    const W = World.cols, H = World.rows;
    this.W = W; this.H = H;
    this.canvas = makeCanvas(W, H);
    const ctx = this.canvas.getContext('2d');

    const img = ctx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const byShade = this.TILE_RGB[World.shade[i]] || this.TILE_RGB[0];
      const c = byShade[World.tiles[i]] || byShade[0];
      img.data[i * 4] = c[0];
      img.data[i * 4 + 1] = c[1];
      img.data[i * 4 + 2] = c[2];
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);

    // 나무를 어두운 점으로 찍으면 숲이 빽빽한 곳이 한눈에 보인다
    for (const p of World.props) {
      if (!p.tree) continue;
      const tx = Math.floor(p.x / CONFIG.TILE), ty = Math.floor(p.y / CONFIG.TILE);
      ctx.fillStyle = this.TREE_RGB[World.shade[ty * W + tx]] || this.TREE_RGB[0];
      ctx.fillRect(tx, ty, 1, 1);
    }

    // 동굴 입구와 상인은 이정표라 눈에 띄게 찍는다 (동굴 주황, 상인 노랑)
    for (const p of World.props) {
      if (!p.landmark) continue;
      ctx.fillStyle = p.landmark === 'shop' ? '#ffe066' : '#e08a4f';
      ctx.fillRect(Math.floor(p.x / CONFIG.TILE) - 1, Math.floor(p.y / CONFIG.TILE) - 1, 3, 3);
      ctx.fillStyle = '#1d1a17';
      ctx.fillRect(Math.floor(p.x / CONFIG.TILE), Math.floor(p.y / CONFIG.TILE), 1, 1);
    }
  },

  /* ── 구석 미니맵 ───────────────────────────────────────── */

  drawCorner(ctx, player, enemies) {
    if (!this.canvas) return;
    const bw = Math.min(this.VIEW_W, this.W), bh = Math.min(this.VIEW_H, this.H);
    const x = CONFIG.VIEW_W - bw - 6, y = CONFIG.VIEW_H - bh - 6;

    // 플레이어를 가운데 두되 맵 밖으로는 나가지 않게 자른다
    const sx = Util.clamp(Math.round(player.x / CONFIG.TILE - bw / 2), 0, this.W - bw);
    const sy = Util.clamp(Math.round(player.y / CONFIG.TILE - bh / 2), 0, this.H - bh);

    ctx.fillStyle = '#17110d';
    ctx.fillRect(x - 1, y - 1, bw + 2, bh + 2);
    ctx.globalAlpha = 0.82;
    ctx.drawImage(this.canvas, sx, sy, bw, bh, x, y, bw, bh);
    ctx.globalAlpha = 1;

    this.drawDots(ctx, x, y, sx, sy, bw, bh, 1, player, enemies);

    // 지역 이름 대신 이 자리의 몬스터 기준 레벨을 붙여둔다 — 어디까지 왔는지 한눈에 보인다
    const lv = World.levelAt(player.x, player.y);
    const label = 'LV ' + lv + ' AREA';
    UI.drawText(ctx, label, x + bw - UI.textWidth(label), y - 7, LEVEL_PALETTES[levelTier(lv)].n, false);
  },

  /* ── 전체 지도 ─────────────────────────────────────────── */

  drawFull(ctx, player, enemies) {
    if (!this.canvas) return;
    // 맵이 커져도 화면 안에 들어오도록 배율을 맞춘다 (도트가 뭉개지지 않게 정수 배율만)
    const scale = Math.max(1, Math.floor(Math.min(
      (CONFIG.VIEW_W - 36) / this.W,
      (CONFIG.VIEW_H - 40) / this.H
    )));
    const w = this.W * scale, h = this.H * scale;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);

    ctx.fillStyle = 'rgba(10,12,10,0.78)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
    ctx.fillStyle = '#17110d';
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.drawImage(this.canvas, 0, 0, this.W, this.H, x, y, w, h);

    this.drawDots(ctx, x, y, 0, 0, this.W, this.H, scale, player, enemies);

    UI.drawText(ctx, 'MAP', CONFIG.VIEW_W / 2, y - 11, '#9be564', true);
    UI.drawText(ctx, 'M TO CLOSE', CONFIG.VIEW_W / 2, y + h + 5, '#7fa86a', true);
  },

  /* ── 움직이는 것들 ─────────────────────────────────────── */

  // ox,oy = 화면상 지도 왼쪽 위 / sx,sy = 잘라낸 시작 타일 / scale = 타일당 픽셀 수
  drawDots(ctx, ox, oy, sx, sy, bw, bh, scale, player, enemies) {
    const T = CONFIG.TILE;
    const put = (wx, wy, color, size) => {
      const mx = Math.floor(wx / T) - sx, my = Math.floor(wy / T) - sy;
      if (mx < 0 || my < 0 || mx >= bw || my >= bh) return;
      ctx.fillStyle = color;
      ctx.fillRect(ox + mx * scale, oy + my * scale, size * scale, size * scale);
    };

    for (const d of Items.drops) {
      put(d.x, d.y, d.kind === 'weapon' ? '#ffffff' : '#ffd93d', 1);
    }
    for (const s of enemies) {
      if (s.dead) continue;
      put(s.x, s.y, LEVEL_PALETTES[levelTier(s.level)].M, 1);
    }

    // 플레이어는 흰 십자로 늘 그려서 점들 사이에서도 바로 찾을 수 있다 (깜빡이지 않는다)
    {
      const mx = Math.floor(player.x / T) - sx, my = Math.floor(player.y / T) - sy;
      if (mx < 0 || my < 0 || mx >= bw || my >= bh) return;
      const px = ox + mx * scale, py = oy + my * scale;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px, py, scale, scale);
      ctx.fillRect(px - scale, py, scale, scale);
      ctx.fillRect(px + scale, py, scale, scale);
      ctx.fillRect(px, py - scale, scale, scale);
      ctx.fillRect(px, py + scale, scale, scale);
    }
  },
};
