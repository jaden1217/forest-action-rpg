// ── js/gear.js
'use strict';

/* 장비 — 무기 말고 몸에 걸치는 것 (머리 / 몸 / 장신구).

   가방에 들어오고, 인벤토리에서 Space 로 입고 벗는다. 자동으로 입지는 않는다.

   장비 한 점은 세 가지로 이루어진다.
     1. 바탕 아이템  CONFIG.gear.items — 가죽 모자, 사슬 갑옷 … 칸과 기본 수치를 정한다
     2. 등급         CONFIG.rarity    — COMMON / FINE / RARE / LEGEND. 옵션이 몇 개 붙는지를 정한다
     3. 랜덤 옵션    CONFIG.affixes   — 떨어질 때 굴린다. 몬스터 레벨이 크기를, 운이 개수를 정한다

   그래서 같은 '가죽 모자'라도 버리기 아까운 것과 아닌 것이 생긴다.
   이름은 가장 센 옵션이 앞에 붙어 지어진다 — SWIFT LEATHER CAP, VAMPIRIC CHAIN MAIL.

   이 파일은 그 표를 읽고, 굴리고, 더하는 일만 한다. */

const Gear = {
  spec(id) { return CONFIG.gear.items[id]; },
  slotOf(item) { return this.spec(item.id).slot; },
  rarity(item) { return CONFIG.rarity.list[item.rarity || 0] || CONFIG.rarity.list[0]; },
  affixSpec(type) { return CONFIG.affixes.list[type]; },

  /* ── 굴리기 ────────────────────────────────────────────── */

  // 등급 하나 — 가중치대로. 흔한 것이 흔하게 나온다
  rollRarity() {
    const list = CONFIG.rarity.list;
    return Util.weightedIndex(list.map(r => r.weight));
  },

  // 옵션 하나의 값 — 1레벨 범위에서 뽑고 레벨만큼 더한다
  rollAffixValue(type, level) {
    const a = this.affixSpec(type);
    return Math.max(1, Util.randInt(a.range[0], a.range[1]) + Math.round(a.perLevel * (level - 1)));
  },

  // 장비 한 점을 통째로 만든다 (바닥에 떨어질 때 한 번만 굴린다)
  roll(id, level, rarityIndex) {
    const spec = this.spec(id);
    if (!spec) return null;
    level = Util.clamp(Math.round(level) || 1, 1, CONFIG.weapons.levelMult.length);
    const rarity = rarityIndex === undefined ? this.rollRarity() : rarityIndex;

    // 같은 옵션이 두 번 붙지 않게 후보에서 빼가며 뽑는다
    const pool = Object.keys(CONFIG.affixes.list);
    const affixes = [];
    const n = Math.min(CONFIG.rarity.list[rarity].affixes, pool.length);
    for (let i = 0; i < n; i++) {
      const type = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      affixes.push({ t: type, v: this.rollAffixValue(type, level) });
    }
    // 이름에 쓸 옵션이 앞에 오도록, 값이 큰 순으로 정렬해 둔다
    affixes.sort((a, b) => b.v - a.v);
    return { kind: 'gear', id: id, level: level, rarity: rarity, affixes: affixes };
  },

  /* ── 수치 ──────────────────────────────────────────────── */

  // 바탕 아이템이 주는 것 (등급·옵션과 무관하다)
  baseStats(item) {
    const spec = this.spec(item.id), out = {};
    if (!spec) return out;
    for (const k in spec.stats) {
      const pair = spec.stats[k];
      out[k] = Math.round(pair[0] + pair[1] * (item.level - 1));
    }
    return out;
  },

  // 굴려 붙은 옵션들
  affixStats(item) {
    const out = {};
    for (const a of (item.affixes || [])) {
      if (!this.affixSpec(a.t)) continue;
      out[a.t] = (out[a.t] || 0) + a.v;
    }
    return out;
  },

  // 바탕 + 옵션을 합친 것 — 실제로 몸에 더해지는 값
  statsOf(item) {
    const out = this.baseStats(item);
    const ax = this.affixStats(item);
    for (const k in ax) out[k] = (out[k] || 0) + ax[k];
    return out;
  },

  /* ── 이름과 색 ─────────────────────────────────────────── */

  // 가장 센 옵션의 말이 앞에 붙는다 (옵션은 굴릴 때 값 순으로 정렬해 뒀다)
  name(item) {
    const spec = this.spec(item.id);
    if (!spec) return '?';
    const first = (item.affixes || [])[0];
    const word = first && this.affixSpec(first.t) ? this.affixSpec(first.t).word + ' ' : '';
    return word + spec.name;
  },

  // 레벨까지 붙인 긴 이름 (바닥 이름표에는 짧은 쪽을 쓴다)
  fullName(item) { return this.name(item) + ' L' + item.level; },

  color(item) { return this.rarity(item).color; },

  sprite(item) { return SPRITES.gear[this.spec(item.id).sprite]; },

  /* 'ARM +7  HP +12' 처럼 사람이 읽는 줄로.
     바탕 수치와 옵션이 같은 이름을 쓸 수 있으므로(ARM 등) 이 함수는 받은 것만 그대로 쓴다. */
  statLine(stats) {
    const order = ['armor', 'maxHp', 'power', 'speed', 'attackSpeed', 'crit', 'critMult',
                   'lifesteal', 'potion', 'cooldown', 'knockRes', 'gold'];
    const base = { armor: 'ARM', maxHp: 'HP', power: 'ATK', speed: 'SPD' };
    const out = [];
    for (const k of order) {
      if (!stats[k]) continue;
      const a = CONFIG.affixes.list[k];
      const label = (base[k] || (a && a.label) || k);
      const pct = (a && a.pct) || k === 'speed';
      out.push(label + ' ' + (stats[k] > 0 ? '+' : '') + stats[k] + (pct ? '%' : ''));
    }
    return out;
  },

  /* ── 세트 ──────────────────────────────────────────────── */

  // 이 바탕 아이템이 어느 세트에 속하는가 (없으면 null)
  setIdOf(id) {
    for (const key in CONFIG.sets) if (CONFIG.sets[key].items.indexOf(id) >= 0) return key;
    return null;
  },
  setOf(item) {
    const key = this.setIdOf(item.id);
    return key ? CONFIG.sets[key] : null;
  },

  /* ── 전설 고유 효과 ─────────────────────────────────────
     전설 등급으로 떨어진 것만 효과가 켜진다. 어떤 효과인지는 바탕 아이템이 정해두고 있어서
     "그 효과를 노리고 그 아이템을 모은다"가 된다. */
  uniqueIdOf(item) {
    if (!item || item.rarity < CONFIG.rarity.list.length - 1) return null;
    const spec = this.spec(item.id);
    return (spec && spec.unique) || null;
  },
  uniqueOf(item) {
    const id = this.uniqueIdOf(item);
    return id ? CONFIG.uniques[id] : null;
  },

  // 몬스터가 떨구는 장비 하나 고르기 — 종류는 고르게 섞인다
  randomId() {
    const ids = Object.keys(CONFIG.gear.items);
    return ids[Math.floor(Math.random() * ids.length)];
  },

  /* 저장에서 돌아온 값이 성한지 확인한다.
     설정이 바뀌어 사라진 아이템·옵션은 조용히 버린다 (옛 저장도 그대로 열린다). */
  sanitize(s) {
    if (!s || !this.spec(s.id)) return null;
    const level = Util.clamp(Math.round(s.level) || 1, 1, CONFIG.weapons.levelMult.length);
    const rarity = Util.clamp(Math.round(s.rarity) || 0, 0, CONFIG.rarity.list.length - 1);
    const affixes = [];
    for (const a of (s.affixes || [])) {
      if (!a || !this.affixSpec(a.t)) continue;
      affixes.push({ t: a.t, v: Math.max(1, Math.round(a.v) || 1) });
    }
    affixes.sort((a, b) => b.v - a.v);
    return { kind: 'gear', id: s.id, level: level, rarity: rarity, affixes: affixes };
  },
};

</script>
  <script>
// ── js/inventory.js
'use strict';

/* 인벤토리 — 여러 칸짜리 가방 (I / Tab 으로 연다. 열려 있는 동안 시간이 멈춘다).

   칸마다 물건 하나가 들어간다.
     0번 칸    포션 주머니 — 개수는 player.potions, 상한은 maxPotions (늘 이 자리에 있다)
     무기      한 칸에 하나. 바닥의 무기를 F 로 집으면 여기로 들어오고, 골라서 Space 로 낀다
     장비      머리 / 몸 / 장신구. 주우면 가방에 들어오고, 골라서 Space 로 입는다
     전리품    몬스터가 떨구는 수집품. 같은 종류끼리 한 칸에 쌓이고, 상인에게 판다

   오른쪽 '장착' 줄의 장비 세 칸도 커서로 고를 수 있다 (가방 칸 다음 번호) — 거기서 Space 는 벗기다.

   조작
     WASD / 방향키   칸 고르기 (마우스를 올려도 골라진다)
     Space / Enter / 클릭   쓰기 — 포션은 마시고, 무기는 끼고(들고 있던 무기가 그 칸으로 들어간다)
     X               바닥에 버리기
     I / Tab / Esc   닫기

   칸 수는 상점의 'BAG +5 SLOTS' 강화로 늘어난다 (player.bagSlots). */

const Inventory = {
  cursor: 1,
  message: '',
  messageTimer: 0,
  lastMouse: { x: -1, y: -1 },

  // 플레이어에게 빈 가방을 채워준다 (첫 칸은 포션 주머니)
  create(player) {
    player.bag = new Array(player.bagSlots).fill(null);
    player.bag[0] = { kind: 'potion' };
  },

  // 강화로 칸이 늘었을 때 — 들어 있던 것은 그대로 두고 뒤에 빈 칸을 붙인다
  resize(player) {
    while (player.bag.length < player.bagSlots) player.bag.push(null);
  },

  spec(id) { return CONFIG.loot.items[id]; },
  stackMax(id) { return this.spec(id).trophy ? CONFIG.inventory.trophyStack : CONFIG.inventory.lootStack; },

  /* ── 넣기 / 빼기 ───────────────────────────────────────── */

  firstEmpty(player) {
    for (let i = 1; i < player.bag.length; i++) if (!player.bag[i]) return i;
    return -1;
  },

  // 무기 한 자루 — 빈 칸이 있어야 들어간다
  addWeapon(player, weapon, level, growing, element) {
    const i = this.firstEmpty(player);
    if (i < 0) return false;
    player.bag[i] = { kind: 'weapon', weapon: weapon, level: level, growing: !!growing, element: element || null };
    return true;
  },

  /* 장비 한 점 — 역시 빈 칸이 있어야 한다 (입는 건 나중에 내가 고른다).
     item 을 그대로 넘기거나(바닥에서 주운 것), id/레벨만 주면 여기서 굴린다(시험용) */
  addGear(player, item, level) {
    const i = this.firstEmpty(player);
    if (i < 0) return false;
    player.bag[i] = (typeof item === 'string') ? Gear.roll(item, level || 1) : item;
    return !!player.bag[i];
  },

  /* 커서가 가리키는 것 — 가방 칸이거나, 그 뒤에 이어 붙은 장비 세 칸 */
  slotCount(player) { return player.bag.length + CONFIG.gear.slots.length; },

  at(player, index) {
    if (index < player.bag.length) return { zone: 'bag', index: index, item: player.bag[index] };
    const slot = CONFIG.gear.slots[index - player.bag.length];
    return { zone: 'gear', slot: slot, item: player.gear[slot] };
  },

  // 전리품이 이만큼 더 들어갈 자리가 있는가 (같은 종류 칸의 남은 자리 + 빈 칸)
  roomFor(player, id) {
    const max = this.stackMax(id);
    let room = 0;
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (!s) room += max;
      else if (s.kind === 'loot' && s.id === id) room += max - s.amount;
    }
    return room;
  },

  // 전리품 — 쌓일 수 있는 칸부터 채우고, 남으면 빈 칸에 새로 쌓는다. 못 넣은 개수를 돌려준다
  addLoot(player, id, amount) {
    const max = this.stackMax(id);
    let left = amount;
    for (let i = 1; i < player.bag.length && left > 0; i++) {
      const s = player.bag[i];
      if (s && s.kind === 'loot' && s.id === id && s.amount < max) {
        const take = Math.min(max - s.amount, left);
        s.amount += take; left -= take;
      }
    }
    for (let i = 1; i < player.bag.length && left > 0; i++) {
      if (player.bag[i]) continue;
      const take = Math.min(max, left);
      player.bag[i] = { kind: 'loot', id: id, amount: take };
      left -= take;
    }
    return left;
  },

  count(player) {
    let n = 0;
    for (let i = 1; i < player.bag.length; i++) if (player.bag[i]) n++;
    return n;
  },

  // 전리품 전부의 값어치와 개수 (상점에서 한 번에 판다)
  lootValue(player) {
    let value = 0, items = 0;
    for (let i = 1; i < player.bag.length; i++) {
      const s = player.bag[i];
      if (!s || s.kind !== 'loot') continue;
      value += this.spec(s.id).value * s.amount;
      items += s.amount;
    }
    return { value: value, items: items };
  },

  sellLoot(player) {
    const v = this.lootValue(player);
    for (let i = 1; i < player.bag.length; i++) {
      if (player.bag[i] && player.bag[i].kind === 'loot') player.bag[i] = null;
    }
    player.gold += v.value;
    // 연금술사 이사 조건 — 판 전리품 개수를 센다
    if (typeof Village !== 'undefined' && v.items > 0) Village.addLootSold(v.items);
    return v;
  },

  /* ── 저장 ──────────────────────────────────────────────── */

  serialize(player) {
    return player.bag.slice(1).map(s => s ? Object.assign({}, s) : null);
  },

  deserialize(player, list) {
    if (!Array.isArray(list)) return;
    for (let i = 0; i < list.length && i + 1 < player.bag.length; i++) {
      const s = list[i];
      if (!s) continue;
      if (s.kind === 'weapon' && CONFIG.weapons[s.weapon]) {
        player.bag[i + 1] = { kind: 'weapon', weapon: s.weapon, level: Math.max(1, s.level | 0), growing: !!s.growing,
          element: CONFIG.forge.elements[s.element] ? s.element : null };
      } else if (s.kind === 'gear') {
        const g = Gear.sanitize(s);
        if (g) player.bag[i + 1] = g;
      } else if (s.kind === 'loot' && this.spec(s.id)) {
        player.bag[i + 1] = { kind: 'loot', id: s.id, amount: Util.clamp(s.amount | 0, 1, this.stackMax(s.id)) };
      }
    }
  },

  /* ── 쓰기 / 버리기 ─────────────────────────────────────── */

  itemName(player, s) {
    if (s.kind === 'potion') return 'POTION';
    if (s.kind === 'weapon') {
      if (s.growing) return CONFIG.weapons.growNames[s.weapon] || CONFIG.weapons[s.weapon].name;
      return CONFIG.weapons[s.weapon].name + ' L' + s.level;
    }
    if (s.kind === 'gear') return Gear.name(s);
    return this.spec(s.id).name;
  },

  // 가방 속 무기의 실제 레벨 — 성장 무기는 가방에 있어도 내 레벨을 따라간다
  weaponLevel(player, s) {
    return s.growing ? Util.clamp(player.level, 1, CONFIG.weapons.levelMult.length) : s.level;
  },

  use(player, index) {
    const at = this.at(player, index);
    // 장비 칸에서 Space = 벗어서 가방으로
    if (at.zone === 'gear') {
      if (!at.item) { this.say('NOTHING TO TAKE OFF'); return; }
      const free = this.firstEmpty(player);
      if (free < 0) { this.say('BAG IS FULL'); Sound.play('error'); return; }
      player.bag[free] = at.item;
      player.gear[at.slot] = null;
      player.recalcStats();
      Sound.play('blip');
      this.say('TOOK OFF ' + Gear.spec(at.item.id).name);
      return;
    }
    const s = at.item;
    if (!s) return;
    if (s.kind === 'gear') {
      // 입는다 — 그 자리에 입고 있던 것이 들어온다 (맞바꾸기)
      const slot = Gear.slotOf(s);
      const old = player.gear[slot];
      player.gear[slot] = s;
      player.bag[index] = old || null;
      player.recalcStats();
      Sound.play('pickup');
      this.say('WEARING ' + Gear.spec(s.id).name);
      return;
    }
    if (s.kind === 'potion') {
      if (player.potions <= 0) { this.say('NO POTIONS'); Sound.play('error'); return; }
      if (player.hp >= player.maxHp) { this.say('HP IS FULL'); Sound.play('error'); return; }
      player.potionCooldown = 0;
      player.usePotion();
      this.say('DRANK A POTION');
      return;
    }
    if (s.kind === 'weapon') {
      // 들고 있던 무기가 이 칸으로 들어가고, 이 칸의 무기를 낀다
      const old = { kind: 'weapon', weapon: player.weapon, level: player.weaponLevel, growing: player.weaponGrowing, element: player.weaponElement };
      const r = player.equipWeapon(s.weapon, this.weaponLevel(player, s), s.growing, s.element);
      if (!r) return;
      player.bag[index] = old;
      this.say('EQUIPPED ' + this.itemName(player, s));
      return;
    }
    this.say('SELL IT AT THE SHOP');
  },

  drop(player, index) {
    const at = this.at(player, index);
    const s = at.item;
    if (!s) return;
    if (s.kind === 'potion') { this.say('DRINK IT WITH E'); return; }
    if (s.kind === 'weapon') {
      Items.spawnWeapon(player.x, player.y, s.weapon, this.weaponLevel(player, s), { growing: s.growing, element: s.element, pickupDelay: 0.6 });
    } else if (s.kind === 'gear') {
      Items.spawnGear(player.x, player.y, s.id, s.level, { dropped: true });
    } else {
      Items.spawnLoot(player.x, player.y, s.id, s.amount, { dropped: true });
    }
    if (at.zone === 'gear') { player.gear[at.slot] = null; player.recalcStats(); }
    else player.bag[index] = null;
    Sound.play('blip');
    this.say('DROPPED ' + this.itemName(player, s));
  },

  say(text) {
    this.message = text;
    this.messageTimer = 1.6;
  },

  /* ── 입력 (시간이 멈춘 동안 Game.handleMenuInput 에서 매 프레임 호출) ── */

  handleInput(player) {
    this.messageTimer = Math.max(0, this.messageTimer - 1 / 60);
    if (this.messageTimer <= 0) this.message = '';

    const n = this.slotCount(player), cols = CONFIG.inventory.cols;
    const P = Input.pressed;
    if (P.KeyA || P.ArrowLeft) this.cursor = (this.cursor + n - 1) % n;
    if (P.KeyD || P.ArrowRight) this.cursor = (this.cursor + 1) % n;
    if (P.KeyW || P.ArrowUp) this.cursor = (this.cursor - cols + n) % n;
    if (P.KeyS || P.ArrowDown) this.cursor = (this.cursor + cols) % n;

    // 마우스를 움직여 칸 위에 올리면 그 칸이 골라진다 (가만히 있으면 키보드 커서를 방해하지 않는다)
    const m = Input.mouse;
    if (m.x !== this.lastMouse.x || m.y !== this.lastMouse.y) {
      this.lastMouse = { x: m.x, y: m.y };
      const hit = this.slotAt(player, m.x, m.y);
      if (hit >= 0) this.cursor = hit;
    }

    if (P.Space || P.Enter || P.Mouse) {
      if (!P.Mouse || this.slotAt(player, m.x, m.y) === this.cursor) this.use(player, this.cursor);
      // 여기서 쓴 Space/클릭이 닫힌 뒤 공격으로 새어나가지 않게 지운다
      delete P.Space; delete P.Enter; delete P.Mouse;
    }
    if (P.KeyX) this.drop(player, this.cursor);
    if (P.KeyI || P.Tab || P.Escape) {
      Game.showInventory = false;
      delete P.KeyI; delete P.Tab;
    }
  },

  /* ── 창 ──────────────────────────────────────────────── */

  // 창과 칸의 자리 — 그리기와 마우스 판정이 같은 값을 쓴다
  layout(player) {
    const cols = CONFIG.inventory.cols, slot = 18, gap = 2;
    const rows = Math.ceil(player.bag.length / cols);
    const w = 258, h = 24 + Math.max(rows, 6) * (slot + gap) + 34;   // 오른쪽 설명(세트·고유 효과까지)과 아래쪽 안내 두 줄이 들어갈 자리
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    const panelX = x + 8 + cols * (slot + gap) + 6;
    return { x: x, y: y, w: w, h: h, gridX: x + 8, gridY: y + 18, cols: cols, rows: rows, slot: slot, gap: gap,
             panelX: panelX, box: 16, bgap: 4, boxX: panelX, boxY: y + 26 };
  },

  slotAt(player, mx, my) {
    const L = this.layout(player);
    for (let i = 0; i < player.bag.length; i++) {
      const sx = L.gridX + (i % L.cols) * (L.slot + L.gap), sy = L.gridY + Math.floor(i / L.cols) * (L.slot + L.gap);
      if (mx >= sx && mx < sx + L.slot && my >= sy && my < sy + L.slot) return i;
    }
    // 오른쪽 장착 줄 — 첫 칸은 무기(고를 수 없다), 그 뒤 셋이 장비 칸이다
    for (let k = 0; k < CONFIG.gear.slots.length; k++) {
      const bx = L.boxX + (k + 1) * (L.box + L.bgap);
      if (mx >= bx && mx < bx + L.box && my >= L.boxY && my < L.boxY + L.box) return player.bag.length + k;
    }
    return -1;
  },

  draw(ctx, player) {
    const L = this.layout(player);
    UI.panel(ctx, L.x, L.y, L.w, L.h, '#9be564');
    UI.divider(ctx, L.x + 6, L.y + 14, L.w - 12);

    UI.drawText(ctx, 'INVENTORY', L.x + 8, L.y + 5, '#9be564');
    const bagText = 'BAG ' + this.count(player) + '/' + (player.bag.length - 1);
    UI.drawText(ctx, bagText, L.gridX + L.cols * (L.slot + L.gap) - 2 - UI.textWidth(bagText), L.y + 6, '#7fa86a');
    const g = String(player.gold);
    ctx.drawImage(SPRITES.coin, L.x + L.w - 10 - UI.textWidth(g) - 10, L.y + 5);
    UI.drawText(ctx, g, L.x + L.w - 10 - UI.textWidth(g), L.y + 6, CONFIG.gold.color);

    // ── 칸
    for (let i = 0; i < player.bag.length; i++) {
      const sx = L.gridX + (i % L.cols) * (L.slot + L.gap), sy = L.gridY + Math.floor(i / L.cols) * (L.slot + L.gap);
      const s = player.bag[i];
      ctx.fillStyle = s ? '#252c22' : '#1b201a';
      ctx.fillRect(sx, sy, L.slot, L.slot);
      if (s) this.drawItem(ctx, player, s, sx, sy, L.slot);
      if (i === this.cursor) {
        ctx.strokeStyle = '#ffe066';
        ctx.strokeRect(sx + 0.5, sy + 0.5, L.slot - 1, L.slot - 1);
      } else if (s && s.kind === 'weapon' && s.growing) {
        ctx.strokeStyle = UI.rainbowNow(0);
        ctx.strokeRect(sx + 0.5, sy + 0.5, L.slot - 1, L.slot - 1);
      } else if (s && s.kind === 'gear' && s.rarity >= 2) {
        // 희귀·전설은 칸 테두리만 봐도 가려낼 수 있다
        ctx.strokeStyle = Gear.color(s);
        ctx.strokeRect(sx + 0.5, sy + 0.5, L.slot - 1, L.slot - 1);
      }
    }

    this.drawDetails(ctx, player, L);

    // ── 안내
    const footY = L.y + L.h - 17;
    if (this.message) UI.drawText(ctx, this.message, L.x + L.w / 2, footY, '#9be564', true);
    else UI.drawText(ctx, 'WASD PICK  SPACE USE  X DROP', L.x + L.w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - I TO CLOSE', L.x + L.w / 2, footY + 8, '#5f6b59', true);
  },

  // 칸 안의 그림 — 가운데 맞춤. 개수는 오른쪽 아래에 작게
  drawItem(ctx, player, s, sx, sy, slot) {
    let sp = null, amount = 0, dim = false;
    if (s.kind === 'potion') { sp = SPRITES.potion; amount = player.potions; dim = player.potions <= 0; }
    else if (s.kind === 'weapon') {
      const set = SPRITES.weapons[s.weapon];
      sp = set && set[levelTier(this.weaponLevel(player, s))];
    } else if (s.kind === 'gear') { sp = Gear.sprite(s); }
    else { sp = SPRITES.loot[s.id]; amount = s.amount; }
    if (!sp) return;
    if (dim) ctx.globalAlpha = 0.35;
    ctx.drawImage(sp, sx + Math.floor((slot - sp.width) / 2), sy + Math.floor((slot - sp.height) / 2));
    ctx.globalAlpha = 1;
    if (s.kind === 'potion' || amount > 1 || s.kind === 'loot') {
      const t = String(amount);
      ctx.fillStyle = 'rgba(10,12,10,0.75)';
      ctx.fillRect(sx + slot - UI.textWidth(t) - 2, sy + slot - 7, UI.textWidth(t) + 2, 7);
      UI.drawText(ctx, t, sx + slot - UI.textWidth(t) - 1, sy + slot - 6, dim ? '#6f7a68' : '#f0d9b5');
    }
  },

  /* 오른쪽 — 지금 입고 든 것, 그리고 고른 칸의 설명.
     장착 줄은 [무기][머리][몸][장신구] 네 칸이다. 무기는 보여주기만 하고(바꾸는 건 가방에서),
     장비 세 칸은 커서로 고를 수 있다 — 거기서 Space 는 '벗다'.

     줄 간격이 8px 로 빡빡한 이유: 옵션이 네 개까지 붙을 수 있어서 설명이 일곱 줄까지 간다. */
  drawDetails(ctx, player, L) {
    const x = L.panelX, top = L.gridY, wide = L.x + L.w - 8 - x;
    UI.drawText(ctx, 'EQUIPPED', x, top, '#7fa86a');

    const slots = CONFIG.gear.slots;
    for (let i = 0; i <= slots.length; i++) {
      const bx = L.boxX + i * (L.box + L.bgap), by = L.boxY;
      const item = i === 0 ? null : player.gear[slots[i - 1]];
      ctx.fillStyle = (i > 0 && !item) ? '#1b201a' : '#252c22';
      ctx.fillRect(bx, by, L.box, L.box);

      let sp = null;
      if (i === 0) { const set = SPRITES.weapons[player.weapon]; sp = set && set[levelTier(player.weaponLevel)]; }
      else if (item) sp = Gear.sprite(item);
      if (sp) ctx.drawImage(sp, bx + Math.floor((L.box - sp.width) / 2), by + Math.floor((L.box - sp.height) / 2));

      if (i > 0 && this.cursor === player.bag.length + (i - 1)) {
        ctx.strokeStyle = '#ffe066';
        ctx.strokeRect(bx + 0.5, by + 0.5, L.box - 1, L.box - 1);
      } else if (item && item.rarity >= 2) {
        ctx.strokeStyle = Gear.color(item);
        ctx.strokeRect(bx + 0.5, by + 0.5, L.box - 1, L.box - 1);
      }
    }

    // 지금 든 무기 한 줄
    const spec = player.weaponSpec(), dmg = player.attackDamage();
    if (player.weaponGrowing) UI.drawRainbowText(ctx, player.weaponLabel(), x, top + 26);
    else UI.drawText(ctx, player.weaponLabel(), x, top + 26, player.weaponColor());
    const eq = player.weaponElement && CONFIG.forge.elements[player.weaponElement];
    UI.drawText(ctx, 'DMG ' + dmg + '  DPS ' + Math.round(dmg / spec.cooldown), x, top + 34, '#f0d9b5');
    if (eq) UI.drawText(ctx, eq.name, x + 92, top + 26, eq.color);

    /* 입은 것이 더해주는 것 — 앞줄은 늘 있는 네 가지, 뒷줄은 굴려 붙은 옵션들.
       아무것도 안 입었어도 0 으로 띄운다 (비어 있다는 걸 알려주려고) */
    const g = player.gearStats;
    UI.drawText(ctx, 'ARM ' + (g.armor || 0) + ' (-' + Math.round(player.damageReduction() * 100) + '%)  HP +' + (g.maxHp || 0), x, top + 42, '#7ec8ff');
    const extras = {};
    for (const k in g) if (k !== 'armor' && k !== 'maxHp' && g[k]) extras[k] = g[k];
    const extraLine = Gear.statLine(extras).slice(0, 4).join(' ');
    UI.drawText(ctx, extraLine || 'NO BONUSES YET', x, top + 50, extraLine ? '#7ec8ff' : '#5f6b59');

    /* 세트와 고유 효과 — 지금 켜져 있는 것만 한 줄씩. 없으면 그 줄을 쓰지 않는다 */
    let sy = top + 58;
    const onSets = [];
    for (const key in player.setCounts) {
      const n = player.setCounts[key];
      if (n >= 2) onSets.push(CONFIG.sets[key].name + ' ' + n);
    }
    if (onSets.length) { UI.drawText(ctx, 'SET ' + onSets.join('  '), x, sy, '#9be564'); sy += 7; }
    const onUniq = Object.keys(player.uniques);
    if (onUniq.length) {
      UI.drawText(ctx, onUniq.map(id => CONFIG.uniques[id].name).join(' . ').slice(0, 40), x, sy, '#ffb35c');
      sy += 7;
    }

    UI.divider(ctx, x, sy + 1, wide);

    const at = this.at(player, this.cursor);
    const s = at.item;
    let y = sy + 5;
    // 설명은 줄이 아홉까지 갈 수 있어서(옵션 넷 + 세트 + 고유 효과) 7칸 간격으로 촘촘히 적는다
    const line = (text, color) => { UI.drawText(ctx, text, x, y, color); y += 7; };

    if (!s) {
      line(at.zone === 'gear' ? CONFIG.gear.slotNames[at.slot] + ' — EMPTY' : 'EMPTY SLOT', '#5f6b59');
      return;
    }

    if (s.kind === 'potion') {
      line('POTION X' + player.potions + '/' + player.maxPotions, '#ffd93d');
      line('HEALS ' + player.potionHeal() + ' HP', '#f0d9b5');
      y += 5;
      line('SPACE DRINK (OR E)', '#9be564');
      return;
    }

    if (s.kind === 'gear') {
      const slot = Gear.slotOf(s), r = Gear.rarity(s);
      line(Gear.name(s), r.color);
      line(r.name + ' . ' + CONFIG.gear.slotNames[slot] + ' . L' + s.level, '#7fa86a');
      line(Gear.statLine(Gear.baseStats(s)).join('  '), '#f0d9b5');
      // 굴려 붙은 옵션 — 두 개씩 끊어 적는다
      const ax = Gear.statLine(Gear.affixStats(s));
      for (let i = 0; i < ax.length; i += 2) line(ax.slice(i, i + 2).join('  '), '#c79ce8');

      // 세트 — 지금 몇 점 입었는지 함께 보여준다 (이걸 입으면 몇 점이 되는지가 중요하다)
      const set = Gear.setOf(s), setKey = Gear.setIdOf(s.id);
      if (set) {
        const worn = player.setCounts[setKey] || 0;
        const have = at.zone === 'gear' ? worn : worn + (player.gear[Gear.slotOf(s)] && Gear.setIdOf(player.gear[Gear.slotOf(s)].id) === setKey ? 0 : 1);
        line('SET ' + set.name + ' ' + Math.min(have, set.items.length) + '/' + set.items.length, have >= 2 ? '#9be564' : '#7fa86a');
      }
      // 전설 고유 효과 — 수치가 아니라 규칙을 바꾸는 한 줄
      const uq = Gear.uniqueOf(s);
      if (uq) line('* ' + uq.text, '#ffb35c');

      if (at.zone === 'gear') {
        y += 4;
        line('SPACE TAKE OFF  X DROP', '#9be564');
        return;
      }
      // 입으면 얼마나 달라지는지 — 그 자리에 입고 있는 것과 견준다
      const worn = player.gear[slot];
      if (!worn) line('NOTHING WORN YET', '#9be564');
      else {
        const mine = Gear.statsOf(s), old = Gear.statsOf(worn), diff = {};
        for (const k in mine) if ((mine[k] || 0) - (old[k] || 0)) diff[k] = (mine[k] || 0) - (old[k] || 0);
        for (const k in old) if (diff[k] === undefined && -(old[k] || 0)) diff[k] = -(old[k] || 0);
        /* 어느 쪽이 나은지는 무게를 달아 더한다 — 방어력은 비율로 막으니 체력보다 무겁고,
           공격력은 한 점이 레벨업 하나의 절반이라 가장 무겁다 */
        const w = { armor: 1.5, maxHp: 0.3, power: 3 };
        const weight = (k) => (w[k] === undefined ? 1 : w[k]);
        let better = 0;
        for (const k in diff) better += diff[k] * weight(k);
        /* 한 줄에 다 못 적으므로 **크게 달라지는 것부터** 세 개만 적고 나머지는 '..' 로 줄인다.
           (안 보이는 것까지 포함해서 색을 정하므로, 초록인데 적힌 건 작아 보일 수 있다) */
        const keys = Object.keys(diff).sort((p, q) => Math.abs(diff[q] * weight(q)) - Math.abs(diff[p] * weight(p)));
        const top = {};
        for (const k of keys.slice(0, 3)) top[k] = diff[k];
        const text = Gear.statLine(top);
        line(keys.length ? 'VS ' + text.join(' ') + (keys.length > 3 ? ' ..' : '') : 'SAME AS WORN',
          better > 0 ? '#9be564' : (better < 0 ? '#c05a5a' : '#7fa86a'));
      }
      line('SPACE WEAR  X DROP', '#9be564');
      return;
    }

    if (s.kind === 'weapon') {
      const lv = this.weaponLevel(player, s);
      const w = CONFIG.weapons[s.weapon];
      if (s.growing) { UI.drawRainbowText(ctx, this.itemName(player, s), x, y); y += 8; }
      else line(this.itemName(player, s), CONFIG.weapons.levelColor[levelTier(lv)]);
      // 끼면 위력이 얼마나 달라지는지 — 지금 든 무기와 바로 비교
      const wd = player.damageWith(s.weapon, lv, s.growing);
      const d = wd - dmg;
      line('DMG ' + wd + ' RNG ' + w.reach, '#f0d9b5');
      line((d >= 0 ? '+' : '') + d + ' VS EQUIPPED', d > 0 ? '#9be564' : (d < 0 ? '#c05a5a' : '#7fa86a'));
      line('SPD ' + UI.speedWord(w.cooldown) + ' DPS ' + Math.round(wd / w.cooldown), '#7fa86a');
      const be = s.element && CONFIG.forge.elements[s.element];
      if (be) line('* ' + be.name, be.color);
      y += 5;
      line('SPACE EQUIP  X DROP', '#9be564');
      return;
    }

    const ls = this.spec(s.id);
    line(ls.name, ls.color);
    line('X' + s.amount + '  WORTH ' + (ls.value * s.amount) + ' G', '#f0d9b5');
    line(ls.trophy ? 'BOSS TROPHY' : 'MONSTER LOOT', '#7fa86a');
    y += 5;
    line('SELL AT THE SHOP', '#ffe066');
    line('X DROP', '#9be564');
  },
};

</script>
  <script>
// ── js/items.js
'use strict';

/* 2주차: 바닥 드랍, 자석 끌림, 자동 줍기 (포션)
   3주차: 무기 드랍. 무기는 발밑에서 F 를 눌러야 가방에 들어간다.
          (지나가다 실수로 좋은 무기가 나쁜 무기로 바뀌면 안 되므로 자동으로는 줍지 않는다)
   인벤토리: 전리품 드랍 — 포션처럼 끌려와 가방에 쌓인다. 가방이 차면 그 자리에 남는다. */

const Items = {
  drops: [],
  fullHintCooldown: 0,   // 가방이 찼을 때 FULL 표시 스팸 방지
  pickupRequested: false, // F 눌림 — 히트스톱 중에도 놓치지 않게 Game이 미리 받아둔다
  nearWeapon: null,       // 지금 발밑에 있는 무기 (안내 문구용)

  reset() {
    this.drops.length = 0;
    this.fullHintCooldown = 0;
    this.pickupRequested = false;
    this.nearWeapon = null;
  },

  // 몬스터가 죽으면 호출 — 포션과 무기를 각각 확률로 떨군다.
  // 포션 확률은 레벨이 아니라 색 등급(5단계)으로 본다 — 레벨은 23까지 올라가기 때문이다.
  dropFor(enemy) {
    if (enemy.noDrop) return;   // 습격이 끝나며 물러간 것 — 잡은 게 아니다
    const cfg = CONFIG.items;
    const tier = levelTier(enemy.level);

    /* 보스 보상
       포션은 확정으로 여섯 개, 그리고 10% 확률로 '성장하는 단검'.
       이 단검은 주운 순간부터 플레이어와 레벨이 같아지고, 레벨업할 때마다 함께 오른다.
       확률이 낮은 대신 한 번 얻으면 다시는 무기를 갈아끼울 필요가 없는 물건이다. */
    if (enemy.isBoss) {
      const r = enemy.reward;   // 보스마다 다르다 (CONFIG.bosses[*].reward)
      this.giveGold(enemy, CONFIG.gold.amountByTier[tier] * CONFIG.gold.bossMult);
      for (let i = 0; i < r.potions; i++) this.spawn(enemy.x, enemy.y, 1);
      if (r.trophy) this.spawnLoot(enemy.x, enemy.y, r.trophy, 1);   // 보스 전리품은 확정
      if (Math.random() < r.chance) {
        this.spawnWeapon(enemy.x, enemy.y, r.weapon, Game.player.level, { growing: true });
      }
      return;
    }
    /* 엘리트 보상 — "쫓아가 볼까"가 서야 한다.
       포션은 확정 두 개, 전리품 두 배, 그리고 **장비가 RARE 이상으로 확정** 떨어진다.
       경험치는 스폰할 때 이미 곱해져 있고(stats.xp), 골드는 여기서 곱한다. */
    if (enemy.elite) {
      const el = CONFIG.elite;
      this.spawn(enemy.x, enemy.y, 2);
      const gid = Gear.randomId();
      const rarity = Math.max(el.rarityFloor, Gear.rollRarity());   // 전설도 평소 확률대로 섞여 나온다
      this.spawnGear(enemy.x, enemy.y, gid, enemy.level, { item: Gear.roll(gid, enemy.level, rarity) });
      this.dropWeaponFor(enemy);
      const eLoot = CONFIG.loot.byType[enemy.TYPE];
      if (eLoot) this.spawnLoot(enemy.x, enemy.y, eLoot, (CONFIG.loot.amountByTier[tier] || 1) * el.loot);
      const eg = CONFIG.gold;
      this.giveGold(enemy, Math.max(1, Math.round((eg.amountByTier[tier] || eg.amountByTier[0]) * el.gold)));
      return;
    }
    if (Math.random() < cfg.potionDropChance[tier]) {
      let amount = 1;
      if (tier >= 4 && Math.random() < cfg.potionDoubleChance) amount = 2;
      this.spawn(enemy.x, enemy.y, amount);
    }
    this.dropWeaponFor(enemy);
    // 장비 — 종류는 고르게 섞이고, 레벨은 잡은 몬스터를 따른다 (등급과 옵션은 spawnGear 가 굴린다)
    if (Math.random() < CONFIG.gear.dropChance) this.spawnGear(enemy.x, enemy.y, Gear.randomId(), enemy.level);
    // 전리품 — 몬스터 종류마다 정해져 있고, 양은 색 등급이 정한다
    const loot = CONFIG.loot;
    const lootId = loot.byType[enemy.TYPE];
    if (lootId && Math.random() < loot.dropChance) this.spawnLoot(enemy.x, enemy.y, lootId, loot.amountByTier[tier] || 1);
    // 골드는 잡는 즉시 들어온다 — 양은 색 등급이 정한다
    const g = CONFIG.gold;
    const base = g.amountByTier[tier] || g.amountByTier[0];
    this.giveGold(enemy, Math.max(1, Math.round(base * Util.rand(1 - g.variance, 1 + g.variance))));
  },

  // 잡은 자리에서 금화가 튀어오르며 액수가 뜨고, 주머니에 바로 더해진다.
  // 밤에 태어난 놈은 값어치도 더 나간다 (Events 가 배수를 안다)
  giveGold(enemy, amount) {
    const mult = (typeof Events !== 'undefined') ? Events.goldMult(enemy) : 1;
    Game.player.addGold(Math.max(1, Math.round(amount * mult)), enemy.x, enemy.y);
  },

  /* 무기 드랍 규칙
     - 떨굴 확률: 몬스터 종류·레벨과 무관하게 모두 같다
     - 종류: 몬스터마다 정해져 있다 (슬라임=단검, 늑대=검, 버섯=도끼)
     - 레벨: 잡은 몬스터의 레벨과 같다 (센 몬스터를 잡아야 좋은 무기가 나온다)
     세 무기의 성능은 같으므로, 이 표는 "원하는 무기를 얻으려면 누구를 노릴지"를 정해줄 뿐이다. */
  dropWeaponFor(enemy) {
    if (Math.random() >= CONFIG.equipment.dropChance) return;
    const id = CONFIG.equipment.weaponByType[enemy.TYPE] || CONFIG.equipment.startWeapon;
    this.spawnWeapon(enemy.x, enemy.y, id, enemy.level);
  },

  // 나무 안에 박혀서 못 줍는 일이 없도록 빈 자리를 점점 넓게 찾는다
  scatter(x, y) {
    if (World.isFreeSpot(x, y, 4)) return { x: x, y: y };
    for (let i = 0; i < 28; i++) {
      const r = 5 + i * 1.5;
      const a = Math.random() * Math.PI * 2;
      const cx = x + Math.cos(a) * r, cy = y + Math.sin(a) * r;
      if (World.isFreeSpot(cx, cy, 4)) return { x: cx, y: cy };
    }
    return { x: x, y: y };
  },

  // 드랍 공통 속성 — 톡 튀어나오는 첫 속도와 수명
  makeDrop(x, y, life, opts) {
    const p = this.scatter(x, y);
    return {
      x: Util.clamp(p.x, 10, World.w - 10),
      y: Util.clamp(p.y, 12, World.h - 8),
      age: Math.random() * 10,   // 통통 튀는 위상을 흩뜨린다
      life: life,
      hintTimer: 0,
      playerNear: false,
      pickupDelay: (opts && opts.pickupDelay) || 0,
      // 가방에서 버린 것은 플레이어가 한 번 떨어져야 다시 끌려온다 (버리자마자 도로 주워지면 안 된다)
      armed: !(opts && opts.dropped),
      vx: Util.rand(-28, 28),
      vy: Util.rand(-34, -10),
    };
  },

  spawn(x, y, amount) {
    const d = this.makeDrop(x, y, CONFIG.items.lifetime);
    d.kind = 'potion';
    d.amount = amount;
    this.drops.push(d);
  },

  // 장비 드랍 (가방에서 버린 것은 opts.dropped)
  /* 바닥에 장비 한 점. item 을 넘기면 그걸 그대로 두고(가방에서 버린 것),
     아니면 여기서 등급과 옵션을 굴린다 — 한 번 굴린 뒤로는 바뀌지 않는다. */
  spawnGear(x, y, id, level, opts) {
    const item = (opts && opts.item) || Gear.roll(id, level);
    if (!item) return;
    const d = this.makeDrop(x, y, CONFIG.equipment.weaponLifetime, opts);
    d.kind = 'gear';
    d.item = item;
    d.id = item.id;
    d.level = item.level;
    d.amount = 1;
    d.auraTimer = 0;
    this.drops.push(d);
    // 희귀한 것이 떨어지면 그 색으로 한 번 터져서 멀리서도 눈에 띈다
    if (item.rarity >= 2) {
      FX.burst(d.x, d.y - 4, 18, [Gear.color(item), '#ffffff'], { speed: 70, life: 0.7, gravity: 30 });
    }
  },

  // 전리품 드랍 (가방에서 버린 것은 opts.dropped)
  spawnLoot(x, y, id, amount, opts) {
    if (!CONFIG.loot.items[id]) return;
    const d = this.makeDrop(x, y, CONFIG.loot.lifetime, opts);
    d.kind = 'loot';
    d.id = id;
    d.amount = Math.max(1, amount | 0);
    this.drops.push(d);
  },

  spawnWeapon(x, y, weaponId, level, opts) {
    const d = this.makeDrop(x, y, CONFIG.equipment.weaponLifetime, opts);
    d.kind = 'weapon';
    d.weapon = weaponId;
    d.element = (opts && opts.element) || null;   // 박아 넣은 속성은 바닥에 둬도 남는다
    d.growing = !!(opts && opts.growing);
    if (d.growing) d.life = 1e9;   // 성장 무기는 사라지지 않는다 (보스 보상이 증발하면 안 된다)
    // 떨군 몬스터의 레벨을 그대로 따른다 (사막 몬스터는 23을 넘는다). 표 끝(60)이 상한
    d.level = Util.clamp(Math.round(level || 1), 1, CONFIG.weapons.levelMult.length);
    d.amount = 1;
    d.auraTimer = 0;
    this.drops.push(d);
    // 성장하는 무기는 떨어지는 순간 무지개가 크게 터져 멀리서도 눈에 띈다
    if (d.growing) {
      FX.burst(d.x, d.y - 4, 36, CONFIG.weapons.rainbow, { speed: 85, life: 0.9, gravity: 40 });
    }
  },

  update(dt, player) {
    const cfg = CONFIG.items;
    this.fullHintCooldown = Math.max(0, this.fullHintCooldown - dt);

    // F 입력은 프레임당 한 번만 쓴다
    const wantPickup = this.pickupRequested;
    this.pickupRequested = false;
    this.nearWeapon = null;

    let bestWeapon = -1, bestDist = Infinity;

    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      d.age += dt;
      d.life -= dt;
      d.hintTimer = Math.max(0, d.hintTimer - dt);
      d.pickupDelay = Math.max(0, d.pickupDelay - dt);
      d.playerNear = false;
      if (d.life <= 0) { this.drops.splice(i, 1); continue; }
      if (player.dead) continue;

      // 처음엔 톡 튀고, 벽에 막히면 멈춘다
      if (Math.abs(d.vx) > 1 || Math.abs(d.vy) > 1) {
        const nx = d.x + d.vx * dt, ny = d.y + d.vy * dt;
        if (!World.blocked({ x: nx - 3, y: ny - 2, w: 6, h: 5 })) {
          d.x = Util.clamp(nx, 10, World.w - 10);
          d.y = Util.clamp(ny, 12, World.h - 8);
        }
        d.vx *= Math.pow(0.005, dt);
        d.vy *= Math.pow(0.005, dt);
      }

      // 성장하는 무기는 바닥에 있는 동안에도 플레이어 레벨을 따라간다
      if (d.growing) {
        d.level = Util.clamp(player.level, 1, CONFIG.weapons.levelMult.length);
        // 무지개 알갱이가 계속 피어오른다 — 바닥에 놓여 있어도 오라가 살아 있다
        d.auraTimer -= dt;
        if (d.auraTimer <= 0) {
          d.auraTimer = 0.22;
          FX.burst(d.x + Util.rand(-6, 6), d.y - 2, 1, CONFIG.weapons.rainbow, { speed: 6, life: 0.7, gravity: -30, size: 1 });
        }
      }

      if (d.pickupDelay > 0) continue;
      const dist = Util.dist(d.x, d.y, player.x, player.y);
      if (!d.armed) {
        if (dist > cfg.pickupRadius + 10) d.armed = true;
        continue;
      }

      // ── 무기: 끌려오지도, 저절로 바뀌지도 않는다. 발밑에 있으면 F 안내만 띄운다
      if (d.kind === 'weapon') {
        if (dist < cfg.pickupRadius + 5) {
          d.playerNear = true;
          if (dist < bestDist) { bestDist = dist; bestWeapon = i; }
        }
        continue;
      }

      /* ── 장비: 끌려와 가방에 들어간다 (입지는 않는다 — 입는 건 인벤토리에서 고른다).
            가방에 빈 칸이 없으면 끌려오지도 않고 그 자리에 그대로 둔다 */
      if (d.kind === 'gear') {
        if (Inventory.firstEmpty(player) < 0) continue;
        // 희귀한 것은 바닥에서도 색 알갱이가 피어오른다
        if (d.item.rarity >= 2) {
          d.auraTimer -= dt;
          if (d.auraTimer <= 0) {
            d.auraTimer = 0.3;
            FX.burst(d.x + Util.rand(-5, 5), d.y - 2, 1, [Gear.color(d.item), '#ffffff'], { speed: 6, life: 0.7, gravity: -30, size: 1 });
          }
        }
        if (dist < CONFIG.loot.magnetRadius && dist > 1) {
          const pull = 130 * (1 - dist / CONFIG.loot.magnetRadius) + 40;
          d.x += (player.x - d.x) / dist * pull * dt;
          d.y += (player.y - d.y) / dist * pull * dt;
        }
        if (dist >= cfg.pickupRadius) continue;
        if (!Inventory.addGear(player, d.item)) continue;
        const color = Gear.color(d.item);
        FX.burst(d.x, d.y - 4, 10, [color, '#ffffff'], { speed: 45, life: 0.4, gravity: 60 });
        FX.number(d.x, d.y - 14, '+' + Gear.name(d.item), color);
        Sound.play('pickup');
        this.drops.splice(i, 1);
        continue;
      }

      // ── 전리품: 포션처럼 끌려와 가방에 쌓인다. 자리가 없으면 끌려오지 않는다
      if (d.kind === 'loot') {
        if (Inventory.roomFor(player, d.id) <= 0) continue;
        if (dist < CONFIG.loot.magnetRadius && dist > 1) {
          const pull = 130 * (1 - dist / CONFIG.loot.magnetRadius) + 40;
          d.x += (player.x - d.x) / dist * pull * dt;
          d.y += (player.y - d.y) / dist * pull * dt;
        }
        if (dist >= cfg.pickupRadius) continue;
        const left = Inventory.addLoot(player, d.id, d.amount);
        const got = d.amount - left;
        if (got > 0) {
          const ls = CONFIG.loot.items[d.id];
          FX.burst(d.x, d.y - 4, 8, [ls.color, '#ffffff'], { speed: 40, life: 0.35, gravity: 60 });
          FX.number(d.x, d.y - 14, '+' + ls.name + (got > 1 ? ' X' + got : ''), ls.color);
          Sound.play('pickup');
          d.amount = left;
          if (d.amount <= 0) this.drops.splice(i, 1);
        }
        continue;
      }

      // ── 포션: 가까우면 끌려와서 자동으로 주워진다.
      //    가방이 꽉 찼으면 끌려오지도 않고 그 자리에 그대로 둔다 — 한 칸 비면 그때 끌려온다
      if (player.potions >= player.maxPotions) continue;
      if (dist < cfg.magnetRadius && dist > 1) {
        const pull = 130 * (1 - dist / cfg.magnetRadius) + 40;
        d.x += (player.x - d.x) / dist * pull * dt;
        d.y += (player.y - d.y) / dist * pull * dt;
      }
      if (dist >= cfg.pickupRadius) continue;

      const taken = player.addPotion(d.amount);
      if (taken > 0) {
        FX.burst(d.x, d.y - 4, 10, ['#e5484d', '#ffffff', '#ffd93d'], { speed: 45, life: 0.4, gravity: 60 });
        FX.number(d.x, d.y - 14, taken > 1 ? '+POTION X' + taken : '+POTION', '#ffd93d');
        d.amount -= taken;
        // 한 칸만 남아 절반만 담았으면 나머지는 바닥에 그대로 둔다
        if (d.amount <= 0) this.drops.splice(i, 1);
      } else if (this.fullHintCooldown <= 0 && d.hintTimer <= 0) {
        FX.number(player.x, player.y - 20, 'FULL', '#8f9aa8');
        d.hintTimer = 1.2;
        this.fullHintCooldown = 0.4;
      }
    }

    // 발밑 무기 중 가장 가까운 것 하나만 F 대상으로 삼는다
    if (bestWeapon >= 0) {
      this.nearWeapon = this.drops[bestWeapon];
      if (wantPickup) this.pickupWeapon(bestWeapon, this.drops[bestWeapon], player);
    }
  },

  /* 무기 줍기 = 가방에 넣기 (끼는 건 인벤토리에서 고른다).
     가방이 꽉 찼으면 예전처럼 손에 든 무기와 맞바꾼다 — 든 무기는 그 자리에 남는다 */
  pickupWeapon(index, d, player) {
    if (player.dead) return;
    if (Inventory.addWeapon(player, d.weapon, d.level, d.growing, d.element)) {
      const color = d.growing ? CONFIG.weapons.growColor : (CONFIG.weapons.levelColor[levelTier(d.level)] || '#ffffff');
      const name = d.growing ? CONFIG.weapons.growNames[d.weapon] : CONFIG.weapons[d.weapon].name + ' L' + d.level;
      FX.burst(d.x, d.y - 4, 8, [color, '#ffffff'], { speed: 40, life: 0.35, gravity: 60 });
      FX.number(d.x, d.y - 14, '+' + name, color);
      Sound.play('pickup');
      this.drops.splice(index, 1);
      return;
    }
    const oldId = player.weapon, oldLevel = player.weaponLevel, oldGrow = player.weaponGrowing;
    if (oldId === d.weapon && oldLevel === d.level && oldGrow === !!d.growing) {
      FX.number(player.x, player.y - 20, 'BAG FULL', '#8f9aa8');
      return;
    }
    const oldEl = player.weaponElement;
    if (!player.equipWeapon(d.weapon, d.level, d.growing, d.element)) return;
    this.drops.splice(index, 1);
    // 바꾸기 전 무기는 버려두고 간다 — 마음이 바뀌면 다시 F로 집을 수 있다
    this.spawnWeapon(d.x, d.y, oldId, oldLevel, { pickupDelay: 0.35, growing: oldGrow, element: oldEl });
  },

  /* 성장하는 무기의 무지개 오라 — 바닥에 옅은 색 원판이 숨쉬듯 커졌다 작아지고,
     그 둘레를 일곱 색 알갱이가 천천히 돈다. */
  drawAura(ctx, sx, sy, age) {
    const pal = CONFIG.weapons.rainbow;
    const pulse = 1 + Math.sin(age * 3) * 0.5;      // 0.5 ~ 1.5
    ctx.globalAlpha = 0.16 + pulse * 0.06;
    fillCircle(ctx, sx, sy + 2, 8 + pulse * 2, UI.rainbowNow(0));
    ctx.globalAlpha = 1;
    for (let i = 0; i < pal.length; i++) {
      const a = age * 1.6 + (i / pal.length) * Math.PI * 2;
      const r = 10 + Math.sin(age * 3 + i) * 1.5;
      ctx.fillStyle = pal[i];
      // 바닥에 누운 타원 궤도 — 위에서 내려다보는 시점이므로 세로를 눌러 그린다
      ctx.fillRect(Math.round(sx + Math.cos(a) * r), Math.round(sy + 2 + Math.sin(a) * r * 0.5), 1, 1);
    }
  },

  // 드랍 하나 그리기. 나무·캐릭터와 같은 y 정렬 목록에 섞여 호출된다
  drawOne(ctx, cam, d) {
    // 수명 5초 미만은 깜빡이며 곧 사라짐을 알린다
    if (d.life < 5 && Math.floor(d.age * 8) % 2 === 0) return;
    const sx = Math.round(d.x - cam.x);
    const sy = Math.round(d.y - cam.y);
    const bob = Math.round(Math.sin(d.age * 4) * 1.5);

    if (d.kind === 'weapon') {
      const spec = CONFIG.weapons[d.weapon];
      const color = CONFIG.weapons.levelColor[levelTier(d.level)] || '#ffffff';
      const set = SPRITES.weapons && SPRITES.weapons[d.weapon];
      const sp = set && set[levelTier(d.level)];
      fillCircle(ctx, sx, sy + 5, 5, 'rgba(0,0,0,0.28)');
      if (d.growing) this.drawAura(ctx, sx, sy, d.age);
      if (sp) ctx.drawImage(sp, sx - Math.floor(sp.width / 2), sy - 8 + bob);
      // 어떤 무기가 몇 레벨인지 바닥에서도 바로 보인다
      if (d.growing) UI.drawRainbowText(ctx, CONFIG.weapons.growNames[d.weapon] || spec.name, sx, sy + 8, true);
      else UI.drawText(ctx, spec.name + ' L' + d.level, sx, sy + 8, color, true);
      // 발밑에 서 있으면 집는 방법을 알려준다 (가방이 차 있으면 맞바꾸기)
      if (d.playerNear) UI.drawText(ctx, Inventory.firstEmpty(Game.player) >= 0 ? 'F TAKE' : 'F SWAP', sx, sy - 19, '#ffffff', true);
      else if (Math.floor(d.age * 3) % 2 === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx + 4, sy - 10 + bob, 1, 1);
      }
      return;
    }

    if (d.kind === 'gear') {
      const sp = Gear.sprite(d.item), color = Gear.color(d.item);
      fillCircle(ctx, sx, sy + 5, 5, 'rgba(0,0,0,0.28)');
      // 희귀한 것은 바닥에 옅은 색 원판이 숨쉰다
      if (d.item.rarity >= 2) {
        const pulse = 1 + Math.sin(d.age * 3) * 0.5;
        ctx.globalAlpha = 0.14 + pulse * 0.06;
        fillCircle(ctx, sx, sy + 2, 7 + pulse * 2, color);
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(sp, sx - Math.floor(sp.width / 2), sy - 8 + bob);
      UI.drawText(ctx, Gear.name(d.item), sx, sy + 8, color, true);
      if (Math.floor(d.age * 3) % 2 === 0) { ctx.fillStyle = '#ffffff'; ctx.fillRect(sx + 4, sy - 10 + bob, 1, 1); }
      return;
    }

    if (d.kind === 'loot') {
      const ls = CONFIG.loot.items[d.id], sp = SPRITES.loot[d.id];
      fillCircle(ctx, sx, sy + 5, 4, 'rgba(0,0,0,0.28)');
      ctx.drawImage(sp, sx - Math.floor(sp.width / 2), sy - 6 + bob);
      if (Math.floor(d.age * 3) % 2 === 0) { ctx.fillStyle = '#ffffff'; ctx.fillRect(sx + 3, sy - 8 + bob, 1, 1); }
      if (ls.trophy) UI.drawText(ctx, ls.name, sx, sy + 8, ls.color, true);   // 보스 전리품은 이름이 보인다
      else if (d.amount > 1) UI.drawText(ctx, 'X' + d.amount, sx, sy + 7, ls.color, true);
      return;
    }

    fillCircle(ctx, sx, sy + 5, 4, 'rgba(0,0,0,0.28)');
    const sp = SPRITES.potion;
    ctx.drawImage(sp, sx - Math.floor(sp.width / 2), sy - 6 + bob);
    // 반짝임 — 아직 안 주운 드랍이 눈에 띄게
    if (Math.floor(d.age * 3) % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 3, sy - 8 + bob, 1, 1);
    }
    if (d.amount > 1) {
      UI.drawText(ctx, 'X' + d.amount, sx, sy + 7, '#ffd93d', true);
    }
  },
};

</script>
  <script>
// ── js/shop.js
'use strict';

/* 9주차: 상점 — 시작 지점 옆 가판대의 상인.

   F 로 말을 걸면 시간이 멈추고 상점 창이 열린다 (인벤토리와 같은 방식).
     W / S       고르기
     Space/Enter 사기
     F / Esc     닫기

   파는 것은 포션과 '강화' 넷(체력 / 공격 / 포션 상한 / 가방 칸). 강화는 살 때마다 랭크가 오르고 값이 뛴다.
   가방에 든 전리품은 'SELL LOOT' 한 줄로 한꺼번에 판다.
   골드는 몬스터가 떨구므로, 상점은 "싸운 만큼 조금 더 튼튼해지는" 보조 성장축이다. */

const Shop = {
  open: false,
  cursor: 0,
  message: '',
  messageTimer: 0,
  npc: null,           // 상인 (World.props 안의 물체)

  reset() {
    this.open = false;
    this.cursor = 0;
    this.message = '';
    this.messageTimer = 0;
  },

  /* ── 상인 배치 ─────────────────────────────────────────
     시작 지점 근처는 나무·물·장식이 모두 비워져 있으므로 그 안에 가판대를 세운다.
     플레이어가 시작 지점에서 눈을 뜨면 바로 오른쪽에 상인이 보인다. */
  place() {
    // 북동쪽 울타리 안쪽 (마을 배치는 Village.SPOTS 가 한곳에서 정한다)
    const s = Village.spot('shop'), x = s.x, y = s.y;
    // 가판대는 뒤에, 상인은 그 앞에. 판매대가 막고 있어 상인 뒤로 돌아갈 수는 없다
    World.addProp(SPRITES.stall, x, y - 10, { solid: [16, 3, 6], footHeight: 3 }).stall = true;
    const npc = World.addProp(SPRITES.merchant[0], x, y + 6, { footHeight: 2 });
    npc.merchant = true;
    npc.landmark = 'shop';        // 미니맵에 따로 찍힌다
    npc.sign = { text: 'SHOP', color: '#ffe066', dy: 42 };   // 가판대 차양 위로 (마을 안에서만 뜬다)
    npc.draw = (ctx, cam) => this.drawNpc(ctx, cam, npc);
    this.npc = npc;
    World.merchant = npc;
  },

  // 상인 그리기 — 가끔 눈을 깜빡이고, 가까이 오면 머리 위에 안내가 뜬다
  drawNpc(ctx, cam, npc) {
    const sx = Math.round(npc.x - cam.x), sy = Math.round(npc.y - cam.y);
    fillCircle(ctx, sx, sy + 1, 5, 'rgba(0,0,0,0.28)');
    // 4초마다 0.15초 동안 눈을 감는다
    const t = World.time % 4;
    const sp = (t > 3.7 && t < 3.85) ? SPRITES.merchant[1] : SPRITES.merchant[0];
    ctx.drawImage(sp, sx - 8, sy - 14);
  },

  drawPrompt(ctx, cam) {
    if (!this.npc) return;
    const sx = Math.round(this.npc.x - cam.x), sy = Math.round(this.npc.y - cam.y);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  SHOP', sx, sy - 24, '#ffe066', true);
  },

  /* ── 목록 ──────────────────────────────────────────────
     첫 줄은 포션, 나머지는 강화. 매번 새로 만들어 값과 랭크가 항상 최신이다. */
  entries(player) {
    const list = [{
      id: 'potion', name: 'POTION', price: CONFIG.shop.potionPrice,
      detail: 'X' + player.potions + '/' + player.maxPotions,
      soldOut: player.potions >= player.maxPotions,
    }];
    // 전리품 팔기 — 가방 속 전리품 전부를 한 번에
    const lv = Inventory.lootValue(player);
    list.push({
      id: 'loot', name: 'SELL LOOT', sell: true, price: lv.value,
      detail: lv.items + ' ITEMS', soldOut: lv.items === 0,
    });
    for (const u of CONFIG.shop.upgrades) {
      const rank = player.upgrades[u.id] || 0;
      list.push({
        id: u.id, name: u.name, spec: u, rank: rank,
        price: this.priceOf(u, rank),
        detail: 'RANK ' + rank + '/' + u.maxRank,
        soldOut: rank >= u.maxRank,
      });
    }
    return list;
  },

  priceOf(u, rank) {
    return Math.round(u.basePrice * Math.pow(u.priceMult, rank));
  },

  /* ── 입력 (시간이 멈춘 동안 Game.handleMenuInput 에서 매 프레임 호출) ── */
  handleInput(player) {
    // 메시지는 실제 시간으로 사라진다 (게임 시간은 멈춰 있으므로)
    this.messageTimer = Math.max(0, this.messageTimer - 1 / 60);
    if (this.messageTimer <= 0) this.message = '';

    const list = this.entries(player);
    if (Input.pressed.KeyW || Input.pressed.ArrowUp) this.cursor = (this.cursor + list.length - 1) % list.length;
    if (Input.pressed.KeyS || Input.pressed.ArrowDown) this.cursor = (this.cursor + 1) % list.length;

    if (Input.pressed.Space || Input.pressed.Enter) {
      this.buy(list[this.cursor], player);
      // 상점에서 쓴 Space 가 닫힌 뒤 공격으로 새어나가지 않게 지운다
      delete Input.pressed.Space;
      delete Input.pressed.Enter;
    }
    if (Input.pressed.KeyF || Input.pressed.Escape) {
      this.close();
      delete Input.pressed.KeyF;   // 같은 F 로 다시 열리지 않게
    }
  },

  buy(item, player) {
    if (item.soldOut) {
      this.say(item.id === 'potion' ? 'POUCH IS FULL' : (item.sell ? 'NO LOOT TO SELL' : 'MAX RANK'));
      Sound.play('error');
      return;
    }
    if (item.sell) {
      const v = Inventory.sellLoot(player);
      Sound.play('gold');
      this.say('SOLD ' + v.items + ' FOR ' + v.value + ' G');
      return;
    }
    if (player.gold < item.price) { this.say('NOT ENOUGH GOLD'); Sound.play('error'); return; }
    player.gold -= item.price;
    Sound.play('buy');

    if (item.id === 'potion') {
      player.addPotion(1);
      this.say('BOUGHT POTION');
      return;
    }
    const u = item.spec;
    player.upgrades[u.id] = (player.upgrades[u.id] || 0) + 1;
    player.recalcStats();   // 랭크가 오르면 파생 능력치를 다시 구한다 (가방 칸도 여기서 늘어난다)
    // 체력 강화는 늘어난 만큼 바로 채워준다 — 사자마자 체감이 있어야 한다
    if (u.stat === 'maxHp') player.hp = Math.min(player.maxHp, player.hp + u.gain);
    this.say(u.name + '  RANK ' + player.upgrades[u.id]);
  },

  say(text) {
    this.message = text;
    this.messageTimer = 1.6;
  },

  openShop() {
    this.open = true;
    this.cursor = 0;
    this.message = '';
    Sound.play('shopOpen');
  },

  close() {
    this.open = false;
    Sound.play('shopClose');
  },

  /* ── 창 ──────────────────────────────────────────────── */
  draw(ctx, player) {
    const w = 190, h = 130;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#ffe066');
    UI.divider(ctx, x + 6, y + 15, w - 12);

    UI.drawText(ctx, 'SHOP', x + w / 2, y + 6, '#ffe066', true);
    ctx.drawImage(SPRITES.coin, x + w - 14 - UI.textWidth(String(player.gold)) - 10, y + 6);
    UI.drawText(ctx, String(player.gold), x + w - 14 - UI.textWidth(String(player.gold)), y + 7, '#ffe066');

    const list = this.entries(player);
    const rowY = y + 24, rowH = 13;
    for (let i = 0; i < list.length; i++) {
      const it = list[i], ry = rowY + i * rowH;
      const selected = i === this.cursor;
      if (selected) {
        ctx.fillStyle = 'rgba(255,224,102,0.12)';
        ctx.fillRect(x + 8, ry - 3, w - 16, rowH - 1);
        UI.drawText(ctx, '>', x + 11, ry, '#ffe066');
      }
      const canBuy = !it.soldOut && player.gold >= it.price;
      UI.drawText(ctx, it.name, x + 20, ry, it.soldOut ? '#6f7a68' : '#f0d9b5');
      UI.drawText(ctx, it.detail, x + 92, ry, '#7fa86a');
      const priceText = it.sell ? (it.soldOut ? '-' : '+' + it.price + ' G') : (it.soldOut ? 'MAX' : it.price + ' G');
      UI.drawText(ctx, priceText, x + w - 12 - UI.textWidth(priceText), ry,
        it.soldOut ? '#6f7a68' : (it.sell ? '#9be564' : (canBuy ? '#ffe066' : '#c05a5a')));
    }

    // 안내 / 방금 산 것
    const footY = y + h - 20;
    if (this.message) {
      UI.drawText(ctx, this.message, x + w / 2, footY, '#9be564', true);
    } else {
      UI.drawText(ctx, 'W S SELECT   SPACE BUY', x + w / 2, footY, '#7fa86a', true);
    }
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 9, '#7fa86a', true);
  },
};

  <script>
// ── js/quests.js
'use strict';

/* 의뢰 게시판 — 상인 옆 나무 판. F 로 들여다보면 시간이 멈추고 의뢰 목록이 열린다.

   이 게임에 가장 크게 비어 있던 것이 "다음에 뭘 하지?" 였다.
   레벨을 올리는 것 말고는 게임이 플레이어에게 아무 말도 하지 않았다.
   그래서 **늘 세 개의 의뢰가 걸려 있고, 그 셋이 화면 오른쪽에 항상 적혀 있게** 했다.

   의뢰는 세 가지뿐이다 — 이 게임이 실제로 시킬 수 있는 일이 그 셋이라서다.
     처치  SLAY 12 SCORPIONS   — 잡을 때마다 하나씩 센다
     수집  BRING 8 SPORE CAPS  — 가방에 그만큼 들고 오면 된다 (받을 때 가져간다)
     탐험  REACH WOLF DEN      — 그 앞까지 가 보면 된다

   하나를 비우면 그 자리에 새 의뢰가 바로 걸린다. 보상은 골드와 **등급 장비 한 점**이라
   "의뢰를 하다 보면 장비가 갖춰진다"가 된다.

   조작
     W / S        고르기
     Space/Enter  다 한 의뢰 받기
     F / Esc      닫기 */

const Quests = {
  open: false,
  cursor: 0,
  list: [],
  nextId: 1,
  message: '',
  messageTimer: 0,
  board: null,      // 게시판 물체 (World.props 안)

  reset() {
    this.open = false;
    this.cursor = 0;
    this.list = [];
    this.nextId = 1;
    this.message = '';
    this.messageTimer = 0;
  },

  /* ── 게시판 세우기 ─────────────────────────────────────
     상인 반대편(비석 쪽이 아닌 자리)에 세운다. 시작하자마자 눈에 들어와야 한다. */
  place() {
    const s = Village.spot('board'), x = s.x, y = s.y;
    const p = World.addProp(SPRITES.questBoard, x, y, { solid: [10, 4, 6], footHeight: 3 });
    p.board = true;
    p.landmark = 'board';   // 미니맵에 따로 찍힌다
    p.sign = { text: 'QUESTS', color: '#e8dcc0', dy: 30 };
    this.board = p;
    World.board = p;
  },

  drawPrompt(ctx, cam) {
    const b = World.board;
    if (!b) return;
    const sx = Math.round(b.x - cam.x), sy = Math.round(b.y - cam.y);
    // 다 한 의뢰가 있으면 깜빡이지 않고 초록으로 또렷하게 알려준다
    const ready = this.list.some(q => this.isDone(q, Game.player));
    if (ready) { UI.drawText(ctx, 'F  CLAIM', sx, sy - 34, '#9be564', true); return; }
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  QUESTS', sx, sy - 34, '#e8dcc0', true);
  },

  /* ── 의뢰 만들기 ───────────────────────────────────────
     지금 서 있는 맵에서 할 수 있는 일만 낸다 — 사막에 있는데 슬라임을 잡아오라고 하면 안 된다.
     이미 걸려 있는 것과 같은 일은 내지 않는다. */
  make(player) {
    const cfg = CONFIG.quests;
    const spec = World.spec || CONFIG.maps.forest;
    for (let attempt = 0; attempt < 24; attempt++) {
      const type = Util.choice(cfg.types);
      let q = null;

      if (type === 'kill') {
        const names = Object.keys(spec.typeWeights[1]);
        const target = Util.choice(names);
        q = { type: 'kill', target: target, need: Util.randInt(cfg.kill.min, cfg.kill.max), progress: 0 };
      } else if (type === 'collect') {
        // 그 맵 몬스터가 떨구는 전리품 중에서 (보스 전리품은 뺀다 — 의뢰로 받기엔 너무 귀하다)
        const ids = Object.keys(spec.typeWeights[1])
          .map(t => CONFIG.loot.byType[t])
          .filter(id => id && !CONFIG.loot.items[id].trophy);
        if (!ids.length) continue;
        const target = Util.choice(ids);
        q = { type: 'collect', target: target, need: Util.randInt(cfg.collect.min, cfg.collect.max), progress: 0 };
      } else {
        // 아직 안 가본 곳 — 이 맵의 동굴들과, 비석 건너편 맵
        const spots = [];
        World.caves.forEach((c, i) => { if (c) spots.push({ kind: 'cave', index: i }); });
        if (spec.portalTo) spots.push({ kind: 'map', id: spec.portalTo });
        if (!spots.length) continue;
        q = { type: 'explore', target: Util.choice(spots), need: 1, progress: 0 };
      }

      if (this.list.some(o => this.sameGoal(o, q))) continue;
      q.id = this.nextId++;
      q.gold = Math.round((cfg.goldBase + player.level * cfg.goldPerLevel) * cfg.goldMult[q.type]);
      q.reward = Gear.roll(Gear.randomId(), player.level, Util.weightedIndex(cfg.rarityWeights));
      return q;
    }
    return null;
  },

  sameGoal(a, b) {
    if (a.type !== b.type) return false;
    if (a.type === 'explore') return JSON.stringify(a.target) === JSON.stringify(b.target);
    return a.target === b.target;
  },

  // 빈자리를 채운다 (게임을 시작할 때, 그리고 하나를 받을 때마다)
  refill(player) {
    let guard = 0;
    while (this.list.length < CONFIG.quests.slots && guard++ < 12) {
      const q = this.make(player);
      if (!q) break;
      this.list.push(q);
    }
  },

  /* ── 진행 ──────────────────────────────────────────────
     처치는 세어 두고, 수집은 가방을 그때그때 센다(들고만 있으면 된다),
     탐험은 그 앞에 가면 1 이 된다. */
  progressOf(q, player) {
    if (q.type === 'collect') {
      let n = 0;
      for (let i = 1; i < player.bag.length; i++) {
        const s = player.bag[i];
        if (s && s.kind === 'loot' && s.id === q.target) n += s.amount;
      }
      return Math.min(n, q.need);
    }
    return Math.min(q.progress, q.need);
  },

  isDone(q, player) { return this.progressOf(q, player) >= q.need; },

  onKill(enemy) {
    for (const q of this.list) {
      if (q.type !== 'kill' || q.target !== enemy.TYPE) continue;
      if (q.progress < q.need) q.progress++;
    }
  },

  // 탐험 의뢰는 매 프레임 "지금 거기 있는가"만 본다
  update(dt, player) {
    this.messageTimer = Math.max(0, this.messageTimer - dt);
    if (this.messageTimer <= 0 && !this.open) this.message = '';
    for (const q of this.list) {
      if (q.type !== 'explore' || q.progress >= 1) continue;
      const t = q.target;
      if (t.kind === 'map') {
        if (World.mapId === t.id) this.finishExplore(q);
      } else if (!World.isArena) {
        const cave = World.caves[t.index];
        if (cave && Util.dist(player.x, player.y, cave.x, cave.y) < CONFIG.quests.reachRange) this.finishExplore(q);
      }
    }
  },

  finishExplore(q) {
    q.progress = 1;
    FX.number(Game.player.x, Game.player.y - 26, 'QUEST DONE', '#9be564');
    Sound.play('banner');
  },

  /* ── 받기 ──────────────────────────────────────────────
     수집 의뢰는 가방에서 그만큼 가져간다. 보상은 골드와 장비 한 점. */
  claim(index, player) {
    const q = this.list[index];
    if (!q) return;
    if (!this.isDone(q, player)) { this.say('NOT DONE YET'); Sound.play('error'); return; }

    if (q.type === 'collect') {
      let left = q.need;
      for (let i = 1; i < player.bag.length && left > 0; i++) {
        const s = player.bag[i];
        if (!s || s.kind !== 'loot' || s.id !== q.target) continue;
        const take = Math.min(s.amount, left);
        s.amount -= take; left -= take;
        if (s.amount <= 0) player.bag[i] = null;
      }
    }

    player.addGold(q.gold);
    if (q.reward) {
      if (!Inventory.addGear(player, q.reward)) {
        // 가방이 꽉 찼으면 발밑에 둔다 — 보상을 그냥 날리지는 않는다
        Items.spawnGear(player.x, player.y, q.reward.id, q.reward.level, { item: q.reward, dropped: true });
        this.say('BAG FULL - DROPPED');
      } else {
        this.say('GOT ' + Gear.name(q.reward));
      }
    }
    Sound.play('levelup');
    this.list.splice(index, 1);
    this.refill(player);
    this.cursor = Util.clamp(this.cursor, 0, Math.max(0, this.list.length - 1));
  },

  say(text) { this.message = text; this.messageTimer = 2.2; },

  openBoard() {
    this.open = true;
    this.cursor = 0;
    this.message = '';
    Sound.play('shopOpen');
  },

  close() {
    this.open = false;
    Sound.play('shopClose');
  },

  handleInput(player) {
    this.messageTimer = Math.max(0, this.messageTimer - 1 / 60);
    if (this.messageTimer <= 0) this.message = '';
    const P = Input.pressed, n = this.list.length;
    if (n) {
      if (P.KeyW || P.ArrowUp) this.cursor = (this.cursor + n - 1) % n;
      if (P.KeyS || P.ArrowDown) this.cursor = (this.cursor + 1) % n;
    }
    if (P.Space || P.Enter) {
      this.claim(this.cursor, player);
      delete P.Space; delete P.Enter;
    }
    if (P.KeyF || P.Escape) { this.close(); delete P.KeyF; }
  },

  /* ── 글로 적기 ─────────────────────────────────────────── */

  title(q) {
    const cfg = CONFIG.quests;
    if (q.type === 'kill') return 'SLAY ' + (cfg.monsterNames[q.target] || q.target.toUpperCase());
    if (q.type === 'collect') return 'BRING ' + CONFIG.loot.items[q.target].name;
    return 'REACH ' + this.placeName(q.target);
  },

  placeName(t) {
    if (t.kind === 'map') return (CONFIG.maps[t.id] || {}).name || '?';
    const cave = CONFIG.maps.forest.caves[t.index];
    return cave ? CONFIG.bosses[cave.boss].lairName : '?';
  },

  /* 화면 오른쪽에 늘 떠 있는 할 일 — 이 주차의 핵심이다.
     접속하자마자 "지금 뭘 하면 되는지"가 적혀 있어야 한다. */
  drawTracker(ctx, player) {
    if (!this.list.length) return;
    const right = CONFIG.VIEW_W - 8;
    let y = 40;
    for (const q of this.list) {
      const done = this.isDone(q, player);
      const count = q.type === 'explore' ? '' : this.progressOf(q, player) + '/' + q.need;
      const label = this.title(q);
      const text = done ? '* ' + label : label + (count ? '  ' + count : '');
      UI.drawText(ctx, text, right - UI.textWidth(text), y, done ? '#9be564' : '#cdd8c6');
      y += 9;
    }
  },

  /* ── 게시판 창 ─────────────────────────────────────────── */
  draw(ctx, player) {
    const w = 216, h = 118;
    const x = Math.round((CONFIG.VIEW_W - w) / 2), y = Math.round((CONFIG.VIEW_H - h) / 2);
    UI.panel(ctx, x, y, w, h, '#e8dcc0');
    UI.divider(ctx, x + 6, y + 15, w - 12);
    UI.drawText(ctx, 'QUEST BOARD', x + w / 2, y + 6, '#e8dcc0', true);

    const rowY = y + 22, rowH = 26;
    for (let i = 0; i < this.list.length; i++) {
      const q = this.list[i], ry = rowY + i * rowH;
      const done = this.isDone(q, player);
      const selected = i === this.cursor;
      if (selected) {
        ctx.fillStyle = 'rgba(232,220,192,0.10)';
        ctx.fillRect(x + 6, ry - 3, w - 12, rowH - 2);
        UI.drawText(ctx, '>', x + 9, ry, '#e8dcc0');
      }
      UI.drawText(ctx, this.title(q), x + 18, ry, done ? '#9be564' : '#f0d9b5');

      // 진행도 — 숫자와 막대를 함께 (탐험은 막대 대신 한마디)
      const p = this.progressOf(q, player);
      if (q.type === 'explore') {
        UI.drawText(ctx, done ? 'FOUND' : 'NOT YET', x + 18, ry + 9, done ? '#9be564' : '#7fa86a');
      } else {
        UI.bar(ctx, x + 18, ry + 10, 60, 3, p / q.need, done ? '#9be564' : '#7ec8ff', '#2a3222');
        UI.drawText(ctx, p + '/' + q.need, x + 82, ry + 8, done ? '#9be564' : '#7fa86a');
      }

      // 보상 — 골드와 장비 한 점 (등급 색으로)
      const g = q.gold + ' G';
      UI.drawText(ctx, g, x + w - 12 - UI.textWidth(g), ry, CONFIG.gold.color);
      if (q.reward) {
        const r = Gear.rarity(q.reward).name + ' ' + CONFIG.gear.items[q.reward.id].name;
        UI.drawText(ctx, r, x + w - 12 - UI.textWidth(r), ry + 9, Gear.color(q.reward));
      }
    }

    const footY = y + h - 19;
    if (this.message) UI.drawText(ctx, this.message, x + w / 2, footY, '#9be564', true);
    else UI.drawText(ctx, 'W S SELECT   SPACE CLAIM', x + w / 2, footY, '#7fa86a', true);
    UI.drawText(ctx, 'PAUSED - F TO CLOSE', x + w / 2, footY + 8, '#5f6b59', true);
  },

  /* ── 저장 ──────────────────────────────────────────────── */
  serialize() {
    return { nextId: this.nextId, list: this.list.map(q => Object.assign({}, q)) };
  },

  deserialize(data, player) {
    this.reset();
    if (data && Array.isArray(data.list)) {
      this.nextId = data.nextId || 1;
      for (const q of data.list) {
        if (!q || !q.type) continue;
        const ok = (q.type === 'kill' && CONFIG.quests.monsterNames[q.target])
          || (q.type === 'collect' && CONFIG.loot.items[q.target])
          || (q.type === 'explore' && q.target);
        if (!ok) continue;
        this.list.push({
          id: q.id || this.nextId++, type: q.type, target: q.target,
          need: Math.max(1, q.need | 0), progress: Math.max(0, q.progress | 0),
          gold: Math.max(0, q.gold | 0), reward: Gear.sanitize(q.reward),
        });
      }
    }
    this.refill(player);
  },
};

  <script>
// ── js/landmarks.js
'use strict';

/* 랜드마크와 보물 — 맵에 눈에 띄는 지점을 흩뿌린다 (로드맵 5주차).

   지금까지 멀리 나갈 이유는 "레벨이 높은 몬스터" 하나뿐이었다. 지형은 넓은데 볼 것이 없었다.
   그래서 **무너진 폐허 / 버려진 야영지 / 묻힌 상자 / 사막 사당**을 흩어 놓고,
   그 한가운데에 **보물 상자**를 둔다.

   상자 규칙
     - 그 자리의 위험도(시작점에서의 거리)가 **보상의 등급**을 정한다 — 멀리 갈수록 좋은 것이 나온다
     - 장비 한 점 + 골드 (+가끔 포션). 장비 레벨은 그 자리의 몬스터 레벨을 따른다
     - **한 번 열면 끝이다.** 저장에 '연 상자'가 남아서 다시 켜도 그대로다

   미니맵에는 아직 안 연 상자만 반짝인다 — "저기 뭔가 있다"가 보이게. */

const Landmarks = {
  opened: {},       // { forest: {3:true}, desert: {0:true} } — 맵을 오가도 남는다
  sparkTimer: 0,

  reset() { this.opened = {}; this.sparkTimer = 0; },

  key(mapId, index) { return (this.opened[mapId] || (this.opened[mapId] = {})) && index; },
  isOpened(mapId, index) { const m = this.opened[mapId]; return !!(m && m[index]); },
  markOpened(mapId, index) { (this.opened[mapId] || (this.opened[mapId] = {}))[index] = true; },

  /* ── 흩뿌리기 ──────────────────────────────────────────
     위험도를 고르게 나눠 갖도록 i 번째는 그 언저리 고리에 놓는다 —
     가까운 것 몇, 중간 몇, 가장자리 몇. 서로 너무 붙지 않게 간격도 본다. */
  place(rng) {
    const cfg = CONFIG.landmarks;
    World.chests = [];
    const kinds = World.spec.theme === 'desert' ? cfg.kinds.desert : cfg.kinds.forest;
    const spots = [];

    for (let i = 0; i < cfg.count; i++) {
      const want = cfg.ringFrom + (i + rng()) / cfg.count * (cfg.ringTo - cfg.ringFrom);
      const spot = this.findSpot(rng, want, spots, cfg);
      if (!spot) continue;
      spots.push(spot);
      this.build(Util.choice(kinds), spot.x, spot.y, rng, World.chests.length);
    }
  },

  findSpot(rng, wantT, taken, cfg) {
    for (let i = 0; i < 500; i++) {
      const a = rng() * Math.PI * 2;
      const t = Util.clamp(wantT + (rng() - 0.5) * 0.12, 0.08, 0.98);
      const x = Util.clamp(World.startX + Math.cos(a) * t * World.w / 2, 60, World.w - 60);
      const y = Util.clamp(World.startY + Math.sin(a) * t * World.h / 2, 70, World.h - 60);
      if (Math.abs(World.dangerAt(x, y) - t) > 0.08) continue;
      if (!World.isFreeSpot(x, y, 30)) continue;
      // 시작 지점(상인·게시판·비석)과 동굴 입구에서는 떨어뜨린다
      if (Util.dist(x, y, World.startX, World.startY) < 120) continue;
      // 거점 울타리 밖으로 — 폐허 기둥(±22px)이 울타리 안으로 처지지 않게 여유를 둔다
      if (Village.inRect(x, y, World.villageZone, 30)) continue;
      if (World.caves.some(c => c && Util.dist(x, y, c.x, c.y) < 90)) continue;
      if (taken.some(s => Util.dist(x, y, s.x, s.y) < cfg.minGap)) continue;
      return { x: x, y: y };
    }
    return null;
  },

  /* 한 자리에 소품 몇 개와 상자 하나. 소품은 지나갈 수 없게 두되(폐허 기둥 등),
     상자 앞은 비워서 다가갈 수 있게 한다. */
  build(kind, x, y, rng, index) {
    const put = (sprite, dx, dy, solid) =>
      World.addProp(sprite, x + dx, y + dy, { solid: solid, footHeight: 3 });

    if (kind === 'ruin') {
      put(Util.choice(SPRITES.ruinPillar), -22, -6, [4, 6, 8]);
      put(Util.choice(SPRITES.ruinPillar), 22, -8, [4, 6, 8]);
      put(Util.choice(SPRITES.ruinBlock), -10, 12, [6, 3, 4]);
      put(Util.choice(SPRITES.ruinBlock), 14, 10, [6, 3, 4]);
      if (rng() < 0.6) put(Util.choice(SPRITES.ruinPillar), 2, -22, [4, 6, 8]);
    } else if (kind === 'camp') {
      put(Util.choice(SPRITES.tent), -16, -4, [10, 4, 6]);
      put(SPRITES.campfire, 8, 4, null);
      put(Util.choice(SPRITES.boulder), 20, -6, [7, 4, 6]);
      if (rng() < 0.5) put(Util.choice(SPRITES.log), -4, 16, null);
    } else if (kind === 'shrine') {
      put(Util.choice(SPRITES.shrine), 0, -14, [5, 5, 6]);
      put(Util.choice(SPRITES.ruinBlock), -16, 4, [6, 3, 4]);
      put(Util.choice(SPRITES.ruinBlock), 16, 4, [6, 3, 4]);
    } else {   // buried — 흙더미만 쌓여 있어 눈에 덜 띈다. 대신 아무 데나 있다
      put(Util.choice(SPRITES.digMound), -1, 6, null);
      if (rng() < 0.5) put(Util.choice(SPRITES.digMound), 14, 10, null);
    }

    const chest = World.addProp(SPRITES.chest[0], x, y, { solid: [6, 3, 4], footHeight: 3 });
    chest.chest = true;
    chest.index = index;
    chest.mapId = World.mapId;
    chest.kind = kind;
    chest.landmark = 'chest';
    chest.draw = (ctx, cam) => this.drawChest(ctx, cam, chest);
    World.chests.push(chest);
  },

  /* ── 열기 ──────────────────────────────────────────────
     그 자리가 멀수록 좋은 등급이 나온다 (rarityNear ~ rarityFar 를 위험도로 섞는다). */
  open(chest, player) {
    if (this.isOpened(chest.mapId, chest.index)) return;
    const cfg = CONFIG.landmarks;
    this.markOpened(chest.mapId, chest.index);

    const t = World.dangerAt(chest.x, chest.y);
    const weights = cfg.rarityNear.map((near, i) => Util.lerp(near, cfg.rarityFar[i], t));
    // 장비 레벨은 **그 자리의 몬스터 레벨 그대로**다 — 가까운 상자는 가까운 만큼의 물건이 나온다
    const level = World.levelAt(chest.x, chest.y);
    const item = Gear.roll(Gear.randomId(), level, Util.weightedIndex(weights));

    const gold = Math.round(cfg.gold.base + cfg.gold.perDanger * t);
    player.addGold(gold, chest.x, chest.y - 6);
    if (Math.random() < cfg.potionChance) {
      const got = player.addPotion(1);
      if (got) FX.number(chest.x, chest.y - 22, '+POTION', '#ffd93d');
    }
    if (item) {
      if (!Inventory.addGear(player, item)) {
        Items.spawnGear(chest.x, chest.y + 10, item.id, item.level, { item: item, dropped: true });
      } else {
        FX.number(chest.x, chest.y - 30, '+' + Gear.name(item), Gear.color(item));
      }
    }

    FX.burst(chest.x, chest.y - 4, 26, [item ? Gear.color(item) : '#ffe066', '#ffffff', CONFIG.gold.color],
      { speed: 70, life: 0.8, gravity: 40 });
    FX.ring(chest.x, chest.y + 2, 14, '#ffe066');
    FX.addShake(2.5);
    Sound.play('levelup');
  },

  // 아직 안 연 상자는 가까이 가면 금빛 알갱이가 하나씩 피어오른다 ("저기 뭔가 있다")
  update(dt, player) {
    if (!World.chests || !World.chests.length) return;
    this.sparkTimer -= dt;
    if (this.sparkTimer > 0) return;
    this.sparkTimer = 0.35;
    for (const c of World.chests) {
      if (this.isOpened(c.mapId, c.index)) continue;
      if (Util.dist(c.x, c.y, player.x, player.y) > 170) continue;
      FX.burst(c.x + Util.rand(-5, 5), c.y - 6, 1, ['#ffe066', '#ffffff'],
        { speed: 6, life: 0.8, gravity: -26, size: 1 });
    }
  },

  drawChest(ctx, cam, chest) {
    const sx = Math.round(chest.x - cam.x), sy = Math.round(chest.y - cam.y);
    const open = this.isOpened(chest.mapId, chest.index);
    const sp = SPRITES.chest[open ? 1 : 0];
    fillCircle(ctx, sx, sy + 1, 7, 'rgba(0,0,0,0.28)');
    /* 안 연 상자는 바닥에 옅은 금빛 원판이 숨쉰다 — 폐허 돌덩이 사이에서도 한눈에 띄게.
       (멀리서 '저기 뭔가 있다'로 읽히는 게 이 기능의 전부라 여기에 공을 들인다) */
    if (!open) {
      const pulse = 1 + Math.sin(World.time * 3 + chest.index) * 0.5;
      ctx.globalAlpha = 0.14 + pulse * 0.07;
      fillCircle(ctx, sx, sy + 2, 9 + pulse * 2, '#ffe066');
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(sp, sx + chest.ox, sy + chest.oy);
    // 자물쇠가 가끔 반짝인다
    if (!open && Math.floor(World.time * 3) % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 2, sy + chest.oy + 5, 1, 1);
    }
  },

  drawPrompt(ctx, cam, chest) {
    const sx = Math.round(chest.x - cam.x), sy = Math.round(chest.y - cam.y);
    if (Math.floor(World.time * 3) % 2 === 0) return;
    UI.drawText(ctx, 'F  OPEN', sx, sy - 24, '#ffe066', true);
  },

  /* ── 저장 ── 연 상자만 적어둔다 (자리와 내용물은 시드에서 다시 나온다) */
  serialize() {
    const out = {};
    for (const map in this.opened) out[map] = Object.keys(this.opened[map]).map(Number);
    return out;
  },

  deserialize(data) {
    this.reset();
    if (!data) return;
    for (const map in data) {
      if (!Array.isArray(data[map])) continue;
      for (const i of data[map]) this.markOpened(map, i | 0);
    }
  },
};

// ── js/fog.js
'use strict';

/* 발견 안개 — 가본 곳만 지도가 밝아진다 (로드맵 6주차).

   지금까지 지도는 처음부터 전부 보였다. 2560x1920 짜리 맵을 펼쳐 놓고
   "어디를 가봤는지"를 기록하지 않으니, 지도가 **내가 만든 기록이 아니라 그냥 설명서**였다.

   이제 타일 하나하나에 '가봤는가'를 적어 두고, 미니맵·전체 지도에서 안 가본 곳을 덮는다.

   저장은 타일 하나당 1비트로 눌러 담아 base64 로 적는다 (맵 하나에 2.4KB → 3.2KB 글자).
   맵 모양은 시드에서 다시 나오므로 '가봤는가'만 남기면 된다. */

const Fog = {
  maps: {},          // { forest: {...}, desert: {...} }
  lastTile: { x: -1, y: -1 },

  reset() {
    this.maps = {};
    this.lastTile = { x: -1, y: -1 };
  },

  ensure(mapId) {
    let m = this.maps[mapId];
    if (m) return m;
    const W = CONFIG.MAP_W, H = CONFIG.MAP_H, cfg = CONFIG.fog;
    m = {
      w: W, h: H,
      bits: new Uint8Array(W * H),
      seen: 0,
      canvas: makeCanvas(W, H),
    };
    const ctx = m.canvas.getContext('2d');
    ctx.fillStyle = cfg.color;
    ctx.fillRect(0, 0, W, H);
    this.maps[mapId] = m;
    return m;
  },

  isSeen(mapId, tx, ty) {
    const m = this.maps[mapId];
    if (!m) return false;
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false;
    return !!m.bits[ty * m.w + tx];
  },

  seenAt(mapId, x, y) {
    return this.isSeen(mapId, Math.floor(x / CONFIG.TILE), Math.floor(y / CONFIG.TILE));
  },

  percent(mapId) {
    const m = this.maps[mapId];
    if (!m) return 0;
    return m.seen / (m.w * m.h);
  },

  /* ── 걷는 대로 걷힌다 ──────────────────────────────────
     타일을 하나 넘어갈 때만 둘레를 훑는다 (매 프레임 150칸을 보는 건 아깝다). */
  update(dt, player) {
    if (World.isArena) return;     // 보스 방은 지도에 없는 곳이다
    const T = CONFIG.TILE, cfg = CONFIG.fog;
    const tx = Math.floor(player.x / T), ty = Math.floor(player.y / T);
    if (tx === this.lastTile.x && ty === this.lastTile.y) return;
    this.lastTile.x = tx; this.lastTile.y = ty;

    const m = this.ensure(World.mapId);
    const ctx = m.canvas.getContext('2d');
    const r = cfg.radius, r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = tx + dx, y = ty + dy;
        if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
        const i = y * m.w + x;
        if (m.bits[i]) continue;
        m.bits[i] = 1;
        m.seen++;
        ctx.clearRect(x, y, 1, 1);
      }
    }
  },

  // 미니맵·전체 지도 위에 덮는다 (잘라낸 자리와 배율을 그대로 받는다)
  draw(ctx, mapId, dx, dy, sx, sy, bw, bh, scale) {
    const m = this.maps[mapId];
    if (!m) return;
    ctx.drawImage(m.canvas, sx, sy, bw, bh, dx, dy, bw * scale, bh * scale);
  },

  /* ── 저장 ── 타일 하나당 1비트로 눌러 담는다 */
  serialize() {
    const out = {};
    for (const id in this.maps) {
      const m = this.maps[id];
      const bytes = new Uint8Array(Math.ceil(m.bits.length / 8));
      for (let i = 0; i < m.bits.length; i++) if (m.bits[i]) bytes[i >> 3] |= 1 << (i & 7);
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      out[id] = { b: btoa(s) };
    }
    return out;
  },

  deserialize(data) {
    this.reset();
    if (!data) return;
    for (const id in data) {
      const d = data[id];
      if (!d || typeof d.b !== 'string') continue;
      const m = this.ensure(id);
      let s;
      try { s = atob(d.b); } catch (err) { continue; }
      const ctx = m.canvas.getContext('2d');
      for (let i = 0; i < m.bits.length; i++) {
        const byte = s.charCodeAt(i >> 3) || 0;
        if (!(byte & (1 << (i & 7)))) continue;
        m.bits[i] = 1;
        m.seen++;
        ctx.clearRect(i % m.w, Math.floor(i / m.w), 1, 1);
      }
    }
  },
};

// ── js/status.js
'use strict';

/* 상태이상 — 화상 / 빙결 / 감전 / 중독 (로드맵 7주차).

   **몬스터와 플레이어 양쪽에 같은 규칙으로 걸린다.** 그래서 이 파일 하나가 둘 다 다룬다
   (전갈의 독만 따로 굴러가던 것을 여기로 흡수했다).

     BURN   화상  0.5초마다 아픔. 짧고 세다
     POISON 중독  0.5초마다 조금씩. 길고 약한 대신 **자연 회복이 멈춘다**
     FREEZE 빙결  걸음과 손이 느려진다 (피해는 없다)
     SHOCK  감전  **받는 피해가 늘어난다** — 다른 상태와 겹칠 때 가장 무섭다

   세기는 '건 쪽의 힘'을 기준으로 잡는다 — 플레이어가 걸면 그 일격의 피해,
   몬스터가 걸면 그 몬스터의 공격력. 그래야 레벨이 올라도 따로 손볼 것이 없다.

   거는 방법
     - 플레이어 → 장비 옵션 (FIERY / FROSTY / SHOCKING / VENOMOUS 가 붙으면 확률로 건다)
     - 몬스터 → 전갈 찌르기(중독), 버섯·늙은 버섯의 포자(중독)

   **막는 수단은 없다.** 저항 수치를 두면 "저항만 올리면 그만"이 되어 불·얼음·독을 만든 보람이 사라진다 —
   걸리면 걸리는 것이고, 대신 지속 시간을 짧게 잡았다. */

const Status = {
  spec(type) { return CONFIG.status.list[type]; },

  /* 건다. power 는 '건 쪽의 힘' — 지속 피해가 이 값에 비례한다.
     같은 상태를 다시 걸면 더 센 쪽으로 덮어쓰고 시간을 새로 센다 (쌓이지는 않는다). */
  apply(target, type, power, source) {
    const spec = this.spec(type);
    if (!target || target.dead || !spec) return;
    // 해독제 해독 상태 — 새로 안 걸린다
    if (target.wardTimer > 0) return;
    // 거점 안의 플레이어에게는 새로 안 걸린다 — 이미 걸린 것은 그대로 tick 한다
    if (typeof Village !== 'undefined' && Village.isSafe && typeof Game !== 'undefined'
        && target === Game.player && Village.isSafe(target.x, target.y)) return;
    const time = spec.time;

    if (!target.status) target.status = {};
    const dmg = spec.ratio ? Math.max(1, Math.round(power * spec.ratio)) : 0;
    const cur = target.status[type];
    target.status[type] = {
      time: time,
      tick: spec.tick || 0,
      next: cur ? Math.min(cur.next, spec.tick || 0) : (spec.tick || 0),
      dmg: cur ? Math.max(cur.dmg, dmg) : dmg,
      source: source || null,
    };
    if (!cur) {
      FX.number(target.x, target.y - 26, spec.name, spec.color);
      FX.burst(target.x, target.y - 4, 6, [spec.color, '#ffffff'], { speed: 26, life: 0.4, gravity: -20, size: 1 });
    }
  },

  has(target, type) { return !!(target.status && target.status[type]); },
  clear(target) { target.status = {}; },

  // 걸음·손이 얼마나 느려지나 (빙결)
  speedScale(target) {
    return this.has(target, 'freeze') ? CONFIG.status.list.freeze.slow : 1;
  },

  // 받는 피해 배수 (감전)
  damageTaken(target) {
    return this.has(target, 'shock') ? CONFIG.status.list.shock.amp : 1;
  },

  // 자연 회복이 막혔는가 (중독·화상) — 강장제가 도는 동안은 안 막힌다
  blocksRegen(target) {
    if (target.tonicTimer > 0) return false;
    if (!target.status) return false;
    for (const type in target.status) if (this.spec(type).blockRegen) return true;
    return false;
  },

  /* 매 프레임 — 시간을 깎고, 지속 피해를 넣고, 알갱이를 띄운다.
     몬스터가 지속 피해로 죽으면 평소 죽음과 같은 길(die)을 타야 드랍·의뢰가 돈다. */
  update(target, dt, isPlayer) {
    const st = target.status;
    if (!st) return;
    for (const type in st) {
      const s = st[type], spec = this.spec(type);
      s.time -= dt;

      if (s.tick > 0 && s.dmg > 0) {
        s.next -= dt;
        if (s.next <= 0) {
          s.next = s.tick;
          this.hurt(target, s.dmg, spec, isPlayer, s.source);
        }
      }

      // 몸에서 피어오르는 알갱이 — 무엇이 걸렸는지 멀리서도 보인다
      if (Math.random() < spec.puff) {
        FX.burst(target.x + Util.rand(-5, 5), target.y - Util.rand(0, 8), 1, spec.puffColors,
          { speed: spec.rise ? 10 : 4, life: 0.5, gravity: spec.rise ? -34 : 10, size: 1 });
      }

      if (s.time <= 0) delete st[type];
      if (target.dead) return;
    }
  },

  hurt(target, dmg, spec, isPlayer, source) {
    if (isPlayer) {
      // 상태이상만으로는 죽지 않는다 — 체력 1 아래로는 안 내려간다
      const hit = Math.min(dmg, Math.max(0, target.hp - 1));
      if (hit > 0) {
        target.hp -= hit;
        FX.number(target.x + Util.rand(-6, 6), target.y - 12, '-' + hit, spec.color);
      }
      target.sinceCombat = 0;
      return;
    }
    target.hp -= dmg;
    target.showHp = 2.0;
    FX.number(target.x + Util.rand(-4, 4), target.y - 10 - target.radius, dmg, spec.color);
    if (target.hp <= 0 && !target.dead) target.die(source || Game.player);
  },

  /* 머리 위 작은 표 — 걸린 것마다 색 네모 하나. 글자를 쓰기엔 자리가 없다 */
  drawMarks(ctx, target, sx, topY) {
    const st = target.status;
    if (!st) return;
    const types = Object.keys(st);
    if (!types.length) return;
    let x = sx - (types.length * 4 - 1) / 2;
    for (const type of types) {
      const spec = this.spec(type);
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, topY - 12, 4, 4);
      ctx.fillStyle = spec.color;
      ctx.fillRect(x, topY - 11, 2, 2);
      x += 4;
    }
  },

  /* 플레이어 HUD — 남은 시간이 보이는 칩 한 줄 */
  drawHud(ctx, player, x, y) {
    const st = player.status;
    if (!st) return;
    for (const type in st) {
      const spec = this.spec(type), s = st[type];
      ctx.fillStyle = '#17110d';
      ctx.fillRect(x - 1, y - 1, 8, 8);
      ctx.fillStyle = spec.color;
      ctx.fillRect(x, y, 6, 6);
      // 남은 시간을 아래에서부터 어둡게 덮어 모래시계처럼 보이게
      const gone = Math.round(6 * (1 - s.time / (spec.time || 1)));
      if (gone > 0) {
        ctx.fillStyle = 'rgba(10,12,10,0.65)';
        ctx.fillRect(x, y + 6 - gone, 6, gone);
      }
      UI.drawText(ctx, spec.short, x + 9, y, spec.color);
      x += 9 + UI.textWidth(spec.short) + 4;
    }
  },
};
